<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Downloads - SSC EDGE</title>


<script>

document.documentElement.dataset.theme =
localStorage.getItem(
"ssc-edge-theme"
) || "dark";

</script>


<link
rel="stylesheet"
href="css/style.css"
>


<style>

.container{

padding:20px;

padding-bottom:90px;

}


.page-title{

font-size:26px;

font-weight:bold;

margin-bottom:6px;

}


.page-subtitle{

color:var(--muted);

margin-bottom:20px;

}


.tabs{

display:flex;

gap:10px;

margin-bottom:18px;

}


.tab{

flex:1;

padding:11px 10px;

border-radius:10px;

border:1px solid var(--border);

background:var(--card);

color:var(--text);

font-weight:bold;

cursor:pointer;

text-align:center;

}


.tab.active{

background:var(--purple);

color:white;

border-color:var(--purple);

}


.download-list{

display:flex;

flex-direction:column;

gap:13px;

}


.download-card{

background:var(--card);

border:1px solid var(--border);

border-radius:14px;

padding:15px;

}


.download-title{

font-size:17px;

font-weight:bold;

line-height:1.35;

margin-bottom:7px;

}


.download-meta{

color:var(--muted);

font-size:13px;

margin-bottom:12px;

}


.actions{

display:flex;

gap:9px;

}


.action{

flex:1;

padding:10px 12px;

border-radius:10px;

border:1px solid var(--border);

font-weight:bold;

text-decoration:none;

text-align:center;

cursor:pointer;

background:var(--card2);

color:var(--text);

box-sizing:border-box;

font-family:inherit;

font-size:14px;

}


.action.primary{

background:var(--purple);

color:white;

border-color:var(--purple);

}


.empty{

text-align:center;

color:var(--muted);

padding:35px 10px;

}


.clear{

width:100%;

margin-top:16px;

padding:11px;

border-radius:10px;

border:1px solid var(--border);

background:var(--card);

color:var(--text);

font-weight:bold;

cursor:pointer;

}


/* =========================
   STATUS
========================= */

.refresh-status{

text-align:center;

font-size:12px;

color:var(--muted);

margin-top:10px;

display:none;

}

</style>

</head>


<body>


<div class="container">


<div class="page-title">

Downloads

</div>


<div class="page-subtitle">

Your downloaded SSC EDGE study material

</div>


<div class="tabs">


<button
class="tab active"
data-type="ALL"
>

All

</button>


<button
class="tab"
data-type="EBOOK"
>

📚 E-Books

</button>


<button
class="tab"
data-type="PDF"
>

📄 PDFs

</button>


</div>


<div
id="downloadList"
class="download-list"
>

<div class="empty">

Loading downloads...

</div>

</div>


<div
id="refreshStatus"
class="refresh-status"
>

Refreshing file information...

</div>


<button
class="clear"
onclick="clearAllDownloads()"
>

🗑️ Clear Download List

</button>


</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";


const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   DOWNLOAD STORAGE
========================================================= */

const DOWNLOAD_KEY =
"ssc-edge-downloads-v3";


const OLD_DOWNLOAD_KEY =
"ssc-edge-downloads-v2";


let currentType =
"ALL";


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value || "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* =========================================================
   GET DOWNLOADS
========================================================= */

function getDownloads(){

    try{

        return JSON.parse(

            localStorage.getItem(
                DOWNLOAD_KEY
            ) || "[]"

        );

    }catch(error){

        return [];

    }

}


/* =========================================================
   SAVE DOWNLOADS
========================================================= */

function saveDownloads(items){

    localStorage.setItem(

        DOWNLOAD_KEY,

        JSON.stringify(items)

    );

}


/* =========================================================
   REFRESH FILE URLS
=========================================================

   Get the current file_url directly
   from study_material.

   No bucket is created or changed.
========================================================= */

async function refreshFileUrls(items){

    if(!items.length){

        return items;

    }


    const status =
        document.getElementById(
            "refreshStatus"
        );


    status.style.display =
        "block";


    let changed =
        false;


    for(
        let i = 0;
        i < items.length;
        i++
    ){

        const item =
            items[i];


        /*
           The id saved by the PDF/E-Book
           pages is the study_material id.

           If an old record does not have
           a usable database id, keep its
           existing URL.
        */

        if(
            !item.id ||
            String(item.id).includes("/")
        ){

            continue;

        }


        try{

            const {
                data,
                error
            } = await supabaseClient

                .from("study_material")

                .select(
                    "id,title,subject_id,file_url,material_type"
                )

                .eq(
                    "id",
                    item.id
                )

                .maybeSingle();


            if(
                !error &&
                data &&
                data.file_url
            ){

                /*
                   Always use the exact
                   file_url stored in Supabase.
                */

                if(
                    item.url !==
                    data.file_url
                ){

                    items[i] = {

                        ...item,

                        url:
                            data.file_url,

                        title:
                            data.title ||
                            item.title,

                        type:
                            data.material_type ===
                            "EBOOK"
                                ? "EBOOK"
                                : "PDF"

                    };

                    changed =
                        true;

                }

            }

        }catch(error){

            console.warn(
                "Could not refresh:",
                item.id,
                error
            );

        }

    }


    if(changed){

        saveDownloads(items);

    }


    status.style.display =
        "none";


    return items;

}


/* =========================================================
   DOWNLOAD URL
=========================================================

   IMPORTANT:
   Do NOT convert the Supabase bucket.

   Use the exact file_url saved in
   study_material and simply request
   download behaviour.

   This prevents:
   "Bucket not found"
========================================================= */

function getDownloadUrl(url){

    if(!url){

        return "";

    }


    if(
        url.includes("?")
    ){

        return url + "&download";

    }


    return url + "?download";

}


/* =========================================================
   RENDER
========================================================= */

async function renderDownloads(){

    const list =
        document.getElementById(
            "downloadList"
        );


    let items =
        getDownloads();


    if(
        currentType !==
        "ALL"
    ){

        items =
            items.filter(

                item =>
                    item.type ===
                    currentType

            );

    }


    if(!items.length){

        list.innerHTML = `

            <div class="empty">

                No downloads here yet.

            </div>

        `;

        return;

    }


    /*
       First display the saved list.
    */

    list.innerHTML =

        items.map(

            item =>
                createCard(item)

        ).join("");


    /*
       Refresh URLs from Supabase.
    */

    const allItems =
        await refreshFileUrls(
            getDownloads()
        );


    let refreshedItems =
        allItems;


    if(
        currentType !==
        "ALL"
    ){

        refreshedItems =
            refreshedItems.filter(

                item =>
                    item.type ===
                    currentType

            );

    }


    list.innerHTML =

        refreshedItems.map(

            item =>
                createCard(item)

        ).join("");

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(item){

    const title =
        escapeHtml(

            item.title ||
            "Untitled"

        );


    const subject =
        escapeHtml(

            item.subject ||
            "General"

        );


    const id =
        escapeHtml(

            item.id ||
            ""

        );


    /*
       ORIGINAL URL ONLY.
    */

    const url =
        escapeHtml(

            item.url ||
            ""

        );


    const typeLabel =
        item.type ===
        "EBOOK"

            ? "📚 E-Book"

            : "📄 PDF";


    /*
       Add ?download only.
       NEVER replace the bucket.
    */

    const downloadUrl =
        escapeHtml(

            getDownloadUrl(
                item.url ||
                ""
            )

        );


    return `

    <div class="download-card">


        <div class="download-title">

            🔖 ${title}

        </div>


        <div class="download-meta">

            ${typeLabel}

            •

            ${subject}

        </div>


        <div class="actions">


            <!-- OPEN -->

            <a

                class="action primary"

                href="${url}"

                target="_blank"

                rel="noopener noreferrer"

            >

                📖 Open

            </a>


            <!-- DOWNLOAD -->

            <a

                class="action"

                href="${downloadUrl}"

                download

            >

                ⬇️ Download

            </a>


            <!-- REMOVE -->

            <button

                class="action"

                onclick="removeItem(
                    '${id.replace(
                        /'/g,
                        "\\'"
                    )}'
                )"

            >

                🗑️ Remove

            </button>


        </div>


    </div>

    `;

}


/* =========================================================
   REMOVE ITEM
========================================================= */

function removeItem(id){

    const items =
        getDownloads().filter(

            item =>
                String(item.id) !==
                String(id)

        );


    saveDownloads(items);


    renderDownloads();

}


/* =========================================================
   CLEAR ALL
========================================================= */

function clearAllDownloads(){

    if(
        !confirm(
            "Clear all downloads?"
        )
    ){

        return;

    }


    localStorage.removeItem(
        DOWNLOAD_KEY
    );


    localStorage.removeItem(
        OLD_DOWNLOAD_KEY
    );


    renderDownloads();

}


/* =========================================================
   TABS
========================================================= */

document

    .querySelectorAll(".tab")

    .forEach(

        tab => {

            tab.addEventListener(

                "click",

                () => {

                    document

                        .querySelectorAll(
                            ".tab"
                        )

                        .forEach(

                            item =>
                                item.classList
                                    .remove(
                                        "active"
                                    )

                        );


                    tab.classList.add(
                        "active"
                    );


                    currentType =
                        tab.dataset.type;


                    renderDownloads();

                }

            );

        }

    );


/* =========================================================
   INITIAL LOAD
========================================================= */

renderDownloads();

</script>

</body>

</html>
