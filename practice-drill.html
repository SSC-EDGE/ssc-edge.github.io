<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
document.documentElement.dataset.theme =
  localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<title>SSC EDGE - Practice Drill</title>

<link rel="stylesheet" href="css/style.css">

<style>
:root{
  --bg:#080811;
  --card:#11111d;
  --card2:#171725;
  --text:#ffffff;
  --muted:#9b9bad;
  --purple:#8b5cf6;
  --purple2:#6d28d9;
  --border:rgba(255,255,255,.08);
}

:root[data-theme="light"]{
  --bg:#f5f5fa;
  --card:#ffffff;
  --card2:#f0eff8;
  --text:#171724;
  --muted:#666678;
  --border:rgba(0,0,0,.10);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

a{
  text-decoration:none;
  color:inherit;
}

.topbar{
  height:64px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 16px;
  border-bottom:1px solid var(--border);
  background:var(--card);
  position:sticky;
  top:0;
  z-index:20;
}

.back-btn{
  width:38px;
  height:38px;
  border:none;
  border-radius:11px;
  background:var(--card2);
  color:var(--text);
  font-size:22px;
  cursor:pointer;
}

.brand{
  font-size:18px;
  font-weight:800;
  letter-spacing:.3px;
}

.brand span{
  color:var(--purple);
}

.page-wrap{
  max-width:900px;
  margin:auto;
  padding:20px 14px 40px;
}

.page-heading{
  margin-bottom:18px;
}

.page-heading h1{
  font-size:22px;
  font-weight:800;
  margin-bottom:6px;
}

.page-heading p{
  font-size:13px;
  color:var(--muted);
}

.subject-label{
  display:inline-flex;
  align-items:center;
  margin-top:12px;
  padding:8px 12px;
  border-radius:9px;
  background:rgba(139,92,246,.12);
  color:var(--purple);
  font-size:12px;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.folder-card,
.test-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
  cursor:pointer;
  transition:.2s;
}

.folder-card:hover,
.test-card:hover{
  transform:translateY(-2px);
  border-color:var(--purple);
}

.folder-icon{
  width:45px;
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:rgba(139,92,246,.14);
  font-size:23px;
  margin-bottom:12px;
}

.folder-title{
  font-size:14px;
  font-weight:800;
  line-height:1.35;
}

.folder-subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:6px;
}

.test-icon{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:11px;
  background:rgba(34,197,94,.13);
  font-size:21px;
  margin-bottom:10px;
}

.test-title{
  font-size:14px;
  font-weight:800;
  line-height:1.35;
}

.test-meta{
  margin-top:7px;
  color:var(--muted);
  font-size:11px;
  line-height:1.6;
}

.empty{
  text-align:center;
  padding:55px 18px;
  background:var(--card);
  border:1px dashed var(--border);
  border-radius:15px;
}

.empty-icon{
  font-size:38px;
  margin-bottom:12px;
}

.empty h3{
  font-size:16px;
  margin-bottom:7px;
}

.empty p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.loading{
  text-align:center;
  padding:55px 10px;
  color:var(--muted);
  font-size:14px;
}

.error-box{
  background:rgba(239,68,68,.10);
  border:1px solid rgba(239,68,68,.35);
  color:#f87171;
  padding:15px;
  border-radius:12px;
  font-size:13px;
  line-height:1.5;
}

.bottom-note{
  margin-top:22px;
  color:var(--muted);
  font-size:11px;
  text-align:center;
}

@media(max-width:520px){
  .grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .folder-card,
  .test-card{
    padding:13px;
    border-radius:13px;
  }

  .folder-title,
  .test-title{
    font-size:12px;
  }

  .folder-subtitle,
  .test-meta{
    font-size:10px;
  }

  .page-heading h1{
    font-size:20px;
  }
}

@media(max-width:340px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <button class="back-btn" onclick="goBack()">‹</button>

  <div class="brand">
    SSC <span>EDGE</span>
  </div>
</header>

<main class="page-wrap">

  <section class="page-heading">
    <h1 id="pageTitle">Practice Drill</h1>
    <p id="pageSubtitle">Select a practice category to continue.</p>
    <div id="subjectLabel" class="subject-label" style="display:none;"></div>
  </section>

  <section id="content">
    <div class="loading">Loading practice...</div>
  </section>

  <div class="bottom-note">
    Learn • Practice • Improve
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-SUPABASE-ANON-KEY";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const params = new URLSearchParams(window.location.search);
const subjectId = params.get("subject_id");

let subjectData = null;
let allFolders = [];
let allTests = [];

let folderStack = [];
let currentFolderId = null;

const content = document.getElementById("content");
const pageTitle = document.getElementById("pageTitle");
const pageSubtitle = document.getElementById("pageSubtitle");
const subjectLabel = document.getElementById("subjectLabel");


function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function normalize(value){
  return String(value || "")
    .trim()
    .toUpperCase()
    .replace(/[-\s]+/g,"_");
}


function folderName(folder){
  return folder.name ||
         folder.title ||
         folder.folder_name ||
         "Practice Folder";
}


function folderType(folder){
  return normalize(
    folder.folder_type ||
    folder.type ||
    folder.category ||
    ""
  );
}


function isPracticeDrillTest(test){
  return normalize(test.test_type) === "PRACTICE_DRILL";
}


function isRootCategory(folder){
  const type = folderType(folder);
  const name = normalize(folderName(folder));

  const isChapter =
    type.includes("CHAPTER") ||
    name.includes("CHAPTER_WISE") ||
    name.includes("CHAPTERWISE") ||
    name.includes("CHAPTER_WISE_PRACTICE");

  const isRevision =
    type.includes("REVISION") ||
    type.includes("BOOST") ||
    name.includes("REVISION") ||
    name.includes("BOOSTER");

  return isChapter || isRevision;
}


function categoryTitle(folder){
  const type = folderType(folder);
  const name = normalize(folderName(folder));

  if(
    type.includes("CHAPTER") ||
    name.includes("CHAPTER_WISE") ||
    name.includes("CHAPTERWISE")
  ){
    return "CHAPTER_WISE PRACTICE";
  }

  if(
    type.includes("REVISION") ||
    type.includes("BOOST") ||
    name.includes("REVISION") ||
    name.includes("BOOSTER")
  ){
    return "REVISION BOOSTER";
  }

  return folderName(folder);
}


function categoryIcon(folder){
  const type = folderType(folder);
  const name = normalize(folderName(folder));

  if(
    type.includes("CHAPTER") ||
    name.includes("CHAPTER")
  ){
    return "📚";
  }

  if(
    type.includes("REVISION") ||
    type.includes("BOOST") ||
    name.includes("REVISION") ||
    name.includes("BOOSTER")
  ){
    return "⚡";
  }

  return "📁";
}


function getFolderId(folder){
  return folder.id;
}


function getParentId(folder){
  return folder.parent_id || folder.parent_folder_id || null;
}


function getTestFolderId(test){
  return test.folder_id || test.practice_folder_id || null;
}


async function loadData(){

  if(!subjectId){
    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">⚠️</div>
        <h3>Subject Not Selected</h3>
        <p>Please open Practice Drill from the Practice page.</p>
      </div>
    `;
    return;
  }

  try{

    const [
      subjectResponse,
      foldersResponse,
      testsResponse
    ] = await Promise.all([

      supabaseClient
        .from("subjects")
        .select("*")
        .eq("id", subjectId)
        .maybeSingle(),

      supabaseClient
        .from("practice_folders")
        .select("*")
        .eq("subject_id", subjectId)
        .eq("is_active", true)
        .order("sort_order", {ascending:true}),

      supabaseClient
        .from("mock_tests")
        .select("*")
        .eq("is_active", true)
        .order("created_at", {ascending:false})

    ]);

    if(subjectResponse.error){
      throw subjectResponse.error;
    }

    if(foldersResponse.error){
      throw foldersResponse.error;
    }

    if(testsResponse.error){
      throw testsResponse.error;
    }

    subjectData = subjectResponse.data;
    allFolders = foldersResponse.data || [];

    allTests = (testsResponse.data || [])
      .filter(isPracticeDrillTest)
      .filter(test => {
        const folderId = getTestFolderId(test);

        return allFolders.some(folder =>
          String(folder.id) === String(folderId)
        );
      });

    if(subjectData){
      const subjectName =
        subjectData.name ||
        subjectData.title ||
        subjectData.subject_name ||
        "";

      if(subjectName){
        subjectLabel.textContent = subjectName;
        subjectLabel.style.display = "inline-flex";
      }
    }

    renderRootCategories();

  }catch(error){

    console.error("Practice Drill Load Error:", error);

    content.innerHTML = `
      <div class="error-box">
        Unable to load practice drill data.<br>
        ${escapeHtml(error.message || "Unknown error")}
      </div>
    `;
  }
}


function renderRootCategories(){

  currentFolderId = null;
  folderStack = [];

  pageTitle.textContent = "Practice Drill";
  pageSubtitle.textContent =
    "Choose a practice category to continue.";

  const roots = allFolders
    .filter(folder => !getParentId(folder))
    .filter(isRootCategory)
    .sort((a,b) => {
      const aName = normalize(folderName(a));
      const bName = normalize(folderName(b));

      const aChapter = aName.includes("CHAPTER");
      const bChapter = bName.includes("CHAPTER");

      if(aChapter && !bChapter) return -1;
      if(!aChapter && bChapter) return 1;

      return Number(a.sort_order || 0) - Number(b.sort_order || 0);
    });

  if(!roots.length){
    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📂</div>
        <h3>No Practice Categories</h3>
        <p>Practice categories have not been added for this subject yet.</p>
      </div>
    `;
    return;
  }

  content.innerHTML = `
    <div class="grid">
      ${roots.map(folder => `
        <div
          class="folder-card"
          onclick="openFolder('${escapeHtml(getFolderId(folder))}')"
        >
          <div class="folder-icon">${categoryIcon(folder)}</div>

          <div class="folder-title">
            ${escapeHtml(categoryTitle(folder))}
          </div>

          <div class="folder-subtitle">
            Open category →
          </div>
        </div>
      `).join("")}
    </div>
  `;
}


function openFolder(folderId){

  const folder = allFolders.find(
    item => String(item.id) === String(folderId)
  );

  if(!folder) return;

  if(currentFolderId !== null){
    folderStack.push(currentFolderId);
  }

  currentFolderId = folderId;

  renderFolder(folder);
}


function renderFolder(folder){

  pageTitle.textContent = folderName(folder);
  pageSubtitle.textContent =
    "Select a chapter, topic folder or practice test.";

  const childFolders = allFolders
    .filter(item =>
      String(getParentId(item)) === String(folder.id)
    )
    .sort((a,b) =>
      Number(a.sort_order || 0) - Number(b.sort_order || 0)
    );

  const folderTests = allTests
    .filter(test =>
      String(getTestFolderId(test)) === String(folder.id)
    );

  if(!childFolders.length && !folderTests.length){

    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📭</div>
        <h3>This folder is empty</h3>
        <p>No chapters, topics or tests have been added here yet.</p>
      </div>
    `;

    return;
  }

  let html = `<div class="grid">`;

  childFolders.forEach(child => {

    html += `
      <div
        class="folder-card"
        onclick="openFolder('${escapeHtml(getFolderId(child))}')"
      >
        <div class="folder-icon">📁</div>

        <div class="folder-title">
          ${escapeHtml(folderName(child))}
        </div>

        <div class="folder-subtitle">
          Open folder →
        </div>
      </div>
    `;
  });

  folderTests.forEach(test => {

    const testTitle =
      test.title ||
      test.test_title ||
      test.name ||
      "Practice Test";

    const duration =
      test.duration_minutes ||
      test.duration ||
      0;

    const totalQuestions =
      test.total_questions ||
      test.question_count ||
      0;

    html += `
      <div
        class="test-card"
        onclick="openTest('${escapeHtml(test.id)}')"
      >
        <div class="test-icon">📝</div>

        <div class="test-title">
          ${escapeHtml(testTitle)}
        </div>

        <div class="test-meta">
          ${duration ? `${escapeHtml(duration)} min` : ""}
          ${duration && totalQuestions ? " • " : ""}
          ${totalQuestions ? `${escapeHtml(totalQuestions)} Questions` : ""}
        </div>
      </div>
    `;
  });

  html += `</div>`;

  content.innerHTML = html;
}


function openTest(testId){

  const test = allTests.find(
    item => String(item.id) === String(testId)
  );

  if(!test) return;

  const testUrl =
    `mock-test.html?test_id=${encodeURIComponent(test.id)}`;

  window.location.href = testUrl;
}


function goBack(){

  if(folderStack.length){

    const previousFolderId = folderStack.pop();

    currentFolderId = previousFolderId;

    const previousFolder = allFolders.find(
      folder => String(folder.id) === String(previousFolderId)
    );

    if(previousFolder){
      renderFolder(previousFolder);
    }else{
      renderRootCategories();
    }

    return;
  }

  window.location.href = "practice.html";
}


loadData();
</script>

</body>
</html>
