<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script>
document.documentElement.dataset.theme =
  localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<title>SSC EDGE - Practice Drill</title>
<link rel="stylesheet" href="css/style.css">

<style>
:root{
  --pd-bg:#080811;
  --pd-card:#11111d;
  --pd-card2:#181827;
  --pd-border:#292943;
  --pd-text:#f5f5ff;
  --pd-muted:#9999b2;
  --pd-purple:#8b5cf6;
  --pd-purple2:#a78bfa;
}
:root[data-theme="light"]{
  --pd-bg:#f5f6fb;
  --pd-card:#ffffff;
  --pd-card2:#f0f1f8;
  --pd-border:#dddded;
  --pd-text:#171725;
  --pd-muted:#68687d;
  --pd-purple:#6d3ee8;
  --pd-purple2:#7c4dff;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--pd-bg);
  color:var(--pd-text);
  font-family:Arial,Helvetica,sans-serif;
}
button{font:inherit;cursor:pointer}
.top{
  position:sticky;
  top:0;
  z-index:10;
  height:58px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 15px;
  background:var(--pd-card);
  border-bottom:1px solid var(--pd-border);
}
.back{
  width:36px;
  height:36px;
  border-radius:10px;
  border:1px solid var(--pd-border);
  background:var(--pd-card2);
  color:var(--pd-text);
  font-size:20px;
}
.logo{
  font-size:16px;
  font-weight:900;
}
.logo span{color:var(--pd-purple2)}
.top small{
  margin-left:auto;
  color:var(--pd-muted);
  font-size:11px;
}
.wrap{
  max-width:900px;
  margin:auto;
  padding:14px;
}
.hero{
  padding:17px;
  border-radius:16px;
  background:linear-gradient(135deg,#17112c,#11111d);
  border:1px solid var(--pd-border);
  margin-bottom:14px;
}
:root[data-theme="light"] .hero{
  background:linear-gradient(135deg,#eee8ff,#fff);
}
.hero h1{
  margin:0;
  font-size:21px;
}
.hero p{
  margin:7px 0 0;
  color:var(--pd-muted);
  font-size:12px;
}
.subjects{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
  margin-bottom:14px;
}
.subject{
  padding:12px;
  border-radius:12px;
  border:1px solid var(--pd-border);
  background:var(--pd-card);
  color:var(--pd-text);
  text-align:left;
}
.subject.active{
  border-color:var(--pd-purple);
  box-shadow:0 0 0 1px var(--pd-purple);
}
.subject b{
  display:block;
  font-size:13px;
}
.subject small{
  display:block;
  color:var(--pd-muted);
  margin-top:4px;
  font-size:10px;
}
.section{
  background:var(--pd-card);
  border:1px solid var(--pd-border);
  border-radius:15px;
  padding:13px;
  margin-bottom:12px;
}
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}
.section-head h2{
  margin:0;
  font-size:15px;
}
.muted{
  color:var(--pd-muted);
  font-size:11px;
}
.folder{
  border:1px solid var(--pd-border);
  border-radius:12px;
  overflow:hidden;
  margin-bottom:9px;
  background:var(--pd-card2);
}
.folder-title{
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  cursor:pointer;
}
.folder-title b{font-size:13px}
.folder-title small{
  color:var(--pd-muted);
  font-size:10px;
}
.arrow{
  color:var(--pd-purple2);
  font-size:17px;
}
.folder-body{
  display:none;
  padding:0 10px 10px;
}
.folder.open .folder-body{display:block}
.child{
  margin-top:8px;
  border:1px solid var(--pd-border);
  border-radius:10px;
  overflow:hidden;
}
.child-title{
  padding:10px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.child-title b{font-size:12px}
.child-body{
  display:none;
  padding:0 8px 8px;
}
.child.open .child-body{display:block}
.mock{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:11px;
  margin-top:7px;
  background:var(--pd-card);
  border:1px solid var(--pd-border);
  border-radius:10px;
}
.mock-info{
  min-width:0;
  flex:1;
}
.mock-info b{
  display:block;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.mock-info small{
  display:block;
  color:var(--pd-muted);
  margin-top:4px;
  font-size:10px;
}
.start{
  border:0;
  background:var(--pd-purple);
  color:#fff;
  border-radius:8px;
  padding:8px 11px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}
.empty{
  text-align:center;
  color:var(--pd-muted);
  padding:24px 8px;
  font-size:12px;
}
.loader{
  text-align:center;
  color:var(--pd-muted);
  padding:25px;
  font-size:12px;
}
@media(max-width:560px){
  .subjects{grid-template-columns:1fr 1fr}
  .top small{display:none}
  .mock{align-items:flex-start}
}
</style>
</head>

<body>

<header class="top">
  <button class="back" onclick="history.back()">‹</button>
  <div class="logo">SSC <span>EDGE</span></div>
  <small>Practice Drill</small>
</header>

<main class="wrap">

  <section class="hero">
    <h1>Practice Drill</h1>
    <p>Choose a subject and practice topic-wise questions.</p>
  </section>

  <div class="subjects" id="subjectTabs">
    <div class="loader">Loading subjects...</div>
  </div>

  <section class="section">
    <div class="section-head">
      <div>
        <h2 id="pageTitle">Practice Folders</h2>
        <div class="muted">Select a mock to start practice.</div>
      </div>
    </div>

    <div id="folderContainer">
      <div class="loader">Loading...</div>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let subjects = [];
let folders = [];
let tests = [];

let selectedSubject = null;

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function isPracticeTest(test){
  return String(
    test.test_type ||
    test.type ||
    test.mock_type ||
    ""
  ).toUpperCase() === "PRACTICE_DRILL";
}

function folderName(folder){
  return folder.display_name ||
    folder.name ||
    folder.title ||
    "Folder";
}

function testName(test){
  return test.title ||
    test.name ||
    "Practice Mock";
}

async function loadData(){
  const [
    subjectResult,
    folderResult,
    testResult
  ] = await Promise.all([
    db
      .from("subjects")
      .select("*")
      .order("name"),

    db
      .from("mock_folders")
      .select("*")
      .eq("is_active",true)
      .order("sort_order")
      .order("name"),

    db
      .from("mock_tests")
      .select("*")
      .eq("is_active",true)
      .eq("test_type","PRACTICE_DRILL")
      .order("sort_order")
      .order("created_at",{ascending:false})
  ]);

  if(subjectResult.error) throw subjectResult.error;
  if(folderResult.error) throw folderResult.error;
  if(testResult.error) throw testResult.error;

  subjects = subjectResult.data || [];
  folders = folderResult.data || [];
  tests = (testResult.data || []).filter(isPracticeTest);

  renderSubjects();

  if(subjects.length){
    selectSubject(subjects[0].id);
  }else{
    $("folderContainer").innerHTML =
      `<div class="empty">No subjects available.</div>`;
  }
}

function renderSubjects(){
  $("subjectTabs").innerHTML =
    subjects.map(subject => `
      <button
        class="subject ${
          selectedSubject &&
          String(selectedSubject.id) === String(subject.id)
          ? "active"
          : ""
        }"
        onclick="selectSubject('${subject.id}')"
      >
        <b>${esc(subject.name)}</b>
        <small>Practice Drill</small>
      </button>
    `).join("") ||
    `<div class="empty">No subjects found.</div>`;
}

function selectSubject(id){
  selectedSubject =
    subjects.find(
      subject => String(subject.id) === String(id)
    ) || null;

  if(!selectedSubject) return;

  $("pageTitle").textContent =
    selectedSubject.name + " Practice Drill";

  renderSubjects();
  renderFolders();
}

function rootFolders(){
  if(!selectedSubject) return [];

  return folders
    .filter(folder =>
      String(folder.subject_id || "") ===
      String(selectedSubject.id) &&
      !folder.parent_id
    )
    .sort((a,b) =>
      Number(a.sort_order || 0) -
      Number(b.sort_order || 0)
    );
}

function childFolders(parentId){
  return folders
    .filter(folder =>
      String(folder.parent_id || "") ===
      String(parentId)
    )
    .sort((a,b) =>
      Number(a.sort_order || 0) -
      Number(b.sort_order || 0)
    );
}

function folderMocks(folderId){
  return tests
    .filter(test =>
      String(test.folder_id || "") ===
      String(folderId)
    )
    .sort((a,b) =>
      Number(a.sort_order || 0) -
      Number(b.sort_order || 0)
    );
}

function renderFolders(){
  const roots = rootFolders();

  if(!roots.length){
    $("folderContainer").innerHTML =
      `<div class="empty">No Practice Drill folders available.</div>`;
    return;
  }

  $("folderContainer").innerHTML =
    roots.map(root => {
      const children = childFolders(root.id);
      const directMocks = folderMocks(root.id);

      return `
        <div class="folder">
          <div class="folder-title" onclick="toggleBox(this.parentElement)">
            <div>
              <b>${esc(folderName(root))}</b>
              <small>
                ${children.length} topics · ${directMocks.length} mocks
              </small>
            </div>
            <span class="arrow">⌄</span>
          </div>

          <div class="folder-body">

            ${
              children.map(child => `
                <div class="child">
                  <div
                    class="child-title"
                    onclick="toggleBox(this.parentElement)"
                  >
                    <b>${esc(folderName(child))}</b>
                    <span class="arrow">⌄</span>
                  </div>

                  <div class="child-body">
                    ${renderMocks(child.id)}
                  </div>
                </div>
              `).join("")
            }

            ${
              directMocks.length
                ? renderMocks(root.id)
                : ""
            }

            ${
              !children.length && !directMocks.length
                ? `<div class="empty">No mocks in this folder.</div>`
                : ""
            }

          </div>
        </div>
      `;
    }).join("");
}

function renderMocks(folderId){
  const list = folderMocks(folderId);

  return list.map(test => `
    <div class="mock">
      <div class="mock-info">
        <b>${esc(testName(test))}</b>
        <small>
          ${Number(test.total_questions || 0)} Questions
          ·
          ${Number(test.duration_minutes || 0)} Minutes
        </small>
      </div>

      <button
        class="start"
        onclick="startMock('${test.id}')"
      >
        Start
      </button>
    </div>
  `).join("");
}

function toggleBox(element){
  element.classList.toggle("open");
}

function startMock(testId){
  location.href =
    "mock-test.html?test_id=" +
    encodeURIComponent(testId) +
    "&mode=practice";
}

loadData().catch(error => {
  $("folderContainer").innerHTML =
    `<div class="empty">${esc(error.message)}</div>`;
});
</script>

</body>
</html>
