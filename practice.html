<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SSC EDGE - Practice</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="top-header">

    <div>
        <h1>Practice</h1>
        <p>Test • Practice • Improve</p>
    </div>

</header>


<main class="container practice-page">


    <!-- ================= HEADING ================= -->

    <section class="page-heading">

        <span class="badge">
            SSC EDGE
        </span>

        <h2>Practice Tests</h2>

        <p>
            Choose your test and start practicing.
        </p>

    </section>


    <!-- ================= FULL MOCKS ================= -->

    <section class="practice-section">

        <div class="practice-title">
            FULL MOCKS
        </div>


        <div class="mock-grid">


            <a href="#" class="mock-card cgl-pre">

                <span class="mock-arrow">→</span>

                <div class="mock-icon">
                    ✓
                </div>

                <div class="mock-name">
                    CGL PRE
                </div>

            </a>


            <a href="#" class="mock-card cgl-mains">

                <span class="mock-arrow">→</span>

                <div class="mock-icon">
                    ★
                </div>

                <div class="mock-name">
                    CGL MAINS
                </div>

            </a>


        </div>

    </section>


    <!-- ================= SECTIONAL MOCKS ================= -->

    <section class="practice-section">

        <div class="practice-title">
            SECTIONAL MOCKS
        </div>


        <div class="mock-grid">


            <a href="#" class="mock-card sectional-quant">

                <span class="mock-arrow">→</span>

                <div class="mock-icon">
                    ∑
                </div>

                <div class="mock-name">
                    Quant
                </div>

            </a>


            <a href="#" class="mock-card sectional-gk">

                <span class="mock-arrow">→</span>

                <div class="mock-icon">
                    ?
                </div>

                <div class="mock-name">
                    GK
                </div>

            </a>


            <a href="#" class="mock-card sectional-english">

                <span class="mock-arrow">→</span>

                <div class="mock-icon">
                    A
                </div>

                <div class="mock-name">
                    English
                </div>

            </a>


            <a href="#" class="mock-card sectional-reasoning">

                <span class="mock-arrow">→</span>

                <div class="mock-icon">
                    🧩
                </div>

                <div class="mock-name">
                    Reasoning
                </div>

            </a>


        </div>

    </section>


</main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

    <a href="home.html" class="nav-item">

        <span>⌂</span>

        <small>Home</small>

    </a>


    <a href="study.html" class="nav-item">

        <span>📚</span>

        <small>Study Material</small>

    </a>


    <a href="practice.html" class="nav-item active">

        <span>✎</span>

        <small>Practice</small>

    </a>


    <a href="profile.html" class="nav-item">

        <span>●</span>

        <small>Profile</small>

    </a>

</nav>


<!-- ================= THEME ================= -->

<script>

(function () {

    const theme =
        localStorage.getItem("ssc-edge-theme");

    if (theme === "light") {

        document.body.classList.add("light-theme");

    }

})();

</script>


</body>
</html>
