<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English - SSC EDGE</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">

<style>

.container{
padding:20px;
padding-bottom:90px;
}

.page-title{
font-size:26px;
font-weight:bold;
margin-bottom:6px;
}

.page-subtitle{
color:var(--muted);
margin-bottom:20px;
}

.pdf-list{
display:flex;
flex-direction:column;
gap:14px;
}

.pdf-card{
background:var(--card);
border:1px solid var(--border);
border-radius:14px;
padding:16px;
}

.pdf-title{
font-size:18px;
font-weight:bold;
margin-bottom:7px;
}

.pdf-description{
color:var(--muted);
font-size:14px;
margin-bottom:14px;
}

.pdf-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.open,
.download{
display:inline-block;
padding:11px 15px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.open{
background:var(--purple);
color:white;
}

.download{
background:var(--card2);
color:var(--text);
border:1px solid var(--border);
}

.empty{
text-align:center;
color:var(--muted);
padding:30px 10px;
}

</style>

</head>

<body>

<div class="container">

<div class="page-title">
English
</div>

<div class="page-subtitle">
SSC EDGE English PDFs
</div>

<div id="pdfList" class="pdf-list">

<div class="empty">
Loading PDFs...
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


function escapeHtml(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function getDownloadUrl(url){

if(
url &&
url.includes(
"/storage/v1/object/public/ssc-edge-pdfs/"
)
){

return url.replace(
"/storage/v1/object/public/ssc-edge-pdfs/",
"/storage/v1/object/download/ssc-edge-pdfs/"
);

}

return url;

}


async function loadPDFs(){

const pdfList =
document.getElementById("pdfList");


const {
data: subject,
error: subjectError
} = await supabaseClient
.from("subjects")
.select("id,name")
.eq("name","English")
.single();


if(subjectError || !subject){

pdfList.innerHTML =
`<div class="empty">
Unable to load English subject.
</div>`;

return;

}


const {
data: pdfs,
error
} = await supabaseClient
.from("study_material")
.select("*")
.eq("material_type","PDF")
.eq("subject_id",subject.id)
.eq("is_active",true)
.order("created_at",{ascending:false});


if(error){

pdfList.innerHTML =
`<div class="empty">
Unable to load PDFs.
</div>`;

return;

}


if(!pdfs || pdfs.length === 0){

pdfList.innerHTML =
`<div class="empty">
No English PDFs available yet.
</div>`;

return;

}


pdfList.innerHTML = pdfs.map(pdf => {

const title =
escapeHtml(pdf.title || "Untitled PDF");

const description =
escapeHtml(pdf.description || "");

const openUrl =
escapeHtml(pdf.file_url || "");

const downloadUrl =
escapeHtml(getDownloadUrl(pdf.file_url || ""));


return `

<div class="pdf-card">

<div class="pdf-title">
${title}
</div>

${description ? `
<div class="pdf-description">
${description}
</div>
` : ""}

<div class="pdf-actions">

<a
class="open"
href="${openUrl}"
target="_blank"
rel="noopener">
📄 Open PDF
</a>

<a
class="download"
href="${downloadUrl}"
download>
📥 Download
</a>

</div>

</div>

`;

}).join("");

}


loadPDFs();

</script>

</body>

</html>
