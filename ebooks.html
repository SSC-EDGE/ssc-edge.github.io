<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>E-Books - SSC EDGE</title>

<script>

document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";

</script>

<link
rel="stylesheet"
href="css/style.css"
>

<script src="js/downloads.js"></script>


<style>

.container{
    padding:20px;
    padding-bottom:90px;
}

.page-title{
    font-size:26px;
    font-weight:700;
    margin-bottom:5px;
}

.page-subtitle{
    color:var(--muted);
    margin-bottom:20px;
}

.material-list{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.material-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
}

/* =========================
   BOOK COVER
========================= */

.book-cover{
    width:100%;
    aspect-ratio:16/9;
    background:#111;
    position:relative;
    overflow:hidden;
}

.book-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.cover-fallback{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;

    background:linear-gradient(
        135deg,
        #171225,
        #30204f
    );

    color:white;
}

.cover-icon{
    font-size:48px;
    margin-bottom:8px;
}

.cover-logo{
    font-size:27px;
    font-weight:800;
    letter-spacing:1px;
}

.cover-text{
    margin-top:5px;
    font-size:13px;
    opacity:.8;
}

/* =========================
   CONTENT
========================= */

.material-content{
    padding:16px;
}

.material-title{
    font-size:18px;
    font-weight:700;
    line-height:1.4;
    margin-bottom:8px;
}

.material-subject{
    display:inline-block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:9px;
}

.material-description{
    color:var(--muted);
    font-size:14px;
    line-height:1.5;
    margin-bottom:14px;
}

/* =========================
   BUTTONS
========================= */

.material-actions{
    display:flex;
    gap:10px;
}

.open,
.download{
    flex:1;
    min-width:0;
    min-height:46px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:11px 10px;

    border-radius:11px;

    text-decoration:none;

    font-weight:700;
    font-size:14px;

    box-sizing:border-box;
}

.open{
    background:var(--purple);
    color:white;
}

.download{
    background:var(--card2);
    color:var(--text);
    border:1px solid var(--border);
}

.empty{
    text-align:center;
    color:var(--muted);
    padding:35px 10px;
}

</style>

</head>


<body>


<div class="container">


<div class="page-title">
E-Books
</div>


<div class="page-subtitle">
SSC EDGE Study Material
</div>


<div
id="materialList"
class="material-list"
>

<div class="empty">
Loading...
</div>

</div>


</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   DOWNLOAD URL
========================= */

function getDownloadUrl(url){

    if(!url){
        return "";
    }

    /*
       Keep the original Supabase
       public file URL.

       Do NOT change:
       /public/bucket/
       into:
       /download/bucket/

       The original URL is valid for
       opening the file. Adding the
       download parameter asks the
       storage server to download it.
    */

    if(url.includes("?")){
        return url + "&download";
    }

    return url + "?download";

}


/* =========================
   BOOK COVER
========================= */

function getCover(material){

    /*
       Future admin support:

       material.thumbnail_url

       Admin panel later will upload
       the book cover and save its URL.
    */

    return material.thumbnail_url || "";

}


/* =========================
   FALLBACK COVER
========================= */

function fallbackCover(){

    return `

    <div class="cover-fallback">

        <div class="cover-icon">
            📚
        </div>

        <div class="cover-logo">
            SSC EDGE
        </div>

        <div class="cover-text">
            Learn • Practice • Improve
        </div>

    </div>

    `;

}


/* =========================
   RECORD DOWNLOAD
========================= */

function recordEbookDownload(
    id,
    title,
    subject,
    url
){

    if(
        window.SSCEdgeDownloads &&
        window.SSCEdgeDownloads.recordDownload
    ){

        window.SSCEdgeDownloads.recordDownload({

            id:id,

            title:title,

            subject:subject,

            type:"EBOOK",

            /*
               Store the ORIGINAL file URL.
               Never store a transformed
               /object/download/ URL.
            */

            url:url

        });

    }

}


/* =========================
   STUDY MATERIAL PROGRESS
========================= */

async function markStudyMaterialComplete(materialId){

    try{

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();


        if(!user){

            return;

        }


        const {
            error
        } =
            await supabaseClient

                .from("study_material_progress")

                .upsert(

                    {
                        user_id:
                            user.id,

                        material_id:
                            Number(materialId),

                        completed:
                            true,

                        completed_at:
                            new Date().toISOString()
                    },

                    {
                        onConflict:
                            "user_id,material_id"
                    }

                );


        if(error){

            console.warn(
                "Study progress could not be saved:",
                error
            );

        }

    }catch(error){

        console.warn(
            "Study progress error:",
            error
        );

    }

}


/* =========================
   LOAD E-BOOKS
========================= */

async function loadMaterials(){

    const materialList =
        document.getElementById(
            "materialList"
        );


    const {
        data:materials,
        error
    } = await supabaseClient

        .from("study_material")

        .select(`
            *,
            subjects (
                name
            )
        `)

        .eq(
            "material_type",
            "EBOOK"
        )

        .eq(
            "is_active",
            true
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        materialList.innerHTML = `

            <div class="empty">
                Unable to load E-Books.
            </div>

        `;

        return;

    }


    if(
        !materials ||
        materials.length === 0
    ){

        materialList.innerHTML = `

            <div class="empty">
                No E-Books available yet.
            </div>

        `;

        return;

    }


    materialList.innerHTML = materials.map(
        material => {

            const rawId =
                material.id ||
                material.file_url ||
                "";


            const rawTitle =
                material.title ||
                "Untitled";


            const rawSubject =
                material.subjects?.name ||
                "General";


            const rawDescription =
                material.description ||
                "";


            const rawFileUrl =
                material.file_url ||
                "";


            /*
               Original URL for opening.
            */

            const openUrl =
                escapeHtml(rawFileUrl);


            /*
               Download URL is generated
               WITHOUT any bucket name.
            */

            const rawDownloadUrl =
                getDownloadUrl(
                    rawFileUrl
                );


            const id =
                escapeHtml(rawId);


            const title =
                escapeHtml(rawTitle);


            const subject =
                escapeHtml(rawSubject);


            const description =
                escapeHtml(rawDescription);


            const downloadUrl =
                escapeHtml(rawDownloadUrl);


            const cover =
                getCover(material);


            const coverHtml =
                cover

                ?

                `

                <div class="book-cover">

                    <img
                        src="${escapeHtml(cover)}"
                        alt="${title}"
                        loading="lazy"
                        onerror="this.parentElement.innerHTML =
                        '${fallbackCover()
                            .replace(/'/g,"\\'")}'
                        "
                    >

                </div>

                `

                :

                `

                <div class="book-cover">

                    ${fallbackCover()}

                </div>

                `;


            return `

            <div class="material-card">

                ${coverHtml}


                <div class="material-content">

                    <div class="material-title">
                        ${title}
                    </div>


                    <div class="material-subject">
                        📚 Subject: ${subject}
                    </div>


                    ${
                        description

                        ?

                        `

                        <div class="material-description">
                            ${description}
                        </div>

                        `

                        :

                        ""
                    }


                    <div class="material-actions">


                        <a
                            class="open"
                            href="${openUrl}"
                            target="_blank"
                            rel="noopener"
                            data-material-id="${id}"
                        >

                            📖 Open E-Book

                        </a>


                        <a
                            class="download"
                            href="${downloadUrl}"
                            download
                            onclick="recordEbookDownload(
                                '${id.replace(/'/g,"\\'")}',
                                '${title.replace(/'/g,"\\'")}',
                                '${subject.replace(/'/g,"\\'")}',
                                '${openUrl.replace(/'/g,"\\'")}'
                            )"
                        >

                            📥 Download

                        </a>


                    </div>

                </div>

            </div>

            `;

        }
    ).join("");


    /* =========================
       OPEN E-BOOK PROGRESS
========================= */

    document
        .querySelectorAll(
            ".open[data-material-id]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function(){

                        markStudyMaterialComplete(
                            this.dataset.materialId
                        );

                    }
                );

            }
        );

}


/* =========================
   INITIAL LOAD
========================= */

loadMaterials();

</script>

</body>

</html>
