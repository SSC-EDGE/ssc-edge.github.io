<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>E-Books - SSC EDGE</title>


<script>

document.documentElement.dataset.theme =
localStorage.getItem(
"ssc-edge-theme"
) || "dark";

</script>


<link
rel="stylesheet"
href="css/style.css"
>


<script
src="js/downloads.js"
></script>


<style>

.container{

padding:20px;

padding-bottom:90px;

}


.page-title{

font-size:26px;

font-weight:bold;

margin-bottom:6px;

}


.page-subtitle{

color:var(--muted);

margin-bottom:20px;

}


.material-list{

display:flex;

flex-direction:column;

gap:14px;

}


.material-card{

background:var(--card);

border:1px solid var(--border);

border-radius:14px;

padding:16px;

}


.material-title{

font-size:18px;

font-weight:bold;

line-height:1.35;

margin-bottom:7px;

}


.material-subject{

display:inline-block;

font-size:13px;

color:var(--muted);

margin-bottom:8px;

}


.material-description{

color:var(--muted);

font-size:14px;

line-height:1.5;

margin-bottom:14px;

}


.material-actions{

display:flex;

gap:10px;

flex-wrap:wrap;

}


.open,
.download{

flex:1;

min-width:130px;

display:inline-block;

padding:11px 15px;

border-radius:10px;

text-decoration:none;

font-weight:bold;

text-align:center;

box-sizing:border-box;

cursor:pointer;

}


.open{

background:var(--purple);

color:white;

}


.download{

background:var(--card2);

color:var(--text);

border:1px solid var(--border);

}


.empty{

text-align:center;

color:var(--muted);

padding:30px 10px;

}

</style>

</head>


<body>


<div class="container">


<div class="page-title">

E-Books

</div>


<div class="page-subtitle">

SSC EDGE Study Material

</div>


<div
id="materialList"
class="material-list"
>

<div class="empty">

Loading...

</div>

</div>


</div>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script>


const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";


const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

return String(value || "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================
   DOWNLOAD URL
========================= */

function getDownloadUrl(url){

if(!url){

return "";

}


/* E-BOOK BUCKET */

if(
url.includes(
"/storage/v1/object/public/ssc-edge-ebooks/"
)
){

return url.replace(

"/storage/v1/object/public/ssc-edge-ebooks/",

"/storage/v1/object/download/ssc-edge-ebooks/"

);

}


/* PDF BUCKET */

if(
url.includes(
"/storage/v1/object/public/ssc-edge-pdfs/"
)
){

return url.replace(

"/storage/v1/object/public/ssc-edge-pdfs/",

"/storage/v1/object/download/ssc-edge-pdfs/"

);

}


return url;

}


/* =========================
   RECORD DOWNLOAD
========================= */

function recordEbookDownload(
id,
title,
subject,
url
){

window.SSCEdgeDownloads
.recordDownload({

id:id,

title:title,

subject:subject,

type:"EBOOK",

url:url

});

}


/* =========================
   LOAD MATERIALS
========================= */

async function loadMaterials(){

const materialList =
document.getElementById(
"materialList"
);


const {
data:materials,
error
} =

await supabaseClient

.from("study_material")

.select(`
*,
subjects (
name
)
`)

.eq(
"material_type",
"EBOOK"
)

.eq(
"is_active",
true
)

.order(
"created_at",
{
ascending:false
}
);


/* =========================
   ERROR
========================= */

if(error){

console.error(error);

materialList.innerHTML=

`<div class="empty">
Unable to load E-Books.
</div>`;

return;

}


/* =========================
   EMPTY
========================= */

if(
!materials ||
materials.length === 0
){

materialList.innerHTML=

`<div class="empty">
No E-Books available yet.
</div>`;

return;

}


/* =========================
   RENDER
========================= */

materialList.innerHTML=

materials.map(
material=>{

const id =
escapeHtml(
material.id ||
material.file_url ||
""
);


const title =
escapeHtml(
material.title ||
"Untitled"
);


const description =
escapeHtml(
material.description ||
""
);


const subject =
escapeHtml(
material.subjects?.name ||
"General"
);


const openUrl =
escapeHtml(
material.file_url ||
""
);


const downloadUrl =
escapeHtml(
getDownloadUrl(
material.file_url ||
""
)
);


return `

<div class="material-card">


<div class="material-title">

${title}

</div>


<div class="material-subject">

📚 Subject: ${subject}

</div>


${
description
?
`

<div class="material-description">

${description}

</div>

`
:
""
}


<div class="material-actions">


<a
class="open"
href="${openUrl}"
target="_blank"
rel="noopener"
>

📖 Open E-Book

</a>


<a
class="download"
href="${downloadUrl}"
download
onclick="recordEbookDownload(
'${id.replace(/'/g,"\\'")}',
'${title.replace(/'/g,"\\'")}',
'${subject.replace(/'/g,"\\'")}',
'${downloadUrl.replace(/'/g,"\\'")}'
)"
>

📥 Download

</a>


</div>


</div>

`;

}
).join("");

}


/* =========================
   INITIAL LOAD
========================= */

loadMaterials();

</script>

</body>

</html>
