<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-Books - SSC EDGE</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">

<style>

.container{
padding:20px;
padding-bottom:90px;
}

.page-title{
font-size:26px;
font-weight:bold;
margin-bottom:6px;
}

.page-subtitle{
color:var(--muted);
margin-bottom:20px;
}

/* =========================
   TABS
========================= */

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tab{
flex:1;
padding:12px;
border-radius:10px;
border:1px solid var(--border);
background:var(--card);
color:var(--text);
font-weight:bold;
text-align:center;
cursor:pointer;
}

.tab.active{
background:var(--purple);
color:white;
border-color:var(--purple);
}

/* =========================
   MATERIAL LIST
========================= */

.material-list{
display:flex;
flex-direction:column;
gap:14px;
}

.material-card{
background:var(--card);
border:1px solid var(--border);
border-radius:14px;
padding:16px;
}

.material-title{
font-size:18px;
font-weight:bold;
margin-bottom:7px;
}

.material-subject{
display:inline-block;
font-size:13px;
color:var(--muted);
margin-bottom:8px;
}

.material-description{
color:var(--muted);
font-size:14px;
margin-bottom:14px;
}

/* =========================
   BUTTONS
========================= */

.material-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.open,
.download{
display:inline-block;
padding:11px 15px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.open{
background:var(--purple);
color:white;
}

.download{
background:var(--card2);
color:var(--text);
border:1px solid var(--border);
}

/* =========================
   EMPTY / LOADING
========================= */

.empty{
text-align:center;
color:var(--muted);
padding:30px 10px;
}

</style>

</head>

<body>

<div class="container">

<div class="page-title">
E-Books
</div>

<div class="page-subtitle">
SSC EDGE Study Material
</div>


<!-- =========================
     TABS
========================= -->

<div class="tabs">

<div
id="ebookTab"
class="tab active"
onclick="showType('EBOOK')">
📚 E-Books
</div>

<div
id="pdfTab"
class="tab"
onclick="showType('PDF')">
📄 All PDFs
</div>

</div>


<!-- =========================
     MATERIAL LIST
========================= -->

<div
id="materialList"
class="material-list">

<div class="empty">
Loading...
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   CURRENT TYPE
========================= */

let currentType = "EBOOK";


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   DOWNLOAD URL
========================= */

function getDownloadUrl(url){

if(!url){
return "";
}


/* E-BOOK BUCKET */

if(
url.includes(
"/storage/v1/object/public/ssc-edge-ebooks/"
)
){

return url.replace(
"/storage/v1/object/public/ssc-edge-ebooks/",
"/storage/v1/object/download/ssc-edge-ebooks/"
);

}


/* PDF BUCKET */

if(
url.includes(
"/storage/v1/object/public/ssc-edge-pdfs/"
)
){

return url.replace(
"/storage/v1/object/public/ssc-edge-pdfs/",
"/storage/v1/object/download/ssc-edge-pdfs/"
);

}


return url;

}


/* =========================
   SHOW TYPE
========================= */

function showType(type){

currentType = type;


/* TAB ACTIVE STATE */

document
.getElementById("ebookTab")
.classList
.toggle("active",type === "EBOOK");

document
.getElementById("pdfTab")
.classList
.toggle("active",type === "PDF");


loadMaterials();

}


/* =========================
   LOAD MATERIALS
========================= */

async function loadMaterials(){

const materialList =
document.getElementById("materialList");


materialList.innerHTML =
`<div class="empty">
Loading...
</div>`;


/* =========================
   FETCH MATERIALS
========================= */

const {
data: materials,
error
} = await supabaseClient

.from("study_material")

.select(`
*,
subjects (
name
)
`)

.eq("material_type",currentType)

.eq("is_active",true)

.order(
"created_at",
{ascending:false}
);


/* =========================
   ERROR
========================= */

if(error){

console.error(error);

materialList.innerHTML =
`<div class="empty">
Unable to load study material.
</div>`;

return;

}


/* =========================
   EMPTY
========================= */

if(!materials || materials.length === 0){

if(currentType === "EBOOK"){

materialList.innerHTML =
`<div class="empty">
No E-Books available yet.
</div>`;

}else{

materialList.innerHTML =
`<div class="empty">
No PDFs available yet.
</div>`;

}

return;

}


/* =========================
   RENDER
========================= */

materialList.innerHTML =
materials.map(material => {


const title =
escapeHtml(
material.title ||
"Untitled"
);


const description =
escapeHtml(
material.description ||
""
);


const subject =
escapeHtml(
material.subjects?.name ||
"General"
);


const openUrl =
escapeHtml(
material.file_url ||
""
);


const downloadUrl =
escapeHtml(
getDownloadUrl(
material.file_url ||
""
)
);


/* =========================
   ICON / TEXT
========================= */

const openText =
currentType === "EBOOK"
? "📖 Open E-Book"
: "📄 Open PDF";


return `

<div class="material-card">

<div class="material-title">
${title}
</div>

<div class="material-subject">
Subject: ${subject}
</div>

${description ? `

<div class="material-description">
${description}
</div>

` : ""}


<div class="material-actions">

<a
class="open"
href="${openUrl}"
target="_blank"
rel="noopener">

${openText}

</a>


<a
class="download"
href="${downloadUrl}"
download>

📥 Download

</a>

</div>

</div>

`;

}).join("");

}


/* =========================
   INITIAL LOAD
========================= */

loadMaterials();

</script>

</body>

</html>
