<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>SSC EDGE - Study Material Admin</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="css/style.css">

<style>

.admin-page{
  max-width:700px;
  margin:auto;
  padding:20px;
}

.admin-card{
  display:block;
  text-decoration:none;
  color:var(--text);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin:14px 0;
}

.admin-card h2{
  margin:0 0 7px;
}

.admin-card p{
  margin:0;
  color:var(--muted);
}

.back{
  margin-top:15px;
  padding:12px 18px;
}

</style>

</head>

<body>

<div class="admin-page">

<h1>📚 Study Material</h1>

<p>Manage SSC EDGE study content</p>


<a href="admin-video.html"
class="admin-card">

<h2>🎬 Videos</h2>

<p>
Upload, add URL, edit or delete videos
</p>

</a>


<a href="admin-ebook.html"
class="admin-card">

<h2>📚 E-Books</h2>

<p>
Upload, add URL, edit or delete E-Books
</p>

</a>


<a href="admin-pdf.html"
class="admin-card">

<h2>📄 PDFs</h2>

<p>
Upload subject-wise PDFs or add PDF URLs
</p>

</a>


<button
class="back"
onclick="history.back()">

← Back

</button>

</div>


<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


(async()=>{

  const {
    data:{user}
  } = await db.auth.getUser();

  if(!user){
    location.href="admin.html";
    return;
  }

  const {data,error}=await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if(error || !data){

    await db.auth.signOut();

    location.href="admin.html";

  }

})();

</script>

</body>
</html>
