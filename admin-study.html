<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SSC EDGE - Study Material</title>

  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem("ssc-edge-theme") || "dark";
  </script>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .admin-page{
      min-height:100vh;
      padding:24px 18px 100px;
    }

    .admin-header{
      margin-bottom:24px;
    }

    .admin-header h1{
      margin:0;
      font-size:26px;
    }

    .admin-header p{
      margin:6px 0 0;
      color:var(--muted);
    }

    .material-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:20px;
      margin-bottom:16px;
    }

    .material-card h2{
      margin:0 0 8px;
      font-size:20px;
    }

    .material-card p{
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .material-btn{
      display:block;
      width:100%;
      box-sizing:border-box;
      margin-top:16px;
      padding:13px;
      border:0;
      border-radius:12px;
      background:var(--purple);
      color:white;
      font-size:15px;
      font-weight:600;
      text-align:center;
      text-decoration:none;
      cursor:pointer;
    }

    .back-btn{
      display:inline-block;
      margin-bottom:20px;
      padding:10px 16px;
      border-radius:10px;
      border:1px solid var(--border);
      background:transparent;
      color:var(--text);
      font-size:14px;
      text-decoration:none;
    }
  </style>
</head>

<body>

<main class="admin-page">

  <a href="admin.html" class="back-btn">
    ← Back to Admin
  </a>

  <div class="admin-header">
    <h1>📚 Study Material</h1>
    <p>Manage videos, e-books and PDFs</p>
  </div>

  <!-- VIDEO -->

  <div class="material-card">

    <h2>🎥 Videos</h2>

    <p>
      Add and manage video study material.
    </p>

    <a href="admin-video.html" class="material-btn">
      Add Video
    </a>

  </div>


  <!-- E-BOOK -->

  <div class="material-card">

    <h2>📕 E-Books</h2>

    <p>
      Add and manage e-books for SSC EDGE students.
    </p>

    <a href="admin-ebook.html" class="material-btn">
      Add E-Book
    </a>

  </div>


  <!-- PDF -->

  <div class="material-card">

    <h2>📄 PDFs</h2>

    <p>
      Add and manage PDF study material.
    </p>

    <a href="admin-pdf.html" class="material-btn">
      Add PDF
    </a>

  </div>

</main>

</body>
</html>
