<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SSC EDGE - Saved Questions</title>

<link rel="stylesheet" href="css/style.css">

<script>
document.documentElement.dataset.theme =
    localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0 0 40px;
}

.page{
    max-width:900px;
    margin:auto;
    padding:16px 14px 40px;
}

/* BACK */

.back{
    display:inline-block;
    margin-bottom:14px;
    color:var(--purple2);
    text-decoration:none;
    font-size:13px;
    font-weight:900;
}

/* HEADER */

.head{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;
    margin-bottom:15px;
}

.head-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.head h1{
    margin:0;
    color:var(--text);
    font-size:21px;
    line-height:1.3;
}

/* SUBJECT BUTTON */

.subject-wrap{
    position:relative;
    flex-shrink:0;
}

.subject-btn{
    border:1px solid var(--border);
    background:var(--card2);
    color:var(--text);
    border-radius:10px;
    padding:9px 11px;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
    white-space:nowrap;
}

.subject-btn:active{
    transform:scale(.97);
}

.subject-menu{
    position:absolute;
    top:calc(100% + 7px);
    right:0;
    width:190px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:6px;
    z-index:50;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
    display:none;
}

.subject-menu.show{
    display:block;
}

.subject-option{
    width:100%;
    border:0;
    background:transparent;
    color:var(--text);
    padding:10px;
    border-radius:8px;
    text-align:left;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.subject-option:hover{
    background:var(--card2);
}

.subject-option.active{
    background:var(--purple);
    color:#fff;
}

.sub{
    margin:7px 0 0;
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

/* STATUS */

.status{
    text-align:center;
    color:var(--muted);
    padding:28px 12px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    font-size:13px;
    line-height:1.5;
}

.empty-icon{
    font-size:36px;
    margin-bottom:8px;
}

/* SUBJECT GROUP */

.subject-group{
    margin-top:20px;
}

.subject-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:0 0 10px;
    padding:0 2px;
}

.subject-heading h2{
    margin:0;
    color:var(--text);
    font-size:16px;
    font-weight:900;
}

.subject-count{
    color:var(--muted);
    font-size:11px;
    font-weight:700;
}

/* HORIZONTAL SLIDES */

.question-slider{
    display:flex;
    gap:12px;

    overflow-x:auto;
    overflow-y:hidden;

    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;

    padding:2px 2px 14px;

    scrollbar-width:none;

    -webkit-overflow-scrolling:touch;
}

.question-slider::-webkit-scrollbar{
    display:none;
}

/* QUESTION CARD */

.question-card{
    flex:0 0 100%;
    width:100%;

    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px;

    overflow:hidden;

    scroll-snap-align:start;
}

/* TOP */

.q-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;

    padding-bottom:9px;

    border-bottom:1px solid var(--border);
}

.q-number{
    color:var(--text);
    font-size:14px;
    font-weight:900;
}

.bookmark{
    font-size:20px;
    line-height:1;
}

/* QUESTION */

.question{
    margin-top:12px;

    color:var(--text);

    font-size:14px;
    font-weight:700;

    line-height:1.65;

    overflow-wrap:anywhere;
}

/* OPTIONS */

.options{
    margin-top:12px;
}

.option{
    padding:10px 11px;

    margin-top:7px;

    border:1px solid var(--border);

    border-radius:10px;

    color:var(--text);

    font-size:12px;

    line-height:1.55;

    overflow-wrap:anywhere;
}

.option.correct{
    border-color:#2fbf71;
    background:rgba(47,191,113,.10);
}

.option.correct b{
    color:#2fbf71;
}

/* ANSWER */

.answer-box{
    margin-top:13px;

    padding:12px;

    border-radius:11px;

    background:var(--card2);

    border:1px solid var(--border);

    color:var(--text);

    font-size:13px;

    line-height:1.6;

    overflow-wrap:anywhere;
}

.answer-box strong{
    color:#2fbf71;
}

/* EXPLANATION */

.explanation-box{
    margin-top:11px;

    padding:12px;

    border-radius:11px;

    background:var(--card2);

    border:1px solid var(--border);

    border-left:3px solid var(--purple);

    color:var(--text);

    font-size:13px;

    line-height:1.65;

    overflow-wrap:anywhere;
}

.explanation-title{
    display:block;

    color:var(--purple2);

    font-weight:900;

    margin-bottom:5px;
}

/* SLIDE INDICATOR */

.slide-hint{
    text-align:center;
    color:var(--muted);
    font-size:10px;
    margin:-3px 0 8px;
}

/* BUTTONS */

.actions{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:14px;
}

.btn{
    display:flex;

    align-items:center;

    justify-content:center;

    min-height:42px;

    padding:8px 10px;

    border-radius:10px;

    background:var(--card2);

    border:1px solid var(--border);

    color:var(--text);

    text-decoration:none;

    font-size:11px;

    font-weight:900;

    text-align:center;

    cursor:pointer;
}

.btn.primary{
    background:var(--purple);

    border-color:var(--purple);

    color:#fff;
}

@media(max-width:500px){

    .head-top{
        align-items:flex-start;
    }

    .head h1{
        font-size:19px;
    }

    .subject-btn{
        padding:8px 9px;
    }

    .actions{
        grid-template-columns:1fr;
    }

    .question-card{
        padding:14px;
    }

}

</style>
</head>

<a class="back" href="profile.html">

                    General Awareness

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==========================================
   ELEMENTS
========================================== */

const app =
document.getElementById("app");

const count =
document.getElementById("count");

const subjectButton =
document.getElementById("subjectButton");

const subjectMenu =
document.getElementById("subjectMenu");


/* ==========================================
   CURRENT FILTER
========================================== */

let selectedSubject = "all";

let allQuestionData = [];


/* ==========================================
   ESCAPE HTML
========================================== */

function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   CHECK CORRECT OPTION
========================================== */

function isCorrectOption(option){

    return (

        option.is_correct === true ||

        option.is_correct === "true" ||

        option.is_correct === 1 ||

        option.is_correct === "1"

    );

}


/* ==========================================
   SUBJECT NAME
========================================== */

function normalizeSubjectName(name){

    const value =
        String(name || "")
        .trim()
        .toLowerCase();


    if(
        value.includes("quant")
    ){
        return "Quantitative Aptitude";
    }


    if(
        value.includes("general") &&
        value.includes("aware")
    ){
        return "General Awareness";
    }


    if(
        value.includes("reason")
    ){
        return "Reasoning";
    }


    if(
        value.includes("english")
    ){
        return "English";
    }


    return name || "Other";

}


/* ==========================================
   GET SAVED QUESTIONS
========================================== */

function getSavedEntries(){

    const entries = [];


    for(
        let i = 0;
        i < localStorage.length;
        i++
    ){

        const key =
            localStorage.key(i);


        if(
            !key ||
            !key.startsWith(
                "ssc-edge-saved-questions-"
            )
        ){
            continue;
        }


        const testId =
            key.substring(
                "ssc-edge-saved-questions-".length
            );


        try{

            const ids =
                JSON.parse(
                    localStorage.getItem(key)
                );


            if(Array.isArray(ids)){

                ids.forEach(id=>{

                    entries.push({

                        testId:
                            String(testId),

                        questionId:
                            String(id)

                    });

                });

            }

        }catch(error){

            console.warn(
                "Could not read saved questions:",
                error
            );

        }

    }


    return entries;

}


/* ==========================================
   REMOVE SAVED QUESTION
========================================== */

function removeSaved(
    testId,
    questionId
){

    const key =
        "ssc-edge-saved-questions-" +
        String(testId);


    try{

        const saved =
            JSON.parse(
                localStorage.getItem(key) || "[]"
            );


        const ids =
            Array.isArray(saved)
            ? saved.map(x=>String(x))
            : [];


        const next =
            ids.filter(
                id =>
                    id !== String(questionId)
            );


        if(next.length){

            localStorage.setItem(
                key,
                JSON.stringify(next)
            );

        }else{

            localStorage.removeItem(key);

        }


        loadSavedQuestions();

    }catch(error){

        console.warn(
            "Could not remove saved question:",
            error
        );

    }

}


/* ==========================================
   LOAD TEST DATA
========================================== */

async function loadTestData(
    testId,
    questionIds
){

    /* TEST */

    const testResult =
        await db
            .from("mock_tests")
            .select("id,title")
            .eq("id",testId)
            .maybeSingle();


    if(testResult.error){

        throw testResult.error;

    }


    /* TEST QUESTIONS */

    const assignmentResult =
        await db
            .from("mock_test_questions")
            .select(
                "question_id,question_order,section_id"
            )
            .eq(
                "mock_test_id",
                testId
            )
            .order(
                "question_order",
                {ascending:true}
            );


    if(assignmentResult.error){

        throw assignmentResult.error;

    }


    const assignments =
        (assignmentResult.data || [])
            .filter(
                a =>
                    questionIds.includes(
                        String(a.question_id)
                    )
            );


    if(!assignments.length){

        return {

            title:
                testResult.data?.title ||
                "SSC EDGE Test",

            questions:[]

        };

    }


    const ids =
        assignments.map(
            a => a.question_id
        );


    /* QUESTIONS */

    const questionResult =
        await db
            .from("questions")
            .select(
                "*"
            )
            .in("id",ids);


    if(questionResult.error){

        throw questionResult.error;

    }


    /* OPTIONS */

    const optionResult =
        await db
            .from("question_options")
            .select(
                "id,question_id,option_label,option_text,is_correct"
            )
            .in("question_id",ids)
            .order(
                "id",
                {ascending:true}
            );


    if(optionResult.error){

        throw optionResult.error;

    }


    /* SECTIONS */

    const sectionIds =
    [
        ...new Set(

            assignments
                .map(
                    a => a.section_id
                )
                .filter(
                    x =>
                        x !== null &&
                        x !== undefined
                )

        )
    ];


    let sections = [];


    if(sectionIds.length){

        const sectionResult =
            await db
                .from("mock_test_sections")
                .select(
                    "id,subject_id,section_order"
                )
                .in(
                    "id",
                    sectionIds
                )
                .order(
                    "section_order",
                    {ascending:true}
                );


        if(sectionResult.error){

            throw sectionResult.error;

        }


        sections =
            sectionResult.data || [];

    }


    /* SUBJECT IDS */

    const subjectIds =
    [
        ...new Set(

            [

                ...(questionResult.data || [])
                    .map(
                        q =>
                            q.subject_id
                    ),

                ...sections
                    .map(
                        s =>
                            s.subject_id
                    )

            ]
            .filter(
                x =>
                    x !== null &&
                    x !== undefined
            )

        )
    ];


    let subjects = [];


    if(subjectIds.length){

        const subjectResult =
            await db
                .from("subjects")
                .select("id,name")
                .in(
                    "id",
                    subjectIds
                );


        if(!subjectResult.error){

            subjects =
                subjectResult.data || [];

        }

    }


    /* MAP DATA */

    const questionMap =
        new Map(

            (questionResult.data || [])
                .map(
                    q =>
                    [
                        String(q.id),
                        q
                    ]
                )

        );


    const optionsMap =
        new Map();


    (optionResult.data || [])
        .forEach(option=>{

            const key =
                String(option.question_id);


            if(
                !optionsMap.has(key)
            ){

                optionsMap.set(
                    key,
                    []
                );

            }


            optionsMap
                .get(key)
                .push(option);

        });


    const sectionMap =
        new Map(

            sections.map(
                s =>
                [
                    String(s.id),
                    s
                ]
            )

        );


    const subjectMap =
        new Map(

            subjects.map(
                s =>
                [
                    String(s.id),
                    s.name
                ]
            )

        );


    /* BUILD QUESTIONS */

    const questions =
        assignments

            .map(a=>{

                const q =
                    questionMap.get(
                        String(a.question_id)
                    );


                if(!q){

                    return null;

                }


                const section =
                    sectionMap.get(
                        String(a.section_id)
                    );


                const rawSubject =

                    subjectMap.get(
                        String(q.subject_id)
                    )

                    ||

                    subjectMap.get(
                        String(section?.subject_id)
                    )

                    ||

                    "";


                const subjectName =
                    normalizeSubjectName(
                        rawSubject
                    );


                return {

                    ...q,

                    question_order:
                        a.question_order,

                    subjectName:
                        subjectName,

                    options:
                        optionsMap.get(
                            String(q.id)
                        ) || []

                };

            })

            .filter(Boolean);


    return {

        title:
            testResult.data?.title ||
            "SSC EDGE Test",

        questions:
            questions

    };

}


/* ==========================================
   RENDER QUESTIONS
========================================== */

function renderQuestions(){

    const filtered =

        selectedSubject === "all"

        ?

        allQuestionData

        :

        allQuestionData.filter(
            item =>
                item.subjectName ===
                selectedSubject
        );


    if(!filtered.length){

        app.innerHTML = `

            <div class="status">

                <div class="empty-icon">
                    🔖
                </div>

                <div>
                    No saved questions in
                    ${esc(selectedSubject)}
                </div>

            </div>

        `;

        count.textContent =
            "🔖 0 Saved Questions";

        return;

    }


    /* GROUP BY SUBJECT */

    const groups =
        new Map();


    filtered.forEach(item=>{

        const subject =
            item.subjectName ||
            "Other";


        if(!groups.has(subject)){

            groups.set(
                subject,
                []
            );

        }


        groups
            .get(subject)
            .push(item);

    });


    let html = "";

    let total = 0;


    groups.forEach(
        (items,subject)=>{

            total += items.length;


            html += `

                <section class="subject-group">

                    <div class="subject-heading">

                        <h2>
                            ${esc(subject)}
                        </h2>

                        <span class="subject-count">
                            ${items.length}
                            ${
                                items.length === 1
                                ? "Question"
                                : "Questions"
                            }
                        </span>

                    </div>


                    <div class="slide-hint">
                        Swipe left/right to view questions
                    </div>


                    <div class="question-slider">

            `;


            items.forEach(
                (item,index)=>{

                    const q =
                        item.question;

                    const correct =
                        q.options.find(
                            isCorrectOption
                        );


                    /* OPTIONS */

                    const opts =
                        q.options.length

                        ?

                        `

                        <div class="options">

                            ${
                                q.options
                                    .map(
                                        (o,i)=>`

                                            <div
                                                class="option ${
                                                    isCorrectOption(o)
                                                    ? "correct"
                                                    : ""
                                                }"
                                            >

                                                <b>
                                                    ${
                                                        esc(
                                                            o.option_label ||
                                                            String.fromCharCode(
                                                                65+i
                                                            )
                                                        )
                                                    }
                                                </b>

                                                ${
                                                    o.option_text
                                                    ?
                                                    " " +
                                                    esc(
                                                        o.option_text
                                                    )
                                                    :
                                                    ""
                                                }

                                                ${
                                                    isCorrectOption(o)
                                                    ?
                                                    " ✓"
                                                    :
                                                    ""
                                                }

                                            </div>

                                        `
                                    )
                                    .join("")
                            }

                        </div>

                        `

                        :

                        "";


                    /* ANSWER */

                    const answerText =

                        correct

                        ?

                        (
                            (correct.option_label || "") +

                            (
                                correct.option_text
                                ?
                                " " +
                                correct.option_text
                                :
                                ""
                            )
                        )

                        :

                        "Correct answer is not available.";


                    /* EXPLANATION */

                    const explanation =

                        q.explanation

                        ?

                        esc(q.explanation)

                        :

                        "No explanation has been added for this question yet.";


                    html += `

                        <article
                            class="question-card"
                        >

                            <div class="q-top">

                                <span class="q-number">

                                    Question
                                    ${esc(q.question_order)}

                                </span>


                                <span
                                    class="bookmark"
                                    title="Saved Question"
                                >
                                    🔖
                                </span>

                            </div>


                            <div class="question">

                                ${esc(q.question_text)}

                            </div>


                            ${opts}


                            <div class="answer-box">

                                <strong>
                                    Correct Answer:
                                </strong>

                                ${esc(answerText)}

                            </div>


                            <div class="explanation-box">

                                <span class="explanation-title">

                                    📖 Explanation

                                </span>

                                ${explanation}

                            </div>


                            <div class="actions">

                                <button
                                    class="btn"
                                    type="button"
                                    onclick="
                                        removeSaved(
                                            '${esc(item.testId)}',
                                            '${esc(q.id)}'
                                        )
                                    "
                                >

                                    Remove

                                </button>


                                <a
                                    class="btn primary"
                                    href="solutions.html?test_id=${encodeURIComponent(item.testId)}"
                                >

                                    Open Test

                                </a>

                            </div>

                        </article>

                    `;

                }

            );


            html += `

                    </div>

                </section>

            `;

        }

    );


    app.innerHTML =
        html;


    count.textContent =

        "🔖 " +

        total +

        (
            total === 1
            ? " Saved Question"
            : " Saved Questions"
        );

}


/* ==========================================
   LOAD SAVED QUESTIONS
========================================== */

async function loadSavedQuestions(){

    app.innerHTML = `
        <div class="status">
            Loading saved questions...
        </div>
    `;


    const entries =
        getSavedEntries();


    /* NO SAVED QUESTIONS */

    if(!entries.length){

        count.textContent =
            "🔖 0 Saved Questions";


        app.innerHTML = `

            <div class="status">

                <div class="empty-icon">
                    🔖
                </div>

                <div>
                    No saved questions yet.
                </div>

                <div style="margin-top:6px;">
                    Save questions from a test
                    to revise them later.
                </div>

            </div>

        `;

        return;

    }


    /* GROUP BY TEST */

    const grouped =
        new Map();


    entries.forEach(entry=>{

        if(
            !grouped.has(
                entry.testId
            )
        ){

            grouped.set(
                entry.testId,
                []
            );

        }


        grouped
            .get(entry.testId)
            .push(
                entry.questionId
            );

    });


    allQuestionData = [];


    /* LOAD EACH TEST */

    for(
        const [
            testId,
            questionIds
        ]
        of grouped
    ){

        try{

            const data =
                await loadTestData(
                    testId,
                    questionIds
                );


            data.questions.forEach(q=>{

                allQuestionData.push({

                    testId:
                        String(testId),

                    question:q

                });

            });

        }catch(error){

            console.error(
                "Saved question load error:",
                error
            );

        }

    }


    if(!allQuestionData.length){

        count.textContent =
            "🔖 0 Saved Questions";


        app.innerHTML = `

            <div class="status">

                <div>
                    Saved questions could not be loaded.
                </div>

                <div style="margin-top:6px;">
                    The saved test/question may
                    no longer exist.
                </div>

            </div>

        `;

        return;

    }


    /* RESET FILTER */

    selectedSubject = "all";

    document
        .querySelectorAll(".subject-option")
        .forEach(btn=>{

            btn.classList.toggle(
                "active",
                btn.dataset.subject === "all"
            );

        });


    subjectButton.textContent =
        "Subject ▾";


    renderQuestions();

}


/* ==========================================
   SUBJECT DROPDOWN
========================================== */

subjectButton.addEventListener(
    "click",
    event=>{

        event.stopPropagation();

        subjectMenu.classList.toggle(
            "show"
        );

    }
);


document
    .querySelectorAll(".subject-option")
    .forEach(button=>{

        button.addEventListener(
            "click",
            event=>{

                event.stopPropagation();


                selectedSubject =
                    button.dataset.subject;


                document
                    .querySelectorAll(
                        ".subject-option"
                    )
                    .forEach(btn=>{

                        btn.classList.toggle(
                            "active",
                            btn === button
                        );

                    });


                subjectButton.textContent =

                    selectedSubject === "all"

                    ?

                    "Subject ▾"

                    :

                    selectedSubject + " ▾";


                subjectMenu.classList.remove(
                    "show"
                );


                renderQuestions();

            }
        );

    });


document.addEventListener(
    "click",
    event=>{

        if(
            !event.target.closest(
                ".subject-wrap"
            )
        ){

            subjectMenu.classList.remove(
                "show"
            );

        }

    }
);


/* ==========================================
   START
========================================== */

loadSavedQuestions();

</script>

</body>
    </html>
