<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#160b26"
>

<title>SSC EDGE - Test</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<script>
document.documentElement.dataset.theme =
  localStorage.getItem("ssc-edge-theme") || "dark";
</script>


<style>

/* ==================================================
   SSC EDGE TEST UI
   ================================================== */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:0 0 30px;
}


/* ==================================================
   HEADER
   ================================================== */

.test-header{

  position:sticky;
  top:0;
  z-index:50;

  background:var(--header);

  border-bottom:1px solid var(--border);

  padding:11px 14px 10px;

  backdrop-filter:blur(14px);

}


.test-header-top{

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;

}


.brand{

  font-size:20px;
  font-weight:900;

  letter-spacing:-.5px;

  white-space:nowrap;

}


.brand-ssc{
  color:var(--text);
}


.brand-edge{
  color:var(--purple);
}


.header-actions{

  display:flex;
  align-items:center;

  gap:7px;

}


.timer{

  display:flex;
  align-items:center;
  justify-content:center;

  min-width:76px;

  padding:8px 9px;

  border-radius:10px;

  background:var(--card2);

  border:1px solid var(--border);

  color:var(--text);

  font-size:13px;
  font-weight:900;

}


.timer.warning{
  color:#ff6868;
}


.pause-btn{

  border:1px solid var(--border);

  background:var(--card2);

  color:var(--text);

  padding:8px 11px;

  border-radius:10px;

  font-size:12px;
  font-weight:900;

  cursor:pointer;

}


.pause-btn:active{
  transform:scale(.97);
}


/* ==================================================
   TEST INFORMATION
   ================================================== */

.test-info{

  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  margin-top:10px;

}


.test-info-left{
  min-width:0;
}


.test-name{

  color:var(--text);

  font-size:15px;
  font-weight:900;

  line-height:1.3;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

}


.test-number{

  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:11px;
  font-weight:700;

}


.submit-section{

  flex-shrink:0;

  border:0;

  background:var(--purple);

  color:white;

  padding:9px 11px;

  border-radius:10px;

  font-size:11px;
  font-weight:900;

  cursor:pointer;

}


/* ==================================================
   SECTION BAR
   ================================================== */

.section-bar{

  display:flex;

  gap:7px;

  overflow-x:auto;

  scrollbar-width:none;

  margin-top:11px;

  padding-bottom:1px;

}


.section-bar::-webkit-scrollbar{
  display:none;
}


.section-btn{

  flex:0 0 auto;

  border:1px solid var(--border);

  background:#fff;

  color:#24152f;

  padding:8px 12px;

  border-radius:9px;

  font-size:11px;

  font-weight:900;

  cursor:pointer;

}


.section-btn.current{

  background:var(--purple);

  border-color:var(--purple);

  color:#fff;

}


.section-btn:active{
  transform:scale(.97);
}


/* ==================================================
   MAIN CONTAINER
   ================================================== */

.test-container{

  max-width:850px;

  margin:auto;

  padding:15px 14px 30px;

}


/* ==================================================
   QUESTION TOP
   ================================================== */

.question-top{

  display:flex;

  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;

}


.question-count{

  color:var(--text);

  font-size:13px;

  font-weight:900;

}


.question-section{

  color:var(--purple2);

  font-size:11px;

  font-weight:900;

}


/* ==================================================
   QUESTION CARD
   ================================================== */

.question-card{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:16px;

  padding:17px;

}


.question-text{

  color:var(--text);

  font-size:16px;

  line-height:1.55;

  font-weight:700;

  white-space:pre-wrap;

}


/* ==================================================
   OPTIONS
   ================================================== */

.options{

  margin-top:18px;

  display:flex;

  flex-direction:column;

  gap:9px;

}


.option{

  display:flex;

  align-items:flex-start;

  gap:10px;

  padding:12px;

  border:1px solid var(--border);

  border-radius:11px;

  background:var(--bg);

  color:var(--text);

  cursor:pointer;

  transition:.15s ease;

}


.option.selected{

  border-color:var(--purple);

  background:var(--card2);

}


.option input{

  width:auto;

  margin-top:3px;

  accent-color:var(--purple);

}


.option-label{

  min-width:22px;

  color:var(--purple2);

  font-size:13px;

  font-weight:900;

}


.option-text{

  color:var(--text);

  font-size:14px;

  line-height:1.45;

}


/* ==================================================
   NAVIGATION
   ================================================== */

.navigation{

  margin-top:13px;

}


.navigation-row{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

}


.nav-btn{

  min-height:44px;

  border-radius:10px;

  padding:9px;

  font-size:11px;

  font-weight:900;

  cursor:pointer;

}


.previous-btn{

  background:var(--card2);

  color:var(--text);

  border:1px solid var(--border);

}


.review-btn{

  width:100%;

  margin-top:8px;

  background:var(--card2);

  color:var(--purple2);

  border:1px solid var(--border);

}


.review-btn.marked{

  background:var(--purple);

  color:white;

  border-color:var(--purple);

}


.grid-btn{

  width:100%;

  margin-top:8px;

  min-height:42px;

  border-radius:10px;

  background:var(--card2);

  color:var(--purple2);

  border:1px solid var(--border);

  font-size:12px;

  font-weight:900;

  cursor:pointer;

}


.save-next-btn{

  width:100%;

  margin-top:8px;

  min-height:45px;

  border:0;

  border-radius:10px;

  background:var(--purple);

  color:white;

  font-size:12px;

  font-weight:900;

  cursor:pointer;

}


/* ==================================================
   QUESTION GRID OVERLAY
   ================================================== */

.grid-overlay{

  position:fixed;

  inset:0;

  z-index:200;

  display:none;

  align-items:flex-end;

  justify-content:center;

  background:rgba(0,0,0,.68);

}


.grid-overlay.show{

  display:flex;

}


.grid-popup{

  width:100%;

  max-width:650px;

  max-height:88vh;

  overflow-y:auto;

  background:var(--bg);

  border:1px solid var(--border);

  border-bottom:0;

  border-radius:20px 20px 0 0;

  padding:17px;

}


/* ==================================================
   GRID HEADER
   ================================================== */

.grid-header{

  display:flex;

  align-items:center;

  gap:10px;

  padding-bottom:13px;

  border-bottom:1px solid var(--border);

}


.grid-subject-area{

  flex:1;

  min-width:0;

}


.grid-subject{

  color:var(--text);

  font-size:17px;

  font-weight:900;

  margin:0;

}


.grid-subtitle{

  display:block;

  margin-top:3px;

  color:var(--muted);

  font-size:10px;

  font-weight:700;

}


.grid-timer{

  padding:8px 9px;

  border-radius:9px;

  background:var(--card2);

  border:1px solid var(--border);

  color:var(--purple2);

  font-size:12px;

  font-weight:900;

  white-space:nowrap;

}


.grid-close{

  width:34px;
  height:34px;

  border:0;

  border-radius:9px;

  background:var(--card2);

  color:var(--text);

  font-size:22px;

  line-height:1;

  cursor:pointer;

}


/* ==================================================
   QUESTION NUMBERS
   ================================================== */

.question-grid{

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:8px;

  padding:16px 0;

}


.grid-question{

  position:relative;

  min-height:44px;

  border:1px solid var(--border);

  border-radius:9px;

  background:#fff;

  color:#24152f;

  font-size:12px;

  font-weight:900;

  cursor:pointer;

}


/* NOT VISITED */

.grid-question.not-visited{

  background:#fff;

  color:#24152f;

}


/* NOT ATTEMPTED */

.grid-question.not-attempted{

  background:#ef4444;

  border-color:#ef4444;

  color:#fff;

}


/* ATTEMPTED */

.grid-question.attempted{

  background:#22c55e;

  border-color:#22c55e;

  color:#fff;

}


/* CURRENT */

.grid-question.current{

  outline:3px solid rgba(168,85,247,.40);

}


/* REVIEW */

.grid-question.review::after{

  content:"★";

  position:absolute;

  top:-7px;

  right:-5px;

  width:18px;

  height:18px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  background:var(--purple);

  color:#fff;

  font-size:9px;

}


/* ==================================================
   GRID LEGEND
   ================================================== */

.grid-legend{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:9px;

  padding-top:13px;

  border-top:1px solid var(--border);

}


.legend-item{

  display:flex;

  align-items:center;

  gap:7px;

  color:var(--muted);

  font-size:10px;

  font-weight:700;

}


.legend-box{

  width:16px;

  height:16px;

  border-radius:4px;

  flex-shrink:0;

}


.legend-attempted{
  background:#22c55e;
}


.legend-not-visited{

  background:#fff;

  border:1px solid #bbb;

}


.legend-not-attempted{
  background:#ef4444;
}


.legend-star{

  color:var(--purple);

  font-size:15px;

  width:16px;

  text-align:center;

}


/* ==================================================
   PAUSE POPUP
   ================================================== */

.pause-overlay{

  position:fixed;

  inset:0;

  z-index:300;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.70);

}


.pause-overlay.show{

  display:flex;

}


.pause-popup{

  width:100%;

  max-width:350px;

  padding:25px 20px;

  border-radius:18px;

  background:var(--bg);

  border:1px solid var(--border);

  text-align:center;

}


.pause-symbol{

  color:var(--purple);

  font-size:27px;

  font-weight:900;

}


.pause-popup h2{

  margin:10px 0 5px;

  color:var(--text);

  font-size:20px;

}


.pause-popup p{

  margin:0 0 18px;

  color:var(--muted);

  font-size:12px;

}


.resume-btn{

  width:100%;

  padding:12px;

  border:0;

  border-radius:10px;

  background:var(--purple);

  color:#fff;

  font-weight:900;

  cursor:pointer;

}


/* ==================================================
   RESULT
   ================================================== */

.result-card{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:18px;

  padding:22px;

  margin-top:20px;

  text-align:center;

}


.result-card h2{

  color:var(--text);

}


.score{

  color:var(--purple2);

  font-size:38px;

  font-weight:900;

}


.result-info{

  color:var(--muted);

  line-height:1.8;

  margin-top:10px;

  font-size:13px;

}


.result-back{

  width:100%;

  margin-top:18px;

  padding:12px;

  border:0;

  border-radius:10px;

  background:var(--purple);

  color:white;

  font-weight:900;

}


/* ==================================================
   STATES
   ================================================== */

.hidden{
  display:none!important;
}


.loading{

  text-align:center;

  padding:55px 10px;

  color:var(--muted);

  font-size:13px;

}


.error{

  background:#512020;

  color:#ffaaaa;

  padding:15px;

  border-radius:12px;

  margin-top:20px;

  font-size:13px;

}


/* ==================================================
   LIGHT THEME
   ================================================== */

[data-theme="light"] .section-btn{
  background:#fff;
  color:#24152f;
}


[data-theme="light"] .section-btn.current{
  background:var(--purple);
  color:#fff;
}


[data-theme="light"] .question-card,
[data-theme="light"] .grid-popup,
[data-theme="light"] .pause-popup,
[data-theme="light"] .result-card{
  background:var(--card);
}


[data-theme="light"] .question-text,
[data-theme="light"] .question-count,
[data-theme="light"] .question-section,
[data-theme="light"] .test-name,
[data-theme="light"] .grid-subject,
[data-theme="light"] .pause-popup h2{
  color:var(--text);
}


/* ==================================================
   MOBILE
   ================================================== */

@media(max-width:500px){

  .brand{
    font-size:19px;
  }

  .timer{
    min-width:70px;
    font-size:12px;
  }

  .pause-btn{
    padding:8px 9px;
    font-size:11px;
  }

  .test-name{
    font-size:14px;
  }

  .submit-section{
    padding:8px 9px;
    font-size:10px;
  }

  .question-text{
    font-size:15px;
  }

  .question-grid{
    grid-template-columns:
      repeat(5,1fr);
  }

}


/* ==================================================
   VERY SMALL SCREEN
   ================================================== */

@media(max-width:350px){

  .header-actions{
    gap:4px;
  }

  .timer{
    min-width:64px;
    padding:7px 5px;
  }

  .pause-btn{
    padding:7px 7px;
  }

  .question-grid{
    gap:6px;
  }

}

</style>

</head>


<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";


const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let test = null;
let questions = [];
let sections = [];
let currentIndex = 0;
let answers = {};
let review = new Set();
let visitedQuestions = new Set();
let remainingSeconds = 0;
let timerInterval = null;
let submitted = false;
let paused = false;
let currentSectionIndex = -1;
let sectionRemainingTimes = {};


const params =
new URLSearchParams(
  location.search
);

const testId =
params.get("id");


loadTest();


async function loadTest(){

  if(!testId){

    showError(
      "No test ID was provided."
    );

    return;

  }


  const testResult =
    await db
      .from("mock_tests")
      .select("*")
      .eq("id",testId)
      .eq("is_active",true)
      .maybeSingle();


  if(testResult.error){

    showError(
      testResult.error.message
    );

    return;

  }


  if(!testResult.data){

    showError(
      "Test not found or inactive."
    );

    return;

  }


  test =
    testResult.data;


  await loadSections();
  await loadQuestions();

}


async function loadSections(){

  if(
    test.test_type !== "FULL" ||
    !test.subject_wise_timing
  ){

    sections = [];

    return;

  }


  const result =
    await db
      .from("mock_test_sections")
      .select("*")
      .eq(
        "mock_test_id",
        test.id
      )
      .order(
        "section_order"
      );


  if(result.error){

    showError(
      result.error.message
    );

    return;

  }


  sections =
    result.data || [];


  sections.forEach(
    section => {

      sectionRemainingTimes[
        String(section.id)
      ] =
        Number(
          section.duration_minutes || 0
        ) * 60;

    }
  );

}


async function loadQuestions(){

  const result =
    await db
      .from("mock_test_questions")
      .select(`
        id,
        question_id,
        question_order,
        section_id
      `)
      .eq(
        "mock_test_id",
        test.id
      )
      .order(
        "question_order"
      );


  if(result.error){

    showError(
      result.error.message
    );

    return;

  }


  const assignments =
    result.data || [];


  if(!assignments.length){

    showError(
      "No questions have been assigned to this test yet."
    );

    return;

  }


  const ids =
    assignments.map(
      x => x.question_id
    );


  const questionResult =
    await db
      .from("questions")
      .select(`
        id,
        question_text,
        explanation,
        marks,
        negative_marks,
        subject_id,
        chapter_id
      `)
      .in(
        "id",
        ids
      );


  if(questionResult.error){

    showError(
      questionResult.error.message
    );

    return;

  }


  const optionResult =
    await db
      .from("question_options")
      .select(`
        id,
        question_id,
        option_text,
        option_label
      `)
      .in(
        "question_id",
        ids
      )
      .order(
        "id"
      );


  if(optionResult.error){

    showError(
      optionResult.error.message
    );

    return;

  }


  const questionMap =
    new Map();


  (questionResult.data || [])
    .forEach(
      q => {

        questionMap.set(
          String(q.id),
          {
            ...q,
            options:[]
          }
        );

      }
    );


  (optionResult.data || [])
    .forEach(
      option => {

        const q =
          questionMap.get(
            String(option.question_id)
          );


        if(q){

          q.options.push(
            option
          );

        }

      }
    );


  questions =
    assignments
      .map(
        assignment => {

          const q =
            questionMap.get(
              String(
                assignment.question_id
              )
            );


          if(!q){
            return null;
          }


          return {

            ...q,

            assignment_id:
              assignment.id,

            section_id:
              assignment.section_id,

            question_order:
              assignment.question_order

          };

        }
      )
      .filter(Boolean);


  if(!questions.length){

    showError(
      "Assigned questions could not be loaded."
    );

    return;

  }


  beginTest();

}


function beginTest(){

  document
    .getElementById("loading")
    .classList
    .add("hidden");


  document
    .getElementById("testArea")
    .classList
    .remove("hidden");


  document
    .getElementById("testName")
    .textContent =
      test.title || "SSC EDGE Test";


  document
    .getElementById("testNumber")
    .textContent =
      "Test " +
      (
        test.test_number ||
        test.test_no ||
        "01"
      );


  renderSections();

  showQuestion();

  startTimer();

}


function getSectionName(section,index){

  return (

    section?.subject_name ||

    section?.subject ||

    section?.name ||

    section?.title ||

    (
      "Section " +
      (index + 1)
    )

  );

}


function renderSections(){

  const bar =
    document.getElementById(
      "sectionBar"
    );


  if(
    !(
      test.test_type === "FULL" &&
      test.subject_wise_timing &&
      sections.length
    )
  ){

    bar.classList.add(
      "hidden"
    );

    return;

  }


  bar.classList.remove(
    "hidden"
  );


  bar.innerHTML = "";


  sections.forEach(
    (section,index) => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "section-btn";


      button.textContent =
        getSectionName(
          section,
          index
        );


      button.onclick =
        function(){

          jumpToSection(
            index
          );

        };


      bar.appendChild(
        button
      );

    }
  );


  updateSectionButtons();

}


function getSectionQuestions(sectionId){

  return questions
    .map(
      (q,index) => ({
        q,
        i:index
      })
    )
    .filter(
      item =>
        String(
          item.q.section_id
        ) ===
        String(sectionId)
    );

}


function getCurrentSectionIndex(){

  if(!sections.length){

    return -1;

  }


  const sectionId =
    questions[
      currentIndex
    ]?.section_id;


  return sections.findIndex(
    section =>
      String(section.id) ===
      String(sectionId)
  );

}


function jumpToSection(sectionIndex){

  if(
    submitted ||
    paused ||
    !sections[sectionIndex]
  ){

    return;

  }


  saveCurrentSectionTime();


  const section =
    sections[
      sectionIndex
    ];


  const list =
    getSectionQuestions(
      section.id
    );


  if(!list.length){

    return;

  }


  currentSectionIndex =
    sectionIndex;


  currentIndex =
    list[0].i;


  loadSectionTime(
    sectionIndex
  );


  showQuestion();

  startSectionInterval();

}


function saveCurrentSectionTime(){

  if(
    currentSectionIndex < 0 ||
    !sections[currentSectionIndex]
  ){

    return;

  }


  sectionRemainingTimes[
    String(
      sections[
        currentSectionIndex
      ].id
    )
  ] =
    remainingSeconds;

}


function loadSectionTime(sectionIndex){

  const section =
    sections[
      sectionIndex
    ];


  if(!section){

    return;

  }


  const key =
    String(section.id);


  if(
    typeof sectionRemainingTimes[key]
    === "number"
  ){

    remainingSeconds =
      sectionRemainingTimes[key];

  }else{

    remainingSeconds =
      Number(
        section.duration_minutes || 0
      ) * 60;

  }

}


function showQuestion(){

  if(
    submitted ||
    !questions.length
  ){

    return;

  }


  const q =
    questions[
      currentIndex
    ];


  visitedQuestions.add(
    currentIndex
  );


  const sectionIndex =
    getCurrentSectionIndex();


  currentSectionIndex =
    sectionIndex;


  const sectionName =
    sectionIndex >= 0
    ? getSectionName(
        sections[
          sectionIndex
        ],
        sectionIndex
      )
    : "";


  document
    .getElementById(
      "questionCount"
    )
    .textContent =
      "Question " +
      (currentIndex + 1) +
      " of " +
      questions.length;


  document
    .getElementById(
      "questionSection"
    )
    .textContent =
      sectionName;


  document
    .getElementById(
      "gridSubject"
    )
    .textContent =
      sectionName ||
      "Question Palette";


  const card =
    document.getElementById(
      "questionCard"
    );


  card.innerHTML = "";


  const text =
    document.createElement(
      "div"
    );


  text.className =
    "question-text";


  text.textContent =
    q.question_text || "";


  const options =
    document.createElement(
      "div"
    );


  options.className =
    "options";


  q.options.forEach(
    (option,index) => {

      const row =
        document.createElement(
          "label"
        );


      row.className =
        "option";


      if(
        answers[q.id] ===
        String(option.id)
      ){

        row.classList.add(
          "selected"
        );

      }


      const radio =
        document.createElement(
          "input"
        );


      radio.type =
        "radio";


      radio.name =
        "question-" +
        q.id;


      radio.value =
        option.id;


      radio.checked =
        answers[q.id] ===
        String(option.id);


      radio.onchange =
        function(){

          answers[q.id] =
            String(option.id);


          showQuestion();

          renderQuestionGrid();

        };


      const label =
        document.createElement(
          "span"
        );


      label.className =
        "option-label";


      label.textContent =
        option.option_label ||
        String.fromCharCode(
          65 + index
        );


      const optionText =
        document.createElement(
          "span"
        );


      optionText.className =
        "option-text";


      optionText.textContent =
        option.option_text || "";


      row.appendChild(radio);
      row.appendChild(label);
      row.appendChild(optionText);
      options.appendChild(row);

    }
  );


  card.appendChild(text);
  card.appendChild(options);


  const navigation =
    document.createElement(
      "div"
    );


  navigation.className =
    "navigation";


  const navigationRow =
    document.createElement(
      "div"
    );


  navigationRow.className =
    "navigation-row";


  const previous =
    document.createElement(
      "button"
    );


  previous.type =
    "button";


  previous.className =
    "nav-btn previous-btn";


  previous.textContent =
    "← Previous Question";


  previous.disabled =
    currentIndex === 0;


  previous.onclick =
    function(){

      saveCurrentAnswer();


      if(currentIndex > 0){

        currentIndex--;

        showQuestion();

      }

    };


  const reviewButton =
    document.createElement(
      "button"
    );


  reviewButton.type =
    "button";


  reviewButton.className =
    "nav-btn review-btn";


  if(review.has(q.id)){

    reviewButton.classList.add("marked");

    reviewButton.textContent =
      "★ Marked for Review";

  }else{

    reviewButton.textContent =
      "☆ Mark for Review";

  }


  reviewButton.onclick =
    function(){

      if(review.has(q.id)){

        review.delete(q.id);

      }else{

        review.add(q.id);

      }


      showQuestion();
      renderQuestionGrid();

    };


  navigationRow.appendChild(previous);
  navigationRow.appendChild(reviewButton);
  navigation.appendChild(navigationRow);


  const gridButton =
    document.createElement(
      "button"
    );


  gridButton.type =
    "button";


  gridButton.className =
    "grid-btn";


  gridButton.innerHTML =
    "▦ &nbsp; Question Grid";


  gridButton.onclick =
    function(){

      openGrid();

    };


  navigation.appendChild(gridButton);


  const nextButton =
    document.createElement(
      "button"
    );


  nextButton.type =
    "button";


  nextButton.className =
    "save-next-btn";


  nextButton.textContent =
    "Save & Next →";


  nextButton.onclick =
    function(){

      saveCurrentAnswer();


      if(
        currentIndex <
        questions.length - 1
      ){

        currentIndex++;

        showQuestion();

      }else{

        confirmSubmit();

      }

    };


  navigation.appendChild(nextButton);

  card.appendChild(navigation);

  renderQuestionGrid();
  updateSectionButtons();
  updateGridTimer();

}


function saveCurrentAnswer(){

  const q =
    questions[
      currentIndex
    ];


  if(!q){
    return;
  }


  const selected =
    document.querySelector(
      'input[name="question-' +
      q.id +
      '"]:checked'
    );


  if(selected){

    answers[q.id] =
      String(
        selected.value
      );

  }

}


function renderQuestionGrid(){

  const grid =
    document.getElementById(
      "questionGrid"
    );


  grid.innerHTML = "";


  let list =
    questions.map(
      (q,index) => ({
        q,
        index
      })
    );


  if(
    currentSectionIndex >= 0 &&
    sections[currentSectionIndex]
  ){

    const sectionId =
      sections[
        currentSectionIndex
      ].id;


    list =
      list.filter(
        item =>
          String(
            item.q.section_id
          ) ===
          String(sectionId)
      );

  }


  list =
    list.slice(0,25);


  list.forEach(
    item => {

      const q =
        item.q;

      const index =
        item.index;


      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "grid-question";


      button.textContent =
        index + 1;


      if(answers[q.id]){

        button.classList.add(
          "attempted"
        );

      }else if(
        visitedQuestions.has(index)
      ){

        button.classList.add(
          "not-attempted"
        );

      }else{

        button.classList.add(
          "not-visited"
        );

      }


      if(review.has(q.id)){

        button.classList.add(
          "review"
        );

      }


      if(index === currentIndex){

        button.classList.add(
          "current"
        );

      }


      button.onclick =
        function(){

          saveCurrentAnswer();

          currentIndex =
            index;

          closeGrid();

          showQuestion();

        };


      grid.appendChild(button);

    }
  );


  updateGridTimer();

}


function openGrid(){

  saveCurrentAnswer();

  renderQuestionGrid();

  updateGridTimer();

  document
    .getElementById("gridOverlay")
    .classList.add("show");

}


function closeGrid(){

  document
    .getElementById("gridOverlay")
    .classList.remove("show");

}


document
  .getElementById("gridClose")
  .addEventListener(
    "click",
    closeGrid
  );


document
  .getElementById("gridOverlay")
  .addEventListener(
    "click",
    function(event){

      if(
        event.target ===
        document.getElementById("gridOverlay")
      ){

        closeGrid();

      }

    }
  );


function startTimer(){

  clearInterval(timerInterval);


  if(
    test.test_type === "FULL" &&
    test.subject_wise_timing &&
    sections.length
  ){

    const current =
      getCurrentSectionIndex();


    if(current >= 0){

      currentSectionIndex =
        current;

      loadSectionTime(current);

      startSectionInterval();

      return;

    }

  }


  remainingSeconds =
    Number(
      test.duration_minutes || 0
    ) * 60;


  startGeneralTimer();

}


function startGeneralTimer(){

  clearInterval(timerInterval);

  updateTimerDisplay();


  timerInterval =
    setInterval(
      function(){

        if(
          submitted ||
          paused
        ){

          return;

        }


        remainingSeconds--;

        updateTimerDisplay();


        if(
          remainingSeconds <= 0
        ){

          clearInterval(timerInterval);

          submitTest(true);

        }

      },
      1000
    );

}


function startSectionInterval(){

  clearInterval(timerInterval);

  updateTimerDisplay();
  updateGridTimer();


  timerInterval =
    setInterval(
      function(){

        if(
          submitted ||
          paused
        ){

          return;

        }


        remainingSeconds--;

        saveCurrentSectionTime();

        updateTimerDisplay();
        updateGridTimer();


        if(
          remainingSeconds <= 0
        ){

          clearInterval(timerInterval);

          sectionTimeUp();

        }

      },
      1000
    );

}


function sectionTimeUp(){

  if(submitted){
    return;
  }


  saveCurrentSectionTime();


  const next =
    currentSectionIndex + 1;


  if(
    next >= sections.length
  ){

    submitTest(true);

    return;

  }


  const nextQuestions =
    getSectionQuestions(
      sections[next].id
    );


  if(
    !nextQuestions.length
  ){

    currentSectionIndex =
      next;

    sectionTimeUp();

    return;

  }


  alert(
    getSectionName(
      sections[
        currentSectionIndex
      ],
      currentSectionIndex
    ) +
    " section time is over. Moving to " +
    getSectionName(
      sections[next],
      next
    ) +
    "."
  );


  currentSectionIndex =
    next;


  currentIndex =
    nextQuestions[0].i;


  loadSectionTime(next);

  showQuestion();

  startSectionInterval();

}


function formatTime(seconds){

  seconds =
    Math.max(
      0,
      Number(seconds) || 0
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    seconds % 60;


  return (
    String(minutes)
      .padStart(2,"0")
    +
    ":"
    +
    String(secs)
      .padStart(2,"0")
  );

}


function updateTimerDisplay(){

  const timer =
    document.getElementById(
      "timer"
    );


  timer.textContent =
    formatTime(
      remainingSeconds
    );


  timer.classList.toggle(
    "warning",
    remainingSeconds <= 60
  );

}


function updateGridTimer(){

  const timer =
    document.getElementById(
      "gridTimer"
    );


  if(timer){

    timer.textContent =
      formatTime(
        remainingSeconds
      );

  }

}


function updateSectionButtons(){

  const buttons =
    document.querySelectorAll(
      ".section-btn"
    );


  const current =
    getCurrentSectionIndex();


  buttons.forEach(
    (button,index) => {

      button.classList.toggle(
        "current",
        index === current
      );

    }
  );


  if(
    current >= 0 &&
    sections[current]
  ){

    document
      .getElementById(
        "gridSubject"
      )
      .textContent =
        getSectionName(
          sections[current],
          current
        );

  }

}


document
  .getElementById("pauseBtn")
  .addEventListener(
    "click",
    function(){

      if(submitted){
        return;
      }


      paused = true;

      saveCurrentSectionTime();


      document
        .getElementById("pauseOverlay")
        .classList.add("show");

    }
  );


document
  .getElementById("resumeBtn")
  .addEventListener(
    "click",
    function(){

      paused = false;


      document
        .getElementById("pauseOverlay")
        .classList.remove("show");


      if(
        test.test_type === "FULL" &&
        test.subject_wise_timing &&
        sections.length
      ){

        startSectionInterval();

      }else{

        startGeneralTimer();

      }

    }
  );


document
  .getElementById("submitSectionBtn")
  .addEventListener(
    "click",
    function(){

      submitCurrentSection();

    }
  );


function submitCurrentSection(){

  if(
    submitted ||
    paused
  ){

    return;

  }


  if(
    !sections.length ||
    currentSectionIndex < 0
  ){

    confirmSubmit();

    return;

  }


  const section =
    sections[
      currentSectionIndex
    ];


  const sectionQuestions =
    getSectionQuestions(
      section.id
    );


  const unanswered =
    sectionQuestions.filter(
      item =>
        !answers[
          item.q.id
        ]
    ).length;


  let message =
    "Submit " +
    getSectionName(
      section,
      currentSectionIndex
    ) +
    " section?";


  if(unanswered){

    message +=
      "\n\nUnanswered questions: " +
      unanswered;

  }


  const next =
    currentSectionIndex + 1;


  if(
    next < sections.length
  ){

    message +=
      "\n\nYou will move to " +
      getSectionName(
        sections[next],
        next
      ) +
      ".";

  }else{

    message +=
      "\n\nThis is the last section. " +
      "The test will be submitted.";

  }


  if(!confirm(message)){
    return;
  }


  saveCurrentSectionTime();


  if(
    next >= sections.length
  ){

    submitTest(false);

    return;

  }


  const nextQuestions =
    getSectionQuestions(
      sections[next].id
    );


  if(
    !nextQuestions.length
  ){

    currentSectionIndex =
      next;

    submitCurrentSection();

    return;

  }


  currentSectionIndex =
    next;


  currentIndex =
    nextQuestions[0].i;


  loadSectionTime(next);

  showQuestion();

  startSectionInterval();

}


function confirmSubmit(){

  if(submitted){
    return;
  }


  const unanswered =
    questions.filter(
      q =>
        !answers[q.id]
    ).length;


  let message =
    "Submit this test?";


  if(unanswered){

    message +=
      "\n\nUnanswered questions: " +
      unanswered;

  }


  if(confirm(message)){

    submitTest(false);

  }

}


async function submitTest(automatic=false){

  if(submitted){
    return;
  }


  submitted = true;
  paused = false;


  clearInterval(timerInterval);


  await calculateResult(automatic);

}


async function calculateResult(automatic){

  const ids =
    questions.map(
      q => q.id
    );


  const correctResult =
    await db
      .from("question_options")
      .select(
        "id,question_id,is_correct"
      )
      .in(
        "question_id",
        ids
      );


  if(correctResult.error){

    showError(
      correctResult.error.message
    );

    return;

  }


  const correctMap =
    new Map();


  (correctResult.data || [])
    .forEach(
      option => {

        if(option.is_correct){

          correctMap.set(
            String(
              option.question_id
            ),
            String(
              option.id
            )
          );

        }

      }
    );


  let correct = 0;
  let wrong = 0;
  let skipped = 0;
  let score = 0;


  questions.forEach(
    q => {

      const selected =
        answers[q.id];


      const marks =
        Number(
          q.marks ??
          test.marks_per_question ??
          2
        );


      const negative =
        Number(
          q.negative_marks ??
          test.negative_marks ??
          0
        );


      if(!selected){

        skipped++;

        return;

      }


      if(
        String(selected) ===
        String(
          correctMap.get(
            String(q.id)
          )
        )
      ){

        correct++;

        score += marks;

      }else{

        wrong++;

        score -= negative;

      }

    }
  );


  score =
    Math.round(
      score * 100
    ) / 100;


  const maxMarks =
    questions.reduce(
      (sum,q) =>
        sum +
        Number(
          q.marks ??
          test.marks_per_question ??
          2
        ),
      0
    );


  await saveAttempt(
    correct,
    wrong,
    skipped,
    score
  );


  document
    .getElementById("testArea")
    .classList.add("hidden");


  document
    .getElementById("result")
    .classList.remove("hidden");


  document
    .getElementById("result")
    .innerHTML = `

      <div class="result-card">

        <h2>
          ${
            automatic
            ? "Time Over"
            : "Test Submitted"
          }
        </h2>

        <div class="score">
          ${score}
        </div>

        <div>
          Score
        </div>

        <div class="result-info">

          Correct: ${correct}<br>

          Wrong: ${wrong}<br>

          Skipped: ${skipped}<br>

          Total Questions:
          ${questions.length}<br>

          Maximum Marks:
          ${maxMarks}

        </div>


        <button
          class="result-back"
          onclick="location.href='practice.html'"
        >
          Back to Practice
        </button>

      </div>

    `;

}


async function saveAttempt(
  correct,
  wrong,
  skipped,
  score
){

  const {
    data:{user}
  } =
    await db.auth.getUser();


  if(!user){
    return;
  }


  const attempt =
    await db
      .from("test_attempts")
      .insert({

        user_id:
          user.id,

        mock_test_id:
          test.id,

        score:
          score,

        correct_answers:
          correct,

        wrong_answers:
          wrong,

        unanswered:
          skipped,

        total_questions:
          questions.length

      })
      .select()
      .maybeSingle();


  if(
    attempt.error
  ){

    console.warn(
      "Attempt history was not saved:",
      attempt.error.message
    );

    return;

  }


  if(
    attempt.data?.id
  ){

    const rows =
      questions.map(
        q => ({

          attempt_id:
            attempt.data.id,

          question_id:
            q.id,

          selected_option_id:
            answers[q.id]
            ? Number(
                answers[q.id]
              )
            : null

        })
      );


    if(rows.length){

      const result =
        await db
          .from("user_answers")
          .insert(rows);


      if(result.error){

        console.warn(
          "User answers were not saved:",
          result.error.message
        );

      }

    }

  }

}


function showError(text){

  document
    .getElementById("loading")
    .innerHTML =
      '<div class="error">' +
      escapeHtml(text) +
      '</div>';

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}
