<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>SSC EDGE Test</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

:root{
  --bg:#08050e;
  --header:#160b26;
  --card:#171025;
  --card2:#251344;
  --purple:#7c3aed;
  --purple2:#a66bff;
  --text:#fff;
  --muted:#aaa2b9;
  --border:#302044;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#f59e0b;
}

:root[data-theme="light"]{
  --bg:#f6f3fb;
  --header:#eee7fa;
  --card:#fff;
  --card2:#eee6fa;
  --purple:#6d35d4;
  --purple2:#8149e8;
  --text:#17121e;
  --muted:#706879;
  --border:#ddd4e9;
}

.header{
  height:58px;
  background:var(--header);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:700;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
}

.test-wrap{
  max-width:850px;
  margin:auto;
  padding:16px;
  padding-bottom:40px;
}

.test-info{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.test-name{
  font-size:18px;
  font-weight:700;
}

.test-number{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.timer-box{
  margin-top:12px;
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.timer{
  font-size:22px;
  font-weight:700;
}

.timer.warning{
  color:var(--yellow);
}

.timer.danger{
  color:var(--red);
}

.timer-label{
  font-size:12px;
  color:var(--muted);
}

.pause-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:9px;
  padding:8px 12px;
  cursor:pointer;
}

.section-bar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:12px;
}

.section-btn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:9px;
  padding:8px 12px;
  cursor:pointer;
  font-size:13px;
}

.section-btn.active{
  background:var(--purple);
  border-color:var(--purple);
}

.section-btn.locked{
  opacity:.45;
}

.start-screen{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:28px 18px;
  text-align:center;
}

.start-screen h2{
  margin-top:0;
}

.start-screen p{
  color:var(--muted);
  line-height:1.6;
}

.primary-btn{
  border:0;
  background:var(--purple);
  color:#fff;
  border-radius:10px;
  padding:12px 20px;
  font-weight:700;
  cursor:pointer;
}

.secondary-btn{
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
  border-radius:10px;
  padding:11px 18px;
  cursor:pointer;
}

.question-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
}

.question-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.question-count{
  font-weight:700;
}

.question-right{
  display:flex;
  align-items:center;
  gap:9px;
}

.question-section{
  color:var(--muted);
  font-size:13px;
}

.save-question-btn{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--card2);
  color:var(--muted);
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:0;
}

.save-question-btn.saved{
  color:var(--purple2);
}

.question-text{
  font-size:17px;
  line-height:1.6;
  margin-bottom:18px;
}

.option{
  width:100%;
  text-align:left;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
  border-radius:11px;
  padding:13px;
  margin-bottom:10px;
  cursor:pointer;
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.option:hover{
  border-color:var(--purple);
}

.option.selected{
  border-color:var(--purple);
  background:rgba(124,58,237,.18);
}

.option-label{
  font-weight:700;
  min-width:24px;
}

.navigation{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:14px;
}

.navigation button{
  flex:1;
}

.grid-btn{
  width:100%;
  margin-top:12px;
}

.question-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:14px;
}

.grid-item{
  min-height:40px;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
  border-radius:8px;
  cursor:pointer;
  position:relative;
}

.grid-item.current{
  border-color:var(--purple);
}

.grid-item.answered{
  background:rgba(34,197,94,.2);
}

.grid-item.review{
  box-shadow:inset 0 0 0 2px var(--yellow);
}

.grid-item.visited{
  border-color:var(--purple2);
}

.grid-timer{
  font-size:8px;
  color:var(--muted);
  position:absolute;
  bottom:2px;
  left:0;
  right:0;
  text-align:center;
}

.result{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px 16px;
  text-align:center;
}

.result-score{
  font-size:34px;
  font-weight:700;
  margin:12px 0;
}

.result-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:18px 0;
}

.result-stat{
  background:var(--card2);
  border-radius:10px;
  padding:12px 5px;
}

.result-stat strong{
  display:block;
  font-size:20px;
}

.result-stat span{
  color:var(--muted);
  font-size:11px;
}

.result-actions{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.state{
  text-align:center;
  padding:40px 15px;
  color:var(--muted);
}

.error{
  color:var(--red);
}

.pause-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:20px;
}

.pause-popup{
  width:100%;
  max-width:380px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  text-align:center;
}

.pause-popup h3{
  margin-top:0;
}

.pause-popup p{
  color:var(--muted);
}

.pause-popup button{
  width:100%;
  margin-top:10px;
}

.hidden{
  display:none!important;
}

@media(max-width:500px){

  .test-wrap{
    padding:12px;
  }

  .question-text{
    font-size:16px;
  }

  .result-stats{
    grid-template-columns:1fr 1fr 1fr;
  }

  .question-grid{
    grid-template-columns:repeat(5,1fr);
  }

}

</style>

</head>

<body>

<div class="header">
  SSC EDGE
</div>

<div class="test-wrap">

  <div id="loadingState" class="state">
    Loading Test...
  </div>

  <div id="errorState" class="state error hidden"></div>

  <div id="mainContent" class="hidden">

    <div class="test-info">

      <div id="testName" class="test-name">
        Test
      </div>

      <div id="testNumber" class="test-number">
        Test No. —
      </div>

      <div class="timer-box">

        <div>
          <div class="timer-label" id="timerLabel">
            Time Remaining
          </div>

          <div id="timer" class="timer">
            00:00
          </div>
        </div>

        <button
          id="pauseBtn"
          class="pause-btn"
          type="button">
          Pause
        </button>

      </div>

    </div>

    <div id="sectionBar" class="section-bar hidden"></div>

    <div id="startScreen" class="start-screen hidden">

      <h2>Ready to Start?</h2>

      <p id="startDescription">
        Start the test when you are ready.
      </p>

      <button
        id="startBtn"
        class="primary-btn"
        type="button">
        Start Test
      </button>

    </div>

    <div id="questionArea" class="hidden">

      <div class="question-card">

        <div class="question-top">

          <span
            id="questionCount"
            class="question-count">
            Question 1
          </span>

          <div class="question-right">

            <button
              id="saveQuestionBtn"
              class="save-question-btn"
              type="button"
              title="Save Question"
              aria-label="Save Question">
              ☆
            </button>

            <span
              id="questionSection"
              class="question-section">
              English
            </span>

          </div>

        </div>

        <div
          id="questionText"
          class="question-text">
        </div>

        <div id="options"></div>

        <div class="navigation">

          <button
            id="prevBtn"
            class="secondary-btn"
            type="button">
            Previous
          </button>

          <button
            id="nextBtn"
            class="primary-btn"
            type="button">
            Next
          </button>

        </div>

      </div>

      <button
        id="gridBtn"
        class="secondary-btn grid-btn"
        type="button">
        Question Palette
      </button>

      <div
        id="questionGrid"
        class="question-grid hidden">
      </div>

      <button
        id="submitBtn"
        class="secondary-btn grid-btn"
        type="button">
        Submit Test
      </button>

    </div>

    <div id="resultArea" class="hidden"></div>

  </div>

</div>

<div id="pauseOverlay" class="pause-overlay">

  <div class="pause-popup">

    <h3>Test Paused</h3>

    <p>
      Your test is paused. Resume when you are ready.
    </p>

    <button
      id="resumeBtn"
      class="primary-btn"
      type="button">
      Resume Test
    </button>

    <button
      id="pauseSubmitBtn"
      class="secondary-btn"
      type="button">
      Submit Test
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   GLOBAL STATE
========================= */

let test = null;

let questions = [];

let sections = [];

let subjects = [];

let currentIndex = 0;

let answers = {};

let review = new Set();

let visitedQuestions = new Set();

let savedQuestions = new Set();

let remainingSeconds = 0;

let timerInterval = null;

let submitted = false;

let paused = false;

let currentSectionIndex = -1;

let sectionRemainingTimes = {};

let progressKey = "";

let savedQuestionsKey = "";

let hasSavedProgress = false;

let progressStarted = false;

let progressSavedAt = null;


/* =========================
   ELEMENTS
========================= */

const loadingState =
document.getElementById("loadingState");

const errorState =
document.getElementById("errorState");

const mainContent =
document.getElementById("mainContent");

const testName =
document.getElementById("testName");

const testNumber =
document.getElementById("testNumber");

const timer =
document.getElementById("timer");

const timerLabel =
document.getElementById("timerLabel");

const pauseBtn =
document.getElementById("pauseBtn");

const sectionBar =
document.getElementById("sectionBar");

const startScreen =
document.getElementById("startScreen");

const startDescription =
document.getElementById("startDescription");

const startBtn =
document.getElementById("startBtn");

const questionArea =
document.getElementById("questionArea");

const questionCount =
document.getElementById("questionCount");

const questionSection =
document.getElementById("questionSection");

const saveQuestionBtn =
document.getElementById("saveQuestionBtn");

const questionText =
document.getElementById("questionText");

const options =
document.getElementById("options");

const prevBtn =
document.getElementById("prevBtn");

const nextBtn =
document.getElementById("nextBtn");

const gridBtn =
document.getElementById("gridBtn");

const questionGrid =
document.getElementById("questionGrid");

const submitBtn =
document.getElementById("submitBtn");

const resultArea =
document.getElementById("resultArea");

const pauseOverlay =
document.getElementById("pauseOverlay");

const resumeBtn =
document.getElementById("resumeBtn");

const pauseSubmitBtn =
document.getElementById("pauseSubmitBtn");


/* =========================
   START
========================= */

window.addEventListener(
"DOMContentLoaded",
loadTest
);


/* =========================
   LOAD TEST
========================= */

async function loadTest(){

  try{

    const params =
    new URLSearchParams(
      window.location.search
    );

    const id =
    params.get("id");

    if(!id){
      throw new Error(
        "Test ID is missing."
      );
    }

    const {data,error} =
    await db
    .from("mock_tests")
    .select("*")
    .eq("id",id)
    .eq("is_active",true)
    .maybeSingle();

    if(error)
      throw error;

    if(!data){
      throw new Error(
        "Test not found or inactive."
      );
    }

    test = data;

    progressKey =
      "ssc-edge-progress-" +
      String(test.id);

    savedQuestionsKey =
      "ssc-edge-saved-questions-" +
      String(test.id);

    loadSavedQuestions();

    testName.textContent =
      test.title || "SSC EDGE Test";

    testNumber.textContent =
      "Test No. " +
      (test.id || "—");

    await loadSections();

    await loadQuestions();

  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "Unable to load test."
    );

  }

}


/* =========================
   LOAD SECTIONS
========================= */

async function loadSections(){

  sections = [];

  if(
    test.test_type === "FULL" &&
    test.subject_wise_timing === true
  ){

    const {data,error} =
    await db
    .from("mock_test_sections")
    .select("*")
    .eq("mock_test_id",test.id)
    .order(
      "section_order",
      {ascending:true}
    );

    if(error)
      throw error;

    sections = data || [];

    if(sections.length){

      const subjectIds =
      sections.map(
        s => s.subject_id
      );

      const {data:subjectData} =
      await db
      .from("subjects")
      .select("*")
      .in("id",subjectIds);

      subjects =
      subjectData || [];

      sectionRemainingTimes = {};

      sections.forEach(section=>{

        sectionRemainingTimes[
          String(section.id)
        ] =
        getSectionDurationMinutes(
          section
        ) * 60;

      });

    }

  }

}


/* =========================
   LOAD QUESTIONS
========================= */

async function loadQuestions(){

  let rawQuestions = [];

  const {data:assignments,error} =
  await db
  .from("mock_test_questions")
  .select(`
    id,
    mock_test_id,
    question_id,
    section_id,
    question_order
  `)
  .eq("mock_test_id",test.id)
  .order(
    "question_order",
    {ascending:true}
  );

  if(error)
    throw error;

  if(assignments && assignments.length){

    const questionIds =
    assignments.map(
      a => a.question_id
    );

    const {data:qData,qError} =
    await db
    .from("questions")
    .select(`
      id,
      subject_id,
      chapter_id,
      question_text,
      explanation,
      marks,
      negative_marks
    `)
    .in("id",questionIds);

    if(qError)
      throw qError;

    const {data:oData,oError} =
    await db
    .from("question_options")
    .select(`
      id,
      question_id,
      option_text,
      option_label,
      is_correct
    `)
    .in("question_id",questionIds)
    .order("id");

    if(oError)
      throw oError;

    const qMap = {};

    (qData || []).forEach(q=>{

      qMap[String(q.id)] = {
        ...q,
        options:[]
      };

    });

    (oData || []).forEach(o=>{

      if(qMap[String(o.question_id)]){

        qMap[
          String(o.question_id)
        ].options.push(o);

      }

    });

    rawQuestions =
    assignments
    .map(a=>{

      const q =
      qMap[String(a.question_id)];

      if(!q)
        return null;

      return {
        ...q,
        assignment_id:a.id,
        section_id:a.section_id,
        question_order:a.question_order
      };

    })
    .filter(Boolean);

  }else{

    /*
      Fallback for old tests which may still
      have questions connected through mock_test_id.
    */

    const {data:qData,error:qError} =
    await db
    .from("questions")
    .select(`
      id,
      subject_id,
      chapter_id,
      question_text,
      explanation,
      marks,
      negative_marks
    `)
    .eq("mock_test_id",test.id)
    .order("id");

    if(qError)
      throw qError;

    const ids =
    (qData || []).map(q=>q.id);

    let oData = [];

    if(ids.length){

      const {data,error:oError} =
      await db
      .from("question_options")
      .select(`
        id,
        question_id,
        option_text,
        option_label,
        is_correct
      `)
      .in("question_id",ids)
      .order("id");

      if(oError)
        throw oError;

      oData =
      errorSafeArray(error,oData);

    }

    const map = {};

    (qData || []).forEach(q=>{

      map[String(q.id)] = {
        ...q,
        options:[]
      };

    });

    (oData || []).forEach(o=>{

      if(map[String(o.question_id)]){

        map[
          String(o.question_id)
        ].options.push(o);

      }

    });

    rawQuestions =
    (qData || []).map(q=>map[String(q.id)]);

  }

  questions = rawQuestions;

  if(!questions.length){

    throw new Error(
      "No questions have been assigned to this test."
    );

  }

  beginTest();

}


/* =========================
   SAFE ARRAY
========================= */

function errorSafeArray(error,data){

  return data || [];

}


/* =========================
   BEGIN TEST
========================= */

function beginTest(){

  loadingState.classList.add("hidden");

  mainContent.classList.remove("hidden");

  renderSections();

  loadProgress();

  renderStartScreen();

}


/* =========================
   START SCREEN
========================= */

function renderStartScreen(){

  startScreen.classList.remove("hidden");

  questionArea.classList.add("hidden");

  resultArea.classList.add("hidden");

  pauseBtn.classList.add("hidden");

  timer.textContent =
  formatTime(
    getInitialDisplayTime()
  );

  if(hasSavedProgress){

    startDescription.textContent =
      "A saved test session was found. Continue from where you left off.";

    startBtn.textContent =
      "Resume Test";

  }else{

    startDescription.textContent =
      "Start the test when you are ready.";

    startBtn.textContent =
      "Start Test";

  }

}


/* =========================
   INITIAL DISPLAY TIME
========================= */

function getInitialDisplayTime(){

  if(
    test.test_type === "FULL" &&
    test.subject_wise_timing === true &&
    sections.length
  ){

    if(
      sectionRemainingTimes &&
      Object.keys(
        sectionRemainingTimes
      ).length
    ){

      const first =
      sections[0];

      const value =
      sectionRemainingTimes[
        String(first.id)
      ];

      if(
        Number.isFinite(value)
      ){
        return value;
      }

    }

    return (
      getSectionDurationMinutes(
        sections[0]
      ) * 60
    );

  }

  return (
    Number(test.duration_minutes || 0)
    * 60
  );

}


/* =========================
   START / RESUME
========================= */

function startOrResumeTest(){

  if(submitted)
    return;

  startScreen.classList.add("hidden");

  questionArea.classList.remove("hidden");

  pauseBtn.classList.remove("hidden");

  progressStarted = true;

  paused = false;

  if(
    hasSavedProgress &&
    progressSavedAt
  ){

    applyElapsedTimeSinceSave();

  }

  startTimer();

  showQuestion();

  saveProgress();

}


/* =========================
   START BUTTON
========================= */

startBtn.addEventListener(
"click",
startOrResumeTest
);


/* =========================
   PROGRESS KEY
========================= */

function getProgressData(){

  try{

    const raw =
    localStorage.getItem(
      progressKey
    );

    if(!raw)
      return null;

    return JSON.parse(raw);

  }catch(error){

    console.error(
      "Progress read error:",
      error
    );

    return null;

  }

}


/* =========================
   LOAD PROGRESS
========================= */

function loadProgress(){

  const saved =
  getProgressData();

  if(!saved){

    hasSavedProgress = false;

    return;

  }

  hasSavedProgress = true;

  currentIndex =
  Math.max(
    0,
    Math.min(
      Number(saved.currentIndex || 0),
      questions.length - 1
    )
  );

  answers =
  saved.answers || {};

  review =
  new Set(
    saved.review || []
  );

  visitedQuestions =
  new Set(
    saved.visited || []
  );

  sectionRemainingTimes =
  saved.sectionRemainingTimes ||
  sectionRemainingTimes ||
  {};

  progressStarted =
  saved.progressStarted === true;

  progressSavedAt =
  Number(saved.savedAt || 0) || null;

  if(
    Number.isFinite(
      Number(saved.remainingSeconds)
    )
  ){

    remainingSeconds =
    Number(saved.remainingSeconds);

  }

  currentSectionIndex =
  Number.isInteger(
    saved.currentSectionIndex
  )
    ? saved.currentSectionIndex
    : -1;

  /*
    Make sure newly added sections still
    receive their correct initial time.
  */

  if(sections.length){

    sections.forEach(section=>{

      const key =
      String(section.id);

      if(
        !Number.isFinite(
          Number(
            sectionRemainingTimes[key]
          )
        )
      ){

        sectionRemainingTimes[key] =
        getSectionDurationMinutes(
          section
        ) * 60;

      }

    });

  }

}


/* =========================
   APPLY ELAPSED TIME
========================= */

function applyElapsedTimeSinceSave(){

  if(
    !progressSavedAt ||
    paused
  ){
    return;
  }

  const now =
  Date.now();

  let elapsed =
  Math.floor(
    (now - progressSavedAt) / 1000
  );

  if(elapsed <= 0)
    return;

  /*
    Prevent absurd values caused by
    corrupted localStorage.
  */

  elapsed =
  Math.min(
    elapsed,
    86400
  );

  if(
    test.test_type === "FULL" &&
    test.subject_wise_timing === true &&
    sections.length
  ){

    applySectionElapsedTime(elapsed);

  }else{

    remainingSeconds =
    Math.max(
      0,
      remainingSeconds - elapsed
    );

  }

  progressSavedAt = Date.now();

}


/* =========================
   APPLY SECTION ELAPSED
========================= */

function applySectionElapsedTime(elapsed){

  let index =
  currentSectionIndex;

  if(index < 0)
    index = 0;

  while(
    elapsed > 0 &&
    index < sections.length
  ){

    const section =
    sections[index];

    const key =
    String(section.id);

    let remaining =
    Number(
      sectionRemainingTimes[key]
    );

    if(
      !Number.isFinite(remaining)
    ){

      remaining =
      getSectionDurationMinutes(
        section
      ) * 60;

    }

    if(remaining > elapsed){

      remaining -= elapsed;

      sectionRemainingTimes[key] =
      remaining;

      elapsed = 0;

      break;

    }

    elapsed -= remaining;

    sectionRemainingTimes[key] = 0;

    index++;

    if(index < sections.length){

      currentSectionIndex = index;

    }

  }

  if(
    index >= sections.length
  ){

    currentSectionIndex =
    sections.length - 1;

  }

}


/* =========================
   SAVE PROGRESS
========================= */

function saveProgress(){

  if(!test || submitted)
    return;

  saveCurrentAnswer();

  saveCurrentSectionTime();

  const data = {

    currentIndex,

    currentSectionIndex,

    answers,

    review:[
      ...review
    ],

    visited:[
      ...visitedQuestions
    ],

    sectionRemainingTimes,

    remainingSeconds,

    progressStarted,

    paused,

    savedAt:Date.now()

  };

  try{

    localStorage.setItem(
      progressKey,
      JSON.stringify(data)
    );

    progressSavedAt =
    data.savedAt;

  }catch(error){

    console.error(
      "Progress save error:",
      error
    );

  }

}


/* =========================
   CLEAR PROGRESS
========================= */

function clearProgress(){

  try{

    localStorage.removeItem(
      progressKey
    );

  }catch(error){

    console.error(error);

  }

  hasSavedProgress = false;

  progressSavedAt = null;

}


/* =========================
   SAVED QUESTIONS
========================= */

function loadSavedQuestions(){

  savedQuestions =
  new Set();

  try{

    const raw =
    localStorage.getItem(
      savedQuestionsKey
    );

    if(!raw)
      return;

    const parsed =
    JSON.parse(raw);

    if(Array.isArray(parsed)){

      savedQuestions =
      new Set(
        parsed.map(
          id => String(id)
        )
      );

    }

  }catch(error){

    console.error(
      "Saved question load error:",
      error
    );

  }

}


/* =========================
   SAVE SAVED QUESTIONS
========================= */

function saveSavedQuestions(){

  try{

    localStorage.setItem(
      savedQuestionsKey,
      JSON.stringify(
        [...savedQuestions]
      )
    );

  }catch(error){

    console.error(
      "Saved question save error:",
      error
    );

  }

}


/* =========================
   TOGGLE SAVED QUESTION
========================= */

function toggleSavedQuestion(){

  if(!questions[currentIndex])
    return;

  const id =
  String(
    questions[currentIndex].id
  );

  if(
    savedQuestions.has(id)
  ){

    savedQuestions.delete(id);

  }else{

    savedQuestions.add(id);

  }

  saveSavedQuestions();

  updateSaveQuestionButton();

}


/* =========================
   UPDATE SAVE ICON
========================= */

function updateSaveQuestionButton(){

  if(!questions[currentIndex])
    return;

  const id =
  String(
    questions[currentIndex].id
  );

  const saved =
  savedQuestions.has(id);

  saveQuestionBtn.textContent =
    saved ? "★" : "☆";

  saveQuestionBtn.classList.toggle(
    "saved",
    saved
  );

  saveQuestionBtn.title =
    saved
      ? "Remove Saved Question"
      : "Save Question";

  saveQuestionBtn.setAttribute(
    "aria-label",
    saved
      ? "Remove Saved Question"
      : "Save Question"
  );

}


/* =========================
   SAVE ICON EVENT
========================= */

saveQuestionBtn.addEventListener(
"click",
toggleSavedQuestion
);


/* =========================
   RENDER SECTIONS
========================= */

function renderSections(){

  if(
    test.test_type !== "FULL" ||
    test.subject_wise_timing !== true ||
    !sections.length
  ){

    sectionBar.classList.add("hidden");

    currentSectionIndex = -1;

    return;

  }

  sectionBar.classList.remove("hidden");

  sectionBar.innerHTML = "";

  sections.forEach(
    (section,index)=>{

      const btn =
      document.createElement("button");

      btn.type = "button";

      btn.className =
      "section-btn";

      btn.dataset.index =
      String(index);

      const subject =
      subjects.find(
        s =>
        String(s.id) ===
        String(section.subject_id)
      );

      btn.textContent =
        subject?.name ||
        "Section " + (index + 1);

      btn.addEventListener(
        "click",
        ()=>jumpToSection(index)
      );

      sectionBar.appendChild(btn);

    }
  );

  updateSectionButtons();

}


/* =========================
   GET SECTION QUESTIONS
========================= */

function getSectionQuestions(index){

  if(
    !sections[index]
  ){
    return [];
  }

  const sectionId =
  String(
    sections[index].id
  );

  return questions
    .map(
      (q,i)=>({
        q,
        index:i
      })
    )
    .filter(
      item =>
      String(
        item.q.section_id
      ) === sectionId
    );

}


/* =========================
   GET CURRENT SECTION
========================= */

function getCurrentSectionIndex(){

  if(
    test.test_type !== "FULL" ||
    test.subject_wise_timing !== true
  ){

    return -1;

  }

  const q =
  questions[currentIndex];

  if(!q)
    return -1;

  const sectionId =
  String(q.section_id || "");

  const index =
  sections.findIndex(
    s =>
    String(s.id) === sectionId
  );

  return index;

}


/* =========================
   JUMP TO SECTION
========================= */

function jumpToSection(index){

  if(
    index < 0 ||
    index >= sections.length
  ){
    return;
  }

  if(
    sectionRemainingTimes[
      String(
        sections[index].id
      )
    ] <= 0
  ){
    return;
  }

  const list =
  getSectionQuestions(index);

  if(!list.length)
    return;

  currentSectionIndex = index;

  currentIndex =
  list[0].index;

  showQuestion();

  saveProgress();

}


/* =========================
   SAVE CURRENT SECTION TIME
========================= */

function saveCurrentSectionTime(){

  if(
    currentSectionIndex < 0 ||
    !sections[currentSectionIndex]
  ){
    return;
  }

  const section =
  sections[currentSectionIndex];

  sectionRemainingTimes[
    String(section.id)
  ] =
  Math.max(
    0,
    Number(
      sectionRemainingTimes[
        String(section.id)
      ] || 0
    )
  );

}


/* =========================
   LOAD SECTION TIME
========================= */

function loadSectionTime(){

  if(
    currentSectionIndex < 0 ||
    !sections[currentSectionIndex]
  ){
    return 0;
  }

  const section =
  sections[currentSectionIndex];

  const key =
  String(section.id);

  let savedTime =
  Number(
    sectionRemainingTimes[key]
  );

  if(
    !Number.isFinite(savedTime) ||
    savedTime < 0
  ){

    savedTime =
    getSectionDurationMinutes(
      section
    ) * 60;

    sectionRemainingTimes[key] =
    savedTime;

  }

  return savedTime;

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

  if(
    !questions.length ||
    submitted
  ){
    return;
  }

  if(
    currentIndex < 0
  ){
    currentIndex = 0;
  }

  if(
    currentIndex >= questions.length
  ){
    currentIndex =
    questions.length - 1;
  }

  const q =
  questions[currentIndex];

  visitedQuestions.add(
    String(q.id)
  );

  questionCount.textContent =
    "Question " +
    (currentIndex + 1) +
    " out of " +
    questions.length;

  const subject =
  subjects.find(
    s =>
    String(s.id) ===
    String(q.subject_id)
  );

  questionSection.textContent =
    subject?.name ||
    getQuestionSectionName(q);

  questionText.innerHTML =
    escapeHtml(
      q.question_text || ""
    ).replace(
      /\n/g,
      "<br>"
    );

  options.innerHTML = "";

  const currentAnswer =
  answers[String(q.id)];

  (q.options || []).forEach(
    option=>{

      const button =
      document.createElement("button");

      button.type = "button";

      button.className =
      "option";

      if(
        currentAnswer ===
        String(option.id)
      ){

        button.classList.add(
          "selected"
        );

      }

      const label =
      document.createElement("span");

      label.className =
      "option-label";

      label.textContent =
      option.option_label ||
      "";

      const text =
      document.createElement("span");

      text.innerHTML =
      escapeHtml(
        option.option_text || ""
      ).replace(
        /\n/g,
        "<br>"
      );

      button.appendChild(label);

      button.appendChild(text);

      button.addEventListener(
        "click",
        ()=>selectAnswer(
          q,
          option
        )
      );

      options.appendChild(button);

    }
  );

  updateSaveQuestionButton();

  prevBtn.disabled =
    currentIndex === 0;

  nextBtn.textContent =
    currentIndex ===
    questions.length - 1
      ? "Finish"
      : "Next";

  const newSection =
  getCurrentSectionIndex();

  if(
    newSection >= 0 &&
    newSection !== currentSectionIndex
  ){

    currentSectionIndex =
    newSection;

  }

  updateSectionButtons();

  renderQuestionGrid();

  updateGridTimer();

}


/* =========================
   QUESTION SECTION NAME
========================= */

function getQuestionSectionName(q){

  if(q.subject_id){

    const s =
    subjects.find(
      x =>
      String(x.id) ===
      String(q.subject_id)
    );

    if(s?.name)
      return s.name;

  }

  return "Question";

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(
  question,
  option
){

  if(submitted || paused)
    return;

  answers[
    String(question.id)
  ] =
  String(option.id);

  renderQuestionOptions();

  renderQuestionGrid();

  saveProgress();

}


/* =========================
   RENDER OPTIONS
========================= */

function renderQuestionOptions(){

  const q =
  questions[currentIndex];

  const answer =
  answers[String(q.id)];

  [...options.children].forEach(
    button=>{

      const optionId =
      button
      .querySelector(".option-label");

      const option =
      (q.options || []).find(
        o =>
        String(o.option_label) ===
        String(
          optionId?.textContent
        )
      );

      button.classList.toggle(
        "selected",
        option &&
        answer ===
        String(option.id)
      );

    }
  );

}


/* =========================
   SAVE CURRENT ANSWER
========================= */

function saveCurrentAnswer(){

  if(!questions[currentIndex])
    return;

  const q =
  questions[currentIndex];

  const selected =
  [...options.children]
  .find(
    button =>
    button.classList.contains(
      "selected"
    )
  );

  if(!selected)
    return;

  const label =
  selected
  .querySelector(
    ".option-label"
  );

  const option =
  (q.options || []).find(
    o =>
    String(o.option_label) ===
    String(label?.textContent)
  );

  if(option){

    answers[
      String(q.id)
    ] =
    String(option.id);

  }

}


/* =========================
   NEXT
========================= */

nextBtn.addEventListener(
"click",
()=>{

  if(
    currentIndex ===
    questions.length - 1
  ){

    confirmSubmit();

    return;

  }

  currentIndex++;

  showQuestion();

  saveProgress();

}
);


/* =========================
   PREVIOUS
========================= */

prevBtn.addEventListener(
"click",
()=>{

  if(currentIndex <= 0)
    return;

  currentIndex--;

  showQuestion();

  saveProgress();

}
);


/* =========================
   QUESTION GRID
========================= */

function renderQuestionGrid(){

  questionGrid.innerHTML = "";

  questions.forEach(
    (q,index)=>{

      const button =
      document.createElement("button");

      button.type = "button";

      button.className =
      "grid-item";

      if(index === currentIndex)
        button.classList.add("current");

      if(
        answers[String(q.id)]
      )
        button.classList.add("answered");

      if(
        review.has(String(q.id))
      )
        button.classList.add("review");

      if(
        visitedQuestions.has(
          String(q.id)
        )
      )
        button.classList.add("visited");

      button.textContent =
      String(index + 1);

      button.addEventListener(
        "click",
        ()=>{

          currentIndex = index;

          showQuestion();

          saveProgress();

          closeGrid();

        }
      );

      questionGrid.appendChild(button);

    }
  );

}


/* =========================
   OPEN GRID
========================= */

gridBtn.addEventListener(
"click",
()=>{

  questionGrid.classList.toggle(
    "hidden"
  );

}
);


/* =========================
   CLOSE GRID
========================= */

function closeGrid(){

  questionGrid.classList.add(
    "hidden"
  );

}


/* =========================
   TIMER
========================= */

function startTimer(){

  clearInterval(
    timerInterval
  );

  if(submitted || paused)
    return;

  if(
    test.test_type === "FULL" &&
    test.subject_wise_timing === true &&
    sections.length
  ){

    currentSectionIndex =
    getCurrentSectionIndex();

    if(
      currentSectionIndex < 0
    ){
      currentSectionIndex = 0;
    }

    remainingSeconds =
    loadSectionTime();

    timerLabel.textContent =
    "Section Time Remaining";

    updateTimerDisplay();

    startSectionInterval();

  }else{

    /*
      IMPORTANT:
      Never reset remainingSeconds merely
      because the test is being resumed.
    */

    if(
      !progressStarted ||
      !Number.isFinite(
        remainingSeconds
      ) ||
      remainingSeconds <= 0
    ){

      remainingSeconds =
      Number(
        test.duration_minutes || 0
      ) * 60;

    }

    timerLabel.textContent =
    "Time Remaining";

    updateTimerDisplay();

    startGeneralTimer();

  }

}


/* =========================
   GENERAL TIMER
========================= */

function startGeneralTimer(){

  clearInterval(
    timerInterval
  );

  timerInterval =
  setInterval(
    ()=>{

      if(
        submitted ||
        paused
      ){
        return;
      }

      remainingSeconds =
      Math.max(
        0,
        remainingSeconds - 1
      );

      updateTimerDisplay();

      saveProgress();

      if(
        remainingSeconds <= 0
      ){

        clearInterval(
          timerInterval
        );

        autoSubmit();

      }

    },
    1000
  );

}


/* =========================
   SECTION TIMER
========================= */

function startSectionInterval(){

  clearInterval(
    timerInterval
  );

  timerInterval =
  setInterval(
    ()=>{

      if(
        submitted ||
        paused
      ){
        return;
      }

      if(
        currentSectionIndex < 0 ||
        !sections[currentSectionIndex]
      ){

        return;

      }

      const section =
      sections[currentSectionIndex];

      const key =
      String(section.id);

      let value =
      Number(
        sectionRemainingTimes[key]
      );

      if(
        !Number.isFinite(value)
      ){

        value =
        getSectionDurationMinutes(
          section
        ) * 60;

      }

      value =
      Math.max(
        0,
        value - 1
      );

      sectionRemainingTimes[key] =
      value;

      remainingSeconds =
      value;

      updateTimerDisplay();

      updateGridTimer();

      updateSectionButtons();

      saveProgress();

      if(value <= 0){

        clearInterval(
          timerInterval
        );

        sectionTimeUp();

      }

    },
    1000
  );

}


/* =========================
   SECTION TIME UP
========================= */

function sectionTimeUp(){

  saveCurrentSectionTime();

  saveProgress();

  if(
    currentSectionIndex <
    sections.length - 1
  ){

    currentSectionIndex++;

    const nextList =
    getSectionQuestions(
      currentSectionIndex
    );

    if(nextList.length){

      currentIndex =
      nextList[0].index;

      alert(
        "Section time is over. Moving to the next section."
      );

      showQuestion();

      startTimer();

      saveProgress();

      return;

    }

  }

  autoSubmit();

}


/* =========================
   TIMER FORMAT
========================= */

function formatTime(seconds){

  seconds =
  Math.max(
    0,
    Math.floor(
      Number(seconds) || 0
    )
  );

  const minutes =
  Math.floor(
    seconds / 60
  );

  const secs =
  seconds % 60;

  return (
    String(minutes).padStart(2,"0") +
    ":" +
    String(secs).padStart(2,"0")
  );

}


/* =========================
   TIMER DISPLAY
========================= */

function updateTimerDisplay(){

  timer.textContent =
  formatTime(
    remainingSeconds
  );

  timer.classList.remove(
    "warning",
    "danger"
  );

  if(
    remainingSeconds <= 30
  ){

    timer.classList.add(
      "danger"
    );

  }else if(
    remainingSeconds <= 120
  ){

    timer.classList.add(
      "warning"
    );

  }

}


/* =========================
   GRID TIMER
========================= */

function updateGridTimer(){

  if(
    !sections.length ||
    currentSectionIndex < 0
  ){
    return;
  }

  [...questionGrid.children]
  .forEach(
    (button,index)=>{

      const q =
      questions[index];

      if(!q)
        return;

      const sectionIndex =
      sections.findIndex(
        s =>
        String(s.id) ===
        String(q.section_id)
      );

      if(
        sectionIndex < 0
      )
        return;

      const section =
      sections[sectionIndex];

      const time =
      sectionRemainingTimes[
        String(section.id)
      ];

      let existing =
      button.querySelector(
        ".grid-timer"
      );

      if(!existing){

        existing =
        document.createElement(
          "span"
        );

        existing.className =
        "grid-timer";

        button.appendChild(
          existing
        );

      }

      existing.textContent =
      formatTime(time);

    }
  );

}


/* =========================
   SECTION BUTTONS
========================= */

function updateSectionButtons(){

  if(!sections.length)
    return;

  [...sectionBar.children]
  .forEach(
    (button,index)=>{

      button.classList.toggle(
        "active",
        index ===
        currentSectionIndex
      );

      const section =
      sections[index];

      const time =
      sectionRemainingTimes[
        String(section.id)
      ];

      button.classList.toggle(
        "locked",
        Number(time) <= 0
      );

      const subject =
      subjects.find(
        s =>
        String(s.id) ===
        String(section.subject_id)
      );

      button.textContent =
        (subject?.name ||
        "Section " + (index + 1)) +
        " • " +
        formatTime(time);

    }
  );

}

/* =========================
   CONFIRM SUBMIT
========================= */

function confirmSubmit(){

  if(submitted)
    return;

  const unanswered =
  questions.filter(
    q =>
    !answers[String(q.id)]
  ).length;

  const message =
    unanswered > 0
      ? "You have " +
        unanswered +
        " unanswered question(s). Submit test?"
      : "Are you sure you want to submit the test?";

  if(
    confirm(message)
  ){

    submitTest();

  }

}


/* =========================
   AUTO SUBMIT
========================= */

function autoSubmit(){

  if(submitted)
    return;

  submitTest();

}


/* =========================
   SUBMIT TEST
========================= */

async function submitTest(){

  if(submitted)
    return;

  submitted = true;

  clearInterval(
    timerInterval
  );

  saveCurrentAnswer();

  saveCurrentSectionTime();

  clearProgress();

  pauseBtn.classList.add(
    "hidden"
  );

  questionArea.classList.add(
    "hidden"
  );

  sectionBar.classList.add(
    "hidden"
  );

  startScreen.classList.add(
    "hidden"
  );

  const result =
  calculateResult();

  await saveAttempt(result);

  renderResult(result);

}


/* =========================
   CALCULATE RESULT
========================= */

function calculateResult(){

  let correct = 0;

  let wrong = 0;

  let unanswered = 0;

  let score = 0;

  questions.forEach(
    q=>{

      const answer =
      answers[String(q.id)];

      if(!answer){

        unanswered++;

        return;

      }

      const selected =
      (q.options || []).find(
        o =>
        String(o.id) ===
        String(answer)
      );

      if(
        selected &&
        selected.is_correct
      ){

        correct++;

        score +=
        Number(
          q.marks ??
          test.marks_per_question ??
          0
        );

      }else{

        wrong++;

        score -=
        Number(
          q.negative_marks ??
          test.negative_marks ??
          0
        );

      }

    }
  );

  return {
    correct,
    wrong,
    unanswered,
    score
  };

}


/* =========================
   SAVE ATTEMPT
========================= */

async function saveAttempt(result){

  try{

    const {
      data:{
        user
      }
    } =
    await db.auth.getUser();

    if(!user){

      console.log(
        "Guest attempt - not saved."
      );

      return;

    }

    const payload = {

      user_id:user.id,

      mock_test_id:test.id,

      started_at:
      new Date(
        Date.now() -
        (
          Number(
            test.duration_minutes || 0
          ) * 60000
        )
      ).toISOString(),

      completed_at:
      new Date().toISOString(),

      score:
      result.score,

      correct_answers:
      result.correct,

      wrong_answers:
      result.wrong,

      unanswered:
      result.unanswered

    };

    const {error} =
    await db
    .from("test_attempts")
    .insert(payload);

    if(error){

      console.warn(
        "Attempt save warning:",
        error
      );

    }

  }catch(error){

    console.warn(
      "Attempt save warning:",
      error
    );

  }

}

========================= */

document.addEventListener(

()=>{

  if(
    document.visibilityState ===
    "hidden"
  ){

    saveProgress();

  }

}
);


/* =========================
   PAGE HIDE
========================= */

window.addEventListener(
"pagehide",
()=>{

  saveProgress();

}
);


/* =========================
   BEFORE UNLOAD
========================= */

window.addEventListener(
"beforeunload",
()=>{

  saveProgress();

}
);


/* =========================
   ERROR
========================= */

function showError(message){

  loadingState.classList.add(
    "hidden"
  );

  mainContent.classList.add(
    "hidden"
  );

  errorState.classList.remove(
    "hidden"
  );

  errorState.textContent =
  message ||
  "Something went wrong.";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   SECTION DURATION
========================= */

function getSectionDurationMinutes(
  section
){

  const value =
  Number(
    section?.duration_minutes
  );

  if(
    Number.isFinite(value) &&
    value > 0
  ){

    return value;

  }

  return 15;

}
