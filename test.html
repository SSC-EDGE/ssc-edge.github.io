<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SSC EDGE - Test</title>

<link rel="stylesheet" href="css/style.css">

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<style>

body{
  margin:0;
}

.test-container{
  max-width:850px;
  margin:auto;
  padding:16px 14px 90px;
}

.test-header{
  background:var(--header);
  border-bottom:1px solid var(--border);
  padding:14px 16px;
  position:sticky;
  top:0;
  z-index:20;
}

.test-header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.test-name{
  font-size:16px;
  font-weight:900;
}

.timer{
  background:var(--card2);
  border:1px solid var(--border);
  padding:8px 12px;
  border-radius:10px;
  font-weight:900;
  font-size:14px;
}

.timer.warning{
  color:#ff7777;
}

.section-bar{
  margin-top:12px;
  display:flex;
  gap:7px;
  overflow-x:auto;
}

.section-btn{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:8px 11px;
  border-radius:9px;
  font-size:11px;
  font-weight:800;
}

.section-btn.current{
  background:var(--purple);
  color:white;
}

.section-btn.locked{
  opacity:.45;
}

.question-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  margin-top:16px;
}

.question-number{
  color:var(--purple2);
  font-size:12px;
  font-weight:900;
  margin-bottom:10px;
}

.question-text{
  font-size:16px;
  line-height:1.55;
  font-weight:700;
  white-space:pre-wrap;
}

.options{
  margin-top:18px;
}

.option{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:13px;
  margin-bottom:9px;
  border:1px solid var(--border);
  border-radius:11px;
  cursor:pointer;
  background:var(--bg);
}

.option.selected{
  border-color:var(--purple);
  background:var(--card2);
}

.option input{
  width:auto;
  margin-top:3px;
}

.option-label{
  font-weight:900;
  min-width:20px;
}

.option-text{
  font-size:14px;
  line-height:1.4;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:14px;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px;
  font-weight:900;
  cursor:pointer;
}

.primary{
  background:var(--purple);
  color:white;
}

.secondary{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
}

.review-btn{
  width:100%;
  margin-top:9px;
}

.palette-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  margin-top:16px;
}

.palette{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:7px;
  margin-top:10px;
}

.palette button{
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:8px;
  padding:8px 4px;
  font-size:11px;
  font-weight:900;
}

.palette button.answered{
  background:var(--purple);
  color:white;
}

.palette button.review{
  border-color:#e5a928;
}

.palette button.current{
  outline:2px solid var(--purple2);
}

.result-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  margin-top:20px;
  text-align:center;
}

.score{
  font-size:36px;
  font-weight:900;
  color:var(--purple2);
}

.result-info{
  color:var(--muted);
  line-height:1.8;
  margin-top:10px;
}

.hidden{
  display:none!important;
}

.loading{
  text-align:center;
  padding:50px 10px;
  color:var(--muted);
}

.error{
  background:#512020;
  color:#ffaaaa;
  padding:15px;
  border-radius:12px;
  margin-top:20px;
}

@media(max-width:500px){

  .palette{
    grid-template-columns:repeat(6,1fr);
  }

  .question-text{
    font-size:15px;
  }

}

</style>
</head>

<body>

<header class="test-header">

  <div class="test-header-top">

    <div
    id="testName"
    class="test-name">
      Loading Test...
    </div>

    <div
    id="timer"
    class="timer">
      --:--
    </div>

  </div>

  <div
  id="sectionBar"
  class="section-bar hidden">
  </div>

</header>


<main class="test-container">

<div
id="loading"
class="loading">

Loading test...

</div>


<div
id="testArea"
class="hidden">

  <div
  id="questionCard"
  class="question-card">
  </div>


  <div class="palette-card">

    <strong>Question Palette</strong>

    <div
    id="palette"
    class="palette">
    </div>

  </div>

</div>


<div
id="result"
class="hidden">
</div>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   STATE
========================================= */

let test=null;
let questions=[];
let sections=[];

let currentIndex=0;

let answers={};
let review=new Set();

let remainingSeconds=0;
let timerInterval=null;

let submitted=false;


/* =========================================
   GET TEST ID
========================================= */

const params=
new URLSearchParams(
  location.search
);

const testId=
params.get("id");


/* =========================================
   START
========================================= */

loadTest();


/* =========================================
   LOAD TEST
========================================= */

async function loadTest(){

  if(!testId){

    showError(
      "No test ID was provided."
    );

    return;

  }


  const testResult=
    await db
      .from("mock_tests")
      .select("*")
      .eq("id",testId)
      .eq("is_active",true)
      .maybeSingle();


  if(testResult.error){

    showError(
      testResult.error.message
    );

    return;

  }


  if(!testResult.data){

    showError(
      "Test not found or inactive."
    );

    return;

  }


  test=
    testResult.data;


  await loadSections();

  await loadQuestions();

}


/* =========================================
   LOAD SECTIONS
========================================= */

async function loadSections(){

  if(
    test.test_type!=="FULL" ||
    !test.subject_wise_timing
  ){

    sections=[];

    return;

  }


  const result=
    await db
      .from("mock_test_sections")
      .select("*")
      .eq(
        "mock_test_id",
        test.id
      )
      .order(
        "section_order"
      );


  if(result.error){

    showError(
      result.error.message
    );

    return;

  }


  sections=
    result.data||[];

}


/* =========================================
   LOAD QUESTIONS
========================================= */

async function loadQuestions(){

  const result=
    await db
      .from("mock_test_questions")
      .select(`
        id,
        question_id,
        question_order,
        section_id
      `)
      .eq(
        "mock_test_id",
        test.id
      )
      .order(
        "question_order"
      );


  if(result.error){

    showError(
      result.error.message
    );

    return;

  }


  const assignments=
    result.data||[];


  if(!assignments.length){

    showError(
      "No questions have been assigned to this test yet."
    );

    return;

  }


  const ids=
    assignments.map(
      x=>x.question_id
    );


  const questionResult=
    await db
      .from("questions")
      .select(`
        id,
        question_text,
        explanation,
        marks,
        negative_marks,
        subject_id,
        chapter_id
      `)
      .in(
        "id",
        ids
      );


  if(questionResult.error){

    showError(
      questionResult.error.message
    );

    return;

  }


  const optionResult=
    await db
      .from("question_options")
      .select(`
        id,
        question_id,
        option_text,
        option_label
      `)
      .in(
        "question_id",
        ids
      )
      .order(
        "id"
      );


  if(optionResult.error){

    showError(
      optionResult.error.message
    );

    return;

  }


  const questionMap=
    new Map();


  (questionResult.data||[])
    .forEach(q=>{

      questionMap.set(
        String(q.id),
        {
          ...q,
          options:[]
        }
      );

    });


  (optionResult.data||[])
    .forEach(o=>{

      const q=
        questionMap.get(
          String(o.question_id)
        );


      if(q){

        q.options.push(o);

      }

    });


  /*
    Rebuild questions in the exact
    admin-selected order.
  */

  questions=
    assignments
      .map(a=>{

        const q=
          questionMap.get(
            String(a.question_id)
          );

        if(!q) return null;

        return {

          ...q,

          assignment_id:
            a.id,

          section_id:
            a.section_id,

          question_order:
            a.question_order

        };

      })
      .filter(Boolean);


  if(!questions.length){

    showError(
      "Assigned questions could not be loaded."
    );

    return;

  }


  beginTest();

}


/* =========================================
   BEGIN TEST
========================================= */

function beginTest(){

  document
    .getElementById("loading")
    .classList.add("hidden");


  document
    .getElementById("testArea")
    .classList
    .remove("hidden");


  document
    .getElementById("testName")
    .textContent=
      test.title;


  renderSections();

  renderPalette();

  showQuestion();


  startTimer();

}


/* =========================================
   SECTIONS
========================================= */

function renderSections(){

  const bar=
    document.getElementById(
      "sectionBar"
    );


  if(
    !(
      test.test_type==="FULL" &&
      test.subject_wise_timing &&
      sections.length
    )
  ){

    bar.classList.add("hidden");

    return;

  }


  bar.classList.remove("hidden");

  bar.innerHTML="";


  sections.forEach(
    (section,index)=>{

      const btn=
        document.createElement(
          "button"
        );

      btn.className=
        "section-btn";


      btn.textContent=
        "Section "+
        (index+1);


      btn.onclick=()=>{

        jumpToSection(index);

      };


      bar.appendChild(btn);

    }
  );


  updateSectionButtons();

}


/* =========================================
   SECTION QUESTIONS
========================================= */

function getSectionQuestions(
  sectionId
){

  return questions
    .map(
      (q,i)=>({
        q,
        i
      })
    )
    .filter(
      x=>
        String(
          x.q.section_id
        )===
        String(sectionId)
    );

}


/* =========================================
   JUMP SECTION
========================================= */

function jumpToSection(
  sectionIndex
){

  if(
    submitted ||
    !sections[sectionIndex]
  ) return;


  const sectionId=
    sections[sectionIndex].id;


  const list=
    getSectionQuestions(
      sectionId
    );


  if(!list.length){

    return;

  }


  currentIndex=
    list[0].i;


  startSectionTimer(
    sectionIndex
  );


  showQuestion();

}


/* =========================================
   SHOW QUESTION
========================================= */

function showQuestion(){

  if(
    submitted ||
    !questions.length
  ) return;


  const q=
    questions[currentIndex];


  const card=
    document.getElementById(
      "questionCard"
    );


  card.innerHTML="";


  const number=
    document.createElement(
      "div"
    );

  number.className=
    "question-number";


  number.textContent=
    "Question "+
    (currentIndex+1)+
    " of "+
    questions.length;


  const text=
    document.createElement(
      "div"
    );

  text.className=
    "question-text";


  text.textContent=
    q.question_text||"";


  const options=
    document.createElement(
      "div"
    );

  options.className=
    "options";


  q.options.forEach(
    (option,index)=>{

      const row=
        document.createElement(
          "label"
        );


      row.className=
        "option";


      if(
        answers[q.id]===
        String(option.id)
      ){

        row.classList.add(
          "selected"
        );

      }


      const radio=
        document.createElement(
          "input"
        );

      radio.type="radio";

      radio.name=
        "question-"+q.id;

      radio.value=
        option.id;


      radio.checked=
        answers[q.id]===
        String(option.id);


      radio.onchange=()=>{

        answers[q.id]=
          String(option.id);

        showQuestion();

        renderPalette();

      };


      const label=
        document.createElement(
          "span"
        );

      label.className=
        "option-label";


      label.textContent=
        option.option_label ||
        String.fromCharCode(
          65+index
        );


      const optionText=
        document.createElement(
          "span"
        );

      optionText.className=
        "option-text";


      optionText.textContent=
        option.option_text||"";


      row.appendChild(radio);
      row.appendChild(label);
      row.appendChild(optionText);

      options.appendChild(row);

    }
  );


  const controls=
    document.createElement(
      "div"
    );

  controls.className=
    "controls";


  const previous=
    document.createElement(
      "button"
    );

  previous.className=
    "btn secondary";

  previous.textContent=
    "← Previous";

  previous.disabled=
    currentIndex===0;

  previous.onclick=()=>{
    if(currentIndex>0){

      currentIndex--;

      showQuestion();

    }
  };


  const next=
    document.createElement(
      "button"
    );

  next.className=
    "btn primary";

  next.textContent=
    currentIndex===
    questions.length-1
    ?"Finish"
    :"Next →";


  next.onclick=()=>{

    if(
      currentIndex===
      questions.length-1
    ){

      confirmSubmit();

    }else{

      currentIndex++;

      showQuestion();

    }

  };


  controls.appendChild(previous);
  controls.appendChild(next);


  const reviewBtn=
    document.createElement(
      "button"
    );

  reviewBtn.className=
    "btn secondary review-btn";


  reviewBtn.textContent=
    review.has(q.id)
    ?"★ Remove Review Mark"
    :"☆ Mark for Review";


  reviewBtn.onclick=()=>{

    if(review.has(q.id)){

      review.delete(q.id);

    }else{

      review.add(q.id);

    }

    showQuestion();

    renderPalette();

  };


  card.appendChild(number);
  card.appendChild(text);
  card.appendChild(options);
  card.appendChild(controls);
  card.appendChild(reviewBtn);


  updateSectionButtons();

}


/* =========================================
   PALETTE
========================================= */

function renderPalette(){

  const palette=
    document.getElementById(
      "palette"
    );


  palette.innerHTML="";


  questions.forEach(
    (q,index)=>{

      const btn=
        document.createElement(
          "button"
        );


      btn.textContent=
        index+1;


      if(
        answers[q.id]
      ){

        btn.classList.add(
          "answered"
        );

      }


      if(
        review.has(q.id)
      ){

        btn.classList.add(
          "review"
        );

      }


      if(
        index===currentIndex
      ){

        btn.classList.add(
          "current"
        );

      }


      btn.onclick=()=>{

        currentIndex=index;

        showQuestion();

      };


      palette.appendChild(btn);

    }
  );

}


/* =========================================
   TIMER
========================================= */

function startTimer(){

  clearInterval(
    timerInterval
  );


  /*
    FULL + subject timing:
    timer belongs to current section.
  */

  if(
    test.test_type==="FULL" &&
    test.subject_wise_timing &&
    sections.length
  ){

    const currentSection=
      getCurrentSectionIndex();


    if(currentSection>=0){

      startSectionTimer(
        currentSection
      );

      return;

    }

  }


  remainingSeconds=
    Number(
      test.duration_minutes
    )*60;


  runTimer(
    ()=>{
      submitTest(true);
    }
  );

}


/* =========================================
   SECTION TIMER
========================================= */

function startSectionTimer(
  sectionIndex
){

  if(
    !sections[sectionIndex]
  ) return;


  clearInterval(
    timerInterval
  );


  remainingSeconds=
    Number(
      sections[
        sectionIndex
      ].duration_minutes
    )*60;


  runTimer(
    ()=>{
      sectionTimeUp(
        sectionIndex
      )
    }
  );

}


/* =========================================
   RUN TIMER
========================================= */

function runTimer(
  onEnd
){

  updateTimerDisplay();


  timerInterval=
    setInterval(()=>{

      if(submitted){

        clearInterval(
          timerInterval
        );

        return;

      }


      remainingSeconds--;


      updateTimerDisplay();


      if(
        remainingSeconds<=0
      ){

        clearInterval(
          timerInterval
        );

        onEnd();

      }

    },1000);

}


/* =========================================
   SECTION TIME UP
========================================= */

function sectionTimeUp(
  sectionIndex
){

  if(submitted) return;


  /*
    Find next section.
  */

  const next=
    sectionIndex+1;


  if(
    next>=sections.length
  ){

    submitTest(true);

    return;

  }


  const nextQuestions=
    getSectionQuestions(
      sections[next].id
    );


  if(!nextQuestions.length){

    sectionTimeUp(next);

    return;

  }


  alert(
    "Section "+
    (sectionIndex+1)+
    " time is over. Moving to Section "+
    (next+1)+"."
  );


  currentIndex=
    nextQuestions[0].i;


  startSectionTimer(
    next
  );


  showQuestion();

}


/* =========================================
   CURRENT SECTION
========================================= */

function getCurrentSectionIndex(){

  if(
    !sections.length
  ) return -1;


  const sectionId=
    questions[
      currentIndex
    ]?.section_id;


  return sections.findIndex(
    s=>
      String(s.id)===
      String(sectionId)
  );

}


/* =========================================
   SECTION BUTTONS
========================================= */

function updateSectionButtons(){

  const buttons=
    document.querySelectorAll(
      ".section-btn"
    );


  const current=
    getCurrentSectionIndex();


  buttons.forEach(
    (btn,index)=>{

      btn.classList.toggle(
        "current",
        index===current
      );

    }
  );

}


/* =========================================
   TIMER DISPLAY
========================================= */

function updateTimerDisplay(){

  const timer=
    document.getElementById(
      "timer"
    );


  const minutes=
    Math.floor(
      remainingSeconds/60
    );


  const seconds=
    remainingSeconds%60;


  timer.textContent=
    String(minutes).padStart(2,"0")+
    ":"+
    String(seconds).padStart(2,"0");


  timer.classList.toggle(
    "warning",
    remainingSeconds<=60
  );

}


/* =========================================
   SUBMIT CONFIRM
========================================= */

function confirmSubmit(){

  if(submitted) return;


  const unanswered=
    questions.filter(
      q=>!answers[q.id]
    ).length;


  let message=
    "Submit this test?";


  if(unanswered){

    message+=
      "\n\nUnanswered questions: "+
      unanswered;

  }


  if(
    confirm(message)
  ){

    submitTest(false);

  }

}


/* =========================================
   SUBMIT
========================================= */

async function submitTest(
  automatic=false
){

  if(submitted) return;


  submitted=true;


  clearInterval(
    timerInterval
  );


  calculateResult(
    automatic
  );

}


/* =========================================
   CALCULATE RESULT
========================================= */

function calculateResult(
  automatic
){

  let correct=0;
  let wrong=0;
  let skipped=0;
  let score=0;


  questions.forEach(q=>{

    const selected=
      answers[q.id];


    if(!selected){

      skipped++;

      return;

    }


    const option=
      q.options.find(
        o=>
          String(o.id)===
          String(selected)
      );


    if(!option){

      skipped++;

      return;

    }


    /*
      Correct answer is detected by
      the option_label against the
      question bank's is_correct data
      if available in the returned
      object. Since user-facing query
      above does not expose it, fetch
      correctness below separately.
    */

  });


  finishResult(
    automatic
  );

}


/* =========================================
   FINAL RESULT WITH CORRECT ANSWERS
========================================= */

async function finishResult(
  automatic
){

  const ids=
    questions.map(
      q=>q.id
    );


  const correctResult=
    await db
      .from("question_options")
      .select(
        "id,question_id,is_correct"
      )
      .in(
        "question_id",
        ids
      );


  if(correctResult.error){

    showError(
      correctResult.error.message
    );

    return;

  }


  const correctMap=
    new Map();


  (correctResult.data||[])
    .forEach(o=>{

      if(o.is_correct){

        correctMap.set(
          String(o.question_id),
          String(o.id)
        );

      }

    });


  let correct=0;
  let wrong=0;
  let skipped=0;
  let score=0;


  questions.forEach(q=>{

    const selected=
      answers[q.id];


    const marks=
      Number(
        q.marks ??
        test.marks_per_question ??
        2
      );


    const negative=
      Number(
        q.negative_marks ??
        test.negative_marks ??
        0
      );


    if(!selected){

      skipped++;

      return;

    }


    if(
      String(selected)===
      String(
        correctMap.get(
          String(q.id)
        )
      )
    ){

      correct++;

      score+=marks;

    }else{

      wrong++;

      score-=negative;

    }

  });


  score=
    Math.round(
      score*100
    )/100;


  const maxMarks=
    questions.reduce(
      (sum,q)=>
        sum+
        Number(
          q.marks ??
          test.marks_per_question ??
          2
        ),
      0
    );


  await saveAttempt(
    correct,
    wrong,
    skipped,
    score
  );


  document
    .getElementById(
      "testArea"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "result"
    )
    .classList
    .remove("hidden");


  document
    .getElementById(
      "result"
    ).innerHTML=`

      <div class="result-card">

        <h2>
          ${
            automatic
            ?"Time Over"
            :"Test Submitted"
          }
        </h2>

        <div class="score">
          ${score}
        </div>

        <div>
          Score
        </div>

        <div class="result-info">

          Correct: ${correct}<br>

          Wrong: ${wrong}<br>

          Skipped: ${skipped}<br>

          Total Questions: ${questions.length}<br>

          Maximum Marks: ${maxMarks}

        </div>

        <button
        class="btn primary"
        style="width:100%;margin-top:18px"
        onclick="location.href='practice.html'">

          Back to Practice

        </button>

      </div>

    `;

}


/* =========================================
   SAVE ATTEMPT
========================================= */

async function saveAttempt(
  correct,
  wrong,
  skipped,
  score
){

  /*
    Authentication is optional here.
    If user is logged in, save attempt.
    If not, result still works.
  */

  const {
    data:{user}
  }=
    await db.auth.getUser();


  if(!user) return;


  /*
    Try to create attempt.
    If your existing table uses these
    standard columns, it will save.
    Result remains usable even if the
    optional history insert is rejected.
  */

  const attempt=
    await db
      .from("test_attempts")
      .insert({

        user_id:
          user.id,

        mock_test_id:
          test.id,

        score:
          score,

        correct_answers:
          correct,

        wrong_answers:
          wrong,

        unanswered:
          skipped,

        total_questions:
          questions.length

      })
      .select()
      .maybeSingle();


  if(
    attempt.error
  ){

    console.warn(
      "Attempt history was not saved:",
      attempt.error.message
    );

    return;

  }


  /*
    Save individual answers when
    attempt ID is available.
  */

  if(
    attempt.data?.id
  ){

    const rows=
      questions.map(q=>({

        attempt_id:
          attempt.data.id,

        question_id:
          q.id,

        selected_option_id:
          answers[q.id]
          ?Number(answers[q.id])
          :null

      }));


    if(rows.length){

      const result=
        await db
          .from("user_answers")
          .insert(rows);


      if(result.error){

        console.warn(
          "User answers were not saved:",
          result.error.message
        );

      }

    }

  }

}


/* =========================================
   ERROR
========================================= */

function showError(text){

  document
    .getElementById(
      "loading"
    )
    .innerHTML=
      '<div class="error">'+
      escapeHtml(text)+
      '</div>';

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

  return String(
    value??""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}
