<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SSC EDGE Question Bank</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
.page{
  min-height:100vh;
  padding:22px 16px 100px;
  max-width:1000px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:25px;
}

.back{
  color:var(--purple2);
  text-decoration:none;
  font-weight:bold;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}

.card h2{
  margin:0 0 14px;
}

label{
  display:block;
  margin:11px 0 6px;
  color:var(--muted);
  font-size:14px;
}

input,
select,
textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border-radius:9px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  font-size:15px;
}

textarea{
  min-height:105px;
  resize:vertical;
  white-space:pre-wrap;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.language-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.language-box{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-top:8px;
}

.language-title{
  font-weight:bold;
  margin-bottom:8px;
  color:var(--purple2);
}

.option-row{
  display:grid;
  grid-template-columns:40px 1fr 1fr;
  gap:8px;
  margin-bottom:9px;
  align-items:center;
}

.option-label{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:var(--card2);
  font-weight:bold;
}

.correct-box{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:8px;
}

.check-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--bg);
  cursor:pointer;
}

.check-item input{
  width:auto;
  accent-color:var(--purple);
}

.checkbox-line{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:15px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
}

.checkbox-line input{
  width:auto;
  accent-color:var(--purple);
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  background:var(--purple);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:var(--card2);
}

button.danger{
  background:#b42318;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.status{
  padding:12px;
  border-radius:10px;
  background:var(--card2);
  margin-bottom:15px;
}

.question{
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.question-title{
  font-weight:bold;
  line-height:1.6;
  white-space:pre-wrap;
}

.question-hi{
  margin-top:7px;
  color:var(--muted);
  line-height:1.6;
  white-space:pre-wrap;
}

.meta{
  color:var(--muted);
  font-size:13px;
  margin-top:7px;
}

.option{
  padding:6px 0;
  font-size:14px;
  white-space:pre-wrap;
}

.correct{
  font-weight:bold;
  color:#22c55e;
}

.bonus{
  display:inline-block;
  margin-top:8px;
  padding:4px 8px;
  border-radius:6px;
  background:#a855f7;
  color:white;
  font-size:12px;
  font-weight:bold;
}

.solution-preview{
  margin-top:10px;
  padding:10px;
  border-radius:9px;
  background:var(--card2);
  white-space:pre-wrap;
  line-height:1.7;
}

.solution-image-preview{
  max-width:180px;
  max-height:130px;
  border-radius:8px;
  margin-top:10px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
}

.small-note{
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
}

@media(max-width:650px){
  .grid,
  .language-grid{
    grid-template-columns:1fr;
  }

  .option-row{
    grid-template-columns:34px 1fr 1fr;
  }

  .correct-box{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="header">
    <h1>❓ Question Bank</h1>
    <a class="back" href="admin.html">← Admin</a>
  </div>

  <div id="status" class="status">
    Checking admin access...
  </div>

  <div id="app" style="display:none;">

    <div class="card">

      <h2 id="formTitle">Add Question</h2>

      <label>Subject</label>
      <select id="subject">
        <option value="">Select Subject</option>
      </select>

      <label>Chapter</label>
      <select id="chapter">
        <option value="">Select Chapter</option>
      </select>

      <div class="language-grid">

        <div class="language-box">
          <div class="language-title">🇬🇧 English Question</div>
          <textarea id="questionText" placeholder="Enter English question..."></textarea>
        </div>

        <div class="language-box">
          <div class="language-title">🇮🇳 Hindi Question</div>
          <textarea id="questionTextHi" placeholder="प्रश्न हिंदी में लिखें..."></textarea>
        </div>

      </div>

      <label>Options — English / Hindi</label>

      <div class="option-row">
        <div class="option-label">A</div>
        <input id="optionA" placeholder="Option A English">
        <input id="optionAHi" placeholder="विकल्प A हिंदी">
      </div>

      <div class="option-row">
        <div class="option-label">B</div>
        <input id="optionB" placeholder="Option B English">
        <input id="optionBHi" placeholder="विकल्प B हिंदी">
      </div>

      <div class="option-row">
        <div class="option-label">C</div>
        <input id="optionC" placeholder="Option C English">
        <input id="optionCHi" placeholder="विकल्प C हिंदी">
      </div>

      <div class="option-row">
        <div class="option-label">D</div>
        <input id="optionD" placeholder="Option D English">
        <input id="optionDHi" placeholder="विकल्प D हिंदी">
      </div>

      <label>Correct Options — select one or more</label>

      <div class="correct-box">
        <label class="check-item">
          <input type="checkbox" class="correctOption" value="A">
          Correct A
        </label>

        <label class="check-item">
          <input type="checkbox" class="correctOption" value="B">
          Correct B
        </label>

        <label class="check-item">
          <input type="checkbox" class="correctOption" value="C">
          Correct C
        </label>

        <label class="check-item">
          <input type="checkbox" class="correctOption" value="D">
          Correct D
        </label>
      </div>

      <div class="checkbox-line">
        <input type="checkbox" id="isBonus">
        <label for="isBonus" style="margin:0;color:var(--text);">
          Bonus Question — attempted students receive marks
        </label>
      </div>

      <div class="grid">

        <div>
          <label>Marks</label>
          <input id="marks" type="number" step="0.01" value="2">
        </div>

        <div>
          <label>Negative Marks</label>
          <input id="negativeMarks" type="number" step="0.01" value="0.5">
        </div>

      </div>

      <label>Common Solution / Explanation</label>
      <textarea
        id="explanation"
        placeholder="Write solution. Line breaks will be preserved exactly..."
      ></textarea>

      <label>Solution Image — optional</label>
      <input id="solutionImage" type="file" accept="image/*">
      <div class="small-note">
        Upload an image of handwritten solution, diagram, chart, etc.
      </div>

      <div id="existingImageBox"></div>

      <label>Solution Video Link — optional</label>
      <input
        id="solutionVideo"
        type="url"
        placeholder="https://youtube.com/... or video link"
      >

      <div class="actions">

        <button onclick="saveQuestion()">
          Save Question
        </button>

        <button class="secondary" onclick="resetForm()">
          Clear
        </button>

      </div>

    </div>


    <div class="card">

      <h2>Question Bank</h2>

      <div class="grid">

        <div>
          <label>Subject</label>
          <select id="filterSubject">
            <option value="">All Subjects</option>
          </select>
        </div>

        <div>
          <label>Chapter</label>
          <select id="filterChapter">
            <option value="">All Chapters</option>
          </select>
        </div>

      </div>

      <label>Search</label>
      <input id="search" placeholder="Search English or Hindi question...">

    </div>

    <div id="questionList"></div>

  </div>
</div>


<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let subjects = [];
let chapters = [];
let questions = [];
let editingId = null;
let existingImageUrl = "";


/* ADMIN CHECK */

async function checkAdmin(){

  const { data:{user} } = await db.auth.getUser();

  if(!user){
    showStatus("Admin access required.");
    return false;
  }

  const { data,error } = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if(error){
    console.error(error);
    showStatus("Unable to verify admin access.");
    return false;
  }

  if(!data){
    await db.auth.signOut();
    showStatus("Access denied. Admin account required.");
    return false;
  }

  document.getElementById("status").style.display = "none";
  document.getElementById("app").style.display = "block";

  return true;
}


function showStatus(text){
  document.getElementById("status").textContent = text;
}


/* SUBJECTS */

async function loadSubjects(){

  const { data,error } = await db
    .from("subjects")
    .select("*")
    .order("name");

  if(error){
    alert("Could not load subjects:\n" + error.message);
    return;
  }

  subjects = data || [];

  const subject = document.getElementById("subject");
  const filter = document.getElementById("filterSubject");

  subject.innerHTML = `<option value="">Select Subject</option>`;
  filter.innerHTML = `<option value="">All Subjects</option>`;

  subjects.forEach(s => {

    subject.innerHTML += `
      <option value="${s.id}">
        ${escapeHtml(s.name)}
      </option>`;

    filter.innerHTML += `
      <option value="${s.id}">
        ${escapeHtml(s.name)}
      </option>`;

  });
}


/* CHAPTERS */

async function loadChapters(){

  const { data,error } = await db
    .from("chapters")
    .select("*")
    .order("name");

  if(error){
    alert("Could not load chapters:\n" + error.message);
    return;
  }

  chapters = data || [];

  updateChapterSelect();
  updateFilterChapter();
}


function updateChapterSelect(){

  const subjectId = document.getElementById("subject").value;
  const select = document.getElementById("chapter");

  select.innerHTML = `<option value="">Select Chapter</option>`;

  chapters
    .filter(c =>
      subjectId &&
      String(c.subject_id) === String(subjectId)
    )
    .forEach(c => {
      select.innerHTML += `
        <option value="${c.id}">
          ${escapeHtml(c.name)}
        </option>`;
    });
}


function updateFilterChapter(){

  const subjectId = document.getElementById("filterSubject").value;
  const select = document.getElementById("filterChapter");

  select.innerHTML = `<option value="">All Chapters</option>`;

  chapters
    .filter(c =>
      !subjectId ||
      String(c.subject_id) === String(subjectId)
    )
    .forEach(c => {
      select.innerHTML += `
        <option value="${c.id}">
          ${escapeHtml(c.name)}
        </option>`;
    });

  renderQuestions();
}


/* LOAD QUESTIONS */

async function loadQuestions(){

  const { data,error } = await db
    .from("questions")
    .select(`
      *,
      subjects(name),
      chapters(name)
    `)
    .order("id",{ascending:false});

  if(error){
    alert("Could not load questions:\n" + error.message);
    return;
  }

  questions = data || [];
  renderQuestions();
}


/* RENDER */

async function renderQuestions(){

  const list = document.getElementById("questionList");

  const subjectId = document.getElementById("filterSubject").value;
  const chapterId = document.getElementById("filterChapter").value;
  const search = document.getElementById("search").value.trim().toLowerCase();

  const filtered = questions.filter(q => {

    if(
      subjectId &&
      String(q.subject_id) !== String(subjectId)
    ) return false;

    if(
      chapterId &&
      String(q.chapter_id) !== String(chapterId)
    ) return false;

    if(search){

      const combined = (
        String(q.question_text || "") + " " +
        String(q.question_text_hi || "") + " " +
        String(q.explanation || "")
      ).toLowerCase();

      if(!combined.includes(search)) return false;
    }

    return true;
  });

  if(!filtered.length){
    list.innerHTML = `
      <div class="card empty">
        No questions found.
      </div>`;
    return;
  }

  const ids = filtered.map(q => q.id);

  const { data:options,error } = await db
    .from("question_options")
    .select("*")
    .in("question_id",ids)
    .order("option_label");

  if(error){
    list.innerHTML = `
      <div class="card empty">
        Questions loaded, but options could not be loaded.
      </div>`;
    return;
  }

  const optionMap = {};

  (options || []).forEach(o => {
    if(!optionMap[o.question_id]){
      optionMap[o.question_id] = [];
    }
    optionMap[o.question_id].push(o);
  });

  list.innerHTML = "";

  filtered.forEach((q,index) => {

    const opts = optionMap[q.id] || [];
    let optionHtml = "";

    opts.forEach(o => {

      optionHtml += `
        <div class="option ${o.is_correct ? "correct" : ""}">
          ${escapeHtml(o.option_label)}.
          ${escapeHtml(o.option_text || "")}
          ${
            o.option_text_hi
            ? " | " + escapeHtml(o.option_text_hi)
            : ""
          }
          ${o.is_correct ? " ✓" : ""}
        </div>`;
    });

    const correctList = opts
      .filter(o => o.is_correct)
      .map(o => o.option_label)
      .join(", ");

    list.innerHTML += `
      <div class="question">

        <div class="question-title">
          ${index+1}. ${escapeHtml(q.question_text || "")}
        </div>

        ${
          q.question_text_hi
          ? `<div class="question-hi">
              🇮🇳 ${escapeHtml(q.question_text_hi)}
             </div>`
          : ""
        }

        <div class="meta">
          ${escapeHtml(q.subjects?.name || "No Subject")}
          •
          ${escapeHtml(q.chapters?.name || "No Chapter")}
          • Marks: ${q.marks ?? 0}
          • Negative: ${q.negative_marks ?? 0}
          • Correct: ${escapeHtml(correctList || "Not set")}
        </div>

        ${
          q.is_bonus
          ? `<span class="bonus">BONUS QUESTION</span>`
          : ""
        }

        <div style="margin-top:8px;">
          ${optionHtml}
        </div>

        ${
          q.explanation
          ? `<div class="solution-preview">
              <b>Solution:</b><br>
              ${escapeHtml(q.explanation)}
             </div>`
          : ""
        }

        ${
          q.solution_image_url
          ? `<img
              class="solution-image-preview"
              src="${escapeHtml(q.solution_image_url)}"
              alt="Solution image"
             >`
          : ""
        }

        ${
          q.solution_video_url
          ? `<div class="meta">
              🎥 Video solution added
             </div>`
          : ""
        }

        <div class="actions">

          <button
            class="secondary"
            onclick="editQuestion(${q.id})"
          >
            Edit
          </button>

          <button
            class="danger"
            onclick="deleteQuestion(${q.id})"
          >
            Delete
          </button>

        </div>

      </div>`;
  });
}


/* IMAGE UPLOAD */

async function uploadSolutionImage(file,questionId){

  if(!file) return existingImageUrl || null;

  const extension =
    file.name.split(".").pop().toLowerCase();

  const fileName =
    `${questionId}_${Date.now()}.${extension}`;

  const filePath = fileName;

  const { error:uploadError } = await db.storage
    .from("solution-images")
    .upload(filePath,file,{
      upsert:true,
      contentType:file.type
    });

  if(uploadError){
    throw uploadError;
  }

  const { data } = db.storage
    .from("solution-images")
    .getPublicUrl(filePath);

  return data.publicUrl;
}


/* SAVE QUESTION */

async function saveQuestion(){

  const subjectId = document.getElementById("subject").value;
  const chapterId = document.getElementById("chapter").value;

  const text = document.getElementById("questionText").value.trim();
  const textHi = document.getElementById("questionTextHi").value.trim();

  const A = document.getElementById("optionA").value.trim();
  const B = document.getElementById("optionB").value.trim();
  const C = document.getElementById("optionC").value.trim();
  const D = document.getElementById("optionD").value.trim();

  const AHi = document.getElementById("optionAHi").value.trim();
  const BHi = document.getElementById("optionBHi").value.trim();
  const CHi = document.getElementById("optionCHi").value.trim();
  const DHi = document.getElementById("optionDHi").value.trim();

  const correctOptions = [
    ...document.querySelectorAll(".correctOption:checked")
  ].map(x => x.value);

  const isBonus = document.getElementById("isBonus").checked;

  const marks =
    parseFloat(document.getElementById("marks").value) || 0;

  const negative =
    parseFloat(document.getElementById("negativeMarks").value) || 0;

  const explanation =
    document.getElementById("explanation").value;

  const videoUrl =
    document.getElementById("solutionVideo").value.trim();

  const imageFile =
    document.getElementById("solutionImage").files[0];

  if(!subjectId){
    alert("Please select a subject.");
    return;
  }

  if(!chapterId){
    alert("Please select a chapter.");
    return;
  }

  if(!text){
    alert("Please enter English question.");
    return;
  }

  if(!textHi){
    alert("Please enter Hindi question.");
    return;
  }

  if(!A || !B || !C || !D){
    alert("Please enter all English options.");
    return;
  }

  if(!AHi || !BHi || !CHi || !DHi){
    alert("Please enter all Hindi options.");
    return;
  }

  if(!correctOptions.length){
    alert("Please select at least one correct option.");
    return;
  }

  try{

    let questionId;

    const questionData = {
      subject_id:subjectId,
      chapter_id:chapterId,
      question_text:text,
      question_text_hi:textHi,
      explanation:explanation,
      marks:marks,
      negative_marks:negative,
      correct_options:correctOptions,
      is_bonus:isBonus,
      solution_video_url:videoUrl || null
    };

    /* UPDATE */

    if(editingId){

      const { error } = await db
        .from("questions")
        .update(questionData)
        .eq("id",editingId);

      if(error) throw error;

      questionId = editingId;

      if(imageFile){
        const imageUrl =
          await uploadSolutionImage(imageFile,questionId);

        const { error:imageError } = await db
          .from("questions")
          .update({
            solution_image_url:imageUrl
          })
          .eq("id",questionId);

        if(imageError) throw imageError;
      }

      const { error:deleteError } = await db
        .from("question_options")
        .delete()
        .eq("question_id",questionId);

      if(deleteError) throw deleteError;

    }

    /* INSERT */

    else{

      questionData.mock_test_id = null;

      const { data,error } = await db
        .from("questions")
        .insert(questionData)
        .select("id")
        .single();

      if(error) throw error;

      questionId = data.id;

      if(imageFile){

        const imageUrl =
          await uploadSolutionImage(imageFile,questionId);

        const { error:imageError } = await db
          .from("questions")
          .update({
            solution_image_url:imageUrl
          })
          .eq("id",questionId);

        if(imageError) throw imageError;
      }
    }

    const optionRows = [

      {
        question_id:questionId,
        option_label:"A",
        option_text:A,
        option_text_hi:AHi,
        is_correct:correctOptions.includes("A")
      },

      {
        question_id:questionId,
        option_label:"B",
        option_text:B,
        option_text_hi:BHi,
        is_correct:correctOptions.includes("B")
      },

      {
        question_id:questionId,
        option_label:"C",
        option_text:C,
        option_text_hi:CHi,
        is_correct:correctOptions.includes("C")
      },

      {
        question_id:questionId,
        option_label:"D",
        option_text:D,
        option_text_hi:DHi,
        is_correct:correctOptions.includes("D")
      }

    ];

    const { error:optionError } = await db
      .from("question_options")
      .insert(optionRows);

    if(optionError) throw optionError;

    alert(
      editingId
      ? "Question updated successfully."
      : "Question added successfully."
    );

    resetForm();
    await loadQuestions();

  }catch(error){

    console.error(error);

    alert(
      "Could not save question:\n" +
      error.message
    );
  }
}


/* EDIT QUESTION */

async function editQuestion(id){

  const q = questions.find(
    x => String(x.id) === String(id)
  );

  if(!q) return;

  editingId = q.id;
  existingImageUrl = q.solution_image_url || "";

  document.getElementById("formTitle").textContent =
    "Edit Question";

  document.getElementById("subject").value =
    q.subject_id || "";

  updateChapterSelect();

  document.getElementById("chapter").value =
    q.chapter_id || "";

  document.getElementById("questionText").value =
    q.question_text || "";

  document.getElementById("questionTextHi").value =
    q.question_text_hi || "";

  document.getElementById("marks").value =
    q.marks ?? 0;

  document.getElementById("negativeMarks").value =
    q.negative_marks ?? 0;

  document.getElementById("explanation").value =
    q.explanation || "";

  document.getElementById("solutionVideo").value =
    q.solution_video_url || "";

  document.getElementById("isBonus").checked =
    q.is_bonus === true;

  document.querySelectorAll(".correctOption")
    .forEach(cb => {
      cb.checked =
        Array.isArray(q.correct_options) &&
        q.correct_options.includes(cb.value);
    });

  document.getElementById("existingImageBox").innerHTML =
    existingImageUrl
    ? `
      <div class="small-note">Current solution image:</div>
      <img
        class="solution-image-preview"
        src="${escapeHtml(existingImageUrl)}"
        alt="Current solution"
      >
    `
    : "";

  const { data,error } = await db
    .from("question_options")
    .select("*")
    .eq("question_id",id)
    .order("option_label");

  if(error){
    alert("Could not load options.");
    return;
  }

  const map = {};

  (data || []).forEach(o => {
    map[o.option_label] = o;
  });

  document.getElementById("optionA").value =
    map.A?.option_text || "";

  document.getElementById("optionB").value =
    map.B?.option_text || "";

  document.getElementById("optionC").value =
    map.C?.option_text || "";

  document.getElementById("optionD").value =
    map.D?.option_text || "";

  document.getElementById("optionAHi").value =
    map.A?.option_text_hi || "";

  document.getElementById("optionBHi").value =
    map.B?.option_text_hi || "";

  document.getElementById("optionCHi").value =
    map.C?.option_text_hi || "";

  document.getElementById("optionDHi").value =
    map.D?.option_text_hi || "";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* DELETE */

async function deleteQuestion(id){

  if(!confirm("Delete this question permanently?")){
    return;
  }

  const { error } = await db
    .from("questions")
    .delete()
    .eq("id",id);

  if(error){
    alert("Could not delete question:\n" + error.message);
    return;
  }

  alert("Question deleted.");
  await loadQuestions();
}

/* ESCAPE */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
