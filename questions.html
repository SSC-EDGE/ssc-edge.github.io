<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SSC EDGE Question Bank</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

.page{
  min-height:100vh;
  padding:22px 16px 100px;
  max-width:950px;
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:25px;
}

.back{
  color:var(--purple2);
  text-decoration:none;
  font-weight:bold;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}

.card h2{
  margin:0 0 12px;
}

label{
  display:block;
  margin:10px 0 6px;
  color:var(--muted);
  font-size:14px;
}

input,
select,
textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border-radius:9px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.option-row{
  display:flex;
  gap:8px;
  margin-bottom:9px;
}

.option-label{
  width:42px;
  min-width:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:var(--card2);
  font-weight:bold;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  background:var(--purple);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button.secondary{
  background:var(--card2);
}

button.danger{
  background:#b42318;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:14px;
}

.question{
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.question-title{
  font-weight:bold;
  line-height:1.5;
}

.meta{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}

.option{
  padding:6px 0;
  font-size:14px;
}

.correct{
  font-weight:bold;
}

.status{
  padding:12px;
  border-radius:10px;
  background:var(--card2);
  margin-bottom:15px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<div class="page">

  <div class="header">

    <h1>❓ Question Bank</h1>

    <a
      class="back"
      href="admin.html"
    >
      ← Admin
    </a>

  </div>


  <div
    id="status"
    class="status"
  >
    Checking admin access...
  </div>


  <div id="app" style="display:none;">


    <!-- ADD QUESTION -->

    <div class="card">

      <h2 id="formTitle">
        Add Question
      </h2>


      <label>Subject</label>

      <select id="subject">
        <option value="">
          Select Subject
        </option>
      </select>


      <label>Chapter</label>

      <select id="chapter">

        <option value="">
          Select Chapter
        </option>

      </select>


      <label>Question</label>

      <textarea
        id="questionText"
        placeholder="Enter question..."
      ></textarea>


      <label>Options</label>


      <div class="option-row">

        <div class="option-label">
          A
        </div>

        <input
          id="optionA"
          placeholder="Option A"
        >

      </div>


      <div class="option-row">

        <div class="option-label">
          B
        </div>

        <input
          id="optionB"
          placeholder="Option B"
        >

      </div>


      <div class="option-row">

        <div class="option-label">
          C
        </div>

        <input
          id="optionC"
          placeholder="Option C"
        >

      </div>


      <div class="option-row">

        <div class="option-label">
          D
        </div>

        <input
          id="optionD"
          placeholder="Option D"
        >

      </div>


      <label>
        Correct Option
      </label>

      <select id="correctOption">

        <option value="">
          Select Correct Option
        </option>

        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>

      </select>


      <div class="grid">

        <div>

          <label>
            Marks
          </label>

          <input
            id="marks"
            type="number"
            step="0.01"
            value="2"
          >

        </div>


        <div>

          <label>
            Negative Marks
          </label>

          <input
            id="negativeMarks"
            type="number"
            step="0.01"
            value="0.5"
          >

        </div>

      </div>


      <label>
        Explanation
      </label>

      <textarea
        id="explanation"
        placeholder="Optional explanation..."
      ></textarea>


      <div class="actions">

        <button
          onclick="saveQuestion()"
        >
          Save Question
        </button>

        <button
          class="secondary"
          onclick="resetForm()"
        >
          Clear
        </button>

      </div>

    </div>


    <!-- FILTER -->

    <div class="card">

      <h2>
        Question Bank
      </h2>


      <div class="grid">

        <div>

          <label>
            Subject
          </label>

          <select
            id="filterSubject"
          >

            <option value="">
              All Subjects
            </option>

          </select>

        </div>


        <div>

          <label>
            Chapter
          </label>

          <select
            id="filterChapter"
          >

            <option value="">
              All Chapters
            </option>

          </select>

        </div>

      </div>


      <label>
        Search
      </label>

      <input
        id="search"
        placeholder="Search question..."
      >

    </div>


    <div id="questionList"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let subjects = [];
let chapters = [];
let questions = [];

let editingId = null;


/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(){

  const {
    data:{user}
  } =
    await db.auth.getUser();


  if(!user){

    showStatus(
      "Admin access required."
    );

    return false;
  }


  const {
    data,
    error
  } =
    await db
      .from("admin_users")
      .select("user_id")
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(error){

    console.error(error);

    showStatus(
      "Unable to verify admin access."
    );

    return false;
  }


  if(!data){

    await db.auth.signOut();

    showStatus(
      "Access denied. Admin account required."
    );

    return false;
  }


  document.getElementById(
    "status"
  ).style.display =
    "none";


  document.getElementById(
    "app"
  ).style.display =
    "block";


  return true;

}


/* STATUS */

function showStatus(text){

  document.getElementById(
    "status"
  ).textContent =
    text;

}


/* =========================
   SUBJECTS
========================= */

async function loadSubjects(){

  const {
    data,
    error
  } =
    await db
      .from("subjects")
      .select("*")
      .order("name");


  if(error){

    alert(
      "Could not load subjects:\n" +
      error.message
    );

    return;
  }


  subjects =
    data || [];


  const subject =
    document.getElementById(
      "subject"
    );

  const filter =
    document.getElementById(
      "filterSubject"
    );


  subject.innerHTML =
    `<option value="">
      Select Subject
    </option>`;


  filter.innerHTML =
    `<option value="">
      All Subjects
    </option>`;


  subjects.forEach(s => {

    subject.innerHTML +=
      `<option value="${s.id}">
        ${escapeHtml(s.name)}
      </option>`;


    filter.innerHTML +=
      `<option value="${s.id}">
        ${escapeHtml(s.name)}
      </option>`;

  });

}


/* =========================
   CHAPTERS
========================= */

async function loadChapters(){

  const {
    data,
    error
  } =
    await db
      .from("chapters")
      .select("*")
      .order("name");


  if(error){

    alert(
      "Could not load chapters:\n" +
      error.message
    );

    return;
  }


  chapters =
    data || [];


  updateChapterSelect();

  updateFilterChapter();

}


/* FORM CHAPTERS */

function updateChapterSelect(){

  const subjectId =
    document.getElementById(
      "subject"
    ).value;


  const select =
    document.getElementById(
      "chapter"
    );


  select.innerHTML =
    `<option value="">
      Select Chapter
    </option>`;


  chapters
    .filter(c => {

      if(!subjectId){
        return false;
      }

      return String(c.subject_id) ===
        String(subjectId);

    })
    .forEach(c => {

      select.innerHTML +=
        `<option value="${c.id}">
          ${escapeHtml(c.name)}
        </option>`;

    });

}


/* FILTER CHAPTERS */

function updateFilterChapter(){

  const subjectId =
    document.getElementById(
      "filterSubject"
    ).value;


  const select =
    document.getElementById(
      "filterChapter"
    );


  select.innerHTML =
    `<option value="">
      All Chapters
    </option>`;


  chapters
    .filter(c => {

      if(!subjectId){
        return true;
      }

      return String(c.subject_id) ===
        String(subjectId);

    })
    .forEach(c => {

      select.innerHTML +=
        `<option value="${c.id}">
          ${escapeHtml(c.name)}
        </option>`;

    });


  renderQuestions();

}


/* =========================
   LOAD QUESTIONS
========================= */

async function loadQuestions(){

  const {
    data,
    error
  } =
    await db
      .from("questions")
      .select(`
        *,
        subjects(name),
        chapters(name)
      `)
      .is(
        "mock_test_id",
        null
      )
      .order("id",{
        ascending:false
      });


  if(error){

    alert(
      "Could not load questions:\n" +
      error.message
    );

    return;
  }


  questions =
    data || [];


  renderQuestions();

}


/* =========================
   RENDER
========================= */

async function renderQuestions(){

  const list =
    document.getElementById(
      "questionList"
    );


  const subjectId =
    document.getElementById(
      "filterSubject"
    ).value;


  const chapterId =
    document.getElementById(
      "filterChapter"
    ).value;


  const search =
    document.getElementById(
      "search"
    ).value
      .trim()
      .toLowerCase();


  const filtered =
    questions.filter(q => {

      if(
        subjectId &&
        String(q.subject_id) !==
        String(subjectId)
      ){
        return false;
      }


      if(
        chapterId &&
        String(q.chapter_id) !==
        String(chapterId)
      ){
        return false;
      }


      if(
        search &&
        !String(
          q.question_text || ""
        )
        .toLowerCase()
        .includes(search)
      ){
        return false;
      }


      return true;

    });


  if(!filtered.length){

    list.innerHTML =
      `<div class="card empty">
        No questions found.
      </div>`;

    return;
  }


  const ids =
    filtered.map(q => q.id);


  const {
    data:options,
    error
  } =
    await db
      .from("question_options")
      .select("*")
      .in(
        "question_id",
        ids
      )
      .order("option_label");


  if(error){

    list.innerHTML =
      `<div class="card empty">
        Questions loaded, but options could not be loaded.
      </div>`;

    return;
  }


  const optionMap = {};


  (options || []).forEach(o => {

    if(!optionMap[o.question_id]){
      optionMap[o.question_id] = [];
    }

    optionMap[o.question_id]
      .push(o);

  });


  list.innerHTML = "";


  filtered.forEach((q,index) => {

    const opts =
      optionMap[q.id] || [];


    let optionHtml = "";


    opts.forEach(o => {

      optionHtml +=
        `<div class="option ${
          o.is_correct
          ? "correct"
          : ""
        }">

          ${escapeHtml(
            o.option_label
          )}.

          ${escapeHtml(
            o.option_text
          )}

          ${
            o.is_correct
            ? " ✓"
            : ""
          }

        </div>`;

    });


    list.innerHTML +=

      `<div class="question">

        <div class="question-title">

          ${index+1}.
          ${escapeHtml(
            q.question_text
          )}

        </div>


        <div class="meta">

          ${escapeHtml(
            q.subjects?.name ||
            "No Subject"
          )}

          •
          
          ${escapeHtml(
            q.chapters?.name ||
            "No Chapter"
          )}

          • Marks:
          ${q.marks ?? 0}

          • Negative:
          ${q.negative_marks ?? 0}

        </div>


        <div>
          ${optionHtml}
        </div>


        ${
          q.explanation
          ?
          `<div class="meta">
            Explanation:
            ${escapeHtml(
              q.explanation
            )}
          </div>`
          :
          ""
        }


        <div class="actions">

          <button
            class="secondary"
            onclick="editQuestion(${q.id})"
          >
            Edit
          </button>


          <button
            class="danger"
            onclick="deleteQuestion(${q.id})"
          >
            Delete
          </button>

        </div>

      </div>`;

  });

}


/* =========================
   SAVE QUESTION
========================= */

async function saveQuestion(){

  const subjectId =
    document.getElementById(
      "subject"
    ).value;


  const chapterId =
    document.getElementById(
      "chapter"
    ).value;


  const text =
    document.getElementById(
      "questionText"
    ).value.trim();


  const A =
    document.getElementById(
      "optionA"
    ).value.trim();


  const B =
    document.getElementById(
      "optionB"
    ).value.trim();


  const C =
    document.getElementById(
      "optionC"
    ).value.trim();


  const D =
    document.getElementById(
      "optionD"
    ).value.trim();


  const correct =
    document.getElementById(
      "correctOption"
    ).value;


  const marks =
    parseFloat(
      document.getElementById(
        "marks"
      ).value
    ) || 0;


  const negative =
    parseFloat(
      document.getElementById(
        "negativeMarks"
      ).value
    ) || 0;


  const explanation =
    document.getElementById(
      "explanation"
    ).value.trim();


  if(!subjectId){

    alert(
      "Please select a subject."
    );

    return;
  }


  if(!chapterId){

    alert(
      "Please select a chapter."
    );

    return;
  }


  if(!text){

    alert(
      "Please enter the question."
    );

    return;
  }


  if(!A || !B || !C || !D){

    alert(
      "Please enter all four options."
    );

    return;
  }


  if(!correct){

    alert(
      "Please select the correct option."
    );

    return;
  }


  try{

    let questionId;


    /* UPDATE */

    if(editingId){

      const {
        error
      } =
        await db
          .from("questions")
          .update({

            subject_id:subjectId,
            chapter_id:chapterId,
            question_text:text,
            explanation:explanation,
            marks:marks,
            negative_marks:negative

          })
          .eq(
            "id",
            editingId
          );


      if(error){
        throw error;
      }


      questionId =
        editingId;


      const {
        error:deleteError
      } =
        await db
          .from("question_options")
          .delete()
          .eq(
            "question_id",
            questionId
          );


      if(deleteError){
        throw deleteError;
      }

    }


    /* INSERT */

    else{

      const {
        data,
        error
      } =
        await db
          .from("questions")
          .insert({

            mock_test_id:null,
            subject_id:subjectId,
            chapter_id:chapterId,
            question_text:text,
            explanation:explanation,
            marks:marks,
            negative_marks:negative

          })
          .select("id")
          .single();


      if(error){
        throw error;
      }


      questionId =
        data.id;

    }


    /* OPTIONS */

    const optionRows = [

      {
        question_id:questionId,
        option_text:A,
        option_label:"A",
        is_correct:
          correct === "A"
      },

      {
        question_id:questionId,
        option_text:B,
        option_label:"B",
        is_correct:
          correct === "B"
      },

      {
        question_id:questionId,
        option_text:C,
        option_label:"C",
        is_correct:
          correct === "C"
      },

      {
        question_id:questionId,
        option_text:D,
        option_label:"D",
        is_correct:
          correct === "D"
      }

    ];


    const {
      error:optionError
    } =
      await db
        .from("question_options")
        .insert(
          optionRows
        );


    if(optionError){
      throw optionError;
    }


    alert(
      editingId
      ?
      "Question updated successfully."
      :
      "Question added successfully."
    );


    resetForm();

    await loadQuestions();

  }catch(error){

    console.error(error);

    alert(
      "Could not save question:\n" +
      error.message
    );

  }

}


/* =========================
   EDIT
========================= */

async function editQuestion(id){

  const q =
    questions.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if(!q){
    return;
  }


  editingId =
    q.id;


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit Question";


  document.getElementById(
    "subject"
  ).value =
    q.subject_id || "";


  updateChapterSelect();


  document.getElementById(
    "chapter"
  ).value =
    q.chapter_id || "";


  document.getElementById(
    "questionText"
  ).value =
    q.question_text || "";


  document.getElementById(
    "marks"
  ).value =
    q.marks ?? 0;


  document.getElementById(
    "negativeMarks"
  ).value =
    q.negative_marks ?? 0;


  document.getElementById(
    "explanation"
  ).value =
    q.explanation || "";


  const {
    data,
    error
  } =
    await db
      .from("question_options")
      .select("*")
      .eq(
        "question_id",
        id
      )
      .order("option_label");


  if(error){

    alert(
      "Could not load options."
    );

    return;
  }


  const map = {};


  (data || []).forEach(o => {

    map[o.option_label] =
      o;

  });


  document.getElementById(
    "optionA"
  ).value =
    map.A?.option_text || "";


  document.getElementById(
    "optionB"
  ).value =
    map.B?.option_text || "";


  document.getElementById(
    "optionC"
  ).value =
    map.C?.option_text || "";


  document.getElementById(
    "optionD"
  ).value =
    map.D?.option_text || "";


  const correct =
    (data || []).find(
      o => o.is_correct
    );


  document.getElementById(
    "correctOption"
  ).value =
    correct?.option_label || "";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DELETE
========================= */

async function deleteQuestion(id){

  if(
    !confirm(
      "Delete this question permanently?"
    )
  ){
    return;
  }


  const {
    error
  } =
    await db
      .from("questions")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    alert(
      "Could not delete question:\n" +
      error.message
    );

    return;
  }


  alert(
    "Question deleted."
  );


  await loadQuestions();

}


/* =========================
   RESET
========================= */

function resetForm(){

  editingId = null;


  document.getElementById(
    "formTitle"
  ).textContent =
    "Add Question";


  document.getElementById(
    "subject"
  ).value =
    "";


  updateChapterSelect();


  document.getElementById(
    "questionText"
  ).value =
    "";


  document.getElementById(
    "optionA"
  ).value =
    "";


  document.getElementById(
    "optionB"
  ).value =
    "";


  document.getElementById(
    "optionC"
  ).value =
    "";


  document.getElementById(
    "optionD"
  ).value =
    "";


  document.getElementById(
    "correctOption"
  ).value =
    "";


  document.getElementById(
    "marks"
  ).value =
    "2";


  document.getElementById(
    "negativeMarks"
  ).value =
    "0.5";


  document.getElementById(
    "explanation"
  ).value =
    "";

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   EVENTS
========================= */

document
  .getElementById("subject")
  .addEventListener(
    "change",
    updateChapterSelect
  );


document
  .getElementById("filterSubject")
  .addEventListener(
    "change",
    updateFilterChapter
  );


document
  .getElementById("filterChapter")
  .addEventListener(
    "change",
    renderQuestions
  );


document
  .getElementById("search")
  .addEventListener(
    "input",
    renderQuestions
  );


/* =========================
   START
========================= */

(async function(){

  const admin =
    await checkAdmin();

  if(!admin){
    return;
  }

  await loadSubjects();

  await loadChapters();

  await loadQuestions();

})();

</script>

</body>
</html>
