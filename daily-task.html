<style>

/* =========================
   THEME
========================= */

:root{
  --bg:#f8f5fc;
  --header:#ffffff;
  --card:#ffffff;
  --card2:#f2ecfa;
  --text:#21182b;
  --muted:#756d80;
  --border:#ded5e8;
  --purple:#9b5cff;
  --purple-dark:#8140df;
  --green:#24a36b;
  --green-bg:#e8f8f0;
  --red:#e05252;
}

:root[data-theme="dark"]{
  --bg:#120d18;
  --header:#1b1225;
  --card:#21162c;
  --card2:#2b1d39;
  --text:#f7f1fc;
  --muted:#aaa0b5;
  --border:#3b2b4c;
  --purple:#a76bff;
  --purple-dark:#8c4be8;
  --green:#4bd18a;
  --green-bg:#173728;
  --red:#ff6b6b;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  padding-bottom:80px;
}


/* =========================
   HEADER
========================= */

.top-header{
  height:62px;
  padding:0 17px;
  display:flex;
  align-items:center;
  background:var(--header);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  font-size:21px;
  font-weight:900;
  letter-spacing:.5px;
}

.brand span{
  color:var(--purple);
}


/* =========================
   MAIN
========================= */

.container{
  max-width:700px;
  margin:auto;
  padding:22px 16px 30px;
}


/* =========================
   PAGE TITLE
========================= */

.page-title{
  font-size:27px;
  font-weight:900;
  margin:0 0 5px;
}

.page-subtitle{
  margin:0 0 20px;
  color:var(--muted);
  font-size:14px;
}


/* =========================
   DAILY SCHEDULE BUTTON
========================= */

.schedule-card{
  width:100%;
  display:flex;
  align-items:center;
  gap:13px;
  padding:17px;
  margin-bottom:25px;

  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;

  color:var(--text);
  text-align:left;

  box-shadow:0 5px 18px rgba(0,0,0,.06);

  cursor:pointer;
  transition:.2s ease;
}

.schedule-card:active{
  transform:scale(.985);
}

.schedule-icon{
  width:48px;
  height:48px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;
  background:var(--card2);

  font-size:25px;
}

.schedule-info{
  flex:1;
}

.schedule-title{
  font-size:17px;
  font-weight:900;
  margin-bottom:4px;
}

.schedule-subtitle{
  color:var(--muted);
  font-size:12px;
  font-weight:600;
}

.schedule-arrow{
  font-size:23px;
  color:var(--muted);
}


/* =========================
   PROGRESS CARD
========================= */

.progress-card{
  background:linear-gradient(
    135deg,
    var(--purple-dark),
    var(--purple)
  );

  color:white;

  border-radius:18px;
  padding:19px;
  margin-bottom:25px;

  box-shadow:0 8px 22px rgba(126,70,220,.22);
}

.progress-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.progress-title{
  font-size:16px;
  font-weight:900;
}

.progress-count{
  font-size:14px;
  font-weight:800;
}

.progress-bar{
  height:9px;
  background:rgba(255,255,255,.28);
  border-radius:20px;
  overflow:hidden;
  margin-top:14px;
}

.progress-fill{
  width:0%;
  height:100%;
  background:white;
  border-radius:20px;
  transition:width .3s ease;
}


/* =========================
   SECTION TITLE
========================= */

.section-title{
  font-size:18px;
  font-weight:900;
  margin:0 0 13px;
}


/* =========================
   TASK LIST
========================= */

.task-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.task-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;

  padding:17px;

  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.task-card.completed{
  border-color:var(--green);
}

.task-top{
  display:flex;
  align-items:flex-start;
  gap:13px;
}

.task-icon{
  width:46px;
  height:46px;
  flex-shrink:0;

  border-radius:13px;
  background:var(--card2);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:25px;
}

.task-info{
  flex:1;
  min-width:0;
}

.task-subject{
  color:var(--purple);
  font-size:12px;
  font-weight:900;
  margin-bottom:5px;
  text-transform:uppercase;
}

.task-title{
  font-size:17px;
  font-weight:900;
  line-height:1.35;
}

.task-description{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  margin-top:6px;
}

.task-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:15px;
}

.task-type{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.task-btn{
  border:0;
  background:var(--purple);
  color:white;

  min-width:110px;

  padding:10px 14px;

  border-radius:10px;

  font-size:13px;
  font-weight:900;

  cursor:pointer;
}

.task-card.completed .task-btn{
  background:var(--green);
}

.completed-text{
  color:var(--green);
  font-weight:900;
}


/* =========================
   STATUS
========================= */

.status-box{
  text-align:center;
  padding:40px 15px;
  color:var(--muted);
}

.status-icon{
  font-size:38px;
  margin-bottom:10px;
}

.status-title{
  font-size:16px;
  color:var(--text);
  font-weight:900;
  margin-bottom:5px;
}

.status-text{
  font-size:13px;
  line-height:1.5;
}


/* =========================
   SCHEDULE PAGE
========================= */

.schedule-page{
  display:none;
}

.schedule-page.show{
  display:block;
}

.task-page.hide{
  display:none;
}

.back-btn{
  display:flex;
  align-items:center;
  gap:7px;

  border:0;
  background:transparent;

  color:var(--purple);

  font-size:14px;
  font-weight:900;

  padding:0;
  margin-bottom:20px;

  cursor:pointer;
}

.schedule-page-title{
  font-size:26px;
  font-weight:900;
  margin:0 0 6px;
}

.schedule-page-subtitle{
  color:var(--muted);
  font-size:14px;
  margin:0 0 20px;
}


/* =========================
   DAY LIST
========================= */

.day-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.day-card{
  width:100%;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  padding:16px;

  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;

  color:var(--text);
  text-align:left;

  cursor:pointer;

  box-shadow:0 4px 14px rgba(0,0,0,.05);
}

.day-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.day-number{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:var(--card2);

  color:var(--purple);

  font-size:13px;
  font-weight:900;
}

.day-name{
  font-size:16px;
  font-weight:900;
}

.today-label{
  color:var(--purple);
  font-size:12px;
  font-weight:900;
  margin-left:5px;
}

.day-arrow{
  color:var(--muted);
  font-size:21px;
}


/* =========================
   SCHEDULE MESSAGE
========================= */

.schedule-message-page{
  display:none;
}

.schedule-message-page.show{
  display:block;
}

.message-card{
  background:var(--card);

  border:1px solid var(--border);
  border-radius:17px;

  padding:19px;

  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.message-day{
  color:var(--purple);
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:6px;
}

.message-date{
  color:var(--muted);
  font-size:12px;
  margin-bottom:17px;
}

.message-content{
  color:var(--text);
  font-size:14px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}


/* =========================
   TASK DETAIL
========================= */

.task-detail-page{
  display:none;
}

.task-detail-page.show{
  display:block;
}

.task-detail-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:19px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.task-detail-subject{
  color:var(--purple);
  font-size:13px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:7px;
}

.task-detail-title{
  font-size:22px;
  font-weight:900;
  line-height:1.35;
  margin-bottom:9px;
}

.task-detail-type{
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  margin-bottom:18px;
}

.task-detail-content{
  color:var(--text);
  font-size:14px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
  margin-bottom:20px;
}

.detail-action{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  padding:11px 14px;
  margin-top:10px;

  border:0;
  border-radius:10px;

  background:var(--purple);
  color:white;

  text-decoration:none;

  font-size:13px;
  font-weight:900;
  cursor:pointer;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;

  height:67px;

  display:grid;
  grid-template-columns:repeat(4,1fr);

  background:#f0e8ff;
  border-top:1px solid #d9c9ef;
}

.bottom-nav a{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:3px;

  text-decoration:none;

  font-size:9px;
  font-weight:800;
}

.nav-icon{
  font-size:20px;
  line-height:1;
}

.bottom-nav small{
  font-size:9px;
  font-weight:800;
  color:#71697d;
}

.bottom-nav a.active small{
  color:#9b5cff;
}

:root[data-theme="dark"] .bottom-nav{
  background:#21142f;
  border-color:#3a2850;
}

:root[data-theme="dark"] .bottom-nav small{
  color:#aaa1b5;
}

:root[data-theme="dark"] .bottom-nav a.active small{
  color:#b487ff;
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

  .container{
    padding:20px 14px 25px;
  }

  .page-title{
    font-size:25px;
  }

  .task-card{
    padding:15px;
  }

  .task-title{
    font-size:16px;
  }

}

</style>

</head>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const taskPage =
document.getElementById("taskPage");

const schedulePage =
document.getElementById("schedulePage");

const scheduleMessagePage =
document.getElementById("scheduleMessagePage");

const taskDetailPage =
document.getElementById("taskDetailPage");

const taskList =
document.getElementById("taskList");

const dayList =
document.getElementById("dayList");

const messageCard =
document.getElementById("messageCard");

const taskDetailCard =
document.getElementById("taskDetailCard");

const progressCount =
document.getElementById("progressCount");

const progressFill =
document.getElementById("progressFill");


/* =========================
   DATE
========================= */

function getToday(){

  const date =
    new Date();

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1)
      .padStart(2,"0");

  const day =
    String(date.getDate())
      .padStart(2,"0");

  return `${year}-${month}-${day}`;

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(dateString){

  if(!dateString)
    return "";

  const date =
    new Date(dateString + "T00:00:00");

  return date.toLocaleDateString(
    "en-IN",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}


/* =========================
   COMPLETED TASKS
========================= */

function getCompletedTasks(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "ssc-edge-daily-completed"
      ) || "[]"
    );

  }catch(error){

    return [];

  }

}


function saveCompletedTasks(tasks){

  localStorage.setItem(
    "ssc-edge-daily-completed",
    JSON.stringify(tasks)
  );

}


/* =========================
   TASK ICON
========================= */

function getTaskIcon(type){

  const value =
    String(type || "").toLowerCase();

  if(
    value.includes("study") ||
    value.includes("content")
  )
    return "📚";

  if(
    value.includes("practice") ||
    value.includes("link")
  )
    return "📝";

  if(
    value.includes("test") ||
    value.includes("mock")
  )
    return "🎯";

  if(value.includes("pdf"))
    return "📄";

  return "🎯";

}


/* =========================================================
   DAILY TASKS
========================================================= */

let currentTasks = [];


async function loadTasks(){

  try{

    const today =
      getToday();

    const { data, error } =
      await supabaseClient
        .from("daily_tasks")
        .select("*")
        .eq("task_date", today)
        .eq("is_active", true)
        .order("task_order", {
          ascending:true
        });


    if(error){

      console.error(
        "Daily Tasks Error:",
        error
      );

      showTaskError();

      return;

    }


    currentTasks =
      data || [];

    renderTasks(currentTasks);

    updateProgress(currentTasks);

  }catch(error){

    console.error(error);

    showTaskError();

  }

}


function renderTasks(tasks){

  const completed =
    getCompletedTasks();

  taskList.innerHTML = "";


  if(!tasks || tasks.length === 0){

    taskList.innerHTML = `

      <div class="status-box">

        <div class="status-icon">
          🎉
        </div>

        <div class="status-title">
          No tasks for today
        </div>

        <div class="status-text">
          Currently no daily tasks are available.
          Check again later.
        </div>

      </div>

    `;

    return;

  }


  tasks.forEach(task => {

    const id =
      String(task.id);

    const isCompleted =
      completed.includes(id);


    const card =
      document.createElement("div");

    card.className =
      "task-card" +
      (isCompleted ? " completed" : "");


    card.innerHTML = `

      <div class="task-top">

        <div class="task-icon">
          ${getTaskIcon(
            task.target_type ||
            task.task_type
          )}
        </div>

        <div class="task-info">

          <div class="task-subject">
            ${escapeHtml(
              task.subject || "SSC"
            )}
          </div>

          <div class="task-title">
            ${escapeHtml(
              task.title || "Daily Task"
            )}
          </div>

          ${
            task.description
            ?
            `<div class="task-description">
              ${escapeHtml(
                task.description
              )}
            </div>`
            :
            ""
          }

        </div>

      </div>


      <div class="task-bottom">

        <span class="task-type">

          ${
            isCompleted
            ?
            `<span class="completed-text">
              ✓ Completed
            </span>`
            :
            escapeHtml(
              getDisplayTaskType(task)
            )
          }

        </span>


        <button
          class="task-btn"
          onclick="handleTask('${id}')">

          ${
            isCompleted
            ? "✓ Completed"
            : "Start Task"
          }

        </button>

      </div>

    `;


    taskList.appendChild(card);

  });

}


/* =========================
   DISPLAY TASK TYPE
========================= */

function getDisplayTaskType(task){

  const target =
    String(
      task.target_type || ""
    ).toLowerCase();

  if(target === "mock")
    return "Mock / Test";

  if(target === "content")
    return "Content";

  if(target === "pdf")
    return "PDF";

  if(target === "link")
    return "Link";

  return task.task_type || "Daily Task";

}


/* =========================================================
   HANDLE TASK
========================================================= */

function handleTask(id){

  const completed =
    getCompletedTasks();

  const task =
    currentTasks.find(
      item =>
        String(item.id) === String(id)
    );


  if(!task)
    return;


  /* =========================
     MARK COMPLETE
  ========================= */

  if(!completed.includes(String(id))){

    completed.push(String(id));

    saveCompletedTasks(completed);

  }


  updateProgress(currentTasks);

  renderTasks(currentTasks);


  /* =========================
     TARGET TYPE
  ========================= */

  const targetType =
    String(
      task.target_type || ""
    ).toLowerCase();


  /* =========================
     MOCK / TEST
  ========================= */

  if(
    targetType === "mock" ||
    targetType === "test"
  ){

    if(task.target_id){

      window.location.href =
        "test.html?id=" +
        encodeURIComponent(
          task.target_id
        );

      return;

    }


    if(task.task_url){

      window.location.href =
        task.task_url;

      return;

    }


    showTaskDetail(task);

    return;

  }


  /* =========================
     PDF
  ========================= */

  if(targetType === "pdf"){

    if(task.pdf_url){

      window.open(
        task.pdf_url,
        "_blank"
      );

      return;

    }


    if(task.task_url){

      window.open(
        task.task_url,
        "_blank"
      );

      return;

    }


    showTaskDetail(task);

    return;

  }


  /* =========================
     LINK
  ========================= */

  if(targetType === "link"){

    if(task.task_link){

      window.open(
        task.task_link,
        "_blank"
      );

      return;

    }


    if(task.task_url){

      window.open(
        task.task_url,
        "_blank"
      );

      return;

    }


    showTaskDetail(task);

    return;

  }


  /* =========================
     CONTENT
  ========================= */

  if(targetType === "content"){

    showTaskDetail(task);

    return;

  }


  /* =========================
     OLD TASK SUPPORT
  ========================= */

  if(task.task_url){

    window.location.href =
      task.task_url;

    return;

  }


  showTaskDetail(task);

}


/* =========================================================
   TASK DETAIL
========================================================= */

function showTaskDetail(task){

  taskPage.classList.add("hide");

  schedulePage.classList.remove("show");

  scheduleMessagePage.classList.remove("show");

  taskDetailPage.classList.add("show");


  const targetType =
    String(
      task.target_type || ""
    ).toLowerCase();


  let actionHtml = "";


  /* =========================
     PDF BUTTON
  ========================= */

  if(
    targetType === "pdf" &&
    task.pdf_url
  ){

    actionHtml = `

      <a
        class="detail-action"
        href="${escapeAttribute(
          task.pdf_url
        )}"
        target="_blank"
        rel="noopener">

        📄 Open PDF

      </a>

    `;

  }


  /* =========================
     LINK BUTTON
  ========================= */

  else if(
    targetType === "link" &&
    task.task_link
  ){

    actionHtml = `

      <a
        class="detail-action"
        href="${escapeAttribute(
          task.task_link
        )}"
        target="_blank"
        rel="noopener">

        🔗 Open Link

      </a>

    `;

  }


  /* =========================
     MOCK BUTTON
  ========================= */

  else if(
    (
      targetType === "mock" ||
      targetType === "test"
    ) &&
    task.target_id
  ){

    actionHtml = `

      <a
        class="detail-action"
        href="test.html?id=${encodeURIComponent(
          task.target_id
        )}">

        🎯 Start Mock / Test

      </a>

    `;

  }


  /* =========================
     OLD URL BUTTON
  ========================= */

  else if(task.task_url){

    actionHtml = `

      <a
        class="detail-action"
        href="${escapeAttribute(
          task.task_url
        )}">

        ▶ Open Task

      </a>

    `;

  }


  taskDetailCard.innerHTML = `

    <div class="task-detail-subject">

      ${escapeHtml(
        task.subject || "SSC"
      )}

    </div>


    <div class="task-detail-title">

      ${escapeHtml(
        task.title || "Daily Task"
      )}

    </div>


    <div class="task-detail-type">

      ${escapeHtml(
        getDisplayTaskType(task)
      )}

    </div>


    ${
      task.content
      ?
      `<div class="task-detail-content">
        ${escapeHtml(task.content)}
      </div>`
      :
      task.description
      ?
      `<div class="task-detail-content">
        ${escapeHtml(task.description)}
      </div>`
      :
      ""
    }


    ${actionHtml}

  `;


  window.scrollTo(0,0);

}


/* =========================
   CLOSE TASK DETAIL
========================= */

function closeTaskDetail(){

  taskDetailPage.classList.remove("show");

  schedulePage.classList.remove("show");

  scheduleMessagePage.classList.remove("show");

  taskPage.classList.remove("hide");

  window.scrollTo(0,0);

}


/* =========================
   PROGRESS
========================= */

function updateProgress(tasks){

  const total =
    tasks.length;

  const completed =
    getCompletedTasks();

  const completedCount =
    tasks.filter(
      task =>
        completed.includes(
          String(task.id)
        )
    ).length;


  progressCount.textContent =
    `${completedCount} / ${total} Tasks`;


  const percentage =
    total === 0
    ? 0
    : (completedCount / total) * 100;


  progressFill.style.width =
    `${percentage}%`;

}


/* =========================
   TASK ERROR
========================= */

function showTaskError(){

  taskList.innerHTML = `

    <div class="status-box">

      <div class="status-icon">
        ⚠️
      </div>

      <div class="status-title">
        Unable to load tasks
      </div>

      <div class="status-text">
        Please try again later.
      </div>

    </div>

  `;

}


/* =========================================================
   DAILY SCHEDULE
========================================================= */

let schedules = [];


async function loadSchedule(){

  try{

    const { data, error } =
      await supabaseClient
        .from("daily_schedules")
        .select("*")
        .eq("is_active", true)
        .order("day_number", {
          ascending:true
        });


    if(error){

      console.error(
        "Schedule Error:",
        error
      );

      showScheduleError();

      return;

    }


    schedules =
      data || [];

    renderSchedule(schedules);

  }catch(error){

    console.error(error);

    showScheduleError();

  }

}


function renderSchedule(data){

  dayList.innerHTML = "";


  if(!data || data.length === 0){

    dayList.innerHTML = `

      <div class="status-box">

        <div class="status-icon">
          📅
        </div>

        <div class="status-title">
          No schedule available
        </div>

        <div class="status-text">
          Daily schedules will appear here.
        </div>

      </div>

    `;

    return;

  }


  const today =
    getToday();


  data.forEach(schedule => {

    const isToday =
      schedule.schedule_date === today;


    const button =
      document.createElement("button");

    button.className =
      "day-card";


    button.onclick = function(){

      openScheduleMessage(
        schedule
      );

    };


    button.innerHTML = `

      <div class="day-left">

        <div class="day-number">

          DAY ${escapeHtml(
            schedule.day_number
          )}

        </div>

        <div>

          <div class="day-name">

            DAY ${escapeHtml(
              schedule.day_number
            )}

            ${
              isToday
              ?
              `<span class="today-label">
                (Today)
              </span>`
              :
              ""
            }

          </div>

        </div>

      </div>


      <div class="day-arrow">
        ›
      </div>

    `;


    dayList.appendChild(button);

  });

}


function showScheduleError(){

  dayList.innerHTML = `

    <div class="status-box">

      <div class="status-icon">
        ⚠️
      </div>

      <div class="status-title">
        Unable to load schedule
      </div>

      <div class="status-text">
        Please try again later.
      </div>

    </div>

  `;

}


/* =========================================================
   OPEN SCHEDULE
========================================================= */

function openSchedule(){

  taskPage.classList.add("hide");

  schedulePage.classList.add("show");

  scheduleMessagePage.classList.remove("show");

  taskDetailPage.classList.remove("show");

  loadSchedule();

  window.scrollTo(0,0);

}


/* =========================================================
   CLOSE SCHEDULE
========================================================= */

function closeSchedule(){

  schedulePage.classList.remove("show");

  scheduleMessagePage.classList.remove("show");

  taskDetailPage.classList.remove("show");

  taskPage.classList.remove("hide");

  window.scrollTo(0,0);

}


/* =========================================================
   OPEN DAY MESSAGE
========================================================= */

function openScheduleMessage(schedule){

  schedulePage.classList.remove("show");

  scheduleMessagePage.classList.add("show");

  taskDetailPage.classList.remove("show");


  const today =
    getToday();

  const isToday =
    schedule.schedule_date === today;


  messageCard.innerHTML = `

    <div class="message-day">

      DAY ${escapeHtml(
        schedule.day_number
      )}

      ${
        isToday
        ?
        `<span class="today-label">
          (Today)
        </span>`
        :
        ""
      }

    </div>


    <div class="message-date">

      ${formatDate(
        schedule.schedule_date
      )}

    </div>


    <div class="message-content">

      ${escapeHtml(
        schedule.message ||
        "No schedule message available."
      )}

    </div>

  `;


  window.scrollTo(0,0);

}


/* =========================================================
   CLOSE DAY MESSAGE
========================================================= */

function closeScheduleMessage(){

  scheduleMessagePage.classList.remove("show");

  schedulePage.classList.add("show");

  window.scrollTo(0,0);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   ESCAPE ATTRIBUTE
========================= */

function escapeAttribute(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =========================
   START
========================= */

loadTasks();

</script>
