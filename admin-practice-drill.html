<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script>
document.documentElement.dataset.theme =
  localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<title>SSC EDGE - Practice Drill Admin</title>

<link rel="stylesheet" href="css/style.css">

<style>
:root{
  --a-bg:#080811;
  --a-card:#11111d;
  --a-card2:#171727;
  --a-border:#292943;
  --a-text:#f5f5ff;
  --a-muted:#9b9bb5;
  --a-p:#8b5cf6;
  --a-p2:#a78bfa;
  --a-red:#ef4444;
}

:root[data-theme="light"]{
  --a-bg:#f5f6fb;
  --a-card:#fff;
  --a-card2:#f0f0f8;
  --a-border:#dcdceb;
  --a-text:#171725;
  --a-muted:#68687d;
  --a-p:#6d3ee8;
  --a-p2:#7c4dff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--a-bg);
  color:var(--a-text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.head{
  height:58px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 15px;
  background:var(--a-card);
  border-bottom:1px solid var(--a-border);
  position:sticky;
  top:0;
  z-index:5;
}

.back{
  width:36px;
  height:36px;
  border:1px solid var(--a-border);
  border-radius:10px;
  background:var(--a-card2);
  color:var(--a-text);
  font-size:20px;
}

.brand{
  font-weight:800;
}

.brand span{
  color:var(--a-p2);
}

.sub{
  margin-left:auto;
  color:var(--a-muted);
  font-size:11px;
}

.wrap{
  max-width:1100px;
  margin:auto;
  padding:14px;
}

.panel{
  background:var(--a-card);
  border:1px solid var(--a-border);
  border-radius:15px;
  padding:14px;
  margin-bottom:14px;
}

.headrow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
}

.headrow h2{
  font-size:16px;
  margin:0;
}

.muted{
  color:var(--a-muted);
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:9px;
}

.btn{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  font-size:12px;
  font-weight:800;
}

.primary{
  background:var(--a-p);
  color:#fff;
}

.secondary{
  background:var(--a-card2);
  color:var(--a-text);
  border:1px solid var(--a-border);
}

.danger{
  background:rgba(239,68,68,.15);
  color:#f87171;
  border:1px solid rgba(239,68,68,.3);
}

.exam,
.item,
.folder{
  border:1px solid var(--a-border);
  background:var(--a-card2);
  color:var(--a-text);
  border-radius:11px;
  padding:11px;
  text-align:left;
}

.exam.active,
.folder.active{
  border-color:var(--a-p);
  box-shadow:0 0 0 1px var(--a-p);
}

.exam small,
.item small,
.folder small{
  display:block;
  color:var(--a-muted);
  font-size:10px;
  margin-top:4px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.actions .btn{
  padding:7px 9px;
  font-size:11px;
}

.empty{
  color:var(--a-muted);
  text-align:center;
  padding:22px 10px;
  font-size:13px;
  border:1px dashed var(--a-border);
  border-radius:10px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:50;
}

.modal.show{
  display:flex;
}

.box{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--a-card);
  border:1px solid var(--a-border);
  border-radius:16px;
  padding:15px;
}

.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  color:var(--a-muted);
  font-size:11px;
  font-weight:700;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--a-border);
  background:var(--a-card2);
  color:var(--a-text);
  border-radius:9px;
  padding:10px;
  outline:none;
}

.field textarea{
  min-height:75px;
  resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--a-p);
}

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  background:#22222f;
  color:#fff;
  padding:11px 15px;
  border-radius:9px;
  display:none;
  z-index:100;
  font-size:12px;
  max-width:90%;
  text-align:center;
}

.toast.show{
  display:block;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){
  .form{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .sub{
    display:none;
  }

  .headrow{
    align-items:flex-start;
  }

  .actions .btn{
    font-size:10px;
    padding:7px 8px;
  }
}
</style>

</head>

<body>

<header class="head">
  <button class="back" onclick="location.href='admin.html'">‹</button>

  <div class="brand">
    SSC <span>EDGE</span>
  </div>

  <div class="sub">
    Practice Drill Manager
  </div>
</header>

<main class="wrap">

  <!-- EXAM IS HIDDEN INTENTIONALLY -->

  <section class="panel" id="subjectPanel">

    <div class="headrow">
      <div>
        <h2>Select Subject</h2>
        <div class="muted">
          Manage Practice Drill folders subject-wise.
        </div>
      </div>

      <span class="muted" id="authStatus">
        Checking admin...
      </span>
    </div>

    <div class="grid" id="subjectGrid">
      <div class="empty">Loading subjects...</div>
    </div>

  </section>


  <section class="panel hidden" id="folderPanel">

    <div class="headrow">

      <div>
        <h2 id="folderHeading">Practice Folders</h2>

        <div class="muted">
          Create CHAPTER_WISE PRACTICE or REVISION BOOSTER folders.
        </div>
      </div>

      <div class="actions">
        <button
          class="btn primary"
          onclick="openFolderModal()"
        >
          ＋ Folder
        </button>
      </div>

    </div>

    <div class="list" id="folderList"></div>

  </section>


  <section class="panel hidden" id="contentPanel">

    <div class="headrow">

      <div>
        <h2 id="contentTitle">Folder</h2>

        <div class="muted">
          Add child folders or mock tests inside this folder.
        </div>
      </div>

      <div class="actions">

        <button
          class="btn secondary"
          onclick="openChildFolderModal()"
        >
          ＋ Chapter/Child Folder
        </button>

        <button
          class="btn primary"
          onclick="openTestModal()"
        >
          ＋ Mock Test
        </button>

      </div>

    </div>

    <div class="list" id="childList"></div>

    <div style="height:12px"></div>

    <div class="list" id="testList"></div>

  </section>

</main>


<div class="modal" id="modal">

  <div class="box">

    <div class="headrow">
      <h2 id="modalTitle">Edit</h2>

      <button
        class="btn secondary"
        onclick="closeModal()"
      >
        ×
      </button>
    </div>

    <div id="modalBody"></div>

    <div
      class="actions"
      style="margin-top:14px"
    >

      <button
        class="btn secondary"
        onclick="closeModal()"
      >
        Cancel
      </button>

      <button
        class="btn primary"
        id="saveBtn"
      >
        Save
      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let exams = [];
let subjects = [];
let folders = [];
let tests = [];

let selectedExam = null;
let selectedSubject = null;
let selectedFolder = null;

let editing = null;
let mode = "";


const $ = id => document.getElementById(id);


function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function toast(message){

  $("toast").textContent = message;
  $("toast").classList.add("show");

  setTimeout(() => {
    $("toast").classList.remove("show");
  }, 2800);

}


function normalize(value){
  return String(value || "")
    .trim()
    .toUpperCase()
    .replaceAll("-","_")
    .replaceAll(" ","_");
}


async function checkAdmin(){

  const {
    data:{user}
  } = await db.auth.getUser();

  if(!user){
    location.href = "admin.html";
    return false;
  }

  const result = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if(result.error || !result.data){

    await db.auth.signOut();

    location.href = "admin.html";

    return false;
  }

  $("authStatus").textContent =
    "Admin verified";

  return true;
}


async function load(){

  if(!(await checkAdmin())) return;

  const [
    examResponse,
    subjectResponse,
    folderResponse,
    testResponse
  ] = await Promise.all([

    db
      .from("exams")
      .select("*")
      .order("name"),

    db
      .from("subjects")
      .select("*")
      .order("name"),

    db
      .from("mock_folders")
      .select("*")
      .order("sort_order")
      .order("name"),

    db
      .from("mock_tests")
      .select("*")
      .order("sort_order")
      .order("created_at",{ascending:false})

  ]);

  const error =
    examResponse.error ||
    subjectResponse.error ||
    folderResponse.error ||
    testResponse.error;

  if(error) throw error;

  exams = examResponse.data || [];
  subjects = subjectResponse.data || [];
  folders = folderResponse.data || [];
  tests = testResponse.data || [];


  /*
    Exam automatically selected.
    Exam selector is not shown in UI.
  */

  selectedExam =
    exams.find(e => e.is_active !== false) ||
    exams[0] ||
    null;


  renderSubjects();

}


function renderSubjects(){

  $("subjectGrid").innerHTML = subjects
    .map(subject => {

      const active =
        selectedSubject &&
        String(selectedSubject.id) === String(subject.id);

      return `
        <button
          class="exam ${active ? "active" : ""}"
          onclick="selectSubject('${subject.id}')"
        >
          ${esc(subject.name || subject.title)}

          <small>
            Manage Practice Drill
          </small>
        </button>
      `;

    })
    .join("") ||

    `<div class="empty">
      No subjects found.
    </div>`;

}


function selectSubject(subjectId){

  selectedSubject = subjects.find(
    subject =>
      String(subject.id) === String(subjectId)
  );

  selectedFolder = null;

  $("folderPanel").classList.remove("hidden");
  $("contentPanel").classList.add("hidden");

  $("folderHeading").textContent =
    `${selectedSubject.name} - Practice Folders`;

  renderSubjects();
  renderFolders();

}


function subjectFolders(){

  if(!selectedExam || !selectedSubject){
    return [];
  }

  return folders
    .filter(folder =>

      String(folder.exam_id) ===
      String(selectedExam.id)

      &&

      String(folder.subject_id || "") ===
      String(selectedSubject.id)

      &&

      !folder.parent_id

      &&

      folder.is_active !== false

    )
    .sort((a,b) =>
      Number(a.sort_order || 0) -
      Number(b.sort_order || 0)
    );

}


function renderFolders(){

  const list = subjectFolders();

  $("folderList").innerHTML = list
    .map(folder => {

      const active =
        selectedFolder &&
        String(selectedFolder.id) === String(folder.id);

      return `
        <div class="folder ${active ? "active" : ""}">

          <div class="row">

            <div
              onclick="selectFolder('${folder.id}')"
              style="flex:1;cursor:pointer"
            >
              <b>
                ${esc(folder.display_name || folder.name)}
              </b>

              <small>
                ${esc(folder.folder_type || "DRILL")}
                ·
                ${folder.is_active === false ? "Inactive" : "Active"}
              </small>
            </div>

            <div class="actions">

              <button
                class="btn secondary"
                onclick="moveFolder('${folder.id}',-1)"
              >
                ↑
              </button>

              <button
                class="btn secondary"
                onclick="moveFolder('${folder.id}',1)"
              >
                ↓
              </button>

              <button
                class="btn secondary"
                onclick="editFolder('${folder.id}')"
              >
                Edit
              </button>

              <button
                class="btn danger"
                onclick="deleteFolder('${folder.id}')"
              >
                Delete
              </button>

            </div>

          </div>

        </div>
      `;

    })
    .join("") ||

    `<div class="empty">
      No folders created for this subject.
    </div>`;

}


function selectFolder(folderId){

  selectedFolder = folders.find(
    folder =>
      String(folder.id) === String(folderId)
  );

  if(!selectedFolder) return;

  $("contentPanel").classList.remove("hidden");

  $("contentTitle").textContent =
    selectedFolder.display_name ||
    selectedFolder.name ||
    "Folder";

  renderFolders();
  renderContents();

  setTimeout(() => {
    $("contentPanel").scrollIntoView({
      behavior:"smooth",
      block:"start"
    });
  },100);

}


function childFolders(){

  if(!selectedFolder) return [];

  return folders
    .filter(folder =>
      String(folder.parent_id || "") ===
      String(selectedFolder.id)
    )
    .sort((a,b) =>
      Number(a.sort_order || 0) -
      Number(b.sort_order || 0)
    );

}


function practiceTestsInFolder(){

  if(!selectedFolder) return [];

  return tests
    .filter(test =>

      String(test.folder_id || "") ===
      String(selectedFolder.id)

      &&

      normalize(test.test_type) ===
      "PRACTICE_DRILL"

    )
    .sort((a,b) =>
      Number(a.sort_order || 0) -
      Number(b.sort_order || 0)
    );

}


function renderContents(){

  if(!selectedFolder) return;

  const children = childFolders();

  const folderTests = practiceTestsInFolder();


  $("childList").innerHTML = children
    .map(child => {

      return `
        <div class="item">

          <div class="row">

            <div>
              <b>
                📁 ${esc(child.display_name || child.name)}
              </b>

              <small>
                Child folder ·
                ${child.is_active === false ? "Inactive" : "Active"}
              </small>
            </div>

            <div class="actions">

              <button
                class="btn secondary"
                onclick="editChild('${child.id}')"
              >
                Edit
              </button>

              <button
                class="btn danger"
                onclick="deleteFolder('${child.id}')"
              >
                Delete
              </button>

            </div>

          </div>

        </div>
      `;

    })
    .join("") || "";


  $("testList").innerHTML = folderTests
    .map(test => {

      return `
        <div class="item">

          <div class="row">

            <div>
              <b>
                📝 ${esc(test.title)}
              </b>

              <small>
                ${test.duration_minutes || 0} min
                ·
                ${test.total_questions || 0} questions
                ·
                ${test.is_active === false ? "Inactive" : "Active"}
              </small>
            </div>

            <div class="actions">

              <button
                class="btn secondary"
                onclick="editTest('${test.id}')"
              >
                Edit
              </button>

              <button
                class="btn secondary"
                onclick="location.href='admin-mock.html?test_id=${encodeURIComponent(test.id)}'"
              >
                Questions
              </button>

              <button
                class="btn danger"
                onclick="deleteTest('${test.id}')"
              >
                Delete
              </button>

            </div>

          </div>

        </div>
      `;

    })
    .join("") ||

    `<div class="empty">
      No Practice Drill mock tests in this folder.
    </div>`;

}


function openFolderModal(){

  editing = null;
  mode = "folder";

  showModal(
    "Add Practice Folder",

    `
      <div class="form">

        <div class="field full">
          <label>Folder Name *</label>
          <input
            id="fName"
            placeholder="Example: Chapter Wise Practice"
          >
        </div>

        <div class="field">
          <label>Folder Type</label>

          <select id="fType">
            <option value="CHAPTER_WISE">
              Chapter Wise Practice
            </option>

            <option value="REVISION_BOOSTER">
              Revision Booster
            </option>
          </select>
        </div>

        <div class="field">
          <label>Active</label>

          <select id="fActive">
            <option value="true">Active</option>
            <option value="false">Inactive</option>
          </select>
        </div>

        <div class="field full">
          <label>Display Name</label>
          <input
            id="fDisplay"
            placeholder="Name visible to users"
          >
        </div>

      </div>
    `,

    saveFolder
  );

}


function openChildFolderModal(){

  if(!selectedFolder){
    return toast("Select a parent folder first");
  }

  editing = null;
  mode = "child";

  showModal(
    "Add Chapter / Child Folder",

    `
      <div class="form">

        <div class="field full">
          <label>Folder Name *</label>
          <input
            id="fName"
            placeholder="Example: Percentage"
          >
        </div>

        <div class="field full">
          <label>Display Name</label>
          <input
            id="fDisplay"
            placeholder="Name visible to users"
          >
        </div>

        <div class="field">
          <label>Active</label>

          <select id="fActive">
            <option value="true">Active</option>
            <option value="false">Inactive</option>
          </select>
        </div>

      </div>
    `,

    saveChild
  );

}


function editFolder(folderId){

  editing = folders.find(
    folder =>
      String(folder.id) === String(folderId)
  );

  if(!editing) return;

  mode = "folder";

  showModal(
    "Edit Practice Folder",

    `
      <div class="form">

        <div class="field full">
          <label>Folder Name *</label>
          <input
            id="fName"
            value="${esc(editing.name)}"
          >
        </div>

        <div class="field">
          <label>Folder Type</label>

          <select id="fType">

            <option
              value="CHAPTER_WISE"
              ${normalize(editing.folder_type) === "CHAPTER_WISE" ? "selected" : ""}
            >
              Chapter Wise Practice
            </option>

            <option
              value="REVISION_BOOSTER"
              ${normalize(editing.folder_type) === "REVISION_BOOSTER" ? "selected" : ""}
            >
              Revision Booster
            </option>

          </select>
        </div>

        <div class="field">
          <label>Active</label>

          <select id="fActive">

            <option
              value="true"
              ${editing.is_active !== false ? "selected" : ""}
            >
              Active
            </option>

            <option
              value="false"
              ${editing.is_active === false ? "selected" : ""}
            >
              Inactive
            </option>

          </select>
        </div>

        <div class="field full">
          <label>Display Name</label>
          <input
            id="fDisplay"
            value="${esc(editing.display_name || "")}"
          >
        </div>

      </div>
    `,

    saveFolder
  );

}


function editChild(folderId){

  editing = folders.find(
    folder =>
      String(folder.id) === String(folderId)
  );

  if(!editing) return;

  mode = "child";

  showModal(
    "Edit Child Folder",

    `
      <div class="form">

        <div class="field full">
          <label>Folder Name *</label>
          <input
            id="fName"
            value="${esc(editing.name)}"
          >
        </div>

        <div class="field full">
          <label>Display Name</label>
          <input
            id="fDisplay"
            value="${esc(editing.display_name || "")}"
          >
        </div>

        <div class="field">
          <label>Active</label>

          <select id="fActive">

            <option
              value="true"
              ${editing.is_active !== false ? "selected" : ""}
            >
              Active
            </option>

            <option
              value="false"
              ${editing.is_active === false ? "selected" : ""}
            >
              Inactive
            </option>

          </select>
        </div>

      </div>
    `,

    saveChild
  );

}


function openTestModal(){

  if(!selectedFolder){
    return toast("Select folder first");
  }

  editing = null;

  showModal(
    "Add Practice Drill Mock Test",
    testForm(),
    saveTest
  );

}


function editTest(testId){

  editing = tests.find(
    test =>
      String(test.id) === String(testId)
  );

  if(!editing) return;

  showModal(
    "Edit Practice Drill Mock Test",
    testForm(editing),
    saveTest
  );

}


function testForm(test = {}){

  return `

    <div class="form">

      <div class="field full">
        <label>Mock Test Title *</label>

        <input
          id="tTitle"
          value="${esc(test.title || "")}"
          placeholder="Example: Percentage Practice Set 01"
        >
      </div>

      <div class="field full">
        <label>Description</label>

        <textarea
          id="tDesc"
          placeholder="Short description"
        >${esc(test.description || "")}</textarea>
      </div>

      <div class="field">
        <label>Duration Minutes</label>

        <input
          id="tDuration"
          type="number"
          min="1"
          value="${test.duration_minutes ?? 15}"
        >
      </div>

      <div class="field">
        <label>Total Questions</label>

        <input
          id="tTotal"
          type="number"
          min="0"
          value="${test.total_questions ?? 0}"
        >
      </div>

      <div class="field">
        <label>Marks / Question</label>

        <input
          id="tMarks"
          type="number"
          step="0.01"
          value="${test.marks_per_question ?? 1}"
        >
      </div>

      <div class="field">
        <label>Negative Marks</label>

        <input
          id="tNeg"
          type="number"
          step="0.01"
          value="${test.negative_marks ?? 0}"
        >
      </div>

      <div class="field">
        <label>Active</label>

        <select id="tActive">

          <option
            value="true"
            ${test.is_active !== false ? "selected" : ""}
          >
            Active
          </option>

          <option
            value="false"
            ${test.is_active === false ? "selected" : ""}
          >
            Inactive
          </option>

        </select>
      </div>

    </div>

  `;

}


function showModal(title,body,saveFunction){

  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = body;

  $("modal").classList.add("show");

  $("saveBtn").onclick = saveFunction;

}


function closeModal(){

  $("modal").classList.remove("show");

}


async function saveFolder(){

  if(!selectedExam){
    return toast("Default exam not found");
  }

  if(!selectedSubject){
    return toast("Select subject first");
  }

  const name = $("fName").value.trim();

  if(!name){
    return toast("Folder name required");
  }

  const payload = {

    exam_id: selectedExam.id,

    subject_id: selectedSubject.id,

    name: name,

    display_name:
      $("fDisplay").value.trim() || null,

    folder_type:
      $("fType").value,

    sort_order:
      editing?.sort_order ?? 0,

    is_active:
      $("fActive").value === "true",

    parent_id:null

  };


  let result;

  if(editing){

    result = await db
      .from("mock_folders")
      .update(payload)
      .eq("id",editing.id);

  }else{

    result = await db
      .from("mock_folders")
      .insert(payload);

  }


  if(result.error){
    return toast(result.error.message);
  }

  closeModal();

  await reload();

  toast("Folder saved successfully");

}

async function saveTest(){

  if(!selectedExam){
    return toast("Default exam not found");
  }

  if(!selectedSubject){
    return toast("Select subject first");
  }

  if(!selectedFolder){
    return toast("Select folder first");
  }

  const title = $("tTitle").value.trim();

  if(!title){
    return toast("Mock test title required");
  }


  const payload = {

    exam_id:selectedExam.id,

    folder_id:selectedFolder.id,

    subject_id:selectedSubject.id,

    title:title,

    description:
      $("tDesc").value.trim() || null,

    /*
      IMPORTANT:
      This makes it a Practice Drill test.
      Normal mocks will not appear here.
    */

    test_type:"PRACTICE_DRILL",

    duration_minutes:
      Number($("tDuration").value) || 15,

    total_questions:
      Number($("tTotal").value) || 0,

    marks_per_question:
      Number($("tMarks").value) || 1,

    negative_marks:
      Number($("tNeg").value) || 0,

    is_active:
      $("tActive").value === "true",

    sort_order:
      editing?.sort_order ?? 0

  };


  let result;

  if(editing){

    result = await db
      .from("mock_tests")
      .update(payload)
      .eq("id",editing.id)
      .select()
      .single();

  }else{

    result = await db
      .from("mock_tests")
      .insert(payload)
      .select()
      .single();

  }


  if(result.error){
    return toast(result.error.message);
  }


  const savedTest = result.data;


  /*
    Create section automatically if not already present.
  */

  if(savedTest){

    const sectionCheck = await db
      .from("mock_test_sections")
      .select("id")
      .eq("mock_test_id",savedTest.id)
      .limit(1);


    if(
      !sectionCheck.error &&
      (!sectionCheck.data ||
       sectionCheck.data.length === 0)
    ){

      await db
        .from("mock_test_sections")
        .insert({

          mock_test_id:savedTest.id,

          subject_id:selectedSubject.id,

          section_name:selectedSubject.name,

          duration_minutes:
            Number($("tDuration").value) || 15,

          section_order:1

        });

    }

  }


  closeModal();

  await reload();

  toast(
    editing
      ? "Practice Drill mock updated"
      : "Practice Drill mock added"
  );

}


async function deleteFolder(folderId){

  if(!confirm(
    "Delete this folder? Child folders and tests may become inaccessible."
  )){
    return;
  }

  const result = await db
    .from("mock_folders")
    .delete()
    .eq("id",folderId);

  if(result.error){
    return toast(result.error.message);
  }

  if(
    selectedFolder &&
    String(selectedFolder.id) === String(folderId)
  ){

    selectedFolder = null;
    $("contentPanel").classList.add("hidden");

  }

  await reload();

  toast("Folder deleted");

}


async function deleteTest(testId){

  if(!confirm("Delete this Practice Drill mock test?")){
    return;
  }

  const result = await db
    .from("mock_tests")
    .delete()
    .eq("id",testId);

  if(result.error){
    return toast(result.error.message);
  }

  await reload();

  toast("Mock test deleted");

}


async function moveFolder(folderId,direction){

  const list = subjectFolders();

  const index = list.findIndex(
    folder =>
      String(folder.id) === String(folderId)
  );

  const nextIndex = index + direction;

  if(
    index < 0 ||
    nextIndex < 0 ||
    nextIndex >= list.length
  ){
    return;
  }

  const current = list[index];
  const next = list[nextIndex];


  await db
    .from("mock_folders")
    .update({
      sort_order:next.sort_order ?? nextIndex
    })
    .eq("id",current.id);


  await db
    .from("mock_folders")
    .update({
      sort_order:current.sort_order ?? index
    })
    .eq("id",next.id);


  await reload();

}


async function reload(){

  const [
    folderResponse,
    testResponse
  ] = await Promise.all([

    db
      .from("mock_folders")
      .select("*")
      .order("sort_order")
      .order("name"),

    db
      .from("mock_tests")
      .select("*")
      .order("sort_order")
      .order("created_at",{ascending:false})

  ]);


  if(folderResponse.error){
    return toast(folderResponse.error.message);
  }

  if(testResponse.error){
    return toast(testResponse.error.message);
  }


  folders = folderResponse.data || [];
  tests = testResponse.data || [];


  renderFolders();

  if(selectedFolder){

    selectedFolder = folders.find(
      folder =>
        String(folder.id) ===
        String(selectedFolder.id)
    );

    if(selectedFolder){
      renderContents();
    }else{
      $("contentPanel").classList.add("hidden");
    }

  }

}


load().catch(error => {

  $("authStatus").textContent = "Error";

  $("subjectGrid").innerHTML = `
    <div class="empty">
      ${esc(error.message)}
    </div>
  `;

});
