<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SSC EDGE - E-Books</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
--bg:#08050e;
--card:#171025;
--card2:#251344;
--purple:#7c3aed;
--text:#fff;
--muted:#aaa2b9;
--border:#302044;
}

:root[data-theme="light"]{
--bg:#f6f3fb;
--card:#fff;
--card2:#eee6fa;
--purple:#6d35d4;
--text:#17121e;
--muted:#706879;
--border:#ddd4e9;
}

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:16px;
padding:20px;
margin-bottom:20px;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin:7px 0 15px;
border-radius:10px;
border:1px solid var(--border);
background:var(--bg);
color:var(--text);
}

input[type="radio"]{
width:auto;
margin:0 6px 0 0;
}

input[type="file"]{
padding:10px;
}

textarea{
min-height:80px;
resize:vertical;
}

label{
font-size:14px;
font-weight:bold;
}

button{
border:0;
border-radius:10px;
padding:12px 16px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.primary{
background:var(--purple);
color:white;
width:100%;
}

.secondary{
background:var(--card2);
color:var(--text);
}

.danger{
background:#b42318;
color:white;
}

.source{
background:var(--card2);
padding:15px;
border-radius:12px;
margin-bottom:15px;
}

.status{
margin-top:12px;
color:var(--muted);
line-height:1.5;
}

.item{
padding:15px 0;
border-bottom:1px solid var(--border);
}

.item:last-child{
border-bottom:0;
}

.item-title{
font-size:17px;
font-weight:bold;
}

.item-meta{
font-size:13px;
color:var(--muted);
margin:5px 0 12px;
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.hidden{
display:none !important;
}

/* COVER PREVIEW */

.cover-preview{
width:100%;
aspect-ratio:16/9;
border-radius:12px;
overflow:hidden;
background:linear-gradient(
135deg,
#171225,
#30204f
);
border:1px solid var(--border);
display:flex;
align-items:center;
justify-content:center;
margin:-2px 0 15px;
}

.cover-preview img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.cover-placeholder{
text-align:center;
color:#fff;
padding:20px;
}

.cover-placeholder .icon{
font-size:40px;
margin-bottom:8px;
}

.cover-placeholder .logo{
font-size:24px;
font-weight:800;
letter-spacing:1px;
}

.cover-placeholder .text{
font-size:12px;
opacity:.75;
margin-top:5px;
}

/* BOOK LIST */

.book-item{
display:flex;
gap:13px;
align-items:flex-start;
}

.book-thumb{
width:105px;
height:70px;
border-radius:9px;
overflow:hidden;
background:linear-gradient(
135deg,
#171225,
#30204f
);
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
}

.book-thumb img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.thumb-fallback{
font-size:27px;
}

.book-details{
flex:1;
min-width:0;
}

@media(max-width:430px){

body{
padding:14px;
}

.card{
padding:16px;
}

.book-thumb{
width:88px;
height:62px;
}

}

</style>

</head>

<body>

<div class="container">

<button
class="secondary"
onclick="location.href='admin-study.html'">

← Back

</button>

<h1>📚 E-Book Management</h1>

<p>
Upload E-Books or use an external URL.
</p>


<div class="card">

<div class="source">

<label>
<input
type="radio"
name="source"
value="upload"
checked
onchange="changeSource()">

📁 Upload E-Book
</label>

<br><br>

<label>
<input
type="radio"
name="source"
value="url"
onchange="changeSource()">

🔗 E-Book URL
</label>

</div>


<label>Title</label>

<input
id="title"
placeholder="E-Book title"
>


<label>Subject</label>

<select id="subject">

<option value="">
Loading...
</option>

</select>


<label>Description</label>

<textarea
id="description"
placeholder="Description"
></textarea>


<label>Cover Image Upload</label>

<input
id="thumbnailFile"
type="file"
accept="image/*"
onchange="previewUploadedCover()"
>


<label>Or Cover Image URL</label>

<input
id="thumbnailUrl"
type="url"
placeholder="https://example.com/book-cover.jpg"
oninput="updateCoverPreview()"
>


<div class="cover-preview" id="coverPreview">

<div class="cover-placeholder">

<div class="icon">📚</div>

<div class="logo">SSC EDGE</div>

<div class="text">
Learn • Practice • Improve
</div>

</div>

</div>


<div id="uploadBox">

<label>E-Book File</label>

<input
id="file"
type="file"
accept=".pdf,.epub,.mobi"
>

</div>


<div id="urlBox" class="hidden">

<label>E-Book URL</label>

<input
id="url"
placeholder="https://example.com/book.pdf"
>

</div>


<button
id="saveBtn"
class="primary"
onclick="saveBook()">

Save E-Book

</button>

<div
id="status"
class="status"
></div>

</div>


<div class="card">

<h2>Existing E-Books</h2>

<div id="books">
Loading...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let editingId = null;
let editingOldUrl = null;
let editingOldThumbnailUrl = null;
let editingOldThumbnailPath = null;


/* ADMIN CHECK */

async function checkAdmin(){

const {
data:{user}
} = await db.auth.getUser();

if(!user){

location.href = "admin.html";

return false;

}

const {
data,
error
} = await db

.from("admin_users")

.select("user_id")

.eq("user_id",user.id)

.maybeSingle();

if(error || !data){

await db.auth.signOut();

location.href = "admin.html";

return false;

}

return true;

}


/* ESCAPE HTML */

function escapeHtml(value){

return String(value ?? "")

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* SAFE JS STRING */

function safeJs(value){

return encodeURIComponent(
String(value ?? "")
);

}


/* LOAD SUBJECTS */

async function loadSubjects(){

const {
data,
error
} = await db

.from("subjects")

.select("id,name")

.eq("is_active",true)

.order("name");

if(error){

document.getElementById("subject").innerHTML =
"<option value=''>Unable to load</option>";

return;

}

document.getElementById("subject").innerHTML =

"<option value=''>Select Subject</option>" +

(data || []).map(x =>

`<option value="${escapeHtml(x.id)}">
${escapeHtml(x.name)}
</option>`

).join("");

}


/* CHANGE SOURCE */

function changeSource(){

const source =
document.querySelector(
'input[name="source"]:checked'
).value;

document.getElementById("uploadBox")
.classList.toggle(
"hidden",
source !== "upload"
);

document.getElementById("urlBox")
.classList.toggle(
"hidden",
source !== "url"
);

}


/* COVER PLACEHOLDER */

function coverPlaceholder(){

return `

<div class="cover-placeholder">

<div class="icon">📚</div>

<div class="logo">SSC EDGE</div>

<div class="text">
Learn • Practice • Improve
</div>

</div>

`;

}


/* SHOW COVER IMAGE */

function showCoverImage(url){

const preview =
document.getElementById("coverPreview");

if(!url){

preview.innerHTML =
coverPlaceholder();

return;

}

preview.innerHTML = "";

const img =
document.createElement("img");

img.src = url;
img.alt = "Cover Preview";

img.onerror = function(){

preview.innerHTML =
coverPlaceholder();

};

preview.appendChild(img);

}


/* URL PREVIEW */

function updateCoverPreview(){

const file =
document.getElementById("thumbnailFile")
.files[0];

if(file){

return;

}

const url =
document.getElementById("thumbnailUrl")
.value.trim();

showCoverImage(url);

}


/* UPLOADED COVER PREVIEW */

function previewUploadedCover(){

const file =
document.getElementById("thumbnailFile")
.files[0];

if(!file){

updateCoverPreview();

return;

}

if(!file.type.startsWith("image/")){

alert("Please select a valid image file.");

document.getElementById("thumbnailFile")
.value = "";

updateCoverPreview();

return;

}

const objectUrl =
URL.createObjectURL(file);

showCoverImage(objectUrl);

}


/* GET STORAGE PATH */

function getStoragePath(publicUrl,bucket){

if(!publicUrl || !bucket){

return null;

}

const marker =
"/storage/v1/object/public/" +
bucket +
"/";

if(!publicUrl.includes(marker)){

return null;

}

return publicUrl.split(marker)[1] || null;

}


/* UPLOAD E-BOOK FILE */

async function uploadBookFile(file){

const ext =
file.name
.split(".")
.pop()
.toLowerCase();

const path =
"ebooks/" +
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
"." +
ext;

const {
error
} = await db.storage

.from("ssc-edge-ebooks")

.upload(
path,
file,
{
upsert:false
}
);

if(error) throw error;

const {
data
} = db.storage

.from("ssc-edge-ebooks")

.getPublicUrl(path);

return data.publicUrl;

}


/* UPLOAD COVER IMAGE */

async function uploadCoverImage(file){

const ext =
file.name
.split(".")
.pop()
.toLowerCase();

const path =
"thumbnails/" +
Date.now() +
"-" +
Math.random()
.toString(36)
.substring(2) +
"." +
ext;

const {
error
} = await db.storage

.from("ssc-edge-ebooks")

.upload(
path,
file,
{
upsert:false,
contentType:file.type
}
);

if(error) throw error;

const {
data
} = db.storage

.from("ssc-edge-ebooks")

.getPublicUrl(path);

return {
url:data.publicUrl,
path:path
};

}


/* SAVE BOOK */

async function saveBook(){

const title =
document.getElementById("title")
.value.trim();

const subject =
document.getElementById("subject")
.value;

const description =
document.getElementById("description")
.value.trim();

const thumbnailUrl =
document.getElementById("thumbnailUrl")
.value.trim();

const thumbnailFile =
document.getElementById("thumbnailFile")
.files[0];

const source =
document.querySelector(
'input[name="source"]:checked'
).value;

const file =
document.getElementById("file")
.files[0];

const url =
document.getElementById("url")
.value.trim();

const status =
document.getElementById("status");

const saveBtn =
document.getElementById("saveBtn");


if(!title || !subject){

status.textContent =
"Please enter title and select subject.";

return;

}

if(
!editingId &&
source === "upload" &&
!file
){

status.textContent =
"Please select an E-Book file.";

return;

}

if(
source === "url" &&
!url
){

status.textContent =
"Please enter the E-Book URL.";

return;

}

status.textContent = "Saving...";
saveBtn.disabled = true;

let uploadedBookUrl = null;
let uploadedCoverUrl = null;
let uploadedCoverPath = null;

try{

let finalUrl = url;
let finalThumbnailUrl = thumbnailUrl;


/* UPLOAD BOOK */

if(
source === "upload" &&
file
){

finalUrl =
await uploadBookFile(file);

uploadedBookUrl = finalUrl;

}


/* UPLOAD COVER IMAGE */

if(thumbnailFile){

const cover =
await uploadCoverImage(thumbnailFile);

finalThumbnailUrl =
cover.url;

uploadedCoverUrl =
cover.url;

uploadedCoverPath =
cover.path;

}


/* UPDATE */

if(editingId){

const {
error
} = await db

.from("study_material")

.update({

subject_id:Number(subject),

title:title,

description:description,

material_type:"EBOOK",

file_url:finalUrl,

thumbnail_url:
finalThumbnailUrl || null,

is_active:true

})

.eq("id",editingId);

if(error) throw error;


/* DELETE OLD BOOK FILE ONLY IF NEW FILE UPLOADED */

if(
uploadedBookUrl &&
editingOldUrl
){

const oldBookPath =
getStoragePath(
editingOldUrl,
"ssc-edge-ebooks"
);

if(oldBookPath){

await db.storage

.from("ssc-edge-ebooks")

.remove([oldBookPath]);

}

}


/* DELETE OLD COVER IF NEW COVER UPLOADED */

if(
uploadedCoverUrl &&
editingOldThumbnailPath
){

await db.storage

.from("ssc-edge-ebooks")

.remove([
editingOldThumbnailPath
]);

}

status.textContent =
"E-Book updated successfully.";

}else{


/* INSERT */

const {
error
} = await db

.from("study_material")

.insert({

subject_id:Number(subject),

title:title,

description:description,

material_type:"EBOOK",

file_url:finalUrl,

thumbnail_url:
finalThumbnailUrl || null,

is_active:true

});

if(error) throw error;

status.textContent =
"E-Book added successfully.";

}

resetForm();

await loadBooks();

}catch(error){

console.error(error);

status.textContent =
"Error: " +
(
error.message ||
"Unable to save E-Book."
);

}

saveBtn.disabled = false;

}


/* LOAD BOOKS */

async function loadBooks(){

const box =
document.getElementById("books");

const {
data,
error
} = await db

.from("study_material")

.select(`

id,
title,
description,
file_url,
thumbnail_url,
subject_id,
created_at,
subjects(name)

`)

.eq("material_type","EBOOK")

.eq("is_active",true)

.order(
"created_at",
{
ascending:false
}
);

if(error){

console.error(error);

box.textContent =
"Unable to load E-Books.";

return;

}

if(!data || !data.length){

box.textContent =
"No E-Books added yet.";

return;

}

box.innerHTML = data.map(book => {

const thumb =
book.thumbnail_url || "";

const thumbHtml = thumb

? `

<img
src="${escapeHtml(thumb)}"
alt="Book Cover"
onerror="this.parentElement.innerHTML =
'<div class=&quot;thumb-fallback&quot;>📚</div>'"
>

`

: `

<div class="thumb-fallback">
📚
</div>

`;

return `

<div class="item">

<div class="book-item">

<div class="book-thumb">

${thumbHtml}

</div>


<div class="book-details">

<div class="item-title">
${escapeHtml(book.title)}
</div>

<div class="item-meta">
${escapeHtml(
book.subjects?.name ||
"No subject"
)}
</div>

<div class="actions">

<button
class="secondary"
onclick="openUrl(
'${safeJs(book.file_url)}'
)">

📖 Open

</button>

<button
class="secondary"
onclick="editBook(${Number(book.id)})">

✏️ Edit

</button>

<button
class="danger"
onclick="deleteBook(
${Number(book.id)},
'${safeJs(book.file_url)}',
'${safeJs(book.thumbnail_url || "")}'
)">

🗑 Delete

</button>

</div>

</div>

</div>

</div>

`;

}).join("");

}


/* OPEN BOOK */

function openUrl(encoded){

window.open(
decodeURIComponent(encoded),
"_blank"
);

}


/* EDIT BOOK */

async function editBook(id){

const {
data,
error
} = await db

.from("study_material")

.select("*")

.eq("id",id)

.single();

if(error){

alert(error.message);

return;

}

editingId = id;

editingOldUrl =
data.file_url || null;

editingOldThumbnailUrl =
data.thumbnail_url || null;

editingOldThumbnailPath =
getStoragePath(
editingOldThumbnailUrl,
"ssc-edge-ebooks"
);

document.getElementById("title")
.value =
data.title || "";

document.getElementById("description")
.value =
data.description || "";

document.getElementById("subject")
.value =
data.subject_id || "";

document.getElementById("thumbnailUrl")
.value =
data.thumbnail_url || "";

document.getElementById("thumbnailFile")
.value = "";

updateCoverPreview();

document.querySelector(
'input[name="source"][value="url"]'
).checked = true;

changeSource();

document.getElementById("url")
.value =
data.file_url || "";

document.getElementById("saveBtn")
.textContent =
"Update E-Book";

window.scrollTo({

top:0,

behavior:"smooth"

});

}


/* DELETE BOOK */

async function deleteBook(
id,
encodedUrl,
encodedThumbnail
){

if(
!confirm("Delete this E-Book?")
){

return;

}

const url =
decodeURIComponent(encodedUrl);

const thumbnail =
decodeURIComponent(encodedThumbnail);

const {
error
} = await db

.from("study_material")

.delete()

.eq("id",id);

if(error){

alert(error.message);

return;

}


/* DELETE BOOK FILE */

const bookPath =
getStoragePath(
url,
"ssc-edge-ebooks"
);

if(bookPath){

await db.storage

.from("ssc-edge-ebooks")

.remove([bookPath]);

}


/* DELETE COVER IMAGE */

const coverPath =
getStoragePath(
thumbnail,
"ssc-edge-ebooks"
);

if(coverPath){

await db.storage

.from("ssc-edge-ebooks")

.remove([coverPath]);

}

await loadBooks();

}


/* RESET FORM */

function resetForm(){

editingId = null;

editingOldUrl = null;

editingOldThumbnailUrl = null;

editingOldThumbnailPath = null;

document.getElementById("title")
.value = "";

document.getElementById("description")
.value = "";

document.getElementById("thumbnailUrl")
.value = "";

document.getElementById("thumbnailFile")
.value = "";

document.getElementById("url")
.value = "";

document.getElementById("file")
.value = "";

document.getElementById("subject")
.value = "";

document.querySelector(
'input[name="source"][value="upload"]'
).checked = true;

changeSource();

document.getElementById("saveBtn")
.textContent =
"Save E-Book";

document.getElementById("status")
.textContent = "";

document.getElementById("coverPreview")
.innerHTML =
coverPlaceholder();

}


/* INITIAL LOAD */

(async function(){

const ok =
await checkAdmin();

if(!ok) return;

await loadSubjects();

await loadBooks();

})();

</script>

</body>

</html>
