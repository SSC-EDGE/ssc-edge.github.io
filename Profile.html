<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SSC EDGE - Profile</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="top-header">

    <div>

        <h1>Profile</h1>

        <p>Your SSC EDGE progress</p>

    </div>

</header>


<!-- ================= PROFILE ================= -->

<main class="container">


    <section class="profile-box">

        <div class="profile-avatar">
            S
        </div>

        <h2>SSC EDGE Student</h2>

        <p>
            Keep learning. Keep improving.
        </p>

    </section>


    <!-- ================= STATS ================= -->

    <section class="stats">


        <div class="stat-card">

            <strong>0</strong>

            <span>
                Tests
            </span>

        </div>


        <div class="stat-card">

            <strong>0</strong>

            <span>
                Questions
            </span>

        </div>


        <div class="stat-card">

            <strong>0%</strong>

            <span>
                Accuracy
            </span>

        </div>


        <div class="stat-card">

            <strong>0</strong>

            <span>
                Streak
            </span>

        </div>


    </section>


    <!-- ================= PROGRESS ================= -->

    <section class="section">

        <div class="section-title">

            <h3>Your Progress</h3>

        </div>


        <div class="progress-card">

            <div class="progress-row">

                <span>
                    Study Material
                </span>

                <strong>
                    0%
                </strong>

            </div>


            <div class="progress-bar">

                <div class="progress-fill"></div>

            </div>

        </div>


        <div class="progress-card">

            <div class="progress-row">

                <span>
                    Practice
                </span>

                <strong>
                    0%
                </strong>

            </div>


            <div class="progress-bar">

                <div class="progress-fill"></div>

            </div>

        </div>


    </section>


    <!-- ================= PROFILE OPTIONS ================= -->

    <section class="section">


        <div class="profile-option">

            <span>⚙️</span>

            <div>

                <h4>Settings</h4>

                <p>
                    App preferences
                </p>

            </div>

            <span>›</span>

        </div>


        <div class="profile-option">

            <span>ℹ️</span>

            <div>

                <h4>About SSC EDGE</h4>

                <p>
                    Learn more about SSC EDGE
                </p>

            </div>

            <span>›</span>

        </div>


    </section>


</main>

</html>
