<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>SSC EDGE - GK</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet"
href="css/style.css">

<style>

.page{
max-width:850px;
margin:auto;
padding:20px 16px 100px;
}

.back{
color:var(--text);
text-decoration:none;
display:inline-block;
margin-bottom:20px;
}

.header h1{
margin:0 0 5px;
}

.header p{
color:var(--muted);
}

.pdf-card{
background:var(--card);
border:1px solid var(--border);
border-radius:16px;
padding:17px;
margin-bottom:14px;
}

.title{
font-size:18px;
font-weight:bold;
}

.description{
color:var(--muted);
font-size:14px;
margin:8px 0 14px;
line-height:1.5;
}

.open{
display:inline-block;
background:var(--purple);
color:white;
padding:11px 15px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.empty{
text-align:center;
padding:40px 15px;
color:var(--muted);
}

</style>

</head>

<body>

<div class="page">

<a href="study.html"
class="back">
← Back to Study Material
</a>


<div class="header">

<h1>🌍 General Knowledge</h1>

<p>Subject-wise Notes & PDFs</p>

</div>


<div id="pdfs">
Loading...
</div>

</div>


<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


async function load(){

const box=
document.getElementById("pdfs");


const {data:subject,error:subjectError}=
await db
.from("subjects")
.select("id")
.eq("name","GK")
.single();


if(subjectError || !subject){

box.innerHTML=
`<div class="empty">
Subject not found.
</div>`;

return;

}


const {data,error}=
await db
.from("study_material")
.select(`
id,
title,
description,
file_url
`)
.eq("material_type","PDF")
.eq("subject_id",subject.id)
.eq("is_active",true)
.order(
"created_at",
{ascending:false}
);


if(error){

box.innerHTML=
`<div class="empty">
Unable to load PDFs.
</div>`;

return;

}


if(!data.length){

box.innerHTML=
`<div class="empty">
No GK PDFs available yet.
</div>`;

return;

}


box.innerHTML=
data.map(pdf=>`

<div class="pdf-card">

<div class="title">
${escapeHtml(pdf.title)}
</div>

${
pdf.description
?
`<div class="description">
${escapeHtml(pdf.description)}
</div>`
:""
}

<a
class="open"
href="${escapeHtml(pdf.file_url)}"
target="_blank"
rel="noopener">

📄 Open PDF

</a>

</div>

`).join("");

}


function escapeHtml(value){

return String(value || "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


load();

</script>

</body>
</html>
