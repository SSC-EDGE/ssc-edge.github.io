<style>
:root{

body{

.card{

.card-title{

.stat-grid{

.green{

.red{

}

.breakdown{

.section-card{

.section-top{

.section-top-box{

.section-top-box:first-child{

}

.section-top-label{

.tabs-wrap{

}

.status{

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const params =
new URLSearchParams(location.search);

const mockTestId =
params.get("id");


let currentTest = null;
let currentUser = null;
let currentAttempt = null;

let sectionStats = [];
let selectedSectionIndex = 0;

let overallRank = null;
let totalAttemptedUsers = null;
let overallPercentile = null;


function $(id){
  return document.getElementById(id);
}


function num(value,fallback=0){

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


function formatScore(value){

  const n = Number(value);

  if(!Number.isFinite(n)){
    return "—";
  }

  return Number(n.toFixed(2)).toString();
}


function formatPercent(value){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){
    return "—";
  }

  return (
    Number(value)
      .toFixed(1)
      .replace(/\.0$/,"")
    + "%"
  );
}


function showError(message){

  $("loading").className =
    "status error";

  $("loading").textContent =
    message;
}


function openSolutions(){

  if(!mockTestId){
    return;
  }

  location.href =
    "solutions.html?id=" +
    encodeURIComponent(mockTestId);
}


/* =========================================================
   TEST
========================================================= */

async function loadTest(){

  const {data,error} =
    await supabaseClient
      .from("mock_tests")
      .select("*")
      .eq("id",mockTestId)
      .single();

  if(error) throw error;

  return data;
}


/* =========================================================
   CURRENT ATTEMPT
========================================================= */

async function loadLatestAttempt(userId){

  const {data,error}=await supabaseClient
    .from("test_attempts")
    .select("id,user_id,mock_test_id,started_at,completed_at,score,correct_answers,wrong_answers,unanswered,rank,percentile,sectional_data")
    .eq("mock_test_id",mockTestId)
    .eq("user_id",userId)
    .not("completed_at","is",null)
    .order("completed_at",{ascending:false})
    .limit(1)
    .maybeSingle();

  if(error) throw error;
  return data;

}


/* =========================================================
   ASSIGNMENTS
========================================================= */

async function loadAssignedQuestions(){

  const {data,error} =
    await supabaseClient
      .from("mock_test_questions")
      .select(
        "id,mock_test_id,question_id,section_id,question_order"
      )
      .eq("mock_test_id",mockTestId)
      .order("question_order",{ascending:true});

  if(error) throw error;

  return data || [];
}


/* =========================================================
   QUESTIONS
========================================================= */

async function loadQuestions(ids){

  if(!ids.length){
    return [];
  }

  const {data,error} =
    await supabaseClient
      .from("questions")
      .select(
        "id,question_text,marks,negative_marks,subject_id,chapter_id,section_id"
      )
      .in("id",ids);

  if(error) throw error;

  return data || [];
}


/* =========================================================
   OPTIONS
========================================================= */

async function loadOptions(ids){

  if(!ids.length){
    return [];
  }

  const {data,error} =
    await supabaseClient
      .from("question_options")
      .select(
        "id,question_id,option_label,is_correct"
      )
      .in("question_id",ids);

  if(error) throw error;

  return data || [];
}


/* =========================================================
   ANSWERS
========================================================= */

async function loadAnswers(attemptId){

  const {data,error} =
    await supabaseClient
      .from("user_answers")
      .select(
        "attempt_id,question_id,selected_option_id"
      )
      .eq("attempt_id",attemptId);

  if(error) throw error;

  return data || [];
}


/* =========================================================
   SECTIONS
========================================================= */

async function loadSections(){

  const {data,error} =
    await supabaseClient
      .from("mock_test_sections")
      .select(
        "id,mock_test_id,subject_id,section_order,duration_minutes"
      )
      .eq("mock_test_id",mockTestId)
      .order("section_order",{ascending:true});

  if(error) throw error;

  return data || [];
}


/* =========================================================
   SUBJECTS
========================================================= */

async function loadSubjects(ids){

  const uniqueIds =
    [...new Set(
      ids
        .filter(
          x =>
            x !== null &&
            x !== undefined &&
            x !== ""
        )
        .map(x => String(x))
    )];

  if(!uniqueIds.length){
    return [];
  }

  const {data,error} =
    await supabaseClient
      .from("subjects")
      .select("id,name")
      .in("id",uniqueIds);

  if(error) throw error;

  return data || [];
}


/* =========================================================
   CORRECT VALUE
========================================================= */

function isCorrectOption(option){

  return (
    option.is_correct === true ||
    option.is_correct === "true" ||
    option.is_correct === 1 ||
    option.is_correct === "1"
  );
}


/* =========================================================
   CALCULATE QUESTIONS
========================================================= */

function calculateResults(
  assignments,
  questions,
  options,
  answers,
  sections
){

  const questionMap =
    new Map();

  questions.forEach(q=>{
    questionMap.set(
      String(q.id),
      q
    );
  });


  const answerMap =
    new Map();

  answers.forEach(a=>{

    answerMap.set(
      String(a.question_id),
      a.selected_option_id
    );

  });


  const correctMap =
    new Map();

  options.forEach(option=>{

    if(isCorrectOption(option)){

      correctMap.set(
        String(option.question_id),
        String(option.id)
      );

    }

  });


  const sectionMap =
    new Map();

  sections.forEach(section=>{

    sectionMap.set(
      String(section.id),
      section
    );

  });


  const results = [];


  assignments.forEach(assignment=>{

    const question =
      questionMap.get(
        String(assignment.question_id)
      );

    if(!question){
      return;
    }


    const selected =
      answerMap.get(
        String(question.id)
      );


    const correctOption =
      correctMap.get(
        String(question.id)
      );


    const marks =
      num(
        question.marks,
        num(
          currentTest.marks_per_question,
          0
        )
      );


    const negative =
      num(
        question.negative_marks,
        num(
          currentTest.negative_marks,
          0
        )
      );


    let status =
      "unanswered";

    let earned = 0;


    const hasAnswer =
      selected !== null &&
      selected !== undefined &&
      String(selected) !== "";


    if(hasAnswer){

      if(
        correctOption !== undefined &&
        String(selected) === correctOption
      ){

        status = "correct";
        earned = marks;

      }else{

        status = "wrong";
        earned = -negative;

      }

    }


    let section =
      null;

    if(
      assignment.section_id !== null &&
      assignment.section_id !== undefined
    ){

      section =
        sectionMap.get(
          String(assignment.section_id)
        );

    }


    const subjectId =
      question.subject_id ??
      section?.subject_id ??
      null;


    results.push({

      question,
      assignment,
      section,
      subjectId,
      marks,
      negative,
      status,
      earned

    });

  });


  return results;
}


/* =========================================================
   SECTION STATS
========================================================= */

function buildSectionStats(
  results,
  subjects,
  sections
){

  const subjectMap =
    new Map();

  subjects.forEach(subject=>{

    subjectMap.set(
      String(subject.id),
      subject
    );

  });


  const statsMap =
    new Map();


  results.forEach(result=>{

    let key =
      result.subjectId;


    if(
      key === null ||
      key === undefined ||
      key === ""
    ){

      key =
        "__section__" +
        String(
          result.assignment.section_id ??
          "other"
        );

    }


    key =
      String(key);


    if(!statsMap.has(key)){

      const subject =
        result.subjectId !== null &&
        result.subjectId !== undefined
          ? subjectMap.get(
              String(result.subjectId)
            )
          : null;


      const section =
        result.section;


      statsMap.set(
        key,
        {

          key,

          subjectId:
            result.subjectId,

          name:
            subject?.name ||
            (
              section
                ? "Section " +
                  section.section_order
                : "Section"
            ),

          score:0,

          maxMarks:0,

          correct:0,

          incorrect:0,

          attempted:0,

          unanswered:0,

          percentile:null,

          order:
            section?.section_order ?? 9999

        }
      );

    }


    const stat =
      statsMap.get(key);


    stat.maxMarks +=
      result.marks;


    stat.score +=
      result.earned;


    if(result.status === "correct"){

      stat.correct++;
      stat.attempted++;

    }
    else if(result.status === "wrong"){

      stat.incorrect++;
      stat.attempted++;

    }
    else{

      stat.unanswered++;

    }

  });


  return [...statsMap.values()]
    .sort(
      (a,b)=>
        a.order - b.order
    );
}


/* =========================================================
   FETCH ALL ATTEMPTS
========================================================= */

async function loadAllCompletedAttempts(){

  let all = [];
  let from = 0;
  const pageSize = 1000;

  while(true){

    const {data,error} =
      await supabaseClient
        .from("test_attempts")
        .select(
          "id,user_id,score,completed_at,rank,percentile,sectional_data"
        )
        .eq("mock_test_id",mockTestId)
        .not("completed_at","is",null)
        .range(
          from,
          from + pageSize - 1
        );

    if(error){
      throw error;
    }

    if(!data || !data.length){
      break;
    }

    all =
      all.concat(data);

    if(data.length < pageSize){
      break;
    }

    from += pageSize;

  }

  return all;
}


/* =========================================================
   OVERALL RANK
========================================================= */

async function calculateOverallRank(){

  const attempts =
    await loadAllCompletedAttempts();


  if(!attempts.length){

    return {
      rank:null,
      totalUsers:null,
      percentile:null
    };

  }


  /*
    One best score per unique user.
  */

  const bestByUser =
    new Map();


  attempts.forEach(row=>{

    if(
      row.user_id === null ||
      row.user_id === undefined
    ){
      return;
    }


    const uid =
      String(row.user_id);


    const score =
      num(row.score,0);


    if(
      !bestByUser.has(uid) ||
      score >
      bestByUser.get(uid)
    ){

      bestByUser.set(
        uid,
        score
      );

    }

  });


  const scores =
    [...bestByUser.values()];


  const totalUsers =
    scores.length;


  if(!totalUsers){

    return {
      rank:null,
      totalUsers:null,
      percentile:null
    };

  }


  const myScore =
    num(
      currentAttempt.score,
      0
    );


  const higher =
    scores.filter(
      score =>
        score > myScore
    ).length;


  const lower =
    scores.filter(
      score =>
        score < myScore
    ).length;


  /*
    Competition rank.
  */

  const rank =
    higher + 1;


  /*
    Percentile.
  */

  const percentile =
    totalUsers > 1
      ? (
          lower /
          (totalUsers - 1)
        ) * 100
      : 100;


  return {

    rank,
    totalUsers,
    percentile

  };
}


/* =========================================================
   SECTION PERCENTILES
========================================================= */

async function calculateSectionPercentiles(){

  if(
    !sectionStats.length ||
    !currentAttempt
  ){
    return;
  }


  try{

    const attempts =
      await loadAllCompletedAttempts();


    if(!attempts.length){
      return;
    }


    const attemptIds =
      attempts.map(
        a => a.id
      );


    /*
      Supabase .in() can become too large,
      so load answers in chunks.
    */

    let allAnswers = [];


    for(
      let i=0;
      i<attemptIds.length;
      i+=500
    ){

      const batch =
        attemptIds.slice(
          i,
          i+500
        );


      const {
        data,
        error
      } =
        await supabaseClient
          .from("user_answers")
          .select(
            "attempt_id,question_id,selected_option_id"
          )
          .in(
            "attempt_id",
            batch
          );


      if(error){
        return;
      }


      if(data){
        allAnswers =
          allAnswers.concat(data);
      }

    }


    const assignments =
      await loadAssignedQuestions();


    const questionIds =
      assignments.map(
        a => a.question_id
      );


    const [
      questions,
      options,
      sections
    ] =
      await Promise.all([

        loadQuestions(questionIds),

        loadOptions(questionIds),

        loadSections()

      ]);


    const subjects =
      await loadSubjects([

        ...questions.map(
          q => q.subject_id
        ),

        ...sections.map(
          s => s.subject_id
        )

      ]);


    const scoreLists =
      new Map();


    attempts.forEach(attempt=>{

      const answers =
        allAnswers.filter(
          answer =>
            String(
              answer.attempt_id
            ) ===
            String(
              attempt.id
            )
        );


      const results =
        calculateResults(
          assignments,
          questions,
          options,
          answers,
          sections
        );


      const stats =
        buildSectionStats(
          results,
          subjects,
          sections
        );


      stats.forEach(stat=>{

        const key =
          stat.subjectId !== null &&
          stat.subjectId !== undefined
            ? String(stat.subjectId)
            : String(stat.key);


        if(!scoreLists.has(key)){
          scoreLists.set(key,[]);
        }


        scoreLists
          .get(key)
          .push(stat.score);

      });

    });


    sectionStats.forEach(current=>{

      const key =
        current.subjectId !== null &&
        current.subjectId !== undefined
          ? String(current.subjectId)
          : String(current.key);


      const scores =
        scoreLists.get(key);


      if(!scores || !scores.length){
        return;
      }


      const lower =
        scores.filter(
          score =>
            score < current.score
        ).length;


      current.percentile =
        scores.length > 1
          ? (
              lower /
              (scores.length - 1)
            ) * 100
          : 100;

    });


  }catch(error){

    console.log(
      "Section percentile unavailable:",
      error
    );

  }
}


/* =========================================================
   RENDER OVERALL
========================================================= */

function renderOverall(){

  /*
    Use actual saved attempt values.
  */

  const correct =
    num(
      currentAttempt.correct_answers,
      0
    );


  const wrong =
    num(
      currentAttempt.wrong_answers,
      0
    );


  const unanswered =
    num(
      currentAttempt.unanswered,
      0
    );


  const attempted =
    correct +
    wrong;


  const accuracy =
    attempted > 0
      ? (
          correct /
          attempted
        ) * 100
      : null;


  /*
    IMPORTANT:
    Rank is displayed as Rank / Total Users.
  */

  if(
    overallRank !== null &&
    totalAttemptedUsers !== null
  ){

    $("rank").textContent =
      overallRank +
      " / " +
      totalAttemptedUsers;

  }else{

    $("rank").textContent =
      "—";

  }


  $("marks").textContent =
    formatScore(
      currentAttempt.score
    );


  $("attempted").textContent =
    attempted;


  $("correctWrong").innerHTML =
    '<span class="green">' +
    correct +
    '</span> / ' +
    '<span class="red">' +
    wrong +
    '</span>';


  $("accuracy").textContent =
    formatPercent(
      accuracy
    );


  $("percentile").textContent =
    formatPercent(
      overallPercentile
    );

}


/* =========================================================
   TABS
========================================================= */

function renderTabs(){

  const tabs=$("tabs");
  tabs.innerHTML="";

  const scoreButton=document.createElement("button");
  scoreButton.className="tab"+(selectedSectionIndex===0?" active":"");
  scoreButton.textContent="Score";
  scoreButton.onclick=()=>{selectedSectionIndex=0;renderTabs();renderSelectedSection()};
  tabs.appendChild(scoreButton);

  sectionStats.forEach((stat,index)=>{
    const button=document.createElement("button");
    button.className="tab"+(selectedSectionIndex===index+1?" active":"");
    button.textContent=stat.name;
    button.onclick=()=>{selectedSectionIndex=index+1;renderTabs();renderSelectedSection()};
    tabs.appendChild(button);
  });

}



/* =========================================================
   SELECTED SECTION
========================================================= */

function renderSelectedSection(){

  if(!sectionStats.length){
    $("sectionDetails").style.display="none";
    $("tabsWrap").style.display="none";
    $("noSections").style.display="block";
    return;
  }

  $("sectionDetails").style.display="grid";
  $("tabsWrap").style.display="block";
  $("noSections").style.display="none";

  const details=$("sectionDetails");

  if(selectedSectionIndex===0){
    details.innerHTML="";
    sectionStats.forEach(stat=>{
      const d=document.createElement("div");d.className="detail";
      d.innerHTML='<div class="detail-label">'+escapeHtml(stat.name)+' Score</div><div class="detail-value">'+formatScore(stat.score)+' / '+formatScore(stat.maxMarks)+'</div>';
      details.appendChild(d);
    });
    const total=sectionStats.reduce((a,b)=>a+Number(b.score||0),0);
    const max=sectionStats.reduce((a,b)=>a+Number(b.maxMarks||0),0);
    const d=document.createElement("div");d.className="detail";d.innerHTML='<div class="detail-label">Total Score</div><div class="detail-value">'+formatScore(total)+' / '+formatScore(max)+'</div>';details.appendChild(d);
    return;
  }

  const stat=sectionStats[selectedSectionIndex-1];
  if(!stat) return;
  details.innerHTML=''+
    '<div class="detail"><div class="detail-label">Score</div><div class="detail-value">'+formatScore(stat.score)+' / '+formatScore(stat.maxMarks)+'</div></div>'+
    '<div class="detail"><div class="detail-label">Section Percentile</div><div class="detail-value">'+formatPercent(stat.percentile)+'</div></div>'+
    '<div class="detail"><div class="detail-label">Correct</div><div class="detail-value green">'+stat.correct+'</div></div>'+
    '<div class="detail"><div class="detail-label">Incorrect</div><div class="detail-value red">'+stat.incorrect+'</div></div>';

}



/* =========================================================
   RENDER
========================================================= */

function render(){

  $("testName").textContent =
    currentTest.title ||
    "SSC EDGE Test";


  const testNumber =
    currentTest.test_number ??
    currentTest.test_no ??
    currentTest.number ??
    "—";


  $("testNo").textContent =
    "Test No. " +
    testNumber;


  renderOverall();

  renderTabs();

  renderSelectedSection();


  $("loading").style.display =
    "none";


  $("content").style.display =
    "block";

}


/* =========================================================
   INIT
========================================================= */

async function init(){

  try{

    if(!mockTestId){

      showError(
        "Invalid test. Test ID is missing."
      );

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getUser();


    if(
      error ||
      !data ||
      !data.user
    ){

      showError(
        "Please login to view your analysis."
      );

      return;

    }


    currentUser =
      data.user;


    currentTest =
      await loadTest();


    currentAttempt =
      await loadLatestAttempt(
        currentUser.id
      );


    if(!currentAttempt){

      showError(
        "No completed attempt found for this test."
      );

      return;

    }


    const assignments =
      await loadAssignedQuestions();


    const questionIds =
      assignments.map(
        a => a.question_id
      );


    const [
      questions,
      options,
      answers,
      sections
    ] =
      await Promise.all([

        loadQuestions(questionIds),

        loadOptions(questionIds),

        loadAnswers(
          currentAttempt.id
        ),

        loadSections()

      ]);


    const subjects =
      await loadSubjects([

        ...questions.map(
          q => q.subject_id
        ),

        ...sections.map(
          s => s.subject_id
        )

      ]);


    const results =
      calculateResults(
        assignments,
        questions,
        options,
        answers,
        sections
      );


    sectionStats =
      buildSectionStats(
        results,
        subjects,
        sections
      );


    /*
      Calculate rank.
    */

    const rankInfo =
      await calculateOverallRank();


    overallRank =
      rankInfo.rank;


    totalAttemptedUsers =
      rankInfo.totalUsers;


    overallPercentile =
      rankInfo.percentile;


    /*
      Calculate sectional percentiles.
    */

    await calculateSectionPercentiles();


    render();


  }catch(error){

    console.error(
      "Analysis error:",
      error
    );


    showError(
      "Unable to load analysis. Please try again."
    );

  }

}


init();

</script>
