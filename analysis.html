<style>
:root{

:root[data-theme="light"]{

*{

}

body{

.container{

/* TEST HEADER */

.test-head{

}

.test-title{

.test-name{

.test-no{

/* CARDS */

.card{

}

.card-title{
  font-size:17px;
  font-weight:800;
  margin-bottom:18px;
}

.stat-grid{

  grid-template-columns:1fr 1fr;
  gap:12px;
}

.stat{

  border:1px solid var(--border);
  border-radius:11px;
  padding:14px;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px;
}

.stat-value{
  font-size:20px;
  font-weight:800;
}

.small-value{

}

.subheading{
  margin:20px 0 10px;
  font-size:14px;
  font-weight:800;
}

.green{
  color:var(--green);
}

.red{
  color:var(--red);
}

/* SECTIONAL */

.breakdown{
  margin-top:18px;
}

.section-card{
  overflow:hidden;
}

.section-top{
  display:grid;
  grid-template-columns:1fr 1.25fr;
  border-bottom:1px solid var(--border);
  margin:-18px -18px 0;
}

.section-top-box{
  padding:15px;

.section-top-box:first-child{
  border-right:1px solid var(--border);
}

.section-top-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:6px;
}

.section-top-value{

  font-weight:800;

}

/* SLIDEABLE SUBJECT TABS */

.tabs-wrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}

.tabs-wrap::-webkit-scrollbar{
  display:none;
}

.tabs{

  gap:8px;
  padding:15px 0 12px;
  width:max-content;
}

.tab{
  border:1px solid var(--border);
  background:var(--card2);

  border-radius:20px;

.tab.active{

  border-color:var(--purple);

.detail{

.detail-label{

.detail-value{
  font-size:18px;
  font-weight:800;
}

.status{

  color:var(--muted);

.error{

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   TEST ID
========================================================= */

const params =
  new URLSearchParams(location.search);

const mockTestId =
  params.get("id");


/* =========================================================
   GLOBAL DATA
========================================================= */

let currentTest = null;
let currentUser = null;
let currentAttempt = null;

let sectionStats = [];

let selectedSectionIndex = 0;

let overallRank = null;
let overallPercentile = null;


/* =========================================================
   SHORT HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function num(value,fallback=0){

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


function formatScore(value){

  const n = Number(value);

  if(!Number.isFinite(n)){
    return "—";
  }

  return Number(
    n.toFixed(2)
  ).toString();
}


function formatPercent(value){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){
    return "—";
  }

  return (
    Number(value)
      .toFixed(1)
      .replace(/\.0$/,"")
    + "%"
  );
}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

  $("loading").className =
    "status error";

  $("loading").textContent =
    message;
}


/* =========================================================
   SOLUTIONS
========================================================= */

function openSolutions(){

  if(!mockTestId){
    return;
  }

  location.href =
    "solutions.html?id=" +
    encodeURIComponent(mockTestId);
}


/* =========================================================
   LOAD TEST
========================================================= */

async function loadTest(){

  const {data,error} =
    await supabaseClient
      .from("mock_tests")
      .select("*")
      .eq("id",mockTestId)
      .single();

  if(error){
    throw error;
  }

  return data;
}


/* =========================================================
   LOAD LATEST COMPLETED ATTEMPT
========================================================= */

async function loadLatestAttempt(userId){

  const {data,error} =
    await supabaseClient
      .from("test_attempts")
      .select("*")
      .eq("mock_test_id",mockTestId)
      .eq("user_id",userId)
      .not("completed_at","is",null)
      .order(
        "completed_at",
        {ascending:false}
      )
      .limit(1)
      .maybeSingle();

  if(error){
    throw error;
  }

  return data;
}


/* =========================================================
   LOAD ASSIGNED QUESTIONS
========================================================= */

async function loadAssignedQuestions(){

  const {data,error} =
    await supabaseClient
      .from("mock_test_questions")
      .select(
        "id,question_id,question_order,section_id"
      )
      .eq(
        "mock_test_id",
        mockTestId
      )
      .order(
        "question_order",
        {ascending:true}
      );

  if(error){
    throw error;
  }

  return data || [];
}


/* =========================================================
   LOAD QUESTIONS
========================================================= */

async function loadQuestions(ids){

  if(!ids.length){
    return [];
  }

  const {data,error} =
    await supabaseClient
      .from("questions")
      .select(
        "id,question_text,marks,negative_marks,subject_id,chapter_id,section_id"
      )
      .in("id",ids);

  if(error){
    throw error;
  }

  return data || [];
}


/* =========================================================
   LOAD OPTIONS
========================================================= */

async function loadOptions(ids){

  if(!ids.length){
    return [];
  }

  const {data,error} =
    await supabaseClient
      .from("question_options")
      .select(
        "id,question_id,is_correct"
      )
      .in("question_id",ids);

  if(error){
    throw error;
  }

  return data || [];
}


/* =========================================================
   LOAD USER ANSWERS
========================================================= */

async function loadAnswers(attemptId){

  const {data,error} =
    await supabaseClient
      .from("user_answers")
      .select(
        "question_id,selected_option_id"

      .eq(
        "attempt_id",
        attemptId
      );

  if(error){

/* =========================================================
   LOAD SECTIONS
========================================================= */

async function loadSections(){

  const {data,error} =
    await supabaseClient
      .from("mock_test_sections")

        "id,subject_id,section_order,duration_minutes"

/* =========================================================
   LOAD SUBJECTS
========================================================= */

async function loadSubjects(ids){

  const uniqueIds =
    [...new Set(
      ids.filter(Boolean)
    )];

  if(!uniqueIds.length){
    return [];
  }

  const {data,error} =
    await supabaseClient
      .from("subjects")
      .select("id,name")
      .in("id",uniqueIds);

  if(error){
    throw error;
  }

  return data || [];
}


/* =========================================================
   CALCULATE QUESTION RESULT
========================================================= */

function calculateResults(
  assignments,
  questions,
  options,
  answers,
  sections
){

  const questionMap =
    new Map(
      questions.map(q => [
        String(q.id),
        q
      ])
    );


  const answerMap =
    new Map(
      answers.map(a => [
        String(a.question_id),
        a.selected_option_id
      ])
    );


  const correctMap =
    new Map();


  for(const option of options){

    if(option.is_correct){

      correctMap.set(
        String(option.question_id),
        String(option.id)
      );

    }

  }


  const sectionMap =
    new Map(
      sections.map(s => [
        String(s.id),
        s
      ])
    );


  const results = [];


  for(const assignment of assignments){

    const question =
      questionMap.get(
        String(assignment.question_id)
      );


    if(!question){
      continue;
    }


    const selected =
      answerMap.get(
        String(question.id)
      );


    const correctOption =
      correctMap.get(
        String(question.id)
      );


    const marks =
      num(
        question.marks,
        num(
          currentTest.marks_per_question,
          2
        )
      );


    const negative =
      num(
        question.negative_marks,
        num(
          currentTest.negative_marks,
          0
        )
      );


    let status =
      "unanswered";

    let earned =
      0;


    if(
      selected !== null &&
      selected !== undefined &&
      selected !== ""
    ){

      if(
        correctOption !== undefined &&
        String(selected) === correctOption
      ){

        status =
          "correct";

        earned =
          marks;

      }else{

        status =
          "wrong";

        earned =
          -negative;

      }

    }


    const section =
      sectionMap.get(
        String(
          assignment.section_id
        )
      );


    /*
      IMPORTANT:
      Question subject_id is used first.
      If missing, section subject_id is used.
    */

    const subjectId =
      question.subject_id ??
      section?.subject_id ??
      null;


    results.push({

      question,
      assignment,
      section,
      subjectId,

      marks,
      negative,

      status,
      earned

    });

  }


  return results;
}


/* =========================================================
   BUILD SUBJECT STATS
========================================================= */

function buildSectionStats(
  results,
  subjects,
  sections
){

  const subjectMap =
    new Map(
      subjects.map(s => [
        String(s.id),
        s
      ])
    );


  const statsMap =
    new Map();


  for(const result of results){

    let key =
      result.subjectId;


    if(
      !key &&
      result.section
    ){

      key =
        result.section.subject_id;

    }


    /*
      Fallback for a question that has
      neither subject nor section subject.
    */

    if(!key){

      key =
        "__section__" +
        String(
          result.assignment.section_id ??
          "other"
        );

    }


    if(
      !statsMap.has(
        String(key)
      )
    ){

      const subject =
        subjectMap.get(
          String(result.subjectId)
        );


      const section =
        result.section ||
        sections.find(
          s =>
            String(s.id) ===
            String(
              result.assignment.section_id
            )
        );


      statsMap.set(
        String(key),
        {

          key:String(key),

          subjectId:
            result.subjectId,

          name:
            subject?.name ||
            (
              section
                ? "Section " +
                  (section.section_order ?? "")
                : "Section"
            ),

          score:0,

          maxMarks:0,

          correct:0,

          incorrect:0,

          attempted:0,

          unanswered:0,

          percentile:null

        }
      );

    }


    const stat =
      statsMap.get(
        String(key)
      );


    stat.maxMarks +=
      result.marks;


    stat.score +=
      result.earned;


    if(
      result.status === "correct"
    ){

      stat.correct++;
      stat.attempted++;

    }
    else if(
      result.status === "wrong"
    ){

      stat.incorrect++;
      stat.attempted++;

    }
    else{

      stat.unanswered++;

    }

  }


  /*
    Preserve admin section order.
  */

  const orderMap =
    new Map();


  sections.forEach(
    (section,index) => {

      if(
        section.subject_id !== null &&
        section.subject_id !== undefined
      ){

        orderMap.set(
          String(section.subject_id),
          index
        );

      }

    }
  );


  return [...statsMap.values()]
    .sort((a,b)=>{

      const ai =
        orderMap.has(
          String(a.subjectId)
        )
          ? orderMap.get(
              String(a.subjectId)
            )
          : 9999;


      const bi =
        orderMap.has(
          String(b.subjectId)
        )
          ? orderMap.get(
              String(b.subjectId)
            )
          : 9999;


      return ai - bi;

    });
}


/* =========================================================
   OVERALL RANK + PERCENTILE
========================================================= */

async function calculateOverallRank(){

  if(!currentAttempt){

    return {
      rank:null,
      percentile:null
    };

  }


  try{

    const {data,error} =
      await supabaseClient
        .from("test_attempts")
        .select(
          "user_id,score,completed_at"
        )
        .eq(
          "mock_test_id",
          mockTestId
        )
        .not(
          "completed_at",
          "is",
          null
        );


    /*
      RLS may prevent access to other users.
    */

    if(
      error ||
      !data ||
      !data.length
    ){

      return {
        rank:null,
        percentile:null
      };

    }


    /*
      Best score of every user.
    */

    const bestByUser =
      new Map();


    for(
      const row of data
    ){

      const uid =
        String(row.user_id);


      const score =
        num(row.score,0);


      if(
        !bestByUser.has(uid) ||
        score >
        bestByUser.get(uid)
      ){

        bestByUser.set(
          uid,
          score
        );

      }

    }


    const scores =
      [...bestByUser.values()];


    const myScore =
      num(
        currentAttempt.score,
        0
      );


    const higher =
      scores.filter(
        score =>
          score > myScore
      ).length;


    const lower =
      scores.filter(
        score =>
          score < myScore
      ).length;


    /*
      Competition rank:
      1 + number of users
      scoring higher.
    */

    const rank =
      higher + 1;


    /*
      Percentile:
      percentage of users
      scoring lower.
    */

    const percentile =
      scores.length
        ? (
            lower /
            scores.length
          ) * 100
        : null;


    return {
      rank,
      percentile
    };


  }catch(error){

    console.error(
      "Rank error:",
      error
    );


    return {
      rank:null,
      percentile:null
    };

  }
}


/* =========================================================
   SECTION PERCENTILE
========================================================= */

async function calculateSectionPercentiles(){

  if(
    !currentAttempt ||
    !sectionStats.length
  ){

    return;

  }


  try{

    /*
      First try to read all completed attempts.
    */

    const {
      data:attempts,
      error:attemptError
    } =
      await supabaseClient
        .from("test_attempts")
        .select(
          "id,user_id"
        )
        .eq(
          "mock_test_id",
          mockTestId
        )
        .not(
          "completed_at",
          "is",
          null
        );


    /*
      If RLS blocks this,
      simply keep percentile as —.
    */

    if(
      attemptError ||
      !attempts ||
      !attempts.length
    ){

      return;

    }


    const attemptIds =
      attempts.map(
        a => a.id
      );


    const {
      data:allAnswers,
      error:answerError
    } =
      await supabaseClient
        .from("user_answers")
        .select(
          "attempt_id,question_id,selected_option_id"
        )
        .in(
          "attempt_id",
          attemptIds
        );


    if(
      answerError ||
      !allAnswers
    ){

      return;

    }


    /*
      Load common test data once.
    */

    const assignments =
      await loadAssignedQuestions();


    const questionIds =
      assignments.map(
        a => a.question_id
      );


    const [
      questions,
      options,
      sections
    ] =
      await Promise.all([

        loadQuestions(
          questionIds
        ),

        loadOptions(
          questionIds
        ),

        loadSections()

      ]);


    const subjects =
      await loadSubjects(
        [
          ...questions.map(
            q => q.subject_id
          ),

          ...sections.map(
            s => s.subject_id
          )

        ]
      );


    /*
      Calculate sectional score
      for every completed attempt.
    */

    const allStats =
      new Map();


    for(
      const attempt of attempts
    ){

      const answers =
        allAnswers.filter(
          answer =>
            String(
              answer.attempt_id
            ) ===
            String(
              attempt.id
            )
        );


      const results =
        calculateResults(
          assignments,
          questions,
          options,
          answers,
          sections
        );


      const stats =
        buildSectionStats(
          results,
          subjects,
          sections
        );


      allStats.set(
        String(attempt.id),
        stats
      );

    }


    /*
      Calculate percentile
      subject by subject.
    */

    for(
      const current of sectionStats
    ){

      const scores = [];


      for(
        const stats of
        allStats.values()
      ){

        const found =
          stats.find(
            stat =>

              (
                stat.subjectId &&
                current.subjectId &&
                String(
                  stat.subjectId
                ) ===
                String(
                  current.subjectId
                )
              )

              ||

              String(stat.key) ===
              String(current.key)
          );


        if(found){

          scores.push(
            found.score
          );

        }

      }


      if(!scores.length){

        continue;

      }


      const lower =
        scores.filter(
          score =>
            score <
            current.score
        ).length;


      current.percentile =
        (
          lower /
          scores.length
        ) * 100;

    }


  }catch(error){

    /*
      Section percentile stays —
      if Supabase RLS does not allow
      reading other users' answers.
    */

    console.log(
      "Section percentile unavailable:",
      error
    );

  }
}


/* =========================================================
   RENDER OVERALL
========================================================= */

function renderOverall(){

  const correct =
    num(
      currentAttempt.correct_answers,
      0
    );


  const wrong =
    num(
      currentAttempt.wrong_answers,
      0
    );


  const attempted =
    correct +
    wrong;


  const accuracy =
    attempted > 0
      ? (
          correct /
          attempted
        ) * 100
      : null;


  $("rank").textContent =
    overallRank === null
      ? "—"
      : overallRank;


  $("marks").textContent =
    formatScore(
      currentAttempt.score
    );


  $("attempted").textContent =
    attempted;


  $("correctWrong").innerHTML =
    '<span class="green">' +
    correct +
    '</span> / ' +
    '<span class="red">' +
    wrong +
    '</span>';


  $("accuracy").textContent =
    formatPercent(
      accuracy
    );


  $("percentile").textContent =
    formatPercent(
      overallPercentile
    );
}


/* =========================================================
   RENDER SUBJECT TABS
========================================================= */

function renderTabs(){

  const tabs =
    $("tabs");


  tabs.innerHTML = "";


  sectionStats.forEach(
    (stat,index)=>{

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "tab" +
        (
          index ===
          selectedSectionIndex
            ? " active"
            : ""
        );


      button.textContent =
        stat.name;


      button.onclick =
        ()=>{

          selectedSectionIndex =
            index;


          renderTabs();

          renderSelectedSection();

        };


      tabs.appendChild(
        button
      );

    }
  );
}


/* =========================================================
   RENDER SELECTED SUBJECT
========================================================= */

function renderSelectedSection(){

  if(!sectionStats.length){

    $("sectionDetails").style.display =
      "none";

    $("tabsWrap").style.display =
      "none";

    $("noSections").style.display =
      "block";

    return;

  }


  $("sectionDetails").style.display =
    "grid";


  $("tabsWrap").style.display =
    "block";


  $("noSections").style.display =
    "none";


  const stat =
    sectionStats[
      selectedSectionIndex
    ];


  if(!stat){
    return;
  }


  $("sectionNameTop").textContent =
    stat.name;


  $("sectionScoreTop").textContent =
    formatScore(
      stat.score
    ) +
    " / " +
    formatScore(
      stat.maxMarks
    );


  $("sectionScore").textContent =
    formatScore(
      stat.score
    ) +
    " / " +
    formatScore(
      stat.maxMarks
    );


  $("sectionPercentile").textContent =
    formatPercent(
      stat.percentile
    );


  $("sectionCorrect").textContent =
    stat.correct;


  $("sectionIncorrect").textContent =
    stat.incorrect;
}


/* =========================================================
   FINAL RENDER
========================================================= */

function render(){

  $("testName").textContent =
    currentTest.title ||
    "SSC EDGE Test";


  /*
    Supports whichever test-number
    field exists in your mock_tests
    table.
  */

  const testNumber =
    currentTest.test_number ??
    currentTest.test_no ??
    currentTest.number ??
    "—";


  $("testNo").textContent =
    "Test No. " +
    testNumber;


  renderOverall();

  renderTabs();

  renderSelectedSection();


  $("loading").style.display =
    "none";


  $("content").style.display =
    "block";
}


/* =========================================================
   INITIALIZE
========================================================= */

async function init(){

  try{

    if(!mockTestId){

      showError(
        "Invalid test. Test ID is missing."
      );

      return;

    }


    /*
      LOGIN CHECK
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getUser();


    if(
      error ||
      !data ||
      !data.user
    ){

      showError(
        "Please login to view your analysis."
      );

      return;

    }


    currentUser =
      data.user;


    /*
      TEST
    */

    currentTest =
      await loadTest();


    /*
      LATEST COMPLETED ATTEMPT
    */

    currentAttempt =
      await loadLatestAttempt(
        currentUser.id
      );


    if(!currentAttempt){

      showError(
        "No completed attempt found for this test."
      );

      return;

    }


    /*
      ASSIGNMENTS
    */

    const assignments =
      await loadAssignedQuestions();


    const questionIds =
      assignments.map(
        a => a.question_id
      );


    /*
      Load all basic analysis data.
    */

    const [
      questions,
      options,
      answers,
      sections
    ] =
      await Promise.all([

        loadQuestions(
          questionIds
        ),

        loadOptions(
          questionIds
        ),

        loadAnswers(
          currentAttempt.id
        ),

        loadSections()

      ]);


    /*
      Subjects needed by questions
      and sections.
    */

    const subjectIds = [

      ...questions.map(
        q => q.subject_id
      ),

      ...sections.map(
        s => s.subject_id
      )

    ].filter(Boolean);


    const subjects =
      await loadSubjects(
        subjectIds
      );


    /*
      Calculate every question.
    */

    const results =
      calculateResults(
        assignments,
        questions,
        options,
        answers,
        sections
      );


    /*
      Calculate real subject-wise data.
    */

    sectionStats =
      buildSectionStats(
        results,
        subjects,
        sections
      );


    /*
      Overall rank + percentile.
    */

    const rankInfo =
      await calculateOverallRank();


    overallRank =
      rankInfo.rank;


    overallPercentile =
      rankInfo.percentile;


    /*
      Section percentile.
      Best effort because RLS may
      prevent access to other users.
    */

    await calculateSectionPercentiles();


    /*
      Display page.
    */

    render();


  }catch(error){

    console.error(
      "Analysis error:",
      error
    );


    showError(
      "Unable to load analysis. Please try again."
    );

  }

}


/* =========================================================
   START
========================================================= */

init();

</script>
