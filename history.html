<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Test History - SSC EDGE</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.simple-header{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:var(--header);
  border-bottom:1px solid var(--border);
}

.simple-header h2{
  margin:0;
  font-size:20px;
}

.page-container{
  max-width:600px;
  margin:auto;
  padding:22px 16px 100px;
}

.page-title{
  margin:0;
  font-size:24px;
}

.page-subtitle{
  margin:6px 0 22px;
  color:var(--muted);
  font-size:14px;
}

.history-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}

.test-name{
  font-size:16px;
  font-weight:bold;
  margin-bottom:5px;
}

.test-date{
  color:var(--muted);
  font-size:12px;
  margin-bottom:15px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:15px;
}

.stat{
  background:var(--card2);
  border-radius:9px;
  padding:9px 4px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:15px;
}

.stat span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
}

.score{
  font-size:14px;
  margin-bottom:12px;
}

.buttons{
  display:flex;
  gap:8px;
}

.btn{
  flex:1;
  padding:10px 6px;
  border-radius:9px;
  text-align:center;
  text-decoration:none;
  font-size:12px;
  cursor:pointer;
}

.analysis-btn{
  background:var(--purple);
  color:white;
}

.solution-btn{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
}

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
}

.empty-icon{
  font-size:40px;
  margin-bottom:10px;
}

.loading{
  text-align:center;
  color:var(--muted);
  padding:30px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:64px;
  background:var(--header);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom-nav a{
  text-decoration:none;
  color:var(--muted);
  font-size:11px;
  text-align:center;
}

.bottom-nav a.active{
  color:var(--purple2);
}

.nav-icon{
  font-size:20px;
  display:block;
  margin-bottom:2px;
}

@media(max-width:380px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

</style>
</head>

<body>

<header class="simple-header">
  <h2>SSC EDGE</h2>
</header>


<main class="page-container">

  <h1 class="page-title">
    Test History
  </h1>

  <p class="page-subtitle">
    View your attempted tests and results
  </p>

  <div id="historyList">

    <div class="loading">
      Loading test history...
    </div>

  </div>

</main>


<nav class="bottom-nav">

  <a href="home.html">
    <span class="nav-icon">🏠</span>
    Home
  </a>

  <a href="study.html">
    <span class="nav-icon">📚</span>
    Study Material
  </a>

  <a href="practice.html">
    <span class="nav-icon">📝</span>
    Practice
  </a>

  <a href="profile.html" class="active">
    <span class="nav-icon">👤</span>
    Profile
  </a>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;
}


/* =========================
   FORMAT DATE
========================= */

function formatDate(date){

  if(!date)return "Date unavailable";

  const d =
    new Date(date);

  if(isNaN(d.getTime()))
    return "Date unavailable";

  return d.toLocaleString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


/* =========================
   LOAD HISTORY
========================= */

async function loadHistory(){

  const list =
    document.getElementById("historyList");


  /* =========================
     GUEST CHECK
  ========================= */

  const isGuest =
    localStorage.getItem("ssc-edge-guest")
    === "true";


  if(isGuest){

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">📝</div>

        <strong>Login required</strong>

        <p>
          Login to save and view your
          test history across devices.
        </p>

      </div>

    `;

    return;
  }


  /* =========================
     GET USER
  ========================= */

  const {
    data:{user},
    error:userError
  } =
  await supabaseClient.auth.getUser();


  if(userError || !user){

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">🔐</div>

        <strong>Please login</strong>

        <p>
          Login to view your test history.
        </p>

      </div>

    `;

    return;
  }


  /* =========================
     GET ATTEMPTS
  ========================= */

  const {
    data:attempts,
    error:attemptError
  } =
  await supabaseClient
    .from("test_attempts")
    .select(`
      id,
      mock_test_id,
      started_at,
      completed_at,
      score,
      correct_answers,
      wrong_answers,
      unanswered
    `)
    .eq("user_id",user.id)
    .order("completed_at",{ascending:false});


  if(attemptError){

    console.error(attemptError);

    list.innerHTML = `

      <div class="empty">

        Unable to load test history.

      </div>

    `;

    return;
  }


  if(!attempts || attempts.length === 0){

    list.innerHTML = `

      <div class="empty">

        <div class="empty-icon">📝</div>

        <strong>No test attempts yet</strong>

        <p>
          Your completed mock tests will
          appear here.
        </p>

      </div>

    `;

    return;
  }


  /* =========================
     GET TEST IDs
  ========================= */

  const testIds =
    [
      ...new Set(
        attempts
          .map(a => a.mock_test_id)
          .filter(Boolean)
      )
    ];


  let tests = [];


  if(testIds.length){

    const {
      data,
      error
    } =
    await supabaseClient
      .from("mock_tests")
      .select("id,title")
      .in("id",testIds);


    if(!error && data){

      tests = data;

    }

  }


  /* =========================
     TEST NAME MAP
  ========================= */

  const testMap = {};

  tests.forEach(test=>{

    testMap[String(test.id)] =
      test.title;

  });


  /* =========================
     RENDER
  ========================= */

  list.innerHTML =
    attempts.map(attempt=>{

      const testName =
        testMap[
          String(attempt.mock_test_id)
        ]
        || "Mock Test";


      return `

        <div class="history-card">

          <div class="test-name">
            ${escapeHtml(testName)}
          </div>

          <div class="test-date">
            ${formatDate(
              attempt.completed_at
              || attempt.started_at
            )}
          </div>


          <div class="stats">

            <div class="stat">
              <strong>
                ${attempt.correct_answers ?? 0}
              </strong>
              <span>Correct</span>
            </div>

            <div class="stat">
              <strong>
                ${attempt.wrong_answers ?? 0}
              </strong>
              <span>Wrong</span>
            </div>

            <div class="stat">
              <strong>
                ${attempt.unanswered ?? 0}
              </strong>
              <span>Unanswered</span>
            </div>

            <div class="stat">
              <strong>
                ${attempt.score ?? 0}
              </strong>
              <span>Score</span>
            </div>

          </div>


          <div class="buttons">

            <a
              class="btn analysis-btn"
              href="analysis.html?attempt_id=${encodeURIComponent(attempt.id)}">
              View Analysis
            </a>

            <a
              class="btn solution-btn"
              href="solutions.html?test_id=${encodeURIComponent(attempt.mock_test_id)}">
              View Solutions
            </a>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   START
========================= */

loadHistory();

</script>

</body>
</html>
