<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<title>SSC EDGE - Practice Admin</title>

<link rel="stylesheet" href="css/style.css">

<style>

:root{
--bg:#080b14;
--card:#111827;
--card2:#151d2d;
--border:#263247;
--text:#f3f4f6;
--muted:#9ca3af;
--purple:#9b5cff;
--purple2:#7c3aed;
--green:#22c55e;
--red:#ef4444;
--yellow:#f59e0b;
--blue:#3b82f6;
}

:root[data-theme="light"]{
--bg:#f5f6fb;
--card:#ffffff;
--card2:#f0f1f7;
--border:#dfe2eb;
--text:#151827;
--muted:#667085;
--purple:#7c3aed;
--purple2:#6d28d9;
--green:#16a34a;
--red:#dc2626;
--yellow:#d97706;
--blue:#2563eb;
}

*{
box-sizing:border-box;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
}

button,
input,
select,
textarea{
font:inherit;
}

button{
cursor:pointer;
}

.app-header{
height:68px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
border-bottom:1px solid var(--border);
background:var(--card);
position:sticky;
top:0;
z-index:50;
}

.brand{
font-size:22px;
font-weight:800;
letter-spacing:.5px;
}

.brand span{
color:var(--purple);
}

.header-right{
display:flex;
align-items:center;
gap:9px;
}

.header-btn{
border:1px solid var(--border);
background:var(--card2);
color:var(--text);
border-radius:9px;
padding:9px 12px;
font-size:13px;
}

.header-btn:hover{
border-color:var(--purple);
}

.page{
max-width:1250px;
margin:auto;
padding:18px;
}

.page-title{
font-size:23px;
font-weight:800;
margin:0;
}

.page-subtitle{
color:var(--muted);
font-size:13px;
margin-top:5px;
}

.top-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
margin-bottom:18px;
}

.primary-btn{
border:0;
background:var(--purple);
color:#fff;
font-weight:700;
border-radius:9px;
padding:11px 15px;
}

.primary-btn:hover{
background:var(--purple2);
}

.secondary-btn{
border:1px solid var(--border);
background:var(--card2);
color:var(--text);
border-radius:9px;
padding:10px 14px;
}

.danger-btn{
border:1px solid rgba(239,68,68,.35);
background:rgba(239,68,68,.1);
color:var(--red);
border-radius:8px;
padding:8px 11px;
}

.small-btn{
border:1px solid var(--border);
background:var(--card2);
color:var(--text);
border-radius:7px;
padding:7px 9px;
font-size:12px;
}

.small-btn:hover,
.secondary-btn:hover{
border-color:var(--purple);
}

.admin-layout{
display:grid;
grid-template-columns:245px minmax(0,1fr);
gap:16px;
align-items:start;
}

.sidebar{
background:var(--card);
border:1px solid var(--border);
border-radius:13px;
padding:13px;
position:sticky;
top:84px;
}

.sidebar-title{
font-size:11px;
font-weight:800;
color:var(--muted);
text-transform:uppercase;
letter-spacing:1px;
padding:5px 8px 10px;
}

.exam-list{
display:flex;
flex-direction:column;
gap:6px;
}

.exam-item{
display:flex;
align-items:center;
justify-content:space-between;
gap:6px;
border:1px solid transparent;
border-radius:9px;
padding:10px;
background:transparent;
}

.exam-item:hover{
background:var(--card2);
}

.exam-item.active{
background:rgba(155,92,255,.14);
border-color:rgba(155,92,255,.4);
}

.exam-main{
display:flex;
align-items:center;
gap:8px;
min-width:0;
flex:1;
}

.exam-name{
font-size:13px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.exam-actions{
display:flex;
gap:3px;
}

.icon-btn{
width:25px;
height:25px;
border:1px solid var(--border);
background:var(--card2);
color:var(--muted);
border-radius:6px;
font-size:11px;
padding:0;
}

.icon-btn:hover{
color:var(--text);
border-color:var(--purple);
}

.content-card{
background:var(--card);
border:1px solid var(--border);
border-radius:13px;
padding:16px;
min-width:0;
}

.empty-state{
text-align:center;
padding:45px 20px;
color:var(--muted);
border:1px dashed var(--border);
border-radius:11px;
}

.empty-state strong{
display:block;
font-size:15px;
color:var(--text);
margin-bottom:7px;
}

.section-heading{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:13px;
}

.section-heading h2{
font-size:17px;
margin:0;
}

.section-heading p{
margin:4px 0 0;
font-size:12px;
color:var(--muted);
}

.exam-topbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
margin-bottom:16px;
}

.selected-exam-title{
font-size:19px;
font-weight:800;
}

.selected-exam-title small{
font-size:11px;
font-weight:500;
color:var(--muted);
display:block;
margin-top:4px;
}

.exam-tools{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.branch-grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:12px;
margin-top:15px;
}

.branch-card{
background:var(--card2);
border:1px solid var(--border);
border-radius:12px;
padding:18px;
min-height:110px;
display:flex;
flex-direction:column;
justify-content:space-between;
cursor:pointer;
transition:.15s;
}

.branch-card:hover{
border-color:var(--purple);
transform:translateY(-1px);
}

.branch-card h3{
margin:0;
font-size:15px;
}

.branch-card p{
margin:7px 0 0;
font-size:12px;
color:var(--muted);
line-height:1.4;
}

.branch-card.add-card{
border-style:dashed;
}

.branch-icon{
font-size:22px;
margin-bottom:10px;
}

.branch-toolbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin:15px 0;
flex-wrap:wrap;
}

.back-btn{
border:1px solid var(--border);
background:var(--card2);
color:var(--text);
border-radius:8px;
padding:8px 11px;
font-size:12px;
}

.breadcrumb{
font-size:13px;
color:var(--muted);
}

.breadcrumb b{
color:var(--text);
}

.category-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.category-card{
border:1px solid var(--border);
background:var(--card2);
border-radius:11px;
padding:16px;
cursor:pointer;
}

.category-card:hover{
border-color:var(--purple);
}

.category-card h3{
margin:0;
font-size:15px;
}

.category-card p{
margin:6px 0 0;
font-size:12px;
color:var(--muted);
}

.series-toolbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
margin-bottom:13px;
}

.series-list{
display:flex;
flex-direction:column;
gap:9px;
}

.series-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
background:var(--card2);
border:1px solid var(--border);
border-radius:10px;
padding:12px;
}

.series-info{
min-width:0;
}

.series-name{
font-size:14px;
font-weight:700;
}

.series-meta{
font-size:11px;
color:var(--muted);
margin-top:4px;
}

.series-actions{
display:flex;
gap:6px;
flex-wrap:wrap;
}

.year-grid{
display:flex;
flex-wrap:wrap;
gap:9px;
margin-top:12px;
}

.year-chip{
border:1px solid var(--border);
background:var(--card2);
color:var(--text);
border-radius:8px;
padding:10px 14px;
font-size:13px;
font-weight:700;
cursor:pointer;
}

.year-chip:hover{
border-color:var(--purple);
}

.year-chip.add-year{
border-style:dashed;
color:var(--purple);
}

.subject-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}

.subject-card{
border:1px solid var(--border);
background:var(--card2);
border-radius:10px;
padding:13px;
cursor:pointer;
}

.subject-card:hover{
border-color:var(--purple);
}

.subject-card h3{
font-size:14px;
margin:0;
}

.subject-card p{
font-size:11px;
color:var(--muted);
margin:5px 0 0;
}

.mock-list{
display:flex;
flex-direction:column;
gap:9px;
}

.mock-row{
border:1px solid var(--border);
background:var(--card2);
border-radius:10px;
padding:12px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
}

.mock-info{
min-width:0;
flex:1;
}

.mock-title{
font-size:14px;
font-weight:700;
word-break:break-word;
}

.mock-meta{
font-size:11px;
color:var(--muted);
margin-top:5px;
line-height:1.5;
}

.mock-actions{
display:flex;
gap:6px;
flex-wrap:wrap;
justify-content:flex-end;
}

.status-dot{
display:inline-block;
width:7px;
height:7px;
border-radius:50%;
margin-right:4px;
background:var(--green);
}

.status-dot.off{
background:var(--red);
}

.modal-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.68);
display:none;
align-items:center;
justify-content:center;
padding:15px;
z-index:100;
}

.modal-backdrop.show{
display:flex;
}

.modal{
width:min(650px,100%);
max-height:92vh;
overflow:auto;
background:var(--card);
border:1px solid var(--border);
border-radius:14px;
padding:18px;
box-shadow:0 20px 70px rgba(0,0,0,.35);
}

.modal.large{
width:min(850px,100%);
}

.modal-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-bottom:16px;
}

.modal-header h2{
font-size:18px;
margin:0;
}

.close-btn{
width:30px;
height:30px;
border:1px solid var(--border);
background:var(--card2);
color:var(--text);
border-radius:7px;
font-size:18px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.form-group{
display:flex;
flex-direction:column;
gap:6px;
}

.form-group.full{
grid-column:1/-1;
}

.form-group label{
font-size:12px;
font-weight:700;
color:var(--muted);
}

.form-group input,
.form-group select,
.form-group textarea{
width:100%;
border:1px solid var(--border);
background:var(--card2);
color:var(--text);
border-radius:8px;
padding:10px;
outline:none;
}

.form-group textarea{
min-height:80px;
resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
border-color:var(--purple);
}

.modal-footer{
display:flex;
justify-content:flex-end;
gap:8px;
margin-top:18px;
padding-top:14px;
border-top:1px solid var(--border);
}

.toggle-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
border:1px solid var(--border);
background:var(--card2);
border-radius:9px;
padding:11px;
}

.toggle-info strong{
display:block;
font-size:13px;
}

.toggle-info span{
display:block;
font-size:11px;
color:var(--muted);
margin-top:3px;
}

.switch{
position:relative;
width:42px;
height:23px;
flex:none;
}

.switch input{
display:none;
}

.slider{
position:absolute;
inset:0;
border-radius:20px;
background:#4b5563;
cursor:pointer;
transition:.2s;
}

.slider:before{
content:"";
position:absolute;
width:17px;
height:17px;
left:3px;
top:3px;
background:#fff;
border-radius:50%;
transition:.2s;
}

.switch input:checked + .slider{
background:var(--purple);
}

.switch input:checked + .slider:before{
transform:translateX(19px);
}

.section-box{
border:1px solid var(--border);
background:var(--card2);
border-radius:10px;
padding:12px;
margin-top:12px;
}

.section-box-header{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
margin-bottom:10px;
}

.section-box-header strong{
font-size:13px;
}

.section-list{
display:flex;
flex-direction:column;
gap:8px;
}

.section-item{
display:grid;
grid-template-columns:minmax(0,1fr) 120px 34px;
gap:7px;
align-items:center;
}

.section-item input{
width:100%;
border:1px solid var(--border);
background:var(--card);
color:var(--text);
border-radius:7px;
padding:8px;
font-size:12px;
}

.remove-section{
border:1px solid rgba(239,68,68,.3);
background:transparent;
color:var(--red);
border-radius:7px;
height:32px;
}

.notice{
padding:11px 12px;
border-radius:8px;
font-size:12px;
margin-bottom:13px;
line-height:1.5;
}

.notice.info{
background:rgba(59,130,246,.1);
border:1px solid rgba(59,130,246,.25);
color:#93c5fd;
}

.notice.warning{
background:rgba(245,158,11,.1);
border:1px solid rgba(245,158,11,.25);
color:#fcd34d;
}

.loading{
padding:30px;
text-align:center;
color:var(--muted);
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%) translateY(20px);
background:#111827;
color:#fff;
border:1px solid #374151;
padding:11px 16px;
border-radius:9px;
font-size:13px;
opacity:0;
pointer-events:none;
transition:.25s;
z-index:200;
max-width:90%;
text-align:center;
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

.toast.success{
border-color:var(--green);
}

.toast.error{
border-color:var(--red);
}

.hidden{
display:none!important;
}

@media(max-width:850px){

.admin-layout{
grid-template-columns:1fr;
}

.sidebar{
position:static;
}

.exam-list{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
}

.branch-grid{
grid-template-columns:repeat(2,minmax(0,1fr));
}

}

@media(max-width:560px){

.page{
padding:12px;
}

.app-header{
padding:0 12px;
}

.page-title{
font-size:20px;
}

.top-row{
align-items:flex-start;
flex-direction:column;
}

.exam-list{
grid-template-columns:1fr;
}

.branch-grid,
.category-grid,
.subject-grid{
grid-template-columns:1fr;
}

.form-grid{
grid-template-columns:1fr;
}

.form-group.full{
grid-column:auto;
}

.mock-row,
.series-row{
align-items:flex-start;
flex-direction:column;
}

.mock-actions,
.series-actions{
width:100%;
justify-content:flex-start;
}

.section-item{
grid-template-columns:minmax(0,1fr) 95px 32px;
}

}

</style>

<style>
.board-tab{width:auto!important;min-width:58px;padding:9px 14px!important;border:1px solid var(--border)!important;background:var(--card2)!important;color:var(--text)!important;border-radius:8px!important;cursor:pointer!important}
.board-tab.active{background:var(--purple)!important;color:#fff!important;border-color:var(--purple)!important}
</style>
</head>

<body>

<header class="app-header">

<div class="brand">
SSC <span>EDGE</span>
</div>

<div class="header-right">

<button class="header-btn" onclick="goHome()">
← Dashboard
</button>

<button class="header-btn" onclick="reloadData()">
↻ Refresh
</button>

</div>

</header>

<main class="page">

<div class="top-row">

<div>
<h1 class="page-title">Practice Admin</h1>
<div class="page-subtitle">
Manage exams, mock series, PYQ years, sectional tests and question sets
</div>
</div>

<button class="primary-btn" onclick="openExamModal()">
+ Add Exam
</button>

</div>

<div class="admin-layout">

<aside class="sidebar">

<div class="sidebar-title">Exams</div>

<div id="boardTabs" style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px;">
<button type="button" class="small-btn board-tab active" data-board="SSC" onclick="setActiveBoard('SSC')">SSC</button>
<button type="button" class="small-btn board-tab" data-board="RRB" onclick="setActiveBoard('RRB')">RRB</button>
</div>

<div id="examList" class="exam-list">
<div class="loading">Loading exams...</div>
</div>

</aside>

<section class="content-card">

<div id="workspace">

<div class="empty-state">

<strong>Select an exam</strong>

Select an exam from the left panel to manage its mocks and series.

</div>

</div>

</section>

</div>

</main>

<!-- EXAM MODAL -->

<div class="modal-backdrop" id="examModal">

<div class="modal">

<div class="modal-header">

<h2 id="examModalTitle">Add Exam</h2>

<button class="close-btn" onclick="closeModal('examModal')">
×
</button>

</div>

<div class="form-grid">

<div class="form-group full">

<label>Exam Name</label>

<input
id="examNameInput"
type="text"
placeholder="Example: SSC CGL"
/>

</div>

<div class="form-group">

<label>Board / Organization</label>

<input
id="examBoardInput"
type="text"
placeholder="Example: SSC"
/>

</div>

<div class="form-group">

<label>Exam Code</label>

<input
id="examCodeInput"
type="text"
placeholder="Example: CGL"
/>

</div>

<div class="form-group full">

<label>Description</label>

<textarea
id="examDescriptionInput"
placeholder="Optional exam description"
></textarea>

</div>

</div>

<div class="modal-footer">

<button class="secondary-btn" onclick="closeModal('examModal')">
Cancel
</button>

<button class="primary-btn" onclick="saveExam()">
Save Exam
</button>

</div>

</div>

</div>

<!-- STRUCTURE MODAL -->

<div class="modal-backdrop" id="structureModal">

<div class="modal">

<div class="modal-header">

<h2 id="structureModalTitle">Add Structure</h2>

<button class="close-btn" onclick="closeModal('structureModal')">
×
</button>

</div>

<div id="structureModalBody"></div>

<div class="modal-footer">

<button class="secondary-btn" onclick="closeModal('structureModal')">
Cancel
</button>

<button class="primary-btn" onclick="saveStructure()">
Save
</button>

</div>

</div>

</div>

<!-- MOCK MODAL -->

<div class="modal-backdrop" id="mockModal">

<div class="modal large">

<div class="modal-header">

<h2 id="mockModalTitle">Add Mock</h2>

<button class="close-btn" onclick="closeModal('mockModal')">
×
</button>

</div>

<div id="mockModalBody"></div>

<div class="modal-footer">

<button class="secondary-btn" onclick="closeModal('mockModal')">
Cancel
</button>

<button class="primary-btn" onclick="saveMock()">
Save Mock
</button>

</div>

</div>

</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SSC EDGE PRACTICE ADMIN
   PART 2 - DATABASE, EXAMS, BRANCHES, SERIES, YEARS
========================================================= */

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

/* =========================
   GLOBAL STATE
========================= */

let exams = [];
let subjects = [];
let folders = [];
let tests = [];

let activeBoard = "SSC";
let selectedExam = null;

let selectedBranch = null;
let selectedCategory = null;
let selectedSubject = null;
let selectedYear = null;
let selectedFolder = null;

let editingExamId = null;
let editingFolderId = null;
let editingMockId = null;

let currentMockContext = {
type: null,
branch: null,
category: null,
folderId: null,
subjectId: null,
year: null
};

/* =========================
   INITIAL LOAD
========================= */

document.addEventListener("DOMContentLoaded", () => {
loadAllData();
});

async function loadAllData(){

showWorkspaceLoading();

try{

const [
examResponse,
subjectResponse,
testResponse
] = await Promise.all([
  supabaseClient.from("exams").select("*").order("id",{ascending:true}),
  supabaseClient.from("subjects").select("*").order("id",{ascending:true}),
  supabaseClient.from("mock_tests").select("*").order("id",{ascending:true})
]);

if(examResponse.error) throw examResponse.error;
if(subjectResponse.error) throw subjectResponse.error;

exams = examResponse.data || [];
subjects = subjectResponse.data || [];
tests = testResponse.error ? [] : (testResponse.data || []);

/* mock_folders is optional in this version */
try{
  const folderResponse = await supabaseClient.from("mock_folders").select("*").order("id",{ascending:true});
  folders = folderResponse.error ? [] : (folderResponse.data || []);
}catch(folderError){
  folders = [];
}

renderExamList();

if(selectedExam){

const stillExists = exams.find(
x => String(x.id) === String(selectedExam.id)
);

if(stillExists){

selectedExam = stillExists;
renderWorkspace();

}else{

selectedExam = null;
renderEmptyWorkspace();

}

}else{

renderEmptyWorkspace();

}

}catch(error){

  console.error("LOAD ALL DATA ERROR:", error);

  alert(
    "LOAD ERROR:\n\n" +
    (error?.message || error?.details || JSON.stringify(error))
  );

  showToast(
    "Data load error: " + getErrorMessage(error),
    "error"
  );

  renderExamList();

  const workspace = document.getElementById("workspace");

  if(workspace){

    workspace.innerHTML = `
      <div class="empty-state">
        <strong>Unable to load data</strong>
        <br><br>
        ${escapeHtml(getErrorMessage(error))}
        <br><br>
        <button class="primary-btn" onclick="loadAllData()">
          Retry
        </button>
      </div>
    `;

  }

}

}

async function saveExam(){

const name =
document.getElementById("examNameInput").value.trim();

const board =
document.getElementById("examBoardInput").value.trim() || "SSC";

const code =
document.getElementById("examCodeInput").value.trim();

const description =
document.getElementById("examDescriptionInput").value.trim();

if(!name){

showToast("Exam name required","error");
return;

}

try{

if(editingExamId){

const {error} = await supabaseClient
.from("exams")
.update({

name:name,
board:board,
code:code,
description:description

})
.eq("id",editingExamId);

if(error) throw error;

showToast("Exam updated","success");

}else{

const boardExams = exams.filter(
x => getExamBoard(x) === board.toUpperCase()
);

const {error} = await supabaseClient
.from("exams")
.insert({

name:name,
board:board,
code:code,
description:description

});

if(error) throw error;

showToast("Exam created","success");

}

closeModal("examModal");

editingExamId = null;

await loadAllData();

}catch(error){

console.error(error);

"Exam save failed: " + getErrorMessage(error),
"error"
);

}

}

async function deleteExam(id){

const exam = exams.find(
x => String(x.id) === String(id)
);

if(!exam) return;

const ok = confirm(
`Delete "${getExamName(exam)}"?\n\nAll related mocks may also become unavailable.`
);

if(!ok) return;

try{

const {error} = await supabaseClient
.from("exams")
.delete()
.eq("id",id);

if(error) throw error;

if(selectedExam && String(selectedExam.id) === String(id)){
selectedExam = null;
}

showToast("Exam deleted","success");

await loadAllData();

}catch(error){

console.error(error);

showToast(
"Exam delete failed: " + getErrorMessage(error),
"error"
);

}

}

async function moveExam(id,direction){

const boardExams = exams
.filter(x => getExamBoard(x) === activeBoard)
.sort((a,b) =>
Number(a.sort_order || 0) - Number(b.sort_order || 0)
);

const index = boardExams.findIndex(
x => String(x.id) === String(id)
);

const targetIndex = index + direction;

if(index < 0 || targetIndex < 0 || targetIndex >= boardExams.length){
return;
}

const current = boardExams[index];
const target = boardExams[targetIndex];

try{

await Promise.all([

supabaseClient
.from("exams")
.update({sort_order:Number(target.sort_order || targetIndex)})
.eq("id",current.id),

supabaseClient
.from("exams")
.update({sort_order:Number(current.sort_order || index)})
.eq("id",target.id)

]);

await loadAllData();

}catch(error){

showToast(
"Exam reorder failed: " + getErrorMessage(error),
"error"
);

}

}

/* =========================
   FOLDER HELPERS
========================= */

function getTestFolder(test){

const folderId =
test?.folder_id ||
test?.mock_folder_id ||
null;

if(!folderId) return null;

return folders.find(
x => String(x.id) === String(folderId)
) || null;

}

function getFolderName(folder){

return (
folder?.display_name ||
folder?.name ||
"Unnamed Series"
);

}

function getFolderType(folder){

return String(
folder?.folder_type ||
folder?.type ||
""
).toUpperCase();

}

function isPyqFolder(folder){

if(!folder) return false;

const type = getFolderType(folder);
const name = getFolderName(folder).toUpperCase();

return (
type.includes("PYQ") ||
name.includes("PYQ") ||
type === "YEAR"
);

}

function isFixedNewFolder(folder){

if(!folder) return false;

const type = getFolderType(folder);
const name = getFolderName(folder).toUpperCase();

return (
type === "NEW" ||
type === "NEW_MOCK" ||
name === "NEW MOCKS" ||
name === "NEW MOCK"
);

}

function isCustomFolder(folder){

if(!folder) return false;

if(isPyqFolder(folder)) return false;
if(isFixedNewFolder(folder)) return false;

const type = getFolderType(folder);

return (
type === "SERIES" ||
type === "CUSTOM" ||
type === "CUSTOM_SERIES" ||
type === "DRILL" ||
type === "PRACTICE"
);

}

function getExamFolders(){

if(!selectedExam) return [];

return folders
.filter(x =>
String(x.exam_id) === String(selectedExam.id)
)
.sort((a,b) =>
Number(a.sort_order || 0) - Number(b.sort_order || 0)
);

}

function getBranchTests(branch){

if(!selectedExam) return [];

return tests.filter(test => {

if(String(test.exam_id) !== String(selectedExam.id)){
return false;
}

const folder = getTestFolder(test);

if(branch === "PYQ"){

return isPyqFolder(folder) ||
String(test.access_type || "").toUpperCase() === "PYQ";

}

if(branch === "NEW"){

return !isPyqFolder(folder) &&
!isCustomFolder(folder) &&
String(test.access_type || "").toUpperCase() !== "PYQ";

}

if(branch === "CUSTOM"){

return isCustomFolder(folder);

}

return false;

});

}

function getCategoryTests(branch,category){

return getBranchTests(branch).filter(test => {

const type = String(
test.test_type ||
test.mock_type ||
""
).toUpperCase();

if(category === "FULL"){

return (
type === "FULL" ||
type === "FULL_MOCK" ||
type === "FULL_MOCKS" ||
!type
);

}

if(category === "SECTIONAL"){

return (
type === "SECTIONAL" ||
type === "SUBJECT_WISE" ||
type === "CHAPTER_WISE"
);

}

return true;

});

function getFolderTests(folderId){

return tests.filter(test => {

return (
String(test.exam_id) === String(selectedExam.id) &&
String(
test.folder_id ||
test.mock_folder_id ||
""
) === String(folderId)
);

});

}

async function moveFolder(folderId,direction){

const list = getExamFolders()
.filter(folder => isCustomFolder(folder));

const index = list.findIndex(
x => String(x.id) === String(folderId)
);

const targetIndex = index + direction;

if(
index < 0 ||
targetIndex < 0 ||
targetIndex >= list.length
){
return;
}

const current = list[index];
const target = list[targetIndex];

try{

await Promise.all([

supabaseClient
.from("mock_folders")
.update({
sort_order:Number(target.sort_order || targetIndex)
})
.eq("id",current.id),

supabaseClient
.from("mock_folders")
.update({
sort_order:Number(current.sort_order || index)
})
.eq("id",target.id)

]);

await loadAllData();

}catch(error){

showToast(
"Series reorder failed: " + getErrorMessage(error),
"error"
);

}

}

async function deleteFolder(folderId){

x => String(x.id) === String(folderId)
);

if(!folder) return;

const folderTests = getFolderTests(folderId);

`Delete "${getFolderName(folder)}"?\n\nContained mocks: ${folderTests.length}`

try{

const {error} = await supabaseClient
.from("mock_folders")
.delete()
.eq("id",folderId);

if(error) throw error;

selectedFolder = null;

showToast("Series deleted","success");

await loadAllData();

}catch(error){

showToast(
"Series delete failed: " + getErrorMessage(error),
"error"
);

}

}

/* =========================================================
   BASIC HELPERS
========================================================= */

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getCurrentExamId() {
  return selectedExam ? selectedExam.id : null;
}

function getTestById(id) {
  return tests.find(t => String(t.id) === String(id)) || null;
}

function getFolderById(id) {
  return folders.find(f => String(f.id) === String(id)) || null;
}

function getSubjectById(id) {
  return subjects.find(s => String(s.id) === String(id)) || null;
}

function getFolderExamId(folder) {
  return folder?.exam_id ?? folder?.exam ?? null;
}

function folderBelongsToExam(folder, examId) {
  return String(getFolderExamId(folder)) === String(examId);
}

/* =========================================================
   ROOT SYSTEM FOLDERS
========================================================= */

async function ensureSystemFolder(folderType) {
  const examId = getCurrentExamId();

  if (!examId) {
    throw new Error("Please select an exam first.");
  }

  const isNew = folderType === "NEW";
  const folderName = isNew ? "New Mocks" : "PYQ Mocks";

  let existing = folders.find(f =>
    folderBelongsToExam(f, examId) &&
    (
      String(f.folder_type || "").toUpperCase() === folderType ||
      String(f.name || "").toLowerCase() === folderName.toLowerCase() ||
      String(f.display_name || "").toLowerCase() === folderName.toLowerCase()
    )
  );

  if (existing) return existing;

  const payload = {
    exam_id: examId,
    name: folderName,
    display_name: folderName,
    folder_type: folderType,
    sort_order: isNew ? 0 : 1,
    is_active: true
  };

  const { data, error } = await supabaseClient
    .from("mock_folders")
    .insert(payload)
    .select()
    .single();

  if (error) {
    console.error(error);
    throw new Error("System folder create nahi ho saka: " + error.message);
  }

  folders.push(data);
  return data;
}

/* =========================================================
   EDITOR CONTEXT
========================================================= */

function getEditorBranch(test = null) {
  if (test) {
    const access = String(test.access_type || "").toUpperCase();

    if (access === "PYQ") return "PYQ";
    if (access === "CUSTOM") return "CUSTOM";
    if (access === "NEW") return "NEW";

    const folder = getFolderById(test.folder_id);

    if (folder) {
      if (isPyqFolder(folder)) return "PYQ";
      if (isCustomFolder(folder)) return "CUSTOM";
      if (
        String(folder.folder_type || "").toUpperCase() === "NEW" ||
        String(folder.name || "").toLowerCase() === "new mocks"
      ) {
        return "NEW";
      }
    }
  }

  if (selectedBranch) return selectedBranch;

  return "NEW";
}

function getEditorFolders(branch, test = null) {
  const examId = getCurrentExamId();

  let list = folders.filter(f => folderBelongsToExam(f, examId));

  if (branch === "NEW") {
    return list.filter(f => {
      const type = String(f.folder_type || "").toUpperCase();
      const name = String(f.name || "").toLowerCase();

      return (
        type === "NEW" ||
        type === "NEW_ROOT" ||
        name === "new mocks" ||
        name === "new mock"
      );
    });
  }

  if (branch === "PYQ") {
    return list.filter(f => {
      const type = String(f.folder_type || "").toUpperCase();
      const name = String(f.name || "").toLowerCase();

      return (
        isPyqFolder(f) ||
        type.includes("PYQ") ||
        name === "pyq mocks" ||
        name.includes("pyq")
      );
    });
  }

  if (branch === "CUSTOM") {
    return list.filter(f => isCustomFolder(f));
  }

  return [];
}

function getDefaultEditorFolder(branch, test = null) {
  if (test?.folder_id) {
    const existing = getFolderById(test.folder_id);
    if (existing) return existing.id;
  }

  const list = getEditorFolders(branch, test);

  if (list.length) {
    return list[0].id;
  }

  return "";
}

/* =========================================================
   SECTION DATA
========================================================= */

function normalizeSections(test) {
  if (!test) return [];

  let sections = test.sections;

  if (typeof sections === "string") {
    try {
      sections = JSON.parse(sections);
    } catch {
      sections = [];
    }
  }

  if (Array.isArray(sections) && sections.length) {
    return sections.map((s, index) => ({
      name: s.name || s.title || `Section ${index + 1}`,
      time_minutes: Number(
        s.time_minutes ??
        s.duration_minutes ??
        s.time ??
        15
      )
    }));
  }

  let timing = test.subject_wise_timing;

  if (typeof timing === "string") {
    try {
      timing = JSON.parse(timing);
    } catch {
      timing = null;
    }
  }

  if (timing?.sections && Array.isArray(timing.sections)) {
    return timing.sections.map((s, index) => ({
      name: s.name || `Section ${index + 1}`,
      time_minutes: Number(s.time_minutes || s.time || 15)
    }));
  }

  return [];
}

function getTimingConfig(test) {
  let timing = test?.subject_wise_timing;

  if (typeof timing === "string") {
    try {
      timing = JSON.parse(timing);
    } catch {
      timing = null;
    }
  }

  return timing || {};
}

              Custom Series
            </option>
          </select>
        </div>

      </div>

      <div class="form-grid">

        <div class="form-group">
          <label>Folder / Year / Series</label>
          <select id="editorMockFolder">
            ${folderOptions || `
              <option value="">No folder available</option>
            `}
          </select>
        </div>

        <div class="form-group">
          <label>Subject</label>
          <select id="editorMockSubject">
            <option value="">All Subjects / General</option>
            ${subjectOptions}
          </select>
        </div>

      </div>

      <div class="form-grid">

        <div class="form-group">
          <label>Total Questions</label>
          <input
            id="editorMockQuestions"
            type="number"
            min="1"
            value="${esc(totalQuestions)}"
          >
        </div>

        <div class="form-group">
          <label>Total Duration (Minutes)</label>
          <input
            id="editorMockDuration"
            type="number"
            min="1"
            value="${esc(duration)}"
          >
        </div>

      </div>

      <div class="toggle-row">
        <label class="switch-label">
          <input
            id="editorMockActive"
            type="checkbox"
            ${active ? "checked" : ""}
          >
          <span>Publish / Active</span>
        </label>
      </div>

      <div id="sectionTimingBox" class="section-timing-box">

        <div class="timing-heading">
          <div>
            <strong>Section-wise Timing</strong>
            <small>Sectional mock ke liye optional</small>
          </div>

          <label class="switch-label">
            <input
              id="editorTimingEnabled"
              type="checkbox"
              ${timingEnabled ? "checked" : ""}
            >
            <span>Enable</span>
          </label>
        </div>

        <div id="timingOptions" style="${timingEnabled ? "" : "display:none;"}">

          <label class="switch-label">
            <input
              id="editorLockSections"
              type="checkbox"
              ${lockSections ? "checked" : ""}
            >
            <span>Lock Section Navigation</span>
          </label>

          <small class="help-text">
            ON hone par student manually doosri section par switch nahi kar payega.
          </small>

          <div id="editorSectionsList"></div>

          <button
            type="button"
            class="secondary-btn"
            onclick="addEditorSection()"
          >
            + Add Section
          </button>

        </div>

      </div>

      <div class="editor-note">
        Save karne ke baad mock selected branch/folder me show hoga.
      </div>

    </div>
  `;

  renderEditorSections(
    sections.length
      ? sections
      : [{ name: "", time_minutes: 15 }]
  );

  const typeSelect = document.getElementById("editorMockType");
  const timingEnabledInput =
    document.getElementById("editorTimingEnabled");

  const timingBox =
    document.getElementById("sectionTimingBox");

  function refreshTimingVisibility() {
    const currentType = typeSelect.value;

    timingBox.style.display =
      currentType === "SECTIONAL" ? "block" : "none";
  }

  typeSelect.addEventListener("change", refreshTimingVisibility);

  timingEnabledInput.addEventListener("change", () => {
    document.getElementById("timingOptions").style.display =
      timingEnabledInput.checked ? "block" : "none";
  });

  refreshTimingVisibility();

  openModal("mockModal");
}

/* =========================================================
   SECTION ROW RENDER
========================================================= */

function renderEditorSections(sectionData = []) {
  const box = document.getElementById("editorSectionsList");

  if (!box) return;

  box.innerHTML = "";

  sectionData.forEach((section, index) => {
    addEditorSection(section.name, section.time_minutes, false);
  });

  if (!sectionData.length) {
    addEditorSection("", 15, false);
  }
}

function addEditorSection(name = "", time = 15, focus = true) {
  const box = document.getElementById("editorSectionsList");

  if (!box) return;

  const row = document.createElement("div");
  row.className = "editor-section-row";

  row.innerHTML = `
    <input
      class="editor-section-name"
      type="text"
      placeholder="Section name"
      value="${esc(name)}"
    >

    <input
      class="editor-section-time"
      type="number"
      min="1"
      placeholder="Minutes"
      value="${esc(time)}"
    >

    <button
      type="button"
      class="danger-small-btn"
      onclick="this.parentElement.remove()"
    >
      ×
    </button>
  `;

  box.appendChild(row);

  if (focus) {
    row.querySelector(".editor-section-name").focus();
  }
}

/* =========================================================
   DYNAMIC BRANCH CHANGE
========================================================= */

async function refreshEditorBranchFolders() {
  const branchEl = document.getElementById("editorMockBranch");
  const folderEl = document.getElementById("editorMockFolder");

  if (!branchEl || !folderEl) return;

  const branch = branchEl.value;

  let list = getEditorFolders(branch);

  if (branch === "NEW" && !list.length) {
    try {
      await ensureSystemFolder("NEW");
      list = getEditorFolders(branch);
    } catch (error) {
      showToast(error.message, "error");
    }
  }

  if (branch === "PYQ" && !list.length) {
    try {
      await ensureSystemFolder("PYQ");
      list = getEditorFolders(branch);
    } catch (error) {
      showToast(error.message, "error");
    }
  }

  folderEl.innerHTML = list
    .sort((a, b) =>
      Number(a.sort_order || 0) - Number(b.sort_order || 0)
    )
    .map(f => `
      <option value="${esc(f.id)}">
        ${esc(getFolderName(f))}
      </option>
    `)
    .join("");

  if (!list.length) {
    folderEl.innerHTML =
      `<option value="">No folder available</option>`;
  }
}

/* =========================================================
   SAVE MOCK
========================================================= */

async function saveMock() {
  const titleEl = document.getElementById("editorMockTitle");
  const descEl = document.getElementById("editorMockDescription");
  const typeEl = document.getElementById("editorMockType");
  const branchEl = document.getElementById("editorMockBranch");
  const folderEl = document.getElementById("editorMockFolder");
  const subjectEl = document.getElementById("editorMockSubject");
  const questionsEl = document.getElementById("editorMockQuestions");
  const durationEl = document.getElementById("editorMockDuration");
  const activeEl = document.getElementById("editorMockActive");
  const timingEl = document.getElementById("editorTimingEnabled");
  const lockEl = document.getElementById("editorLockSections");

  if (!titleEl) return;

  const title = titleEl.value.trim();
  const description = descEl.value.trim();
  const testType = typeEl.value;
  const branch = branchEl.value;
  const folderId = folderEl.value || null;
  const subjectId = subjectEl.value || null;
  const totalQuestions = Number(questionsEl.value || 0);
  const durationMinutes = Number(durationEl.value || 0);
  const isActive = activeEl.checked;

  if (!title) {
    showToast("Mock title required hai", "error");
    titleEl.focus();
    return;
  }

  if (totalQuestions < 1) {
    showToast("Questions 1 ya usse zyada hone chahiye", "error");
    return;
  }

  if (durationMinutes < 1) {
    showToast("Duration required hai", "error");
    return;
  }

  if (!folderId) {
    showToast("Folder / Year / Series select karo", "error");
    return;
  }

  let sections = [];

  if (testType === "SECTIONAL" && timingEl?.checked) {
    const rows = [
      ...document.querySelectorAll(".editor-section-row")
    ];

    rows.forEach((row, index) => {
      const name =
        row.querySelector(".editor-section-name")?.value.trim();

      const time = Number(
        row.querySelector(".editor-section-time")?.value || 0
      );

      if (name && time > 0) {
        sections.push({
          name,
          time_minutes: time,
          order: index + 1
        });
      }
    });

    if (!sections.length) {
      showToast("Kam se kam ek section add karo", "error");
      return;
    }
  }

  const timingConfig = {
    enabled:
      testType === "SECTIONAL" &&
      Boolean(timingEl?.checked),

    allow_switch:
      !(
        testType === "SECTIONAL" &&
        Boolean(timingEl?.checked) &&
        Boolean(lockEl?.checked)
      ),

    locked:
      testType === "SECTIONAL" &&
      Boolean(timingEl?.checked) &&
      Boolean(lockEl?.checked),

    section_switch:
      !(
        testType === "SECTIONAL" &&
        Boolean(timingEl?.checked) &&
        Boolean(lockEl?.checked)
      ),

    sections
  };

  let sortOrder = 0;

  const sameFolderTests = tests.filter(t =>
    String(t.folder_id || "") === String(folderId)
  );

  if (editorMode === "NEW") {
    sortOrder = sameFolderTests.length;
  } else {
    const oldTest = getTestById(editorTestId);
    sortOrder = Number(oldTest?.sort_order || 0);
  }

  const payload = {
    title,
    description,
    test_type: testType,
    folder_id: folderId,
    subject_id: subjectId,
    duration_minutes: durationMinutes,
    total_questions: totalQuestions,
    is_active: isActive,
    access_type: branch,
    sort_order: sortOrder,
    subject_wise_timing: timingConfig,
    sections
  };

  let result;

  try {
    if (editorMode === "EDIT" && editorTestId) {
      result = await supabaseClient
        .from("mock_tests")
        .update(payload)
        .eq("id", editorTestId)
        .select()
        .single();
    } else {
      result = await supabaseClient
        .from("mock_tests")
        .insert(payload)
        .select()
        .single();
    }

    /*
      Agar database me sections column nahi hai,
      to fallback me sections remove karke save karega.
    */
    if (
      result.error &&
      String(result.error.message || "")
        .toLowerCase()
        .includes("sections")
    ) {
      const fallbackPayload = { ...payload };
      delete fallbackPayload.sections;

      if (editorMode === "EDIT" && editorTestId) {
        result = await supabaseClient
          .from("mock_tests")
          .update(fallbackPayload)
          .eq("id", editorTestId)
          .select()
          .single();
      } else {
        result = await supabaseClient
          .from("mock_tests")
          .insert(fallbackPayload)
          .select()
          .single();
      }
    }

    if (result.error) {
      throw result.error;
    }

    showToast(
      editorMode === "EDIT"
        ? "Mock successfully updated"
        : "Mock successfully created",
      "success"
    );

    closeModal("mockModal");

    editorTestId = null;
    editorMode = "NEW";

    await loadAllData();

  } catch (error) {
    console.error("SAVE MOCK ERROR:", error);
    showToast(
      "Mock save nahi hua: " + (error.message || "Unknown error"),
      "error"
    );
  }
}
