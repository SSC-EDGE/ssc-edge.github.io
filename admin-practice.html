<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
document.documentElement.dataset.theme =
  localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<title>SSC EDGE - Practice Admin</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================================================
   SSC EDGE PRACTICE ADMIN
========================================================= */

:root{
  --purple:#9b5cff;
  --purple2:#7b35e8;
  --bg:#09090d;
  --card:#111117;
  --card2:#15151d;
  --border:#252530;
  --text:#f5f5f7;
  --muted:#92929e;
  --green:#28c76f;
  --red:#ff4d5e;
  --yellow:#ffbd4a;
}

:root[data-theme="light"]{
  --bg:#f6f4fa;
  --card:#ffffff;
  --card2:#f1eef7;
  --border:#ddd8e8;
  --text:#17151c;
  --muted:#686473;
}

/* ---------- RESET ---------- */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* ---------- HEADER ---------- */

.admin-header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  position:sticky;
  top:0;
  z-index:50;
}

.brand{
  font-size:23px;
  font-weight:800;
  letter-spacing:-.5px;
}

.brand span{
  color:var(--purple);
}

.header-right{
  display:flex;
  align-items:center;
  gap:9px;
}

.header-btn{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  font-size:18px;
}

/* ---------- PAGE ---------- */

.page{
  width:min(1050px,100%);
  margin:auto;
  padding:20px 15px 50px;
}

.page-title{
  font-size:25px;
  font-weight:800;
  margin:3px 0 5px;
}

.page-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

/* ---------- TOP ACTIONS ---------- */

.top-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.primary-btn,
.secondary-btn,
.danger-btn{
  border:0;
  border-radius:11px;
  padding:11px 15px;
  font-weight:700;
}

.primary-btn{
  background:var(--purple);
  color:white;
}

.secondary-btn{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
}

.danger-btn{
  background:#3a151a;
  color:#ff6b79;
  border:1px solid #60222b;
}

/* ---------- EXAMS ---------- */

.section-label{
  font-size:12px;
  font-weight:800;
  color:var(--muted);
  letter-spacing:.8px;
  margin:22px 0 10px;
  text-transform:uppercase;
}

.exam-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.exam-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  transition:.15s;
}

.exam-card.active{
  border-color:var(--purple);
  box-shadow:0 0 0 1px rgba(155,92,255,.15);
}

.exam-main{
  display:flex;
  align-items:center;
  gap:12px;
}

.exam-logo{
  width:48px;
  height:48px;
  border-radius:13px;
  background:var(--card2);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  overflow:hidden;
}

.exam-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.exam-logo.ssc-logo{
  font-size:17px;
  font-weight:900;
  color:var(--purple);
}

.exam-name{
  font-size:17px;
  font-weight:800;
}

.exam-board{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.exam-actions{
  display:flex;
  gap:7px;
  margin-top:13px;
  flex-wrap:wrap;
}

.small-btn{
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
  border-radius:9px;
  padding:7px 10px;
  font-size:12px;
  font-weight:700;
}

.small-btn.purple{
  background:var(--purple);
  border-color:var(--purple);
  color:white;
}

.small-btn.red{
  color:#ff6674;
}

/* ---------- WORKSPACE ---------- */

.workspace{
  margin-top:25px;
}

.workspace-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.workspace-title{
  font-size:21px;
  font-weight:800;
}

.workspace-subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

/* ---------- ROOT CARDS ---------- */

.root-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.root-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:17px;
}

.root-icon{
  width:44px;
  height:44px;
  border-radius:12px;
  background:rgba(155,92,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  margin-bottom:12px;
}

.root-title{
  font-size:18px;
  font-weight:800;
}

.root-desc{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.root-actions{
  display:flex;
  gap:7px;
  margin-top:13px;
  flex-wrap:wrap;
}

/* ---------- CATEGORY CARDS ---------- */

.category-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.category-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:17px;
}

.category-icon{
  font-size:22px;
  margin-bottom:11px;
}

.category-title{
  font-size:17px;
  font-weight:800;
}

.category-desc{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.category-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:13px;
}

/* ---------- HORIZONTAL CHOOSERS ---------- */

.horizontal-scroll{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:2px 1px 7px;
  scrollbar-width:none;
}

.horizontal-scroll::-webkit-scrollbar{
  display:none;
}

.choice-card{
  min-width:145px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px;
  flex:none;
}

.choice-card.active{
  border-color:var(--purple);
}

.choice-title{
  font-size:15px;
  font-weight:800;
}

.choice-meta{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.choice-actions{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.reorder-btn{
  width:30px;
  height:28px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
  font-size:12px;
}

/* ---------- TESTS ---------- */

.tests-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:19px 0 11px;
}

.tests-title{
  font-size:17px;
  font-weight:800;
}

.test-list{
  display:grid;
  gap:10px;
}

.test-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
}

.test-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.test-title{
  font-size:15px;
  font-weight:800;
}

.test-status{
  font-size:10px;
  padding:4px 7px;
  border-radius:7px;
  background:rgba(40,199,111,.12);
  color:var(--green);
  white-space:nowrap;
}

.test-status.off{
  background:rgba(255,77,94,.12);
  color:var(--red);
}

.test-info{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:11px;
  margin-top:7px;
}

.test-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:11px;
}

/* ---------- EMPTY ---------- */

.empty{
  border:1px dashed var(--border);
  background:var(--card);
  border-radius:14px;
  padding:22px;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* ---------- MODAL ---------- */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(480px,100%);
  max-height:90vh;
  overflow-y:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:19px;
}

.modal-title{
  font-size:19px;
  font-weight:800;
  margin-bottom:16px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  height:43px;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
  border-radius:10px;
  padding:0 12px;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:var(--purple);
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:17px;
}

.help-text{
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
  margin-top:4px;
}

/* ---------- TOAST ---------- */

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(20px);
  background:#191920;
  color:white;
  border:1px solid #33333e;
  padding:11px 15px;
  border-radius:11px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:200;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.toast.error{
  border-color:#712631;
  color:#ff8290;
}

/* ---------- MOBILE ---------- */

@media(max-width:650px){

  .admin-header{
    height:64px;
    padding:0 13px;
  }

  .brand{
    font-size:21px;
  }

  .page{
    padding:16px 12px 40px;
  }

  .page-title{
    font-size:22px;
  }

  .exam-list,
  .root-grid,
  .category-grid{
    grid-template-columns:1fr;
  }

  .workspace-head{
    display:block;
  }

  .workspace-head .primary-btn{
    margin-top:11px;
  }

  .test-top{
    align-items:flex-start;
  }

}

/* ---------- LOADING ---------- */

.loading{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.hidden{
  display:none!important;
}

</style>
</head>

<body>

<header class="admin-header">

  <div class="brand">
    SSC <span>EDGE</span>
  </div>

  <div class="header-right">

    <button class="header-btn" onclick="location.href='practice.html'">
      ←
    </button>

  </div>

</header>

<main class="page">

  <div class="page-title">
    Practice Admin
  </div>

  <div class="page-subtitle">
    Manage exams, mock categories, years, subjects and tests.
  </div>

  <div class="top-actions">

    <button class="primary-btn" onclick="openExamForm()">
      + Add Exam
    </button>

    <button class="secondary-btn" onclick="loadAll()">
      ↻ Refresh
    </button>

  </div>

  <!-- =====================================================
       EXAMS
  ====================================================== -->

  <div class="section-label">
    Exams
  </div>

  <div id="examList" class="exam-list">
    <div class="loading">
      Loading exams...
    </div>
  </div>

  <!-- =====================================================
       WORKSPACE
  ====================================================== -->

  <section id="workspace" class="workspace hidden">

    <div class="workspace-head">

      <div>
        <div id="workspaceTitle" class="workspace-title">
          -
        </div>

        <div class="workspace-subtitle">
          Practice structure
        </div>
      </div>

      <button class="primary-btn" onclick="openRootForm()">
        + Add Mock Type
      </button>

    </div>

    <div id="rootArea"></div>

  </section>

</main>

<!-- =======================================================
     EXAM MODAL
======================================================= -->

<div id="examModal" class="modal-bg">

  <div class="modal">

    <div id="examModalTitle" class="modal-title">
      Add Exam
    </div>

    <div class="field">

      <label>
        Board
      </label>

      <select id="examBoard">

        <option value="SSC">
          SSC
        </option>

        <option value="RRB">
          RRB

      </select>

    </div>

    <div class="field">

      <label>
        Exam Name
      </label>

      <input

    </div>

      Example: CGL, CHSL, CPO, MTS, NTPC etc.
    </div>

    <div class="modal-actions">

      <button
        class="secondary-btn"

      >
        Cancel
      </button>

      <button
        class="primary-btn"
        onclick="saveExam()"
      >
        Save
      </button>

    </div>

  </div>

</div>

<!-- =======================================================
     ROOT MODAL
======================================================= -->

<div id="rootModal" class="modal-bg">

  <div class="modal">

    <div class="modal-title">
      Add Mock Type
    </div>

    <div class="field">

      <label>
        Mock Type
      </label>

      <select id="rootType">

        <option value="new">
          NEW MOCKS
        </option>

        <option value="pyq">
          PYQ MOCKS

    </div>

    <div class="modal-actions">

      <button

      >
        Cancel
      </button>

      <button
        class="primary-btn"

        Create

    </div>

  </div>

</div>

<!-- =======================================================
     CATEGORY MODAL
======================================================= -->

<div id="categoryModal" class="modal-bg">

  <div class="modal">

    <div id="categoryModalTitle" class="modal-title">
      Add Category
    </div>

    <div class="field">

      <label>
        Category
      </label>

      <select id="categoryType">

        <option value="full">
          FULL MOCKS
        </option>

        <option value="sectional">

    </div>

    <div class="modal-actions">

      <button
        class="secondary-btn"
        onclick="closeCategoryForm()"

        Cancel
      </button>

      <button
        class="primary-btn"

      </button>

  </div>

</div>

<!-- =======================================================
     YEAR / SUBJECT MODAL
======================================================= -->

<div id="leafModal" class="modal-bg">

  <div class="modal">

    <div id="leafModalTitle" class="modal-title">
      Add
    </div>

    <div class="field">

      <label id="leafLabel">
        Name

      <input

        type="text"

    </div>

      <button
        class="secondary-btn"

      </button>

      <button
        class="primary-btn"
        onclick="saveLeaf()"
      >
        Save
      </button>

    </div>

</div>

<!-- =======================================================
     TEST MODAL
======================================================= -->

<div id="testModal" class="modal-bg">

  <div class="modal">

    <div id="testModalTitle" class="modal-title">
      Add Test
    </div>

    <div class="field">

      <label>
        Test Title

        id="testTitle"

        Active

    <div class="modal-actions">

      <button
        class="secondary-btn"
        onclick="closeTestForm()"

        Cancel
      </button>

        Save
      </button>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* =========================================================
   STATE
========================================================= */

let exams = [];
let folders = [];
let tests = [];
let subjects = [];

let selectedExam = null;

let editingExamId = null;
let editingFolderId = null;
let editingTestId = null;

let currentParentId = null;
let currentLeafType = null;

/* =========================================================
   HELPERS
========================================================= */

function normalizeType(value){

  return String(value || "")
    .trim()
    .toLowerCase();

}

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function showToast(message,error=false){

  const toast =
    document.getElementById("toast");

  toast.textContent = message;

  toast.classList.toggle("error",error);

  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },2600);

}

function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}

function openModal(id){

  document
    .getElementById(id)
    .classList.add("show");

}

/* =========================================================
   SORT
========================================================= */

function sortByOrder(a,b){

  return (Number(a.sort_order)||0)
       - (Number(b.sort_order)||0);

}

function sortExams(){

  exams.sort((a,b)=>{

    const boardA = String(a.board||"");
    const boardB = String(b.board||"");

    if(boardA !== boardB){

      if(boardA === "SSC") return -1;
      if(boardB === "SSC") return 1;

    }

    return sortByOrder(a,b);

  });

}

/* =========================================================
   LOAD ALL
========================================================= */

async function loadAll(){

  if(!window.supabase){

    showToast(
      "Supabase library failed to load.",
      true
    );

    return;

  }

  const results =
    await Promise.all([

      db
        .from("exams")
        .select("*")
        .order("sort_order",{ascending:true})
        .order("id",{ascending:true}),

      db
        .from("mock_folders")
        .select("*")
        .order("sort_order",{ascending:true})
        .order("id",{ascending:true}),

      db
        .from("mock_tests")
        .select("*")
        .order("sort_order",{ascending:true})
        .order("id",{ascending:true}),

      db
        .from("subjects")
        .select("*")
        .order("id",{ascending:true})

    ]);

  const names = [
    "EXAMS",
    "MOCK_FOLDERS",
    "MOCK_TESTS",
    "SUBJECTS"
  ];

  for(let i=0;i<results.length;i++){

    if(results[i].error){

      console.error(
        names[i],
        results[i].error
      );

      showToast(
        names[i] + ": " +
        results[i].error.message,
        true
      );

      return;

    }

  }

  exams = results[0].data || [];
  folders = results[1].data || [];
  tests = results[2].data || [];
  subjects = results[3].data || [];

  sortExams();

  renderExams();

  if(selectedExam){

    const fresh =
      exams.find(
        x => Number(x.id) === Number(selectedExam.id)
      );

    if(fresh){

      selectedExam = fresh;
      renderWorkspace();

    }else{

      selectedExam = null;

      document
        .getElementById("workspace")
        .classList.add("hidden");

    }

  }

}

/* =========================================================
   EXAMS
========================================================= */

function renderExams(){

  const box =
    document.getElementById("examList");

  if(!exams.length){

    box.innerHTML = `
      <div class="empty">
        No exams added yet.
      </div>
    `;

    return;

  }

  box.innerHTML =
    exams.map(exam=>{

      const active =
        selectedExam &&
        Number(selectedExam.id) === Number(exam.id);

async function saveExam(){

  const board =
    document.getElementById("examBoard")
      .value
      .trim()
      .toUpperCase();

  const name =
    document.getElementById("examName")
      .value
      .trim();

  if(!name){

    showToast(
      "Enter exam name.",
      true
    );

    return;

  }

  const isEditing =
    editingExamId !== null;

  const idBeingEdited =
    editingExamId;

  if(isEditing){

    const { error } =
      await db
        .from("exams")
        .update({
          board:board,
          name:name
        })
        .eq("id",idBeingEdited);

    if(error){

      console.error(error);

      showToast(
        "EXAMS: " + error.message,
        true
      );

      return;

    }

    if(
      selectedExam &&
      Number(selectedExam.id) === Number(idBeingEdited)
    ){

      selectedExam = {
        ...selectedExam,
        board,
        name
      };

    }

    showToast("Exam updated.");

  }else{

    const maxOrder =
      exams
        .filter(x=>String(x.board).toUpperCase()===board)
        .reduce(
          (m,x)=>Math.max(
            m,
            Number(x.sort_order)||0
          ),
          -1
        );

    /*
      IMPORTANT:
      exams.mock_type has a DB CHECK constraint.
      The database accepts only:
      SECTIONAL
      SUBJECT_WISE

      It is only a legacy required field.
      It does NOT control the Practice hierarchy.
    */

    const { data,error } =
      await db
        .from("exams")
        .insert({
          board:board,
          name:name,
          mock_type:"SECTIONAL",
          is_active:true,
          sort_order:maxOrder + 1
        })
        .select()
        .single();

    if(error){

      console.error(error);

      showToast(
        "EXAMS: " + error.message,
        true
      );

      return;

    }

    selectedExam = data;

    showToast("Exam created.");

  }

  editingExamId = null;

  closeExamForm();

  await loadAll();

}

/* =========================================================
   EXAM REORDER
========================================================= */

async function moveExam(id,direction){

  const index =
    exams.findIndex(
      x => Number(x.id) === Number(id)
    );

  if(index < 0) return;

  const board =
    String(exams[index].board || "")
      .toUpperCase();

  const sameBoard =
    exams.filter(
      x =>
        String(x.board||"").toUpperCase() === board
    );

  const pos =
    sameBoard.findIndex(
      x => Number(x.id) === Number(id)
    );

  const target =
    pos + direction;

  if(target < 0 || target >= sameBoard.length){

    return;

  }

  const current = sameBoard[pos];
  const other = sameBoard[target];

  const currentOrder =
    Number(current.sort_order)||0;

  const otherOrder =
    Number(other.sort_order)||0;

  const { error } =
    await db
      .from("exams")
      .update({
        sort_order:otherOrder
      })
      .eq("id",current.id);

  if(error){

    showToast(
      "EXAMS: " + error.message,
      true
    );

    return;

  }

  const { error:error2 } =
    await db
      .from("exams")
      .update({
        sort_order:currentOrder
      })
      .eq("id",other.id);

  if(error2){

    showToast(
      "EXAMS: " + error2.message,
      true
    );

    return;

  }

  await loadAll();

}

/* =========================================================
   DELETE EXAM
========================================================= */

async function deleteExam(id){

  const exam =
    exams.find(
      x => Number(x.id) === Number(id)
    );

  if(!exam) return;

  if(
    !confirm(
      `Delete "${exam.name}" and all its practice folders/tests?`
    )
  ){

    return;

  }

  const examFolders =
    folders.filter(
      x => Number(x.exam_id) === Number(id)
    );

  const folderIds =
    examFolders.map(x=>Number(x.id));

  /*
    Delete tests first.
  */

  if(folderIds.length){

    const { error:testError } =
      await db
        .from("mock_tests")
        .delete()
        .in("folder_id",folderIds);

    if(testError){

      showToast(
        "MOCK_TESTS: " +
        testError.message,
        true
      );

      return;

    }

  }

  /*
    Delete folders deepest-first so a self
    parent_id foreign key does not block deletion.
  */

  const remaining =
    [...examFolders];

  while(remaining.length){

    const leafFolders =
      remaining.filter(folder=>{

        return !remaining.some(
          child =>
            Number(child.parent_id) ===
            Number(folder.id)
        );

      });

    const batch =
      leafFolders.length
        ? leafFolders
        : remaining;

    const ids =
      batch.map(x=>Number(x.id));

    const { error } =
      await db
        .from("mock_folders")
        .delete()
        .in("id",ids);

    if(error){

      showToast(
        "MOCK_FOLDERS: " +
        error.message,
        true
      );

      return;

    }

    for(const item of batch){

      const index =
        remaining.indexOf(item);

      if(index >= 0){

        remaining.splice(index,1);

      }

    }

  }

  const { error:examError } =
    await db
      .from("exams")
      .delete()
      .eq("id",id);

  if(examError){

    showToast(
      "EXAMS: " +
      examError.message,
      true
    );

    return;

  }

  if(
    selectedExam &&
    Number(selectedExam.id) === Number(id)
  ){

    selectedExam = null;

  }

  showToast("Exam deleted.");

  await loadAll();

}

/* =========================================================

========================================================= */

function inferTestType(folder){

  if(!folder){

    return "FULL";

  }

  const type =
    normalizeType(folder.folder_type);

  if(type === "subject"){

    return "SECTIONAL";

  }

  if(type === "sectional"){

    return "SECTIONAL";

  }

  return "FULL";

}

/* =========================================================
   SAVE TEST
========================================================= */

async function saveTest(){

  const title =
    document.getElementById("testTitle")
      .value
      .trim();

  const duration =
    Number(
      document.getElementById("testDuration")
        .value
    );

  const questions =
    Number(
      document.getElementById("testQuestions")
        .value
    );

  const active =
    document.getElementById("testActive")
      .value === "true";

  if(!title){

    showToast(
      "Enter test title.",
      true
    );

    return;

  }

  if(!duration || duration < 1){

    showToast(
      "Enter valid duration.",
      true
    );

    return;

  }

  if(!questions || questions < 1){

    showToast(
      "Enter valid question count.",
      true
    );

    return;

  }

  const isEditing =
    editingTestId !== null &&
    editingTestId !== undefined;

  let folderId =
    Number(currentParentId);

  /*
    While editing, never depend only on currentParentId.
    Fetch the actual test so its original folder is preserved.
  */

  if(isEditing){

    const {data:existingTest,error:existingError} =
      await db
        .from("mock_tests")
        .select("id,folder_id,exam_id")
        .eq("id",Number(editingTestId))
        .maybeSingle();

    if(existingError || !existingTest){

      showToast(
        "Unable to load existing test.",
        true
      );

      return;

    }

    folderId =
      Number(existingTest.folder_id);

  }

  const folder =
    folders.find(
      x =>
        Number(x.id) ===
        Number(folderId)
    );

  if(!folder){

    showToast(
      "Test folder not found.",
      true
    );

    return;

  }

  const examId =
    selectedExam && selectedExam.id
      ? Number(selectedExam.id)
      : null;

  if(!examId){

    showToast(
      "Please select an exam.",
      true
    );

    return;

  }

  const testType =
    inferTestType(folder);

  /*
    mock_tests.test_type accepts only:
    FULL
    SECTIONAL
    SUBJECT_WISE

    We use:
    FULL       -> Full mocks
    SECTIONAL  -> Sectional mocks
  */

  if(isEditing){

    const {error} =
      await db
        .from("mock_tests")
        .update({

          exam_id:examId,
          folder_id:Number(folder.id),
          title:title,
          test_type:testType,
          subject_id:folder.subject_id ? Number(folder.subject_id) : null,
          duration_minutes:duration,
          total_questions:questions,
          is_active:active

        })
        .eq("id",editingTestId);

    if(error){

      showToast(
        "MOCK_TESTS: " +
        error.message,
        true
      );

      return;

    }

    showToast("Test updated.");

  }else{

    const siblings =
      getTests(folder.id);

    const maxOrder =
      siblings.reduce(
        (m,x)=>
          Math.max(
            m,
            Number(x.sort_order)||0
          ),
        -1
      );

    /*
      For sectional subject folders,
      try to use the subject_id attached
      to that folder.

      If there is no subject_id, it remains null.
    */

    const subjectId =
      folder.subject_id || null;

    const {error} =
      await db
        .from("mock_tests")
        .insert({

          exam_id:selectedExam.id,

          folder_id:folder.id,

          title:title,

          test_type:testType,

          subject_id:subjectId,

          duration_minutes:duration,

          total_questions:questions,

          is_active:active,

          sort_order:maxOrder + 1

        });

    if(error){

      showToast(
        "MOCK_TESTS: " +
        error.message,
        true
      );

      return;

    }

    showToast("Test created.");

  }

  editingTestId = null;

  closeTestForm();

  await loadAll();

  /*
    Re-open the same location.
  */

  const freshFolder =
    folders.find(
      x =>
        Number(x.id) ===
        Number(currentParentId)
    );

  if(freshFolder){

    const type =
      normalizeType(
        freshFolder.folder_type
      );

    if(type === "year"){

      renderYearTests(freshFolder);

    }else if(type === "subject"){

      renderSubjectTests(freshFolder);

    }else if(type === "full"){

      renderFullLevel(freshFolder);

    }

  }

}

/* =========================================================
   MOVE TEST
========================================================= */

async function moveTest(id,direction){

  const test =
    tests.find(
      x => Number(x.id) === Number(id)
    );

  if(!test) return;

  const siblings =
    getTests(test.folder_id);

  const index =
    siblings.findIndex(
      x => Number(x.id) === Number(id)
    );

  const target =
    index + direction;

  if(target < 0 || target >= siblings.length){

    return;

  }

  const current =
    siblings[index];

  const other =
    siblings[target];

  const currentOrder =
    Number(current.sort_order)||0;

  const otherOrder =
    Number(other.sort_order)||0;

  const {error} =
    await db
      .from("mock_tests")
      .update({
        sort_order:otherOrder
      })
      .eq("id",current.id);

  if(error){

    showToast(
      "MOCK_TESTS: " +
      error.message,
      true
    );

    return;

  }

  const {error:error2} =
    await db
      .from("mock_tests")
      .update({
        sort_order:currentOrder
      })
      .eq("id",other.id);

  if(error2){

    showToast(
      "MOCK_TESTS: " +
      error2.message,
      true
    );

    return;

  }

  await loadAll();

}

async function saveLeaf(){

  const name =
    document.getElementById("leafName")
      .value
      .trim();

  if(!name){

    showToast(
      "Enter a name.",
      true
    );

    return;

  }

      f =>

        normalizeType(f.folder_type) ===
          currentLeafType &&
        String(
          f.display_name ||
          f.name
        ).trim().toLowerCase() ===
        name.toLowerCase()
    );

  if(duplicate){

    showToast(
      "This item already exists.",
      true
    );

    return;

  }

  const siblings =
    folders.filter(
      f =>
        Number(f.parent_id) ===
        Number(currentParentId)
    );

  const maxOrder =
    siblings.reduce(
      (m,x)=>
        Math.max(
          m,
          Number(x.sort_order)||0
        ),
      -1
    );

  const {error} =
    await db
      .from("mock_folders")
      .insert({

        exam_id:selectedExam.id,

        parent_id:currentParentId,

        name:name,

        display_name:name,

        folder_type:currentLeafType,

        sort_order:maxOrder + 1,

        is_active:true,

        subject_id:
          currentLeafType === "subject"
            ? findSubjectId(name)
            : null

      });

  if(error){

    showToast(
      "MOCK_FOLDERS: " +
      error.message,
      true
    );

    return;

  }

  closeLeafForm();

  showToast(
    currentLeafType === "year"
      ? "Year added."
      : "Subject added."
  );

  await loadAll();

  const parent =
    folders.find(
      x =>
        Number(x.id) ===
        Number(currentParentId)
    );

  if(parent){

    const type =
      normalizeType(parent.folder_type);

    if(type === "full"){

      renderPYQFull(parent);

    }else if(type === "sectional"){

      renderSectionalLevel(parent);

    }

  }

}

/* =========================================================
   MOVE FOLDER
========================================================= */

async function moveFolder(id,direction){

  const folder =
    folders.find(
      x => Number(x.id) === Number(id)
    );

  if(!folder) return;

  const siblings =
    folders
      .filter(
        x =>
          Number(x.exam_id) ===
            Number(folder.exam_id) &&
          (
            Number(x.parent_id || 0) ===
            Number(folder.parent_id || 0)
          ) &&
          normalizeType(x.folder_type) ===
          normalizeType(folder.folder_type)
      )
      .sort(sortByOrder);

  /*
    For full/sectional categories we DO NOT
    want to accidentally mix folder types.
    Root children are therefore reordered
    together separately below.
  */

  let orderedSiblings;

  const parent =
    folder.parent_id
      ? folders.find(
          x =>
            Number(x.id) ===
            Number(folder.parent_id)
        )
      : null;

  if(
    parent &&
    ["new","pyq"].includes(
      normalizeType(parent.folder_type)
    )
  ){

    orderedSiblings =
      folders
        .filter(
          x =>
            Number(x.parent_id) ===
            Number(folder.parent_id)
        )
        .sort(sortByOrder);

  }else{

    orderedSiblings =
      folders
        .filter(
          x =>
            Number(x.parent_id || 0) ===
            Number(folder.parent_id || 0) &&
            normalizeType(x.folder_type) ===
            normalizeType(folder.folder_type)
        )
        .sort(sortByOrder);

  }

  const index =
    orderedSiblings.findIndex(
      x => Number(x.id) === Number(id)
    );

  if(index < 0) return;

  const target =
    index + direction;

  if(
    target < 0 ||
    target >= orderedSiblings.length
  ){

    return;

  }

  const current =
    orderedSiblings[index];

  const other =
    orderedSiblings[target];

  const currentOrder =
    Number(current.sort_order)||0;

  const otherOrder =
    Number(other.sort_order)||0;

  const {error} =
    await db
      .from("mock_folders")
      .update({
        sort_order:otherOrder
      })
      .eq("id",current.id);

  if(error){

    showToast(
      "MOCK_FOLDERS: " +
      error.message,
      true
    );

    return;

  }

  const {error:error2} =
    await db
      .from("mock_folders")
      .update({
        sort_order:currentOrder
      })
      .eq("id",other.id);

  if(error2){

    showToast(
      "MOCK_FOLDERS: " +
      error2.message,
      true
    );

    return;

  }

  await loadAll();

}

/* =========================================================
   DELETE FOLDER
========================================================= */

async function deleteFolder(id){

  const folder =
    folders.find(
      x => Number(x.id) === Number(id)
    );

  if(!folder) return;

  const descendants =
    getDescendants(id);

  const allIds = [
    Number(id),
    ...descendants.map(x=>Number(x.id))
  ];

  if(
    !confirm(
      `Delete "${folder.display_name || folder.name}" and everything inside it?`
    )
  ){

    return;

  }

  /*
    Delete tests first.
  */

  const {error:testError} =
    await db
      .from("mock_tests")
      .delete()
      .in("folder_id",allIds);

  if(testError){

    showToast(
      "MOCK_TESTS: " +
      testError.message,
      true
    );

    return;

  }

  /*
    Delete deepest folders first.
  */

  const remaining =
    folders.filter(
      f => allIds.includes(Number(f.id))
    );

  while(remaining.length){

    const leafFolders =
      remaining.filter(folderItem=>{

        return !remaining.some(
          child =>
            Number(child.parent_id) ===
            Number(folderItem.id)
        );

      });

    const batch =
      leafFolders.length
        ? leafFolders
        : remaining;

    const ids =
      batch.map(
        x=>Number(x.id)
      );

    const {error} =
      await db
        .from("mock_folders")
        .delete()
        .in("id",ids);

    if(error){

      showToast(
        "MOCK_FOLDERS: " +
        error.message,
        true
      );

      return;

    }

    for(const item of batch){

      const index =
        remaining.indexOf(item);

      if(index >= 0){

        remaining.splice(index,1);

      }

    }

  }

  showToast("Folder deleted.");

  await loadAll();

}

/* =========================================================
   DESCENDANTS
========================================================= */

function getDescendants(parentId){

  const result = [];

  const queue = [
    Number(parentId)
  ];

  while(queue.length){

    const current =
      queue.shift();

    const children =
      folders.filter(
        f =>
          Number(f.parent_id) ===
          Number(current)
      );

    for(const child of children){

      result.push(child);

      queue.push(
        Number(child.id)
      );

    }

  }

  return result;

}

/* =========================================================
   PARENT NAVIGATION
========================================================= */

function goToParentFolder(id){

  const parent =
    folders.find(
      x => Number(x.id) === Number(id)
    );

  if(!parent){

    renderRootArea();

    return;

  }

  const type =
    normalizeType(parent.folder_type);

  if(type === "new" || type === "pyq"){

    renderFolderLevel(parent);

    return;

  }

  if(type === "full"){

    renderFullLevel(parent);

    return;

  }

  if(type === "sectional"){

    renderSectionalLevel(parent);

    return;

  }

  if(type === "year"){

    renderYearTests(parent);

    return;

  }

  if(type === "subject"){

    renderSubjectTests(parent);

    return;

  }

  renderRootArea();

}

/* =========================================================
   ROOT FINDER
========================================================= */

function getRootFolder(folder){

  let current = folder;

  let safety = 0;

  while(
    current &&
    current.parent_id &&
    safety < 20
  ){

    const parent =
      folders.find(
        x =>
          Number(x.id) ===
          Number(current.parent_id)
      );

    if(!parent) break;

    current = parent;

    safety++;

  }

  return current;

}

   MODAL CLOSE WHEN CLICKING BACKGROUND
========================================================= */

document

  .forEach(modal=>{

    modal.addEventListener(
      "click",
      event=>{

        if(event.target === modal){

          modal.classList.remove("show");

        }

      }
    );

  });

loadAll();
