<style>

/* =========================================================
   ADMIN PRACTICE
========================================================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
}

.admin-page{
  width:100%;
  min-height:100vh;
  padding:18px;
}

.admin-container{
  max-width:1100px;
  margin:auto;
}

.admin-title{
  font-size:26px;
  font-weight:800;
  margin-bottom:5px;
}

.admin-subtitle{
  opacity:.7;
  margin-bottom:22px;
}

.admin-topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.admin-btn{
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  background:#7c3aed;
  color:#fff;
}

.admin-btn.secondary{
  background:rgba(127,127,127,.15);
  color:inherit;
}

.admin-btn.danger{
  background:#dc2626;
}

.admin-btn.small{
  padding:7px 10px;
  font-size:12px;
  border-radius:9px;
}

.admin-section{
  margin-bottom:24px;
}

.admin-section-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:12px;
}

.exam-grid,
.root-grid,
.category-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.admin-card{
  background:rgba(127,127,127,.09);
  border:1px solid rgba(127,127,127,.16);
  border-radius:18px;
  padding:18px;
  cursor:pointer;
  transition:.2s;
}

.admin-card:hover{
  transform:translateY(-2px);
  border-color:#8b5cf6;
}

.admin-card.active{
  border:2px solid #8b5cf6;
}

.admin-card-title{
  font-size:17px;
  font-weight:800;
}

.admin-card-subtitle{
  font-size:12px;
  opacity:.65;
  margin-top:5px;
}

.admin-card-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:14px;
}

.workspace{
  margin-top:25px;
}

.breadcrumb{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:16px;
  font-size:13px;
  opacity:.8;
}

.breadcrumb span{
  cursor:pointer;
}

.breadcrumb .current{
  font-weight:800;
  opacity:1;
}

.horizontal-scroll{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:7px;
}

.horizontal-scroll::-webkit-scrollbar{
  height:5px;
}

.horizontal-scroll::-webkit-scrollbar-thumb{
  background:#7c3aed;
  border-radius:20px;
}

.subject-card,
.year-card{
  min-width:170px;
  flex:0 0 170px;
  background:rgba(127,127,127,.09);
  border:1px solid rgba(127,127,127,.16);
  border-radius:16px;
  padding:15px;
  cursor:pointer;
}

.subject-card:hover,
.year-card:hover{
  border-color:#8b5cf6;
}

.test-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:14px;
}

.test-card{
  background:rgba(127,127,127,.09);
  border:1px solid rgba(127,127,127,.16);
  border-radius:15px;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.test-title{
  font-weight:800;
}

.test-meta{
  font-size:12px;
  opacity:.65;
  margin-top:5px;
}

.test-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.empty{
  padding:22px;
  text-align:center;
  opacity:.6;
  background:rgba(127,127,127,.07);
  border-radius:15px;
}

.form-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:9999;
}

.form-overlay.show{
  display:flex;
}

.form-box{
  width:100%;
  max-width:480px;
  max-height:90vh;
  overflow-y:auto;
  background:var(--card-bg,#17151f);
  border-radius:20px;
  padding:22px;
}

.form-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:18px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:12px;
  border-radius:11px;
  border:1px solid rgba(127,127,127,.25);
  background:rgba(127,127,127,.08);
  color:inherit;
  outline:none;
}

.form-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:18px;
}

.notice{
  padding:12px 15px;
  border-radius:12px;
  background:rgba(124,58,237,.12);
  margin-bottom:18px;
  font-size:13px;
}

@media(max-width:600px){

  .admin-page{
    padding:12px;
  }

  .admin-title{
    font-size:22px;
  }

  .admin-card{
    padding:15px;
  }

  .test-card{
    flex-direction:column;
    align-items:flex-start;
  }

  .test-actions{
    justify-content:flex-start;
  }

}

</style>

<!-- =========================================================

<div id="folderOverlay" class="form-overlay">

    <div class="form-title" id="folderFormTitle">

    <div class="form-group">

      <input
        id="folderName"

    <div class="form-actions">

<div id="testOverlay" class="form-overlay">

    <div class="form-group">

    <div class="form-actions">

      <button
        class="admin-btn secondary"

      </button>

      <button

        onclick="saveTest()"
      >
        Save
      </button>

    </div>

  </div>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

/* =========================================================
   STATE
========================================================= */

let exams = [];
let folders = [];
let tests = [];
let subjects = [];

let selectedExam = null;
let currentFolder = null;

let editingExamId = null;
let editingFolderId = null;
let editingTestId = null;

let currentFolderParentId = null;
let currentFolderType = null;
let currentTestFolderId = null;

/* =========================================================
   SUPABASE REQUEST
========================================================= */

async function supabaseRequest(
  table,
  options = {}
){

  let url =
    SUPABASE_URL +
    "/rest/v1/" +
    table;

  const params = [];

  if(options.select)
    params.push(
      "select=" +
      encodeURIComponent(options.select)
    );

  if(options.filters){

    Object.entries(options.filters).forEach(
      ([key,value]) => {

        params.push(
          key +
          "=eq." +
          encodeURIComponent(value)
        );

      }
    );

  }

  if(options.order)
    params.push(
      "order=" +
      encodeURIComponent(options.order)
    );

  if(options.limit)
    params.push(
      "limit=" +
      options.limit
    );

  if(params.length)
    url += "?" + params.join("&");

  const headers = {

    "apikey": SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json"

  };

  const fetchOptions = {

    method:options.method || "GET",

    headers

  };

  if(options.body){

    fetchOptions.body =
      JSON.stringify(options.body);

  }

  const response =
    await fetch(
      url,
      fetchOptions
    );

  const text =
    await response.text();

  let data = null;

  try{

    data =
      text ?
      JSON.parse(text) :
      null;

  }catch{

    data = text;

  }

  if(!response.ok){

    throw new Error(
      data?.message ||
      data?.details ||
      data?.hint ||
      text ||
      "Supabase request failed"
    );

  }

  return data;

}

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  type = "success"
){

  const el =
    document.getElementById("message");

  el.innerHTML = `
    <div class="notice"
         style="${
           type === "error"
           ? "background:rgba(220,38,38,.12)"
           : ""
         }">
      ${escapeHtml(text)}
    </div>
  `;

  setTimeout(() => {

    el.innerHTML = "";

  },4000);

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* =========================================================
   NORMALIZE FOLDER TYPE
========================================================= */

function normalizeType(type){

  return String(type || "")
    .trim()
    .toLowerCase();

}

/* =========================================================
   SORT
========================================================= */

function sortItems(array){

  return [...array].sort(
    (a,b) => {

      const ao =
        Number(a.sort_order ?? 0);

      const bo =
        Number(b.sort_order ?? 0);

      if(ao !== bo)
        return ao - bo;

      return String(
        a.display_name ||
        a.name ||
        a.title ||
        ""
      ).localeCompare(
        String(
          b.display_name ||
          b.name ||
          b.title ||
          ""
        ),
        undefined,
        {numeric:true}
      );

    }
  );

}

/* =========================================================
   LOAD ALL
========================================================= */

async function loadAll(){

  try{

    const [
      examsData,
      foldersData,
      testsData,
      subjectsData
    ] = await Promise.all([

      supabaseRequest(
        "exams",
        {
          select:"*",
          order:"sort_order.asc"
        }
      ),

      supabaseRequest(
        "mock_folders",
        {
          select:"*",
          order:"sort_order.asc"
        }
      ),

      supabaseRequest(
        "mock_tests",
        {
          select:"*",
          order:"sort_order.asc"
        }
      ),

      supabaseRequest(
        "subjects",
        {
          select:"*"
        }
      )

    ]);

    exams =
      sortItems(examsData || []);

    folders =
      sortItems(foldersData || []);

    tests =
      sortItems(testsData || []);

    subjects =
      subjectsData || [];

    renderExams();

    if(selectedExam){

      const freshExam =
        exams.find(
          e =>
            String(e.id) ===
            String(selectedExam.id)
        );

      if(freshExam){

        selectedExam =
          freshExam;

        renderWorkspace();

      }else{

        selectedExam = null;
        currentFolder = null;
        renderWorkspace();

      }

    }

  }catch(error){

    console.error(error);

    showMessage(
      error.message,
      "error"
    );

  }

}

/* =========================================================
   EXAM RENDER
========================================================= */

function renderExams(){

  const container =
    document.getElementById("examList");

  if(!exams.length){

    container.innerHTML =
      `<div class="empty">
        No exams added yet.
      </div>`;

    return;

  }

  container.innerHTML =
    exams.map(exam => {

      const active =
        selectedExam &&
        String(selectedExam.id) ===
        String(exam.id);

      return `

        <div
          class="admin-card ${active ? "active" : ""}"
          onclick="selectExam('${exam.id}')"
        >

          <div class="admin-card-title">
            ${escapeHtml(exam.board)}
            •
            ${escapeHtml(exam.name)}
          </div>

          <div class="admin-card-subtitle">
            Practice structure
          </div>

          <div
            class="admin-card-actions"
            onclick="event.stopPropagation()"
          >

            <button
              class="admin-btn small"
              onclick="editExam('${exam.id}')"
            >
              Edit
            </button>

            <button
              class="admin-btn small secondary"
              onclick="moveExam('${exam.id}',-1)"
            >
              ↑
            </button>

            <button
              class="admin-btn small secondary"
              onclick="moveExam('${exam.id}',1)"
            >
              ↓
            </button>

            <button
              class="admin-btn small danger"
              onclick="deleteExam('${exam.id}')"
            >
              Delete
            </button>

          </div>

        </div>

      `;

    }).join("");

}

/* =========================================================
   SELECT EXAM
========================================================= */

function selectExam(id){

  selectedExam =
    exams.find(
      e =>
        String(e.id) ===
        String(id)
    ) || null;

  currentFolder = null;

  renderExams();
  renderWorkspace();

}

/* =========================================================
   RENDER WORKSPACE
========================================================= */

function renderWorkspace(){

  const workspace =
    document.getElementById("workspace");

  if(!selectedExam){

    workspace.innerHTML = "";

    return;

  }

  workspace.innerHTML = `

    <div class="admin-section">

      <div class="admin-section-title">
        ${escapeHtml(selectedExam.board)}
        →
        ${escapeHtml(selectedExam.name)}
      </div>

      <div id="hierarchyArea"></div>

    </div>

  `;

  renderRootLevel();

}

/* =========================================================
   ROOT LEVEL
========================================================= */

function renderRootLevel(){

  const area =
    document.getElementById("hierarchyArea");

  if(!area)
    return;

  const roots =
    sortItems(
      folders.filter(
        f =>
          String(f.exam_id) ===
            String(selectedExam.id) &&
          !f.parent_id
      )
    );

  const newFolder =
    roots.find(
      f =>
        normalizeType(f.folder_type) ===
        "new"
    );

  const pyqFolder =
    roots.find(
      f =>
        normalizeType(f.folder_type) ===
        "pyq"
    );

  let html = `

    <div class="breadcrumb">
      <span class="current">
        ${escapeHtml(selectedExam.name)}
      </span>
    </div>

    <div class="root-grid">

  `;

  if(newFolder){

    html += renderFolderCard(
      newFolder,
      "NEW MOCKS"
    );

  }else{

    html += `

      <div class="admin-card"
           onclick="openCategoryForm(null,'new')">

        <div class="admin-card-title">
          + NEW MOCKS
        </div>

        <div class="admin-card-subtitle">
          Add New Mocks
        </div>

      </div>

    `;

  }

  if(pyqFolder){

    html += renderFolderCard(
      pyqFolder,
      "PYQ MOCKS"
    );

  }else{

    html += `

      <div class="admin-card"
           onclick="openCategoryForm(null,'pyq')">

        <div class="admin-card-title">
          + PYQ MOCKS
        </div>

        <div class="admin-card-subtitle">
          Add PYQ Mocks
        </div>

      </div>

    `;

  }

  html += `</div>`;

  area.innerHTML = html;

}

/* =========================================================
   FOLDER CARD
========================================================= */

function renderFolderCard(
  folder,
  title
){

  return `

    <div
      class="admin-card"
      onclick="openFolder('${folder.id}')"
    >

      <div class="admin-card-title">
        ${escapeHtml(
          folder.display_name ||
          folder.name ||
          title
        )}
      </div>

      <div class="admin-card-subtitle">
        ${escapeHtml(title)}
      </div>

      <div
        class="admin-card-actions"
        onclick="event.stopPropagation()"
      >

        <button
          class="admin-btn small"
          onclick="editFolder('${folder.id}')"
        >
          Edit
        </button>

        <button
          class="admin-btn small secondary"
          onclick="moveFolder('${folder.id}',-1)"
        >
          ↑
        </button>

        <button
          class="admin-btn small secondary"
          onclick="moveFolder('${folder.id}',1)"
        >
          ↓
        </button>

        <button
          class="admin-btn small danger"
          onclick="deleteFolder('${folder.id}')"
        >
          Delete
        </button>

      </div>

    </div>

  `;

}

/* =========================================================
   OPEN FOLDER
========================================================= */

function openFolder(id){

  currentFolder =
    folders.find(
      f =>
        String(f.id) ===
        String(id)
    ) || null;

  if(!currentFolder)
    return;

  renderFolderLevel(
    currentFolder
  );

}

/* =========================================================
   RENDER FOLDER LEVEL
========================================================= */

function renderFolderLevel(
  folder
){

  const area =
    document.getElementById(
      "hierarchyArea"
    );

  if(!area)
    return;

  const type =
    normalizeType(
      folder.folder_type
    );

  const parent =
    folder.parent_id
      ? folders.find(
          f =>
            String(f.id) ===
            String(folder.parent_id)
        )
      : null;

  let breadcrumb = `

    <div class="breadcrumb">

      <span onclick="renderRootLevel()">
        ${escapeHtml(selectedExam.name)}
      </span>

      <span>›</span>

      ${
        parent
        ? `
          <span
            onclick="openFolder('${parent.id}')"
          >
            ${escapeHtml(
              parent.display_name ||
              parent.name
            )}
          </span>

          <span>›</span>
        `
        : ""
      }

      <span class="current">
        ${escapeHtml(
          folder.display_name ||
          folder.name
        )}
      </span>

    </div>

  `;

  let html =
    breadcrumb;

  /* =======================================================
     NEW / PYQ
  ======================================================= */

  if(type === "new" || type === "pyq"){

    const children =
      sortItems(
        folders.filter(
          f =>
            String(f.parent_id) ===
            String(folder.id)
        )
      );

    const fullFolder =
      children.find(
        f =>
          normalizeType(
            f.folder_type
          ) === "full"
      );

    const sectionalFolder =
      children.find(
        f =>
          normalizeType(
            f.folder_type
          ) === "sectional"
      );

    html += `

      <div class="category-grid">

    `;

    if(fullFolder){

      html += renderFolderCard(
        fullFolder,
        "FULL MOCKS"
      );

    }

    if(sectionalFolder){

      html += renderFolderCard(
        sectionalFolder,
        "SECTIONAL MOCKS"
      );

    }

    html += `</div>`;

    /*
      IMPORTANT:
      Only allow the missing category to be added.
      If both exist, no duplicate category button.
    */

    if(!fullFolder || !sectionalFolder){

      let missingType = null;

      if(!fullFolder)
        missingType = "full";

      if(!sectionalFolder && !missingType)
        missingType = "sectional";

      const buttonText =
        missingType === "full"
          ? "+ Add FULL MOCKS"
          : missingType === "sectional"
            ? "+ Add SECTIONAL MOCKS"
            : "+ Add Category";

      html += `

        <div style="margin-top:15px">

          <button
            class="admin-btn"
            onclick="openCategoryForm(
              '${folder.id}',
              '${missingType || ""}'
            )"
          >
            ${buttonText}
          </button>

        </div>

      `;

    }

    area.innerHTML =
      html;

    return;

  }

  /* =======================================================
     FULL
  ======================================================= */

  if(type === "full"){

    const parentType =
      parent
        ? normalizeType(
            parent.folder_type
          )
        : "";

    /*
      NEW FULL
      Tests directly
    */

    if(parentType === "new"){

      html += renderTestArea(
        folder,
        "FULL MOCKS"
      );

      area.innerHTML =
        html;

      return;

    }

    /*
      PYQ FULL
      Show years
    */

    if(parentType === "pyq"){

      const years =
        sortItems(
          folders.filter(
            f =>
              String(f.parent_id) ===
              String(folder.id) &&
              normalizeType(
                f.folder_type
              ) === "year"
          )
        );

      html += `

        <div class="admin-section-title">
          PYQ YEARS
        </div>

        <div class="horizontal-scroll">

          ${
            years.length
              ? years
                  .map(
                    year =>
                      renderYearCard(year)
                  )
                  .join("")
              : `
                <div class="empty">
                  No years added.
                </div>
              `
          }

        </div>

        <div style="margin-top:15px">

          <button
            class="admin-btn"
            onclick="openCategoryForm(
              '${folder.id}',
              'year'
            )"
          >
            + Add Year
          </button>

        </div>

      `;

      area.innerHTML =
        html;

      return;

    }

  }

  /* =======================================================
     SECTIONAL
  ======================================================= */

  if(type === "sectional"){

    const subjectsFolders =
      sortItems(
        folders.filter(
          f =>
            String(f.parent_id) ===
            String(folder.id) &&
            normalizeType(
              f.folder_type
            ) === "subject"
        )
      );

    html += `

      <div class="admin-section-title">
        SUBJECTS
      </div>

      <div class="horizontal-scroll">

        ${
          subjectsFolders.length
            ? subjectsFolders
                .map(
                  subject =>
                    renderSubjectCard(
                      subject
                    )
                )
                .join("")
            : `
              <div class="empty">
                No subjects added.
              </div>
            `
        }

      </div>

      <div style="margin-top:15px">

        <button
          class="admin-btn"
          onclick="openCategoryForm(
            '${folder.id}',
            'subject'
          )"
        >
          + Add Subject
        </button>

      </div>

    `;

    area.innerHTML =
      html;

    return;

  }

  /* =======================================================
     YEAR
  ======================================================= */

  if(type === "year"){

    html += renderTestArea(
      folder,
      folder.display_name ||
      folder.name ||
      "YEAR"
    );

    area.innerHTML =
      html;

    return;

  }

  /* =======================================================
     SUBJECT
  ======================================================= */

  if(type === "subject"){

    html += renderTestArea(
      folder,
      folder.display_name ||
      folder.name ||
      "SUBJECT"
    );

    area.innerHTML =
      html;

    return;

  }

  area.innerHTML =
    html;

}

/* =========================================================
   SAVE EXAM
========================================================= */

async function saveExam(){

  const board =
    document.getElementById(
      "examBoard"
    ).value.trim();

  const name =
    document.getElementById(
      "examName"
    ).value.trim();

  if(!name){

    showMessage(
      "Please enter exam name.",
      "error"
    );

    return;

  }

  /*
    IMPORTANT:
    Capture edit state BEFORE closeExamForm()
    because closeExamForm() clears editingExamId.
  */

  const wasEditing =
    !!editingExamId;

  const savedExamId =
    editingExamId;

  try{

    if(wasEditing){

      await supabaseRequest(
        "exams",
        {
          method:"PATCH",

          filters:{
            id:savedExamId
          },

          body:{
            board,
            name
          }

        }
      );

    }else{

      /*
        IMPORTANT:
        exams.mock_type allows only:
        SECTIONAL
        SUBJECT_WISE

        We use SECTIONAL as the
        required legacy value.
      */

      const created =
        await supabaseRequest(
          "exams",
          {
            method:"POST",

            body:{
              board,
              name,
              mock_type:"SECTIONAL",
              is_active:true,
              sort_order:
                exams.length
                  ? Math.max(
                      ...exams.map(
                        e =>
                          Number(
                            e.sort_order || 0
                          )
                      )
                    ) + 1
                  : 0
            }
          }
        );

      const newExam =
        Array.isArray(created)
          ? created[0]
          : created;

      if(newExam?.id){

        await createDefaultStructure(
          newExam.id
        );

      }

    }

    closeExamForm();

    await loadAll();

    if(wasEditing){

      const updated =
        exams.find(
          e =>
            String(e.id) ===
            String(savedExamId)
        );

      if(updated){

        selectedExam =
          updated;

      }

    }else{

      const newest =
        [...exams]
          .sort(
            (a,b) =>
              Number(b.id) -
              Number(a.id)
          )[0];

      if(newest){

        selectedExam =
          newest;

      }

    }

    renderExams();
    renderWorkspace();

    showMessage(
      wasEditing
        ? "Exam updated successfully."
        : "Exam created successfully."
    );

  }catch(error){

    console.error(error);

    showMessage(
      error.message,
      "error"
    );

  }

}

async function createDefaultStructure(
  examId
){

  const existing =
    folders.filter(
      f =>
        String(f.exam_id) ===
        String(examId)
    );

  if(existing.length)
    return;

  /*
    Root:
      NEW MOCKS
      PYQ MOCKS
  */

  const rootRows = [

    {
      exam_id:examId,
      name:"NEW MOCKS",
      display_name:"NEW MOCKS",
      folder_type:"new",
      parent_id:null,
      sort_order:0,
      is_active:true
    },

    {
      exam_id:examId,
      name:"PYQ MOCKS",
      display_name:"PYQ MOCKS",
      folder_type:"pyq",
      parent_id:null,
      sort_order:1,
      is_active:true
    }

  ];

  const roots =
    await supabaseRequest(
      "mock_folders",
      {
        method:"POST",
        body:rootRows
      }
    );

  const newRoot =
    roots[0];

  const pyqRoot =
    roots[1];

  /*
    Children:
      FULL MOCKS
      SECTIONAL MOCKS
  */

  const children = [

    {
      exam_id:examId,
      name:"FULL MOCKS",
      display_name:"FULL MOCKS",
      folder_type:"full",
      parent_id:newRoot.id,
      sort_order:0,
      is_active:true
    },

    {
      exam_id:examId,
      name:"SECTIONAL MOCKS",
      display_name:"SECTIONAL MOCKS",
      folder_type:"sectional",
      parent_id:newRoot.id,
      sort_order:1,
      is_active:true
    },

    {
      exam_id:examId,
      name:"FULL MOCKS",
      display_name:"FULL MOCKS",
      folder_type:"full",
      parent_id:pyqRoot.id,
      sort_order:0,
      is_active:true
    },

    {
      exam_id:examId,
      name:"SECTIONAL MOCKS",
      display_name:"SECTIONAL MOCKS",
      folder_type:"sectional",
      parent_id:pyqRoot.id,
      sort_order:1,
      is_active:true
    }

  ];

  await supabaseRequest(
    "mock_folders",
    {
      method:"POST",
      body:children
    }
  );

}

/* =========================================================
   OPEN CATEGORY FORM
========================================================= */

function openCategoryForm(
  parentId = null,
  forcedType = null
){

  const parent =
    parentId
      ? folders.find(
          f =>
            String(f.id) ===
            String(parentId)
        )
      : null;

  /*
    Root category:
      new / pyq
  */

  if(!parent && forcedType){

    const exists =
      folders.some(
        f =>
          String(f.exam_id) ===
            String(selectedExam.id) &&
          !f.parent_id &&
          normalizeType(
            f.folder_type
          ) ===
            normalizeType(forcedType)
      );

    if(exists){

      showMessage(
        "This category already exists.",
        "error"
      );

      return;

    }

  }

  /*
    NEW/PYQ children:
      full / sectional

    Prevent duplicate.
  */

  if(parent){

    const parentType =
      normalizeType(
        parent.folder_type
      );

    if(
      (parentType === "new" ||
       parentType === "pyq") &&
      forcedType
    ){

      const exists =
        folders.some(
          f =>
            String(f.parent_id) ===
              String(parent.id) &&
            normalizeType(
              f.folder_type
            ) ===
              normalizeType(forcedType)
        );

      if(exists){

        showMessage(
          "This category already exists.",
          "error"
        );

        return;

      }

    }

  }

  currentFolderParentId =
    parentId;

  currentFolderType =
    forcedType || null;

  editingFolderId = null;

  let defaultName = "";

  if(forcedType === "new")
    defaultName = "NEW MOCKS";

  if(forcedType === "pyq")
    defaultName = "PYQ MOCKS";

  if(forcedType === "full")
    defaultName = "FULL MOCKS";

  if(forcedType === "sectional")
    defaultName = "SECTIONAL MOCKS";

  if(forcedType === "year")
    defaultName = "";

  if(forcedType === "subject")
    defaultName = "";

  document.getElementById(
    "folderFormTitle"
  ).textContent =
    forcedType === "year"
      ? "Add Year"
      : forcedType === "subject"
        ? "Add Subject"
        : "Add Category";

  document.getElementById(
    "folderName"
  ).value =
    defaultName;

  document.getElementById(
    "folderOverlay"
  ).classList.add("show");

}

            )
          : null;

      const siblings =
        folders.filter(

            ) ===
              String(

              )

        siblings.length
          ? Math.max(
              ...siblings.map(

                  Number(

                  )
              )
            )
          : -1;

      await supabaseRequest(

          body:{

            parent_id:
              currentFolderParentId ||
              null,

            name,

            display_name:name,

            folder_type:
              currentFolderType ||
              "subject",

            sort_order:
              maxOrder + 1,

            is_active:true

/* =========================================================
   DELETE FOLDER
========================================================= */

async function deleteFolder(
  id
){

  const folder =
    folders.find(
      f =>
        String(f.id) ===
        String(id)
    );

  if(!folder)
    return;

  if(
    !confirm(
      `Delete "${folder.display_name || folder.name}" and everything inside it?`
    )
  )
    return;

  try{

    /*
      Delete descendants first.
    */

    const allIds =
      getDescendantFolderIds(id);

    allIds.push(id);

    /*
      Tests must be deleted before folders.
    */

    await supabaseRequest(
      "mock_tests",
      {
        method:"DELETE",

        filters:{
          folder_id:id
        }
      }
    );

    for(
      const childId
      of allIds.filter(
        x =>
          String(x) !==
          String(id)
      )
    ){

      await supabaseRequest(
        "mock_tests",
        {
          method:"DELETE",

          filters:{
            folder_id:childId
          }
        }
      );

    }

    /*
      Delete folders from deepest level.
    */

    const descendants =
      allIds
        .filter(
          x =>
            String(x) !==
            String(id)
        )
        .reverse();

    for(
      const childId
      of descendants
    ){

      await supabaseRequest(
        "mock_folders",
        {
          method:"DELETE",

          filters:{
            id:childId
          }
        }
      );

    }

    await supabaseRequest(
      "mock_folders",
      {
        method:"DELETE",

        filters:{
          id
        }
      }
    );

    currentFolder = null;

    await loadAll();

    renderWorkspace();

    showMessage(
      "Folder deleted successfully."
    );

  }catch(error){

    console.error(error);

    showMessage(
      error.message,
      "error"
    );

  }

}

/* =========================================================
   GET DESCENDANTS
========================================================= */

function getDescendantFolderIds(
  parentId
){

  const result = [];

  function walk(id){

    const children =
      folders.filter(
        f =>
          String(f.parent_id) ===
          String(id)
      );

    children.forEach(
      child => {

        result.push(child.id);

        walk(child.id);

      }
    );

  }

  walk(parentId);

  return result;

}

/* =========================================================
   MOVE FOLDER
========================================================= */

async function moveFolder(
  id,
  direction
){

  const folder =
    folders.find(
      f =>
        String(f.id) ===
        String(id)
    );

  if(!folder)
    return;

  const siblings =
    sortItems(
      folders.filter(
        f =>
          String(f.exam_id) ===
            String(folder.exam_id) &&
          String(
            f.parent_id || ""
          ) ===
            String(
              folder.parent_id || ""
            )
      )
    );

  const index =
    siblings.findIndex(
      f =>
        String(f.id) ===
        String(id)
    );

  const targetIndex =
    index + direction;

  if(
    targetIndex < 0 ||
    targetIndex >= siblings.length
  )
    return;

  const other =
    siblings[targetIndex];

  try{

    const oldOrder =
      Number(
        folder.sort_order || 0
      );

    const newOrder =
      Number(
        other.sort_order || 0
      );

    await Promise.all([

      supabaseRequest(
        "mock_folders",
        {
          method:"PATCH",

          filters:{
            id:folder.id
          },

          body:{
            sort_order:newOrder
          }

        }
      ),

      supabaseRequest(
        "mock_folders",
        {
          method:"PATCH",

          filters:{
            id:other.id
          },

          body:{
            sort_order:oldOrder
          }

        }
      )

    ]);

    await loadAll();

    renderWorkspace();

  }catch(error){

    console.error(error);

    showMessage(
      error.message,
      "error"
    );

  }

}

    Number(
      document.getElementById(
        "testDuration"
      ).value
    );

  const totalQuestions =
    Number(
      document.getElementById(
        "testQuestions"
      ).value
    );

  if(!title){

    showMessage(
      "Please enter test title.",
      "error"
    );

    return;

  }

  if(
    !duration ||
    duration < 1
  ){

    showMessage(
      "Please enter valid duration.",
      "error"
    );

    return;

  }

  if(
    !totalQuestions ||
    totalQuestions < 1
  ){

    showMessage(
      "Please enter valid question count.",
      "error"
    );

    return;

  }

  try{

    if(editingTestId){

      await supabaseRequest(
        "mock_tests",
        {
          method:"PATCH",

          filters:{
            id:editingTestId
          },

          body:{
            title,
            duration_minutes:duration,
            total_questions:totalQuestions
          }

        }
      );

    }else{

      const folder =
        folders.find(
          f =>
            String(f.id) ===
            String(
              currentTestFolderId
            )
        );

      if(!folder){

        showMessage(
          "Folder not found.",
          "error"
        );

        return;

      }

      const folderTests =
        tests.filter(
          t =>
            String(t.folder_id) ===
            String(folder.id)
        );

      const maxOrder =
        folderTests.length
          ? Math.max(
              ...folderTests.map(
                t =>
                  Number(
                    t.sort_order || 0
                  )
              )
            )
          : -1;

      /*
        IMPORTANT FIX:
        Use uppercase test_type values
        accepted by database constraint.
      */

      const testType =
        inferTestType(
          folder
        );

      await supabaseRequest(
        "mock_tests",
        {
          method:"POST",

          body:{
            exam_id:selectedExam.id,

            folder_id:
              folder.id,

            title,

            test_type:
              testType,

            subject_id:
              folder.subject_id ||
              null,

            duration_minutes:
              duration,

            total_questions:
              totalQuestions,

            is_active:true,

            sort_order:
              maxOrder + 1
          }

        }
      );

    }

    closeTestForm();

    await loadAll();

    renderWorkspace();

    showMessage(
      editingTestId
        ? "Test updated successfully."
        : "Test added successfully."
    );

  }catch(error){

    console.error(error);

    showMessage(
      error.message,
      "error"
    );

  }

}

/* =========================================================
   MOVE TEST
========================================================= */

async function moveTest(
  id,
  direction
){

  const test =
    tests.find(
      t =>
        String(t.id) ===
        String(id)
    );

  if(!test)
    return;

  const siblings =
    sortItems(
      tests.filter(
        t =>
          String(t.folder_id) ===
          String(test.folder_id)
      )
    );

  const index =
    siblings.findIndex(
      t =>
        String(t.id) ===
        String(id)
    );

  const targetIndex =
    index + direction;

  if(
    targetIndex < 0 ||
    targetIndex >= siblings.length
  )
    return;

  const other =
    siblings[targetIndex];

  try{

    const oldOrder =
      Number(
        test.sort_order || 0
      );

    const newOrder =
      Number(
        other.sort_order || 0
      );

    await Promise.all([

      supabaseRequest(
        "mock_tests",
        {
          method:"PATCH",

          filters:{
            id:test.id
          },

          body:{
            sort_order:newOrder
          }

        }
      ),

      supabaseRequest(
        "mock_tests",
        {
          method:"PATCH",

          filters:{
            id:other.id
          },

          body:{
            sort_order:oldOrder
          }

        }
      )

    ]);

    await loadAll();

    renderWorkspace();

  }catch(error){

    console.error(error);

    showMessage(
      error.message,
      "error"
    );

  }

}

/* =========================================================
   DELETE EXAM
========================================================= */

async function deleteExam(
  id
){

  const exam =
    exams.find(
      e =>
        String(e.id) ===
        String(id)
    );

  if(!exam)
    return;

  if(
    !confirm(
      `Delete ${exam.board} ${exam.name} and all its mocks/tests?`
    )
  )
    return;

  try{

    const examFolders =
      folders.filter(
        f =>
          String(f.exam_id) ===
          String(id)
      );

    /*
      Delete tests first.
    */

    const examTests =
      tests.filter(
        t =>
          String(t.exam_id) ===
          String(id)
      );

    for(
      const test
      of examTests
    ){

      await supabaseRequest(
        "mock_tests",
        {
          method:"DELETE",

          filters:{
            id:test.id
          }
        }
      );

    }

    /*
      Delete folders deepest first.
    */

    const folderIds =
      examFolders
        .map(f => f.id)
        .reverse();

    for(
      const folderId
      of folderIds
    ){

      await supabaseRequest(
        "mock_folders",
        {
          method:"DELETE",

          filters:{
            id:folderId
          }
        }
      );

    }

    await supabaseRequest(
      "exams",
      {
        method:"DELETE",

        filters:{
          id
        }
      }
    );

    if(
      selectedExam &&
      String(selectedExam.id) ===
      String(id)
    ){

      selectedExam = null;
      currentFolder = null;

    }

    await loadAll();

    renderWorkspace();

    showMessage(
      "Exam deleted successfully."
    );

  }catch(error){

    console.error(error);

    showMessage(
      error.message,
      "error"
    );

  }

}
