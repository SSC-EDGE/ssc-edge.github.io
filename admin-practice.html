<!DOCTYPE html>
<html lang="en">

<head>

<script>
document.documentElement.dataset.theme =
  localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSC EDGE - Admin Practice</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================================================
   ADMIN PRACTICE
========================================================= */

body {
    padding-bottom: 40px;
}

.admin-container {
    max-width: 900px;
    margin: auto;
    padding: 18px 15px 40px;
}

.admin-header {
    margin-bottom: 20px;
}

.admin-title {
    font-size: 26px;
    font-weight: 900;
}

.admin-subtitle {
    color: var(--text-muted);
    margin-top: 4px;
}


/* =========================================================
   PANELS
========================================================= */

.admin-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 15px;
}

.panel-title {
    font-size: 16px;
    font-weight: 900;
    margin-bottom: 14px;
}


/* =========================================================
   INPUTS
========================================================= */

.form-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 10px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group.full {
    grid-column: 1/-1;
}

.form-label {
    font-size: 11px;
    font-weight: 800;
    color: var(--text-muted);
}

input,
select {

    width: 100%;
    box-sizing: border-box;

    border: 1px solid var(--border);

    background: var(--bg);

    color: var(--text);

    border-radius: 11px;

    padding: 11px 12px;

    outline: none;

    font-size: 14px;
}

input:focus,
select:focus {
    border-color: var(--purple2);
}


/* =========================================================
   BUTTONS
========================================================= */

.admin-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 13px;
}

.btn {

    border: 0;

    border-radius: 10px;

    padding: 10px 14px;

    font-weight: 800;

    cursor: pointer;

    background: var(--purple2);

    color: white;
}

.btn.secondary {

    background: rgba(145,83,255,.12);

    color: var(--purple2);

}

.btn.danger {

    background: rgba(220,50,70,.12);

    color: #ff5d70;

}

.btn.small {
    padding: 7px 10px;
    font-size: 11px;
}


/* =========================================================
   EXAM LIST
========================================================= */

.exam-admin-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.exam-admin-card {

    border: 1px solid var(--border);

    border-radius: 16px;

    background: var(--bg);

    overflow: hidden;

}

.exam-admin-head {

    padding: 14px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

}

.exam-admin-name {
    font-weight: 900;
}

.exam-admin-meta {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 3px;
}

.exam-admin-actions {

    display: flex;

    gap: 5px;

    flex-wrap: wrap;

    justify-content: flex-end;

}


/* =========================================================
   TREE
========================================================= */

.tree {

    border-top: 1px solid var(--border);

    padding: 12px;

}

.tree-node {

    margin-bottom: 9px;

}

.tree-row {

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 10px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 12px;

}

.tree-indent {
    width: 14px;
    flex: 0 0 14px;
}

.tree-icon {

    width: 30px;

    height: 30px;

    border-radius: 9px;

    background: rgba(145,83,255,.12);

    color: var(--purple2);

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: 900;

    font-size: 11px;

}

.tree-info {
    flex: 1;
    min-width: 0;
}

.tree-name {
    font-weight: 800;
    font-size: 13px;
}

.tree-type {
    color: var(--text-muted);
    font-size: 10px;
    margin-top: 2px;
}

.tree-actions {

    display: flex;

    gap: 4px;

    flex-wrap: wrap;

}

.empty-admin {

    padding: 25px 10px;

    text-align: center;

    color: var(--text-muted);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .exam-admin-head {
        align-items: flex-start;
        flex-direction: column;
    }

    .exam-admin-actions {
        justify-content: flex-start;
    }

    .tree-row {
        align-items: flex-start;
    }

}

</style>

</head>

    <div class="header-brand">
        SSC <span style="color:var(--purple2);">EDGE</span>

</header>


<main class="admin-container">


<!-- =====================================================

<!-- =====================================================

<!-- =====================================================

<section class="admin-panel">

    <div class="form-grid">


        <div class="form-group">

            <label class="form-label">
                Exam
            </label>

            <select id="folderExam">
            </select>

        </div>


        <div class="form-group">

            <label class="form-label">

        <div class="form-group">

            <label class="form-label">

            </label>

                <option value="new">

                <option value="pyq">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   DATA
========================================================= */

let exams = [];
let folders = [];
let subjects = [];


/* =========================================================
   HELPERS
========================================================= */

function $(id) {
    return document.getElementById(id);
}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function folderName(folder) {

    return folder.display_name ||
           folder.name ||
           "";
}


/* =========================================================
   LOAD
========================================================= */

async function loadAll() {

    const [
        examResult,
        folderResult,
        subjectResult
    ] = await Promise.all([

        supabaseClient
            .from("exams")
            .select("*")
            .order("sort_order",{ascending:true}),

        supabaseClient
            .from("mock_folders")
            .select("*")
            .order("sort_order",{ascending:true}),

        supabaseClient
            .from("subjects")
            .select("*")
            .order("id",{ascending:true})

    ]);


    if (examResult.error)
        throw examResult.error;

    if (folderResult.error)
        throw folderResult.error;

    if (subjectResult.error)
        throw subjectResult.error;


    exams = examResult.data || [];

    folders = folderResult.data || [];

    subjects = subjectResult.data || [];


    populateExamSelect();

    populateSubjectSelect();

    renderAdmin();

}


/* =========================================================
   EXAM SELECT
========================================================= */

function populateExamSelect() {

    $("folderExam").innerHTML =
        exams.map(exam => `

            <option value="${exam.id}">
                ${escapeHTML(exam.board)}
                —
                ${escapeHTML(exam.name)}
            </option>

        `).join("");


    updateParentSelect();

}


function populateSubjectSelect() {

    $("folderSubject").innerHTML = `

        <option value="">
            None
        </option>

        ${
            subjects.map(subject => `

                <option value="${subject.id}">
                    ${escapeHTML(
                        subject.name ||
                        subject.title ||
                        "Subject"
                    )}
                </option>

            `).join("")
        }

    `;

}


/* =========================================================
   PARENT SELECT
========================================================= */

function updateParentSelect() {

    const examId =
        Number($("folderExam").value);


    const examFolders =
        folders
            .filter(f =>
                Number(f.exam_id) === examId
            )
            .sort((a,b) =>
                (a.sort_order || 0) -
                (b.sort_order || 0)
            );


    $("folderParent").innerHTML = `

        <option value="">
            Exam Root
        </option>

        ${
            examFolders.map(folder => `

                <option value="${folder.id}">
                    ${escapeHTML(
                        folderName(folder)
                    )}
                    — ${escapeHTML(
                        folder.folder_type
                    )}
                </option>

            `).join("")
        }

    `;

}


$("folderExam")
    .addEventListener(
        "change",
        updateParentSelect
    );


/* =========================================================
   ADD EXAM
========================================================= */

async function addExam() {

    const board =
        $("examBoard").value;

    const name =
        $("examName").value.trim();

    const mockType =
        $("examMockType").value;


    if (!name) {

        alert("Please enter exam name.");

        return;
    }


    const sameBoard =
        exams.filter(e =>
            String(e.board).toUpperCase() ===
            String(board).toUpperCase()
        );


    const nextOrder =
        sameBoard.length + 1;


    const { error } =
        await supabaseClient
            .from("exams")
            .insert({

                board,
                name,
                mock_type: mockType,
                is_active: true,
                sort_order: nextOrder

            });


    if (error) {

        console.error(error);

        alert(
            "Unable to add exam.\n\n" +
            error.message
        );

        return;
    }


    $("examName").value = "";

    await loadAll();

    alert("Exam added successfully.");

}


/* =========================================================
   ADD FOLDER
========================================================= */

async function addFolder() {

    const examId =
        Number($("folderExam").value);

    const parentValue =
        $("folderParent").value;

    const type =
        $("folderType").value;

    const name =
        $("folderName").value.trim();

    const order =
        Number(
            $("folderOrder").value || 1
        );

    const subjectValue =
        $("folderSubject").value;


    if (!examId) {

        alert("Please select exam.");

        return;
    }


    if (!name) {

        alert("Please enter display name.");

        return;
    }


    const parentId =
        parentValue
            ? Number(parentValue)
            : null;


    /*
       Basic hierarchy validation
    */

    if (
        parentId === null &&
        !["new","pyq"].includes(type)
    ) {

        alert(
            "At exam level you can add only NEW MOCKS or PYQ MOCKS."
        );

        return;
    }


    if (parentId !== null) {

        const parent =
            folders.find(f =>
                Number(f.id) === parentId
            );


        if (!parent) {

            alert("Invalid parent.");

            return;
        }


        if (
            ["new","pyq"].includes(parent.folder_type)
            &&
            !["full","sectional"].includes(type)
        ) {

            alert(
                "Under NEW/PYQ you can add only FULL MOCKS or SECTIONAL MOCKS."
            );

            return;
        }


        if (
            parent.folder_type === "full"
            &&
            !(
                parentId &&
                folders.some(f =>
                    Number(f.parent_id) === parentId &&
                    f.folder_type === "year"
                )
            )
            &&
            type !== "year"
        ) {

            /*
              New FULL does not need child folders.
              PYQ FULL does.
              We therefore allow only YEAR as
              a child when explicitly selected.
            */

        }


        if (
            parent.folder_type === "sectional"
            &&
            type !== "subject"
        ) {

            alert(
                "Under SECTIONAL MOCKS you can add only SUBJECTS."
            );

            return;
        }

    }


    const data = {

        exam_id: examId,

        parent_id: parentId,

        name: name,

        display_name: name,

        folder_type: type,

        sort_order: order,

        is_active: true

    };


    if (subjectValue) {

        data.subject_id =
            Number(subjectValue);

    }


    const { error } =
        await supabaseClient
            .from("mock_folders")
            .insert(data);


    if (error) {

        console.error(error);

        alert(
            "Unable to add category.\n\n" +
            error.message
        );

        return;
    }


    $("folderName").value = "";

    await loadAll();

    alert("Category added successfully.");

}


/* =========================================================
   RENDER ADMIN
========================================================= */

function renderAdmin() {

    const container =
        $("examAdminList");


    if (!exams.length) {

        container.innerHTML = `
            <div class="empty-admin">
                No exams added yet.
            </div>
        `;

        return;
    }


    container.innerHTML =
        exams.map(exam => `

            <div class="exam-admin-card">


                <div class="exam-admin-head">

                    <div>

                        <div class="exam-admin-name">

                            ${escapeHTML(exam.board)}
                            —
                            ${escapeHTML(exam.name)}

                        </div>

                        <div class="exam-admin-meta">

                            Order:
                            ${exam.sort_order || 0}

                            •

                            ${
                                exam.is_active !== false
                                ? "Active"
                                : "Hidden"
                            }

                        </div>

                    </div>


                    <div class="exam-admin-actions">

                        <button
                            class="btn small secondary"
                            onclick="editExam(${exam.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="btn small secondary"
                            onclick="moveExam(${exam.id},-1)"
                        >
                            ↑
                        </button>

                        <button
                            class="btn small secondary"
                            onclick="moveExam(${exam.id},1)"
                        >
                            ↓
                        </button>

                        <button
                            class="btn small danger"
                            onclick="deleteExam(${exam.id})"
                        >
                            Delete
                        </button>

                    </div>

                </div>


                <div class="tree">

                    ${renderExamTree(exam)}

                </div>

            </div>

        `).join("");

}


/* =========================================================
   TREE
========================================================= */

function renderExamTree(exam) {

    const roots =
        folders
            .filter(f =>
                Number(f.exam_id) ===
                Number(exam.id)
            )
            .filter(f =>
                f.parent_id === null
            )
            .sort((a,b) =>
                (a.sort_order || 0) -
                (b.sort_order || 0)
            );


    if (!roots.length) {

        return `
            <div class="empty-admin">
                No NEW/PYQ categories yet.
            </div>
        `;

    }


    return roots
        .map(folder =>
            renderTreeNode(folder,0)
        )
        .join("");

}


function renderTreeNode(folder,level) {

    const children =
        folders
            .filter(f =>
                Number(f.parent_id) ===
                Number(folder.id)
            )
            .sort((a,b) =>
                (a.sort_order || 0) -
                (b.sort_order || 0)
            );


    let html = `

        <div class="tree-node">

            <div class="tree-row">

                <div
                    class="tree-indent"
                    style="width:${level * 18}px"
                ></div>

                <div class="tree-icon">
                    ${treeIcon(folder.folder_type)}
                </div>

                <div class="tree-info">

                    <div class="tree-name">
                        ${escapeHTML(
                            folderName(folder)
                        )}
                    </div>

                    <div class="tree-type">
                        ${escapeHTML(
                            folder.folder_type
                        )}
                        • Order
                        ${folder.sort_order || 0}
                        •
                        ${
                            folder.is_active !== false
                            ? "Active"
                            : "Hidden"
                        }
                    </div>

                </div>


                <div class="tree-actions">

                    <button
                        class="btn small secondary"
                        onclick="editFolder(${folder.id})"
                    >
                        Edit
                    </button>

                    <button
                        class="btn small secondary"
                        onclick="moveFolder(${folder.id},-1)"
                    >
                        ↑
                    </button>

                    <button
                        class="btn small secondary"
                        onclick="moveFolder(${folder.id},1)"
                    >
                        ↓
                    </button>

                    <button
                        class="btn small danger"
                        onclick="deleteFolder(${folder.id})"
                    >
                        Delete
                    </button>

                </div>

            </div>

            ${
                children
                    .map(child =>
                        renderTreeNode(
                            child,
                            level + 1
                        )
                    )
                    .join("")
            }

        </div>

    `;


    return html;

}


function treeIcon(type) {

    if (type === "new") return "N";

    if (type === "pyq") return "P";

    if (type === "full") return "F";

    if (type === "sectional") return "S";

    if (type === "year") return "Y";

    if (type === "subject") return "S";

    return "•";

}


/* =========================================================
   EDIT EXAM
========================================================= */

function editExam(id) {

    const exam =
        exams.find(e =>
            Number(e.id) === Number(id)
        );

    if (!exam) return;


    $("editId").value = exam.id;

    $("editKind").value = "exam";

    $("editName").value =
        exam.name || "";

    $("editBoard").value =
        exam.board || "SSC";

    $("editMockType").value =
        exam.mock_type || "Sectional";

    $("editOrder").value =
        exam.sort_order || 1;

    $("editActive").value =
        exam.is_active !== false
            ? "true"
            : "false";


    $("editPanel").style.display =
        "block";

    $("editPanel").scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

}


/* =========================================================
   EDIT FOLDER
========================================================= */

function editFolder(id) {

    const folder =
        folders.find(f =>
            Number(f.id) === Number(id)
        );

    if (!folder) return;


    $("editId").value =
        folder.id;

    $("editKind").value =
        "folder";

    $("editName").value =
        folderName(folder);

    $("editOrder").value =
        folder.sort_order || 1;

    $("editActive").value =
        folder.is_active !== false
            ? "true"
            : "false";


    $("editBoardGroup").style.display =
        "none";

    $("editMockTypeGroup").style.display =
        "none";


    $("editPanel").style.display =
        "block";

    $("editPanel").scrollIntoView({
        behavior:"smooth",
        block:"center"
    });

}


/* =========================================================
   SAVE EDIT
========================================================= */

async function saveEdit() {

    const id =
        Number($("editId").value);

    const kind =
        $("editKind").value;


    if (!id) return;


    if (kind === "exam") {

        const updateData = {

            name:
                $("editName")
                    .value
                    .trim(),

            board:
                $("editBoard").value,

            mock_type:
                $("editMockType").value,

            sort_order:
                Number(
                    $("editOrder").value || 1
                ),

            is_active:
                $("editActive").value === "true"

        };


        if (!updateData.name) {

            alert("Name required.");

            return;
        }


        const { error } =
            await supabaseClient
                .from("exams")
                .update(updateData)
                .eq("id",id);


        if (error) {

            alert(error.message);

            return;
        }

    }


    else {

        const name =
            $("editName")
                .value
                .trim();


        if (!name) {

            alert("Name required.");

            return;
        }


        const { error } =
            await supabaseClient
                .from("mock_folders")
                .update({

                    name,

                    display_name:name,

                    sort_order:
                        Number(
                            $("editOrder")
                                .value || 1
                        ),

                    is_active:
                        $("editActive")
                            .value === "true"

                })
                .eq("id",id);


        if (error) {

            alert(error.message);

            return;
        }

    }


    closeEdit();

    await loadAll();

    alert("Saved successfully.");

}


/* =========================================================
   CLOSE EDIT
========================================================= */

function closeEdit() {

    $("editPanel").style.display =
        "none";

}

/* =========================================================
   MOVE EXAM
========================================================= */

async function moveExam(id,direction) {

    const exam =
        exams.find(e =>
            Number(e.id) === Number(id)
        );

    if (!exam) return;


    const boardExams =
        exams
            .filter(e =>
                String(e.board).toUpperCase() ===
                String(exam.board).toUpperCase()
            )
            .sort((a,b) =>
                (a.sort_order || 0) -
                (b.sort_order || 0)
            );


    const index =
        boardExams.findIndex(e =>
            Number(e.id) === Number(id)
        );


    const targetIndex =
        index + direction;


    if (
        targetIndex < 0 ||
        targetIndex >= boardExams.length
    ) return;


    const target =
        boardExams[targetIndex];


    const oldOrder =
        exam.sort_order || index + 1;

    const targetOrder =
        target.sort_order ||
        targetIndex + 1;


    await Promise.all([

        supabaseClient
            .from("exams")
            .update({
                sort_order: targetOrder
            })
            .eq("id",exam.id),

        supabaseClient
            .from("exams")
            .update({
                sort_order: oldOrder
            })
            .eq("id",target.id)

    ]);


    await loadAll();

}


/* =========================================================
   MOVE FOLDER
========================================================= */

async function moveFolder(id,direction) {

    const folder =
        folders.find(f =>
            Number(f.id) === Number(id)
        );

    if (!folder) return;


    const siblings =
        folders
            .filter(f =>
                Number(f.exam_id) ===
                Number(folder.exam_id)
            )
            .filter(f => {

                if (folder.parent_id === null)
                    return f.parent_id === null;

                return Number(f.parent_id) ===
                    Number(folder.parent_id);

            })
            .sort((a,b) =>
                (a.sort_order || 0) -
                (b.sort_order || 0)
            );


    const index =
        siblings.findIndex(f =>
            Number(f.id) === Number(id)
        );


    const targetIndex =
        index + direction;


    if (
        targetIndex < 0 ||
        targetIndex >= siblings.length
    ) return;


    const target =
        siblings[targetIndex];


    const oldOrder =
        folder.sort_order || index + 1;

    const targetOrder =
        target.sort_order ||
        targetIndex + 1;


    await Promise.all([

        supabaseClient
            .from("mock_folders")
            .update({
                sort_order: targetOrder
            })
            .eq("id",folder.id),

        supabaseClient
            .from("mock_folders")
            .update({
                sort_order: oldOrder
            })
            .eq("id",target.id)

    ]);


    await loadAll();

}
