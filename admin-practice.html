<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSC EDGE - Admin Practice</title>

<script>
document.documentElement.dataset.theme =
    localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================================================
   SSC EDGE ADMIN PRACTICE
========================================================= */

:root{
    --a-bg:#0f0f14;
    --a-card:#17171f;
    --a-card2:#20202a;
    --a-border:#30303c;
    --a-text:#f5f3f8;
    --a-muted:#aaa4b3;
    --a-purple:#9b5cff;
    --a-purple2:#b77aff;
    --a-danger:#ef5350;
    --a-green:#35c98a;
}

:root[data-theme="light"]{
    --a-bg:#f7f5fa;
    --a-card:#ffffff;
    --a-card2:#f0ebf7;
    --a-border:#ddd6e8;
    --a-text:#211d27;
    --a-muted:#716a7b;
    --a-purple:#8b45ee;
    --a-purple2:#9d63f4;
    --a-danger:#d93636;
    --a-green:#159b65;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;

    background:var(--a-bg)!important;
    color:var(--a-text)!important;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    padding-bottom:35px;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

input,
select{
    font-family:inherit;
}

/* =========================================================
   WRAPPER
========================================================= */

.admin-wrap{
    width:100%;
    max-width:900px;

    margin:0 auto;

    padding:20px 15px 40px;
}

/* =========================================================
   HEADER
========================================================= */

.admin-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.brand{
    font-size:21px;
    font-weight:950;
    letter-spacing:-.5px;
}

.brand span{
    color:var(--a-purple2);
}

.admin-label{
    margin-top:3px;

    font-size:10px;
    font-weight:800;

    color:var(--a-muted);

    letter-spacing:.4px;
}

/* =========================================================
   CARD
========================================================= */

.admin-card{
    margin-bottom:15px;

    padding:16px;

    background:var(--a-card);

    border:1px solid var(--a-border);

    border-radius:17px;
}

.admin-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:14px;
}

.admin-head h2{
    margin:0;

    font-size:16px;
    font-weight:950;
}

.admin-head p{
    margin:4px 0 0;

    font-size:10px;
    color:var(--a-muted);
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
    min-height:38px;

    padding:8px 13px;

    border-radius:10px;

    background:var(--a-purple);

    color:#fff;

    font-size:11px;
    font-weight:900;

    white-space:nowrap;
}

.btn:hover{
    filter:brightness(1.08);
}

.btn.secondary{
    background:var(--a-card2);

    color:var(--a-text);

    border:1px solid var(--a-border);
}

.btn.danger{
    background:var(--a-danger);
    color:#fff;
}

.btn.green{
    background:var(--a-green);
    color:#fff;
}

.btn.small{
    min-height:31px;

    padding:6px 9px;

    border-radius:8px;

    font-size:9px;
}

/* =========================================================
   FORM
========================================================= */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}

.field{
    display:flex;
    flex-direction:column;

    gap:5px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:10px;
    font-weight:850;

    color:var(--a-muted);
}

.field input,
.field select{
    width:100%;

    min-height:41px;

    padding:8px 10px;

    border-radius:10px;

    border:1px solid var(--a-border);

    background:var(--a-card2);

    color:var(--a-text);

    outline:none;
}

.field input:focus,
.field select:focus{
    border-color:var(--a-purple);
}

.form-actions{
    display:flex;
    flex-wrap:wrap;

    gap:8px;

    margin-top:12px;
}

/* =========================================================
   EXAM CARDS
========================================================= */

.exam-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:11px;
}

.exam-card{
    position:relative;

    padding:15px;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    border-radius:14px;

    transition:.15s;
}

.exam-card.active{
    border-color:var(--a-purple);

    box-shadow:
        0 0 0 1px
        rgba(155,92,255,.12);
}

.exam-board{
    font-size:9px;

    font-weight:900;

    color:var(--a-purple2);

    letter-spacing:.6px;

    text-transform:uppercase;
}

.exam-title{
    margin-top:5px;

    font-size:15px;
    font-weight:950;
}

.exam-order{
    margin-top:4px;

    font-size:9px;

    color:var(--a-muted);
}

.exam-actions{
    display:flex;
    flex-wrap:wrap;

    gap:5px;

    margin-top:12px;
}

/* =========================================================
   BREADCRUMB
========================================================= */

.breadcrumb{
    display:flex;
    align-items:center;

    gap:6px;

    margin-bottom:12px;

    overflow-x:auto;

    scrollbar-width:none;
}

.breadcrumb::-webkit-scrollbar{
    display:none;
}

.crumb{
    flex:none;

    padding:6px 9px;

    border-radius:8px;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    color:var(--a-muted);

    font-size:9px;
    font-weight:850;
}

.crumb.current{
    color:#fff;

    background:var(--a-purple);

    border-color:var(--a-purple);
}

.crumb-arrow{
    flex:none;

    color:var(--a-muted);

    font-size:10px;
}

/* =========================================================
   NAVIGATION CARDS
========================================================= */

.practice-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:11px;
}

.practice-admin-card{
    min-height:112px;

    padding:16px;

    display:flex;
    flex-direction:column;

    justify-content:center;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    border-radius:15px;

    cursor:pointer;

    transition:.15s;
}

.practice-admin-card:hover{
    border-color:var(--a-purple);
}

.practice-admin-icon{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:10px;

    border-radius:11px;

    background:rgba(155,92,255,.13);

    color:var(--a-purple2);

    font-size:19px;
}

.practice-admin-title{
    font-size:14px;
    font-weight:950;
}

.practice-admin-sub{
    margin-top:3px;

    font-size:9px;
    color:var(--a-muted);
}

/* =========================================================
   CARD TOP ACTIONS
========================================================= */

.card-top-actions{
    display:flex;
    flex-wrap:wrap;
    gap:5px;

    margin-top:10px;
}

/* =========================================================
   SECTION HEADING
========================================================= */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin:18px 0 10px;
}

.section-title h3{
    margin:0;

    font-size:12px;
    font-weight:950;

    letter-spacing:.5px;
}

.section-title span{
    font-size:9px;
    color:var(--a-muted);
}

/* =========================================================
   HORIZONTAL ROW
========================================================= */

.horizontal-scroll{
    display:flex;

    gap:10px;

    overflow-x:auto;

    padding:2px 1px 7px;

    scrollbar-width:none;
}

.horizontal-scroll::-webkit-scrollbar{
    display:none;
}

.horizontal-card{
    flex:0 0 145px;

    min-height:100px;

    padding:13px;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    border-radius:14px;

    cursor:pointer;

    transition:.15s;
}

.horizontal-card:hover{
    border-color:var(--a-purple);
}

.horizontal-icon{
    font-size:20px;

    margin-bottom:8px;
}

.horizontal-title{
    font-size:12px;
    font-weight:950;
}

.horizontal-sub{
    margin-top:3px;

    font-size:8px;
    color:var(--a-muted);
}

.horizontal-actions{
    display:flex;
    gap:4px;

    margin-top:9px;
}

/* =========================================================
   TEST CARDS
========================================================= */

.test-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}

.test-card{
    padding:13px;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    border-radius:13px;
}

.test-title{
    font-size:12px;
    font-weight:900;

    line-height:1.35;
}

.test-meta{
    margin-top:6px;

    font-size:9px;

    color:var(--a-muted);

    line-height:1.5;
}

.test-actions{
    display:flex;
    flex-wrap:wrap;

    gap:5px;

    margin-top:10px;
}

/* =========================================================
   MANAGE ROW
========================================================= */

.manage-row{
    margin-bottom:8px;

    padding:11px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:8px;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    border-radius:12px;
}

.manage-info{
    min-width:0;
}

.manage-name{
    font-size:11px;
    font-weight:900;
}

.manage-meta{
    margin-top:3px;

    font-size:8px;
    color:var(--a-muted);
}

.manage-actions{
    display:flex;
    flex-wrap:wrap;
    gap:4px;

    justify-content:flex-end;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    padding:25px 15px;

    text-align:center;

    font-size:11px;

    color:var(--a-muted);

    border:1px dashed var(--a-border);

    border-radius:13px;
}

/* =========================================================
   STATUS
========================================================= */

.status{
    position:sticky;
    bottom:10px;
    z-index:20;

    margin-top:15px;

    padding:10px 12px;

    background:var(--a-card);

    border:1px solid var(--a-border);

    border-radius:10px;

    font-size:10px;

    color:var(--a-muted);

    text-align:center;
}

.status.error{
    color:#ff8585;
}

.status.success{
    color:var(--a-green);
}

/* =========================================================
   HIDDEN
========================================================= */

.hidden{
    display:none!important;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:560px){

    .admin-wrap{
        padding:17px 12px 35px;
    }

    .exam-grid,
    .practice-grid,
    .test-grid{
        grid-template-columns:1fr 1fr;
    }

    .admin-card{
        padding:13px;
    }

}

@media(max-width:390px){

    .exam-grid,
    .practice-grid,
    .test-grid{
        grid-template-columns:1fr;
    }

    .horizontal-card{
        flex-basis:140px;
    }

}

</style>

</head>

<body>

<div class="admin-wrap">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* =========================================================
   STATE
========================================================= */

let exams = [];
let subjects = [];
let folders = [];
let tests = [];

let selectedExam = null;
let currentFolder = null;

let editingExamId = null;
let editingFolderId = null;
let editingTestId = null;

let currentParentId = null;
let currentFolderType = null;
let currentTestFolderId = null;

/* =========================================================
   HELPERS
========================================================= */

function byId(id){
    return document.getElementById(id);
}

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function setStatus(text,type=""){

    const el = byId("status");

    el.textContent = text;

    el.className =
        "status " + type;

}

function normalizeType(type){

    return String(type || "")
        .trim()
        .toLowerCase()
        .replace(/[\s_-]+/g," ");

}

function sortItems(list){

    return [...list].sort((a,b)=>{

        const x =
            Number(a.sort_order ?? 0);

        const y =
            Number(b.sort_order ?? 0);

        if(x !== y)
            return x-y;

        return String(
            a.display_name ||
            a.name ||
            a.title ||
            ""
        ).localeCompare(
            String(
                b.display_name ||
                b.name ||
                b.title ||
                ""
            )
        );

    });

}

function getFolder(id){

    return folders.find(f =>
        String(f.id) === String(id)
    ) || null;

}

function childrenOf(parentId){

    return sortItems(
        folders.filter(f =>
            String(f.parent_id ?? "") ===
            String(parentId ?? "")
        )
    );

}

function getRoot(folder){

    let current = folder;

    while(
        current &&
        current.parent_id !== null &&
        current.parent_id !== undefined
    ){

        current =
            getFolder(current.parent_id);

    }

    return current;

}

function getPath(folder){

    const path = [];

    let current = folder;

    while(current){

        path.unshift(current);

        if(
            current.parent_id === null ||
            current.parent_id === undefined
        )
            break;

        current =
            getFolder(current.parent_id);

    }

    return path;

}

function nextSort(parentId){

    const list =
        folders.filter(f =>
            String(f.parent_id ?? "") ===
            String(parentId ?? "")
        );

    if(!list.length)
        return 1;

    return Math.max(
        ...list.map(
            f => Number(f.sort_order) || 0
        )
    ) + 1;

}

function nextTestSort(folderId){

    const list =
        tests.filter(t =>
            String(t.folder_id) ===
            String(folderId)
        );

    if(!list.length)
        return 1;

    return Math.max(
        ...list.map(
            t => Number(t.sort_order) || 0
        )
    ) + 1;

}

function getTests(folderId){

    return [...tests]
        .filter(t =>
            String(t.folder_id) ===
            String(folderId)
        )
        .sort((a,b)=>{

            const x =
                Number(a.sort_order ?? 0);

            const y =
                Number(b.sort_order ?? 0);

            if(x !== y)
                return x-y;

            return new Date(
                b.created_at || 0
            ) -
            new Date(
                a.created_at || 0
            );

        });

}

/* =========================================================
   LOAD ALL
========================================================= */

async function loadAll(){

    setStatus("Loading...");

    try{

        const [
            examsResponse,
            subjectsResponse,
            foldersResponse,
            testsResponse
        ] = await Promise.all([

            supabaseClient
                .from("exams")
                .select("*")
                .order(
                    "sort_order",
                    {ascending:true}
                )
                .order(
                    "name",
                    {ascending:true}
                ),

            supabaseClient
                .from("subjects")
                .select("*")
                .order("name"),

            supabaseClient
                .from("mock_folders")
                .select("*")
                .order(
                    "sort_order",
                    {ascending:true}
                ),

            supabaseClient
                .from("mock_tests")
                .select("*")
                .order(
                    "sort_order",
                    {ascending:true}
                )

        ]);

        if(examsResponse.error)
            throw examsResponse.error;

        if(subjectsResponse.error)
            throw subjectsResponse.error;

        if(foldersResponse.error)
            throw foldersResponse.error;

        if(testsResponse.error)
            throw testsResponse.error;

        exams =
            examsResponse.data || [];

        subjects =
            subjectsResponse.data || [];

        folders =
            foldersResponse.data || [];

        tests =
            testsResponse.data || [];

        renderExams();
        renderSubjectOptions();

        if(selectedExam){

            const updated =
                exams.find(e =>
                    String(e.id) ===
                    String(selectedExam.id)
                );

            if(updated){

                selectedExam = updated;

                if(currentFolder){

                    const updatedFolder =
                        getFolder(
                            currentFolder.id
                        );

                    if(updatedFolder)
                        currentFolder =
                            updatedFolder;
                    else
                        currentFolder = null;

                }

                renderWorkspace();

            }else{

                closeWorkspace();

            }

        }

        setStatus(
            "Ready",
            "success"
        );

    }catch(error){

        console.error(error);

        setStatus(
            "Error: " +
            error.message,
            "error"
        );

    }

}

/* =========================================================
   CREATE DEFAULT STRUCTURE
========================================================= */

async function createDefaultStructure(examId){

    /*
       IMPORTANT:
       mock_type is NOT used for Practice hierarchy.

       Practice hierarchy is stored completely
       inside mock_folders.
    */

    const roots = [

        {
            exam_id:examId,
            parent_id:null,
            subject_id:null,
            name:"NEW MOCKS",
            display_name:"NEW MOCKS",
            folder_type:"new",
            sort_order:1,
            is_active:true
        },

        {
            exam_id:examId,
            parent_id:null,
            subject_id:null,
            name:"PYQ MOCKS",
            display_name:"PYQ MOCKS",
            folder_type:"pyq",
            sort_order:2,
            is_active:true
        }

    ];

    const rootResponse =
        await supabaseClient
        .from("mock_folders")
        .insert(roots)
        .select();

    if(rootResponse.error)
        throw rootResponse.error;

    const newRoot =
        rootResponse.data.find(f =>
            normalizeType(
                f.folder_type
            ) === "new"
        );

    const pyqRoot =
        rootResponse.data.find(f =>
            normalizeType(
                f.folder_type
            ) === "pyq"
        );

    const children = [];

    if(newRoot){

        children.push({

            exam_id:examId,
            parent_id:newRoot.id,
            subject_id:null,
            name:"FULL MOCKS",
            display_name:"FULL MOCKS",
            folder_type:"full",
            sort_order:1,
            is_active:true

        });

        children.push({

            exam_id:examId,
            parent_id:newRoot.id,
            subject_id:null,
            name:"SECTIONAL MOCKS",
            display_name:"SECTIONAL MOCKS",
            folder_type:"sectional",
            sort_order:2,
            is_active:true

        });

    }

    if(pyqRoot){

        children.push({

            exam_id:examId,
            parent_id:pyqRoot.id,
            subject_id:null,
            name:"FULL MOCKS",
            display_name:"FULL MOCKS",
            folder_type:"full",
            sort_order:1,
            is_active:true

        });

        children.push({

            exam_id:examId,
            parent_id:pyqRoot.id,
            subject_id:null,
            name:"SECTIONAL MOCKS",
            display_name:"SECTIONAL MOCKS",
            folder_type:"sectional",
            sort_order:2,
            is_active:true

        });

    }

    if(children.length){

        const childResponse =
            await supabaseClient
            .from("mock_folders")
            .insert(children);

        if(childResponse.error)
            throw childResponse.error;

    }

}

/* =========================================================
   SAVE EXAM
========================================================= */

async function saveExam(){

    const board =
        byId("examBoard")
        .value;

    const name =
        byId("examName")
        .value
        .trim();

    const sort =
        Number(
            byId("examSort")
            .value
        ) || 0;

    if(!name){

        alert(
            "Enter exam name."
        );

        return;

    }

    setStatus(
        editingExamId
        ?
        "Updating exam..."
        :
        "Creating exam..."
    );

    try{

        let response;

        if(editingExamId){

            /*
               Existing mock_type is preserved.
               Therefore old exams are never forced
               into an invalid mock_type.
            */

            const oldExam =
                exams.find(e =>
                    String(e.id) ===
                    String(editingExamId)
                );

            response =
                await supabaseClient
                .from("exams")
                .update({

                    board:board,

                    name:name,

                    sort_order:sort,

                    is_active:true

                })
                .eq(
                    "id",
                    editingExamId
                );

        }else{

            /*
               DATABASE CHECK FIX:
               "Sectional" is a known valid value
               in the existing exams constraint.

               It does NOT mean Practice category.
            */

            response =
                await supabaseClient
                .from("exams")
                .insert({

                    board:board,

                    name:name,

                    mock_type:"SECTIONAL",

                    sort_order:sort,

                    is_active:true

                })
                .select()
                .single();

        }

        if(response.error)
            throw response.error;

        /*
           Only a NEW exam receives the automatic
           New/PYQ + Full/Sectional structure.
        */

        if(!editingExamId){

            await createDefaultStructure(
                response.data.id
            );

        }

        closeExamForm();

        await loadAll();

        if(!editingExamId){

            const newExam =
                exams.find(e =>
                    String(e.id) ===
                    String(response.data.id)
                );

            if(newExam)
                selectExam(newExam.id);

        }

    }catch(error){

        console.error(error);

        alert(
            "Exam error:\n" +
            error.message
        );

        setStatus(
            error.message,
            "error"
        );

    }

}

/* =========================================================
   DELETE EXAM
========================================================= */

async function deleteExam(id){

    const exam =
        exams.find(e =>
            String(e.id) ===
            String(id)
        );

    if(!exam)
        return;

    const examFolders =
        folders.filter(f =>
            String(f.exam_id) ===
            String(id)
        );

    const folderIds =
        examFolders.map(
            f => String(f.id)
        );

    const hasTests =
        tests.some(t =>
            folderIds.includes(
                String(t.folder_id)
            )
        );

    let message =
        "Delete " +
        exam.board +
        " - " +
        exam.name +
        "?";

    if(examFolders.length)
        message +=
            "\n\nAll Practice folders will be deleted.";

    if(hasTests)
        message +=
            "\nAll tests inside them will also be deleted.";

    if(!confirm(message))
        return;

    setStatus(
        "Deleting exam..."
    );

    try{

        /*
           Delete tests first so no orphan tests
           remain when folders are deleted.
        */

        if(folderIds.length){

            const testDelete =
                await supabaseClient
                .from("mock_tests")
                .delete()
                .in(
                    "folder_id",
                    folderIds
                );

            if(testDelete.error)
                throw testDelete.error;

            const folderDelete =
                await supabaseClient
                .from("mock_folders")
                .delete()
                .eq(
                    "exam_id",
                    id
                );

            if(folderDelete.error)
                throw folderDelete.error;

        }

        const examDelete =
            await supabaseClient
            .from("exams")
            .delete()
            .eq(
                "id",
                id
            );

        if(examDelete.error)
            throw examDelete.error;

        if(
            selectedExam &&
            String(selectedExam.id) ===
            String(id)
        ){

            closeWorkspace();

        }

        await loadAll();

    }catch(error){

        console.error(error);

        alert(
            "Delete error:\n" +
            error.message
        );

        setStatus(
            error.message,
            "error"
        );

    }

}

/* =========================================================
   MOVE EXAM
========================================================= */

async function moveExam(id,direction){

    const list =
        sortItems(exams);

    const index =
        list.findIndex(e =>
            String(e.id) ===
            String(id)
        );

    if(index < 0)
        return;

    const target =
        direction === "up"
        ?
        index-1
        :
        index+1;

    if(
        target < 0 ||
        target >= list.length
    )
        return;

    const a =
        list[index];

    const b =
        list[target];

    let orderA =
        Number(a.sort_order)||0;

    let orderB =
        Number(b.sort_order)||0;

    if(orderA === orderB){

        orderA =
            target+1;

        orderB =
            index+1;

    }

    const r1 =
        await supabaseClient
        .from("exams")
        .update({
            sort_order:orderB
        })
        .eq(
            "id",
            a.id
        );

    const r2 =
        await supabaseClient
        .from("exams")
        .update({
            sort_order:orderA
        })
        .eq(
            "id",
            b.id
        );

    if(r1.error || r2.error){

        alert(
            (r1.error || r2.error)
            .message
        );

        return;

    }

    await loadAll();

}

/* =========================================================
   ADD ROOT
========================================================= */

async function addRoot(type){

    if(!selectedExam)
        return;

    const rootType =
        type === "pyq"
        ?
        "pyq"
        :
        "new";

    const exists =
        folders.some(f =>

            String(f.exam_id) ===
            String(selectedExam.id)

            &&

            (
                f.parent_id === null ||
                f.parent_id === undefined
            )

            &&

            normalizeType(
                f.folder_type
            ) === rootType

        );

    if(exists){

        alert(
            rootType === "new"
            ?
            "NEW MOCKS already exists."
            :
            "PYQ MOCKS already exists."
        );

        return;

    }

    const name =
        rootType === "new"
        ?
        "NEW MOCKS"
        :
        "PYQ MOCKS";

    setStatus(
        "Creating " +
        name +
        "..."
    );

    try{

        const response =
            await supabaseClient
            .from("mock_folders")
            .insert({

                exam_id:
                    selectedExam.id,

                parent_id:
                    null,

                subject_id:
                    null,

                name:name,

                display_name:name,

                folder_type:
                    rootType,

                sort_order:
                    nextSort(null),

                is_active:true

            });

        if(response.error)
            throw response.error;

        await loadAll();

    }catch(error){

        alert(
            "Folder error:\n" +
            error.message
        );

        setStatus(
            error.message,
            "error"
        );

    }

}

/* =========================================================

========================================================= */

function renderFolderLevel(){

    if(!currentFolder)
        return;

    byId("levelCard")
        .classList
        .remove("hidden");

    const type =
        normalizeType(
            currentFolder.folder_type
        );

    byId("levelTitle")
        .textContent =
        currentFolder.display_name ||
        currentFolder.name;

    byId("levelSubtitle")
        .textContent =
        getLevelDescription(
            currentFolder
        );

    const addButton =
        byId("levelAddButton");

    /* NEW / PYQ */

    if(
        type === "new" ||
        type === "pyq"
    ){

        addButton.style.display =
            "block";

        addButton.textContent =
            "+ Add Category";

        addButton.onclick =
            function(){

                openCategoryForm(
                    currentFolder.id
                );

            };

        renderCategoryChildren();

        return;

    }

    /* FULL */

    if(type === "full"){

        const root =
            getRoot(
                currentFolder
            );

        const rootType =
            root
            ?
            normalizeType(
                root.folder_type
            )
            :
            "";

        if(rootType === "pyq"){

            addButton.style.display =
                "block";

            addButton.textContent =
                "+ Add Year";

            addButton.onclick =
                function(){

                    openYearForm(
                        currentFolder.id
                    );

                };

            renderYearChildren();

        }else{

            addButton.style.display =
                "block";

            addButton.textContent =
                "+ Add Test";

            addButton.onclick =
                function(){

                    openTestForm(
                        currentFolder.id
                    );

                };

            renderDirectTests(
                currentFolder.id
            );

        }

        return;

    }

    /* SECTIONAL */

    if(type === "sectional"){

        addButton.style.display =
            "block";

        addButton.textContent =
            "+ Add Subject";

        addButton.onclick =
            function(){

                openSubjectFolderForm(
                    currentFolder.id
                );

            };

        renderSubjectChildren();

        return;

    }

    /* YEAR */

    if(type === "year"){

        addButton.style.display =
            "block";

        addButton.textContent =
            "+ Add Test";

        addButton.onclick =
            function(){

                openTestForm(
                    currentFolder.id
                );

            };

        renderDirectTests(
            currentFolder.id
        );

        return;

    }

    /* SUBJECT */

    if(type === "subject"){

        addButton.style.display =
            "block";

        addButton.textContent =
            "+ Add Test";

        addButton.onclick =
            function(){

                openTestForm(
                    currentFolder.id
                );

            };

        renderDirectTests(
            currentFolder.id
        );

        return;

    }

    /* FALLBACK */

    addButton.style.display =
        "block";

    addButton.textContent =
        "+ Add Test";

    addButton.onclick =
        function(){

            openTestForm(
                currentFolder.id
            );

        };

    renderDirectTests(
        currentFolder.id
    );

}

/* =========================================================
   DESCRIPTION
========================================================= */

function getLevelDescription(folder){

    const type =
        normalizeType(
            folder.folder_type
        );

    if(type === "new")
        return "New Mock Tests";

    if(type === "pyq")
        return "Previous Year Mock Tests";

    if(type === "full"){

            getRoot(folder);

        if(

            normalizeType(
                root.folder_type
            ) === "pyq"
        )

        return "Full mock tests";

    }

        return "Select subject";

    if(type === "year")
        return "Tests for this year";

    if(type === "subject")
        return "Tests for this subject";

    return "Practice management";

}

/* =========================================================
   SAVE FOLDER
========================================================= */

async function saveFolder(){

    if(!selectedExam)
        return;

    const name =
        byId("folderName")
        .value
        .trim();

    if(!name){

        alert(
            "Enter a name."
        );

        return;

    }

    if(!currentFolderType){

        const oldFolder =
            editingFolderId
            ?
            getFolder(
                editingFolderId
            )
            :
            null;

        currentFolderType =
            oldFolder
            ?
            normalizeType(
                oldFolder.folder_type
            )
            :
            null;

    }

    if(!currentFolderType){

        alert(
            "Folder type missing."
        );

        return;

    }

    const sort =
        Number(
            byId("folderSort")
            .value
        ) || 0;

    const subjectValue =
        byId("folderSubject")
        .value;

    const data = {

        exam_id:
            selectedExam.id,

        parent_id:
            currentParentId === null ||
            currentParentId === undefined
            ?
            null
            :
            currentParentId,

        subject_id:
            currentFolderType === "subject" &&
            subjectValue
            ?
            Number(subjectValue)
            :
            null,

        name:name,

        display_name:name,

        folder_type:
            currentFolderType,

        sort_order:
            sort,

        is_active:true

    };

    setStatus(
        editingFolderId
        ?
        "Updating..."
        :
        "Creating..."
    );

    try{

        let response;

        if(editingFolderId){

            response =
                await supabaseClient
                .from("mock_folders")
                .update(data)
                .eq(
                    "id",
                    editingFolderId
                );

        }else{

            response =
                await supabaseClient
                .from("mock_folders")
                .insert(data);

        }

        if(response.error)
            throw response.error;

        const savedId =
            editingFolderId;

        closeFolderForm();

        await loadAll();

        if(savedId){

            const updated =
                getFolder(
                    savedId
                );

            if(updated){

                currentFolder =
                    updated;

                renderWorkspace();

            }

        }

    }catch(error){

        console.error(error);

        alert(
            "Folder error:\n" +
            error.message
        );

        setStatus(
            error.message,
            "error"
        );

    }

}

/* =========================================================
   DELETE FOLDER
========================================================= */

async function deleteFolder(id){

    const folder =
        getFolder(id);

    if(!folder)
        return;

    const descendants =
        getDescendants(id);

    const allIds = [

        String(id),

        ...descendants

    ];

    const hasTests =
        tests.some(t =>
            allIds.includes(
                String(t.folder_id)
            )
        );

    let message =
        "Delete \"" +
        (
            folder.display_name ||
            folder.name
        ) +
        "\"?";

    if(descendants.length){

        message +=
            "\n\nAll child folders will also be deleted.";

    }

    if(hasTests){

        message +=
            "\nAll tests inside them will also be deleted.";

    }

    if(!confirm(message))
        return;

    setStatus(
        "Deleting..."
    );

    try{

        /*
           Delete tests first.
        */

        const testDelete =
            await supabaseClient
            .from("mock_tests")
            .delete()
            .in(
                "folder_id",
                allIds
            );

        if(testDelete.error)
            throw testDelete.error;

        /*
           Delete deepest folders first.
           Parent FK has cascade, but deleting the
           complete subtree directly is safer.
        */

        const folderDelete =
            await supabaseClient
            .from("mock_folders")
            .delete()
            .in(
                "id",
                allIds
            );

        if(folderDelete.error)
            throw folderDelete.error;

        if(
            currentFolder &&
            allIds.includes(
                String(currentFolder.id)
            )
        ){

            currentFolder =
                null;

        }

        await loadAll();

    }catch(error){

        console.error(error);

        alert(
            "Delete error:\n" +
            error.message
        );

        setStatus(
            error.message,
            "error"
        );

    }

}

/* =========================================================
   DESCENDANTS
========================================================= */

function getDescendants(id){

    const result = [];

    function walk(parentId){

        folders
        .filter(f =>
            String(f.parent_id) ===
            String(parentId)
        )
        .forEach(child => {

            result.push(
                String(child.id)
            );

            walk(
                child.id
            );

        });

    }

    walk(id);

    return result;

}

/* =========================================================
   MOVE FOLDER
========================================================= */

async function moveFolder(id,direction){

    const folder =
        getFolder(id);

    if(!folder)
        return;

    const siblings =
        sortItems(
            folders.filter(f =>

                String(f.exam_id) ===
                String(folder.exam_id)

                &&

                String(
                    f.parent_id ?? ""
                ) ===
                String(
                    folder.parent_id ?? ""
                )

            )
        );

    const index =
        siblings.findIndex(f =>
            String(f.id) ===
            String(id)
        );

    if(index < 0)
        return;

    const target =
        direction === "up"
        ?
        index-1
        :
        index+1;

    if(
        target < 0 ||
        target >= siblings.length
    )
        return;

    const other =
        siblings[target];

    let orderA =
        Number(
            folder.sort_order
        ) || 0;

    let orderB =
        Number(
            other.sort_order
        ) || 0;

    if(orderA === orderB){

        orderA =
            target+1;

        orderB =
            index+1;

    }

    const r1 =
        await supabaseClient
        .from("mock_folders")
        .update({
            sort_order:orderB
        })
        .eq(
            "id",
            folder.id
        );

    const r2 =
        await supabaseClient
        .from("mock_folders")
        .update({
            sort_order:orderA
        })
        .eq(
            "id",
            other.id
        );

    if(r1.error || r2.error){

        alert(
            (r1.error || r2.error)
            .message
        );

        return;

    }

    await loadAll();

}

   MOVE TEST
========================================================= */

async function moveTest(id,direction){

    const test =
        tests.find(t =>
            String(t.id) ===
            String(id)
        );

    if(!test)
        return;

    const siblings =
        getTests(
            test.folder_id
        );

    const index =
        siblings.findIndex(t =>
            String(t.id) ===
            String(id)
        );

    if(index < 0)
        return;

    const target =
        direction === "up"
        ?
        index-1
        :
        index+1;

    if(
        target < 0 ||
        target >= siblings.length
    )
        return;

    const other =
        siblings[target];

    let orderA =
        Number(
            test.sort_order
        ) || 0;

    let orderB =
        Number(
            other.sort_order
        ) || 0;

    if(orderA === orderB){

        orderA =
            target+1;

        orderB =
            index+1;

    }

    const r1 =
        await supabaseClient
        .from("mock_tests")
        .update({
            sort_order:orderB
        })
        .eq(
            "id",
            test.id
        );

    const r2 =
        await supabaseClient
        .from("mock_tests")
        .update({
            sort_order:orderA
        })
        .eq(
            "id",
            other.id
        );

    if(r1.error || r2.error){

        alert(
            (r1.error || r2.error)
            .message
        );

        return;

    }

    await loadAll();

}

/* =========================================================
   DELETE TEST
========================================================= */

async function deleteTest(id){

    const test =
        tests.find(t =>
            String(t.id) ===
            String(id)
        );

    if(!test)
        return;

    if(!confirm(
        "Delete \"" +
        (
            test.title ||
            "this test"
        ) +
        "\"?"
    ))
        return;

    setStatus(
        "Deleting test..."
    );

    const response =
        await supabaseClient
        .from("mock_tests")
        .delete()
        .eq(
            "id",
            id
        );

    if(response.error){

        alert(
            "Delete error:\n" +
            response.error.message
        );

        setStatus(
            response.error.message,
            "error"
        );

        return;

    }

    await loadAll();

}

/* =========================================================
   FORM SCROLL
========================================================= */

function scrollToForm(id){

    setTimeout(()=>{

        const el =
            byId(id);

        if(!el)
            return;

        window.scrollTo({

            top:
                el.offsetTop - 10,

            behavior:"smooth"

        });

    },50);

}
