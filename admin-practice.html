<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
document.documentElement.dataset.theme =
  localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<title>SSC EDGE - Practice Admin</title>

<link rel="stylesheet" href="css/style.css">

<style>

:root {
  --pa-bg: #09090f;
  --pa-card: #12121c;
  --pa-card2: #181827;
  --pa-border: rgba(255,255,255,.09);
  --pa-text: #f5f5ff;
  --pa-muted: #9292aa;
  --pa-purple: #9b6cff;
  --pa-purple2: #7545e8;
  --pa-danger: #ff5f70;
  --pa-green: #39d98a;
}

:root[data-theme="light"] {
  --pa-bg: #f5f4fb;
  --pa-card: #ffffff;
  --pa-card2: #f0eef9;
  --pa-border: rgba(0,0,0,.10);
  --pa-text: #181522;
  --pa-muted: #6e687d;
  --pa-purple: #7042d9;
  --pa-purple2: #5724bd;
  --pa-danger: #e33d50;
  --pa-green: #159b5b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--pa-bg);
  color: var(--pa-text);
  font-family: Arial, Helvetica, sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.pa-header {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 18px;
  background: var(--pa-card);
  border-bottom: 1px solid var(--pa-border);
}

.pa-brand {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: .3px;
}

.pa-brand span {
  color: var(--pa-purple);
}

.pa-subtitle {
  font-size: 11px;
  color: var(--pa-muted);
  margin-top: 3px;
}

.pa-header-actions {
  display: flex;
  gap: 8px;
}

.pa-icon-btn {
  width: 36px;
  height: 36px;
  border: 1px solid var(--pa-border);
  border-radius: 10px;
  color: var(--pa-text);
  background: var(--pa-card2);
  font-size: 17px;
}

.pa-container {
  width: min(1180px, calc(100% - 24px));
  margin: 18px auto 50px;
}

.pa-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.pa-page-title {
  margin: 0;
  font-size: 22px;
}

.pa-page-desc {
  margin: 5px 0 0;
  color: var(--pa-muted);
  font-size: 13px;
}

.pa-btn {
  border: 0;
  border-radius: 10px;
  padding: 11px 15px;
  font-weight: 700;
  color: white;
  background: var(--pa-purple2);
}

.pa-btn:hover {
  opacity: .9;
}

.pa-btn.secondary {
  color: var(--pa-text);
  background: var(--pa-card2);
  border: 1px solid var(--pa-border);
}

.pa-btn.danger {
  background: var(--pa-danger);
}

.pa-btn.small {
  padding: 8px 11px;
  font-size: 12px;
  border-radius: 8px;
}

.pa-panel {
  background: var(--pa-card);
  border: 1px solid var(--pa-border);
  border-radius: 15px;
  overflow: hidden;
  margin-bottom: 16px;
}

.pa-panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--pa-border);
  flex-wrap: wrap;
}

.pa-panel-title {
  font-size: 15px;
  font-weight: 800;
}

.pa-panel-body {
  padding: 15px;
}

.pa-exam-card {
  margin-bottom: 16px;
  border: 1px solid var(--pa-border);
  background: var(--pa-card);
  border-radius: 15px;
  overflow: hidden;
}

.pa-exam-head {
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: var(--pa-card2);
  border-bottom: 1px solid var(--pa-border);
  flex-wrap: wrap;
}

.pa-exam-name {
  font-size: 18px;
  font-weight: 800;
}

.pa-exam-meta {
  color: var(--pa-muted);
  font-size: 12px;
  margin-top: 4px;
}

.pa-actions {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.pa-root-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  padding: 15px;
}

.pa-root-card {
  border: 1px solid var(--pa-border);
  background: var(--pa-card);
  border-radius: 13px;
  padding: 14px;
}

.pa-root-title {
  font-weight: 800;
  font-size: 15px;
}

.pa-root-desc {
  font-size: 12px;
  color: var(--pa-muted);
  margin-top: 5px;
}

.pa-folder {
  margin-top: 12px;
  border: 1px solid var(--pa-border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--pa-card);
}

.pa-folder-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 13px;
  background: var(--pa-card2);
  flex-wrap: wrap;
}

.pa-folder-name {
  font-size: 14px;
  font-weight: 800;
}

.pa-folder-type {
  display: inline-block;
  margin-left: 7px;
  color: var(--pa-purple);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .6px;
}

.pa-folder-body {
  padding: 12px;
}

.pa-child-list {
  display: grid;
  gap: 9px;
}

.pa-child-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--pa-border);
  border-radius: 10px;
  padding: 11px;
  background: var(--pa-card2);
  flex-wrap: wrap;
}

.pa-child-name {
  font-size: 13px;
  font-weight: 700;
}

.pa-child-meta {
  color: var(--pa-muted);
  font-size: 11px;
  margin-top: 3px;
}

.pa-tests {
  margin-top: 10px;
  display: grid;
  gap: 8px;
}

.pa-test-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--pa-border);
  border-radius: 10px;
  padding: 10px;
  flex-wrap: wrap;
}

.pa-test-name {
  font-size: 13px;
  font-weight: 700;
}

.pa-test-meta {
  color: var(--pa-muted);
  font-size: 11px;
  margin-top: 4px;
}

.pa-status {
  display: inline-block;
  padding: 4px 7px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  margin-left: 5px;
}

.pa-status.active {
  background: rgba(57,217,138,.13);
  color: var(--pa-green);
}

.pa-status.inactive {
  background: rgba(255,95,112,.13);
  color: var(--pa-danger);
}

.pa-empty {
  color: var(--pa-muted);
  font-size: 13px;
  padding: 10px 0;
  text-align: center;
}

.pa-loading {
  padding: 35px;
  text-align: center;
  color: var(--pa-muted);
}

.pa-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0,0,0,.65);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.pa-modal-backdrop.show {
  display: flex;
}

.pa-modal {
  width: min(460px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: var(--pa-card);
  border: 1px solid var(--pa-border);
  border-radius: 16px;
  padding: 18px;
}

.pa-modal h3 {
  margin: 0 0 15px;
  font-size: 18px;
}

.pa-field {
  margin-bottom: 13px;
}

.pa-field label {
  display: block;
  font-size: 12px;
  color: var(--pa-muted);
  margin-bottom: 6px;
}

.pa-field input,
.pa-field select {
  width: 100%;
  border: 1px solid var(--pa-border);
  background: var(--pa-card2);
  color: var(--pa-text);
  border-radius: 9px;
  padding: 11px;
  outline: none;
}

.pa-field input:focus,
.pa-field select:focus {
  border-color: var(--pa-purple);
}

.pa-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}

.pa-divider {
  height: 1px;
  background: var(--pa-border);
  margin: 14px 0;
}

@media (max-width: 650px) {
  .pa-root-grid {
    grid-template-columns: 1fr;
  }

  .pa-container {
    width: min(100% - 16px, 1180px);
    margin-top: 12px;
  }

  .pa-page-title {
    font-size: 19px;
  }

  .pa-exam-name {
    font-size: 16px;
  }

  .pa-header {
    padding: 13px 12px;
  }
}

</style>
</head>

<body>

<header class="pa-header">
  <div>
    <div class="pa-brand">SSC <span>EDGE</span></div>
    <div class="pa-subtitle">Practice Management</div>
  </div>

  <div class="pa-header-actions">
    <button class="pa-icon-btn" onclick="toggleTheme()" title="Toggle Theme">☼</button>
    <button class="pa-icon-btn" onclick="goBack()" title="Back">←</button>
  </div>
</header>

<main class="pa-container">

  <div class="pa-toolbar">
    <div>
      <h1 class="pa-page-title">Practice Admin</h1>
      <p class="pa-page-desc">Manage exams, mock folders and mock tests.</p>
    </div>

    <button class="pa-btn" onclick="openExamModal()">
      + Add Exam
    </button>
  </div>

  <div id="mainArea">
    <div class="pa-loading">Loading practice structure...</div>
  </div>

</main>

<!-- EXAM MODAL -->
<div class="pa-modal-backdrop" id="examModal">
  <div class="pa-modal">
    <h3 id="examModalTitle">Add Exam</h3>

    <div class="pa-field">
      <label>Board</label>
      <select id="examBoard">
        <option value="SSC">SSC</option>
        <option value="RRB">RRB</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="pa-field">
      <label>Exam Name</label>
      <input id="examName" placeholder="Example: CGL, CHSL, CPO, MTS">
    </div>

    <div class="pa-modal-actions">
      <button class="pa-btn secondary" onclick="closeModal('examModal')">
        Cancel
      </button>

      <button class="pa-btn" onclick="saveExam()">
        Save Exam
      </button>
    </div>
  </div>
</div>

<!-- FOLDER MODAL -->
<div class="pa-modal-backdrop" id="folderModal">
  <div class="pa-modal">
    <h3 id="folderModalTitle">Add Folder</h3>

    <div class="pa-field">
      <label>Folder Name</label>
      <input id="folderName" placeholder="Example: 2024, Quant, New Mock">
    </div>

    <div class="pa-field">
      <label>Folder Type</label>
      <select id="folderType">
        <option value="new">New Mocks</option>
        <option value="pyq">PYQ Mocks</option>
        <option value="full">Full Mocks</option>
        <option value="sectional">Sectional Mocks</option>
        <option value="year">PYQ Year</option>
        <option value="subject">Subject</option>
        <option value="custom">Custom</option>
      </select>
    </div>

    <div class="pa-modal-actions">
      <button class="pa-btn secondary" onclick="closeModal('folderModal')">
        Cancel
      </button>

      <button class="pa-btn" onclick="saveFolder()">
        Save Folder
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
  window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let exams = [];
let folders = [];
let tests = [];
let subjects = [];

let activeExamId = null;
let activeParentId = null;
let editingExamId = null;
let editingFolderId = null;

document.addEventListener("DOMContentLoaded", async () => {
  await checkAdmin();
});

function toggleTheme() {
  const current =
    document.documentElement.dataset.theme || "dark";

  const next = current === "dark" ? "light" : "dark";

  document.documentElement.dataset.theme = next;
  localStorage.setItem("ssc-edge-theme", next);
}

function goBack() {
  if (history.length > 1) {
    history.back();
  } else {
    location.href = "admin-dashboard.html";
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove("show");
}

function openModal(id) {
  document.getElementById(id).classList.add("show");
}

async function checkAdmin() {
  try {
    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      document.getElementById("mainArea").innerHTML = `
        <div class="pa-panel">
          <div class="pa-panel-body">
            <div class="pa-empty">Please login as admin first.</div>
          </div>
        </div>
      `;
      return;
    }

    const { data: admin, error } = await supabaseClient
      .from("admin_users")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();

    if (error || !admin) {
      document.getElementById("mainArea").innerHTML = `
        <div class="pa-panel">
          <div class="pa-panel-body">
            <div class="pa-empty">Access denied. You are not an admin.</div>
          </div>
        </div>
      `;
      return;
    }

    await loadData();

  } catch (error) {
    console.error(error);

    document.getElementById("mainArea").innerHTML = `
      <div class="pa-panel">
        <div class="pa-panel-body">
          <div class="pa-empty">Unable to verify admin access.</div>
        </div>
      </div>
    `;
  }
}

async function loadData() {
  document.getElementById("mainArea").innerHTML = `
    <div class="pa-loading">Loading practice structure...</div>
  `;

  const [
    examsResponse,
    foldersResponse,
    testsResponse,
    subjectsResponse
  ] = await Promise.all([
    supabaseClient
      .from("exams")
      .select("*")
      .order("sort_order", { ascending: true })
      .order("id", { ascending: true }),

    supabaseClient
      .from("mock_folders")
      .select("*")
      .order("sort_order", { ascending: true })
      .order("id", { ascending: true }),

    supabaseClient
      .from("mock_tests")
      .select("*")
      .order("sort_order", { ascending: true })
      .order("id", { ascending: true }),

    supabaseClient
      .from("subjects")
      .select("*")
      .order("name", { ascending: true })
  ]);

  if (examsResponse.error) {
    console.error(examsResponse.error);
    showError(examsResponse.error.message);
    return;
  }

  exams = examsResponse.data || [];
  folders = foldersResponse.data || [];
  tests = testsResponse.data || [];
  subjects = subjectsResponse.data || [];

  renderPage();
}

function showError(message) {
  document.getElementById("mainArea").innerHTML = `
    <div class="pa-panel">
      <div class="pa-panel-body">
        <div class="pa-empty">${escapeHtml(message)}</div>
      </div>
    </div>
  `;
}

function renderPage() {
  const area = document.getElementById("mainArea");

  if (!exams.length) {
    area.innerHTML = `
      <div class="pa-panel">
        <div class="pa-panel-body">
          <div class="pa-empty">
            No exams added yet. Click "+ Add Exam" to begin.
          </div>
        </div>
      </div>
    `;
    return;
  }

  area.innerHTML = exams.map(exam => {
    return renderExam(exam);
  }).join("");
}

function renderExam(exam) {
  const rootFolders = folders
    .filter(folder =>
      String(folder.exam_id) === String(exam.id) &&
      !folder.parent_id
    )
    .sort(sortItems);

  return `
    <section class="pa-exam-card">

      <div class="pa-exam-head">
        <div>
          <div class="pa-exam-name">
            ${escapeHtml(exam.name || "Unnamed Exam")}
          </div>

          <div class="pa-exam-meta">
            Board: ${escapeHtml(exam.board || "SSC")}
            · ${rootFolders.length} main folder(s)
          </div>
        </div>

        <div class="pa-actions">
          <button
            class="pa-btn small"
            onclick="openRootFolderModal('${exam.id}')">
            + Add Mock Type
          </button>

          <button
            class="pa-btn small secondary"
            onclick="editExam('${exam.id}')">
            Edit
          </button>

          <button
            class="pa-btn small danger"
            onclick="deleteExam('${exam.id}')">
            Delete
          </button>
        </div>
      </div>

      <div class="pa-root-grid">
        ${
          rootFolders.length
            ? rootFolders.map(folder => renderRootFolder(folder)).join("")
            : `
              <div class="pa-empty">
                No mock types added for this exam.
              </div>
            `
        }
      </div>

    </section>
  `;
}

function renderRootFolder(folder) {
  const children = folders
    .filter(item =>
      String(item.parent_id) === String(folder.id)
    )
    .sort(sortItems);

  const folderLabel =
    folder.folder_type === "new"
      ? "NEW MOCKS"
      : folder.folder_type === "pyq"
        ? "PYQ MOCKS"
        : formatFolderType(folder.folder_type);

  return `
    <div class="pa-root-card">

      <div class="pa-root-title">
        ${escapeHtml(folder.name || folderLabel)}
      </div>

      <div class="pa-root-desc">
        ${children.length} category folder(s)
      </div>

      <div class="pa-actions" style="margin-top:12px;">
        <button
          class="pa-btn small"
          onclick="openChildFolderModal('${folder.id}')">
          + Add Category
        </button>

        <button
          class="pa-btn small secondary"
          onclick="editFolder('${folder.id}')">
          Edit
        </button>

        <button
          class="pa-btn small danger"
          onclick="deleteFolder('${folder.id}')">
          Delete
        </button>
      </div>

      ${
        children.length
          ? children.map(child => renderChildFolder(child)).join("")
          : `
            <div class="pa-empty" style="margin-top:12px;">
              No categories added.
            </div>
          `
      }

    </div>
  `;
}

function renderChildFolder(folder) {
  const children = folders
    .filter(item =>
      String(item.parent_id) === String(folder.id)
    )
    .sort(sortItems);

  const folderTests = tests
    .filter(test =>
      String(test.folder_id) === String(folder.id)
    )
    .sort(sortItems);

  return `
    <div class="pa-folder">

      <div class="pa-folder-head">
        <div>
          <span class="pa-folder-name">
            ${escapeHtml(folder.name || "Folder")}
          </span>

          <span class="pa-folder-type">
            ${escapeHtml(formatFolderType(folder.folder_type))}
          </span>
        </div>

        <div class="pa-actions">
          <button
            class="pa-btn small"
            onclick="openTestForm('${folder.id}')">
            + Add Test
          </button>

          <button
            class="pa-btn small secondary"
            onclick="openChildFolderModal('${folder.id}')">
            + Subfolder
          </button>

          <button
            class="pa-btn small secondary"
            onclick="editFolder('${folder.id}')">
            Edit
          </button>

          <button
            class="pa-btn small danger"
            onclick="deleteFolder('${folder.id}')">
            Delete
          </button>
        </div>
      </div>

      <div class="pa-folder-body">

        ${
          children.length
            ? `
              <div class="pa-child-list">
                ${children.map(child => renderChildFolder(child)).join("")}
              </div>
            `
            : ""
        }

        ${
          folderTests.length
            ? `
              <div class="pa-tests">
                ${folderTests.map(test => renderTest(test)).join("")}
              </div>
            `
            : `
              <div class="pa-empty">
                No tests in this folder.
              </div>
            `
        }

      </div>

    </div>
  `;
}

function renderTest(test) {
  const statusClass = test.is_active ? "active" : "inactive";
  const statusText = test.is_active ? "ACTIVE" : "INACTIVE";

  return `
    <div class="pa-test-row">

      <div>
        <div class="pa-test-name">
          ${escapeHtml(test.title || "Untitled Test")}

          <span class="pa-status ${statusClass}">
            ${statusText}
          </span>
        </div>

        <div class="pa-test-meta">
          ${escapeHtml(test.test_type || "FULL")}
          · ${test.duration_minutes || 0} min
          · ${test.total_questions || 0} questions
        </div>
      </div>

      <div class="pa-actions">

        <button
          class="pa-btn small secondary"
          onclick="editTest('${test.id}')">
          Edit
        </button>

        <button
          class="pa-btn small secondary"
          onclick="toggleTestStatus('${test.id}', ${test.is_active ? "false" : "true"})">
          ${test.is_active ? "Disable" : "Activate"}
        </button>

        <button
          class="pa-btn small danger"
          onclick="deleteTest('${test.id}')">
          Delete
        </button>

      </div>

    </div>
  `;
}

/* =========================
   EXAM ACTIONS
========================= */

function openExamModal() {
  editingExamId = null;

  document.getElementById("examModalTitle").textContent = "Add Exam";
  document.getElementById("examBoard").value = "SSC";
  document.getElementById("examName").value = "";

  openModal("examModal");
}

function editExam(id) {
  const exam = exams.find(item => String(item.id) === String(id));
  if (!exam) return;

  editingExamId = id;

  document.getElementById("examModalTitle").textContent = "Edit Exam";
  document.getElementById("examBoard").value = exam.board || "SSC";
  document.getElementById("examName").value = exam.name || "";

  openModal("examModal");
}

async function saveExam() {
  const board = document.getElementById("examBoard").value.trim();
  const name = document.getElementById("examName").value.trim();

  if (!name) {
    alert("Enter exam name.");
    return;
  }

  let response;

  if (editingExamId) {
    response = await supabaseClient
      .from("exams")
      .update({
        board,
        name
      })
      .eq("id", editingExamId);
  } else {
    response = await supabaseClient
      .from("exams")
      .insert({
        board,
        name,
        sort_order: exams.length
      });
  }

  if (response.error) {
    alert(response.error.message);
    return;
  }

  closeModal("examModal");
  await loadData();
}

async function deleteExam(id) {
  const exam = exams.find(item => String(item.id) === String(id));
  if (!exam) return;

  const ok = confirm(
    `Delete "${exam.name}" and all its folders/tests?`
  );

  if (!ok) return;

  const examFolders = folders.filter(folder =>
    String(folder.exam_id) === String(id)
  );

  const folderIds = examFolders.map(folder => folder.id);

  if (folderIds.length) {
    const relatedTests = tests.filter(test =>
      folderIds.some(folderId =>
        String(folderId) === String(test.folder_id)
      )
    );

    for (const test of relatedTests) {
      await deleteTestById(test.id, false);
    }

    await supabaseClient
      .from("mock_folders")
      .delete()
      .eq("exam_id", id);
  }

  const response = await supabaseClient
    .from("exams")
    .delete()
    .eq("id", id);

  if (response.error) {
    alert(response.error.message);
    return;
  }

  await loadData();
}

/* =========================
   FOLDER ACTIONS
========================= */

function openRootFolderModal(examId) {
  activeExamId = examId;
  activeParentId = null;
  editingFolderId = null;

  document.getElementById("folderModalTitle").textContent =
    "Add Mock Type";

  document.getElementById("folderName").value = "";

  document.getElementById("folderType").innerHTML = `
    <option value="new">New Mocks</option>
    <option value="pyq">PYQ Mocks</option>
  `;

  openModal("folderModal");
}

function openChildFolderModal(parentId) {
  const parent = folders.find(item =>
    String(item.id) === String(parentId)
  );

  if (!parent) return;

  activeExamId = parent.exam_id;
  activeParentId = parentId;
  editingFolderId = null;

  document.getElementById("folderModalTitle").textContent =
    "Add Folder";

  document.getElementById("folderName").value = "";

  document.getElementById("folderType").innerHTML = `
    <option value="full">Full Mocks</option>
    <option value="sectional">Sectional Mocks</option>
    <option value="year">PYQ Year</option>
    <option value="subject">Subject</option>
    <option value="custom">Custom</option>
  `;

  if (
    parent.folder_type === "full" ||
    parent.folder_type === "sectional"
  ) {
    document.getElementById("folderType").innerHTML = `
      <option value="year">PYQ Year</option>
      <option value="subject">Subject</option>
      <option value="custom">Custom</option>
    `;
  }

  openModal("folderModal");
}

function editFolder(id) {
  const folder = folders.find(item =>
    String(item.id) === String(id)
  );

  if (!folder) return;

  editingFolderId = id;
  activeExamId = folder.exam_id;
  activeParentId = folder.parent_id || null;

  document.getElementById("folderModalTitle").textContent =
    "Edit Folder";

  document.getElementById("folderName").value =
    folder.name || "";

  document.getElementById("folderType").innerHTML = `
    <option value="new">New Mocks</option>
    <option value="pyq">PYQ Mocks</option>
    <option value="full">Full Mocks</option>
    <option value="sectional">Sectional Mocks</option>
    <option value="year">PYQ Year</option>
    <option value="subject">Subject</option>
    <option value="custom">Custom</option>
  `;

  document.getElementById("folderType").value =
    folder.folder_type || "custom";

  openModal("folderModal");
}

async function saveFolder() {
  const name = document.getElementById("folderName")
    .value.trim();

  const folderType = document.getElementById("folderType")
    .value;

  if (!name) {
    alert("Enter folder name.");
    return;
  }

  let response;

  if (editingFolderId) {
    response = await supabaseClient
      .from("mock_folders")
      .update({
        name,
        folder_type: folderType
      })
      .eq("id", editingFolderId);
  } else {
    const siblingFolders = folders.filter(folder =>
      String(folder.exam_id) === String(activeExamId) &&
      String(folder.parent_id || "") === String(activeParentId || "")
    );

    response = await supabaseClient
      .from("mock_folders")
      .insert({
        exam_id: activeExamId,
        parent_id: activeParentId || null,
        name,
        folder_type: folderType,
        sort_order: siblingFolders.length,
        is_active: true
      });
  }

  if (response.error) {
    alert(response.error.message);
    return;
  }

  closeModal("folderModal");
  await loadData();
}

async function deleteFolder(id) {
  const folder = folders.find(item =>
    String(item.id) === String(id)
  );

  if (!folder) return;

  const descendants = getAllDescendantFolders(id);
  const allFolderIds = [id, ...descendants.map(item => item.id)];

  const relatedTests = tests.filter(test =>
    allFolderIds.some(folderId =>
      String(folderId) === String(test.folder_id)
    )
  );

  const ok = confirm(
    `Delete "${folder.name}" and its folders/tests?`
  );

  if (!ok) return;

  for (const test of relatedTests) {
    await deleteTestById(test.id, false);
  }

  const response = await supabaseClient
    .from("mock_folders")
    .delete()
    .in("id", allFolderIds);

  if (response.error) {
    alert(response.error.message);
    return;
  }

  await loadData();
}

function getAllDescendantFolders(parentId) {
  const result = [];

  function collect(id) {
    const children = folders.filter(folder =>
      String(folder.parent_id) === String(id)
    );

    children.forEach(child => {
      result.push(child);
      collect(child.id);
    });
  }

  collect(parentId);
  return result;
}

async function toggleTestStatus(id, status) {
  const response = await supabaseClient
    .from("mock_tests")
    .update({
      is_active: status
    })
    .eq("id", id);

  if (response.error) {
    alert(response.error.message);
    return;
  }

  await loadData();
}

async function deleteTest(id) {
  const test = tests.find(item =>
    String(item.id) === String(id)
  );

  if (!test) return;

  const ok = confirm(
    `Delete test "${test.title}" permanently?`
  );

  if (!ok) return;

  await deleteTestById(id, true);
}

async function deleteTestById(id, reload = true) {
  await supabaseClient
    .from("mock_test_questions")
    .delete()
    .eq("mock_test_id", id);

  await supabaseClient
    .from("mock_test_sections")
    .delete()
    .eq("mock_test_id", id);

  const response = await supabaseClient
    .from("mock_tests")
    .delete()
    .eq("id", id);

  if (response.error) {
    alert(response.error.message);
    return;
  }

  if (reload) {
    await loadData();
  }
}

/* =========================
   HELPERS
========================= */

function sortItems(a, b) {
  const orderA = Number(a.sort_order || 0);
  const orderB = Number(b.sort_order || 0);

  if (orderA !== orderB) {
    return orderA - orderB;
  }

  return Number(a.id || 0) - Number(b.id || 0);
}

function formatFolderType(type) {
  const map = {
    new: "New Mocks",
    pyq: "PYQ Mocks",
    full: "Full Mocks",
    sectional: "Sectional Mocks",
    year: "PYQ Year",
    subject: "Subject",
    custom: "Folder"
  };

  return map[type] || "Folder";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

document.querySelectorAll(".pa-modal-backdrop")
  .forEach(modal => {
    modal.addEventListener("click", event => {
      if (event.target === modal) {
        modal.classList.remove("show");
      }
    });
  });
