<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSC EDGE - Admin Practice</title>

<script>
document.documentElement.dataset.theme =
    localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================================================
   SSC EDGE ADMIN PRACTICE
========================================================= */

:root{
    --a-bg:#0f0f14;
    --a-card:#17171f;
    --a-card2:#20202a;
    --a-border:#30303c;
    --a-text:#f5f3f8;
    --a-muted:#aaa4b3;
    --a-purple:#9b5cff;
    --a-purple2:#b77aff;
    --a-danger:#ef5350;
    --a-green:#35c98a;
}

:root[data-theme="light"]{
    --a-bg:#f7f5fa;
    --a-card:#ffffff;
    --a-card2:#f0ebf7;
    --a-border:#ddd6e8;
    --a-text:#211d27;
    --a-muted:#716a7b;
    --a-purple:#8b45ee;
    --a-purple2:#9d63f4;
    --a-danger:#d93636;
    --a-green:#159b65;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;

    background:var(--a-bg)!important;
    color:var(--a-text)!important;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    padding-bottom:35px;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

input,
select{
    font-family:inherit;
}

/* =========================================================
   WRAPPER
========================================================= */

.admin-wrap{
    width:100%;
    max-width:900px;

    margin:0 auto;

    padding:20px 15px 40px;
}

/* =========================================================
   HEADER
========================================================= */

.admin-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.brand{
    font-size:21px;
    font-weight:950;
    letter-spacing:-.5px;
}

.brand span{
    color:var(--a-purple2);
}

.admin-label{
    margin-top:3px;

    font-size:10px;
    font-weight:800;

    color:var(--a-muted);

    letter-spacing:.4px;
}

/* =========================================================
   CARD
========================================================= */

.admin-card{
    margin-bottom:15px;

    padding:16px;

    background:var(--a-card);

    border:1px solid var(--a-border);

    border-radius:17px;
}

.admin-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:14px;
}

.admin-head h2{
    margin:0;

    font-size:16px;
    font-weight:950;
}

.admin-head p{
    margin:4px 0 0;

    font-size:10px;
    color:var(--a-muted);
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
    min-height:38px;

    padding:8px 13px;

    border-radius:10px;

    background:var(--a-purple);

    color:#fff;

    font-size:11px;
    font-weight:900;

    white-space:nowrap;
}

.btn:hover{
    filter:brightness(1.08);
}

.btn.secondary{
    background:var(--a-card2);

    color:var(--a-text);

    border:1px solid var(--a-border);
}

.btn.danger{
    background:var(--a-danger);
    color:#fff;
}

.btn.green{
    background:var(--a-green);
    color:#fff;
}

.btn.small{
    min-height:31px;

    padding:6px 9px;

    border-radius:8px;

    font-size:9px;
}

/* =========================================================
   FORM
========================================================= */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}

.field{
    display:flex;
    flex-direction:column;

    gap:5px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:10px;
    font-weight:850;

    color:var(--a-muted);
}

.field input,
.field select{
    width:100%;

    min-height:41px;

    padding:8px 10px;

    border-radius:10px;

    border:1px solid var(--a-border);

    background:var(--a-card2);

    color:var(--a-text);

    outline:none;
}

.field input:focus,
.field select:focus{
    border-color:var(--a-purple);
}

.form-actions{
    display:flex;
    flex-wrap:wrap;

    gap:8px;

    margin-top:12px;
}

/* =========================================================
   EXAM CARDS
========================================================= */

.exam-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:11px;
}

.exam-card{
    position:relative;

    padding:15px;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    border-radius:14px;

    transition:.15s;
}

.exam-card.active{
    border-color:var(--a-purple);

    box-shadow:
        0 0 0 1px
        rgba(155,92,255,.12);
}

.exam-board{
    font-size:9px;

    font-weight:900;

    color:var(--a-purple2);

    letter-spacing:.6px;

    text-transform:uppercase;
}

.exam-title{
    margin-top:5px;

    font-size:15px;
    font-weight:950;
}

.exam-order{
    margin-top:4px;

    font-size:9px;

    color:var(--a-muted);
}

.exam-actions{
    display:flex;
    flex-wrap:wrap;

    gap:5px;

    margin-top:12px;
}

/* =========================================================
   BREADCRUMB
========================================================= */

.breadcrumb{
    display:flex;
    align-items:center;

    gap:6px;

    margin-bottom:12px;

    overflow-x:auto;

    scrollbar-width:none;
}

.breadcrumb::-webkit-scrollbar{
    display:none;
}

.crumb{
    flex:none;

    padding:6px 9px;

    border-radius:8px;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    color:var(--a-muted);

    font-size:9px;
    font-weight:850;
}

.crumb.current{
    color:#fff;

    background:var(--a-purple);

    border-color:var(--a-purple);
}

:root[data-theme="light"] .crumb.current{
    color:#fff;
}

.crumb-arrow{
    flex:none;

    color:var(--a-muted);

    font-size:10px;
}

/* =========================================================
   NAVIGATION CARD GRID
========================================================= */

.practice-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:11px;
}

.practice-admin-card{
    min-height:112px;

    padding:16px;

    display:flex;
    flex-direction:column;

    justify-content:center;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    border-radius:15px;

    cursor:pointer;

    transition:.15s;
}

.practice-admin-card:hover{
    border-color:var(--a-purple);
}

.practice-admin-card.active{
    border-color:var(--a-purple);
}

.practice-admin-icon{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:10px;

    border-radius:11px;

    background:
        rgba(155,92,255,.13);

    color:var(--a-purple2);

    font-size:19px;
}

.practice-admin-title{
    font-size:14px;
    font-weight:950;
}

.practice-admin-sub{
    margin-top:3px;

    font-size:9px;
    color:var(--a-muted);
}

/* =========================================================
   SECTION HEADING
========================================================= */

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin:18px 0 10px;
}

.section-title h3{
    margin:0;

    font-size:12px;
    font-weight:950;

    letter-spacing:.5px;
}

.section-title span{
    font-size:9px;
    color:var(--a-muted);
}

/* =========================================================
   HORIZONTAL ROW
========================================================= */

.horizontal-scroll{
    display:flex;

    gap:10px;

    overflow-x:auto;

    padding:2px 1px 7px;

    scrollbar-width:none;
}

.horizontal-scroll::-webkit-scrollbar{
    display:none;
}

.horizontal-card{
    flex:0 0 145px;

    min-height:92px;

    padding:13px;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    border-radius:14px;

    cursor:pointer;
}

.horizontal-card:hover,
.horizontal-card.active{
    border-color:var(--a-purple);
}

.horizontal-icon{
    font-size:20px;

    margin-bottom:8px;
}

.horizontal-title{
    font-size:12px;
    font-weight:950;
}

.horizontal-sub{
    margin-top:3px;

    font-size:8px;
    color:var(--a-muted);
}

/* =========================================================
   TEST CARDS
========================================================= */

.test-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}

.test-card{
    padding:13px;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    border-radius:13px;
}

.test-title{
    font-size:12px;
    font-weight:900;

    line-height:1.35;
}

.test-meta{
    margin-top:6px;

    font-size:9px;

    color:var(--a-muted);

    line-height:1.5;
}

.test-actions{
    display:flex;
    flex-wrap:wrap;

    gap:5px;

    margin-top:10px;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
    padding:25px 15px;

    text-align:center;

    font-size:11px;

    color:var(--a-muted);

    border:1px dashed var(--a-border);

    border-radius:13px;
}

/* =========================================================
   STATUS
========================================================= */

.status{
    position:sticky;
    bottom:10px;
    z-index:20;

    margin-top:15px;

    padding:10px 12px;

    background:var(--a-card);

    border:1px solid var(--a-border);

    border-radius:10px;

    font-size:10px;

    color:var(--a-muted);

    text-align:center;
}

.status.error{
    color:#ff8585;
}

.status.success{
    color:var(--a-green);
}

/* =========================================================
   HIDDEN
========================================================= */

.hidden{
    display:none!important;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:560px){

    .admin-wrap{
        padding:17px 12px 35px;
    }

    .exam-grid,
    .practice-grid,
    .test-grid{
        grid-template-columns:1fr 1fr;
    }

    .admin-card{
        padding:13px;
    }

    .admin-head{
        align-items:flex-start;
    }

    .admin-head h2{
        font-size:15px;
    }

}

@media(max-width:390px){

    .exam-grid,
    .practice-grid,
    .test-grid{
        grid-template-columns:1fr;
    }

    .horizontal-card{
        flex-basis:140px;
    }

}

</style>

</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   STATE
========================================================= */

let exams = [];
let subjects = [];
let folders = [];
let tests = [];

let selectedExam = null;

let currentFolder = null;

let editingExamId = null;
let editingFolderId = null;
let editingTestId = null;

let currentParentId = null;
let currentTestFolderId = null;


/* =========================================================
   HELPERS
========================================================= */

function byId(id){
    return document.getElementById(id);
}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function setStatus(text,type=""){

    const el = byId("status");

    el.textContent = text;

    el.className =
        "status " + type;

}


function sortItems(list){

    return [...list].sort((a,b)=>{

        const x =
            Number(a.sort_order ?? 0);

        const y =
            Number(b.sort_order ?? 0);

        if(x !== y)
            return x-y;

        return String(
            a.display_name ||
            a.name ||
            a.title ||
            ""
        ).localeCompare(
            String(
                b.display_name ||
                b.name ||
                b.title ||
                ""
            )
        );

    });

}


function childrenOf(parentId){

    return sortItems(
        folders.filter(f =>
            String(f.parent_id ?? "") ===
            String(parentId ?? "")
        )
    );

}


function getFolder(id){

    return folders.find(f =>
        String(f.id) === String(id)
    ) || null;

}


function getRoot(folder){

    let current = folder;

    while(
        current &&
        current.parent_id !== null &&
        current.parent_id !== undefined
    ){

        current =
            getFolder(current.parent_id);

    }

    return current;

}


function getPath(folder){

    const path = [];

    let current = folder;

    while(current){

        path.unshift(current);

        if(
            current.parent_id === null ||
            current.parent_id === undefined
        )
            break;

        current =
            getFolder(current.parent_id);

    }

    return path;

}


function nextSort(parentId){

    const list =
        folders.filter(f =>
            String(f.parent_id ?? "") ===
            String(parentId ?? "")
        );

    if(!list.length)
        return 1;

    return Math.max(
        ...list.map(
            f => Number(f.sort_order) || 0
        )
    ) + 1;

}


function getTests(folderId){

    return tests
        .filter(t =>
            String(t.folder_id) ===
            String(folderId)
        )
        .sort((a,b) =>
            new Date(
                b.created_at || 0
            ) -
            new Date(
                a.created_at || 0
            )
        );

}


/* =========================================================
   LOAD ALL
========================================================= */

async function loadAll(){

    setStatus("Loading...");

    try{

        const [
            examsResponse,
            subjectsResponse,
            foldersResponse,
            testsResponse
        ] = await Promise.all([

            supabaseClient
                .from("exams")
                .select("*")
                .order(
                    "sort_order",
                    {ascending:true}
                )
                .order(
                    "name",
                    {ascending:true}
                ),

            supabaseClient
                .from("subjects")
                .select("*")
                .order("name"),

            supabaseClient
                .from("mock_folders")
                .select("*")
                .order(
                    "sort_order",
                    {ascending:true}
                ),

            supabaseClient
                .from("mock_tests")
                .select("*")
                .order(
                    "created_at",
                    {ascending:false}
                )

        ]);


        if(examsResponse.error)
            throw examsResponse.error;

        if(subjectsResponse.error)
            throw subjectsResponse.error;

        if(foldersResponse.error)
            throw foldersResponse.error;

        if(testsResponse.error)
            throw testsResponse.error;


        exams =
            examsResponse.data || [];

        subjects =
            subjectsResponse.data || [];

        folders =
            foldersResponse.data || [];

        tests =
            testsResponse.data || [];


        renderExams();
        renderSubjectOptions();

        if(selectedExam){

            const updated =
                exams.find(e =>
                    String(e.id) ===
                    String(selectedExam.id)
                );

            if(updated){

                selectedExam = updated;

                renderWorkspace();

            }else{

                closeWorkspace();

            }

        }


        setStatus(
            "Ready",
            "success"
        );

    }catch(error){

        console.error(error);

        setStatus(
            "Error: " +
            error.message,
            "error"

function editExam(id){

    const exam =
        exams.find(e =>
            String(e.id) ===
            String(id)
        );

    if(!exam)
        return;


    editingExamId =
        exam.id;

    byId("examFormTitle")
        .textContent =
        "Edit Exam";

    byId("examBoard")
        .value =
        exam.board || "SSC";

    byId("examName")

        .classList
        .remove("hidden");

}


function closeExamForm(){

    byId("examFormCard")
        .classList
        .add("hidden");

}


async function saveExam(){

    const board =
        byId("examBoard").value;

    const name =
        byId("examName")
        .value
        .trim();

    const sort =
        Number(
            byId("examSort").value
        ) || 0;


    if(!name){

        alert("Enter exam name.");

        return;

    }


    /*
       mock_type is intentionally NOT used
       for the Practice hierarchy.

       Existing exams table may require a valid
       mock_type because of its old database
       constraint. Therefore for NEW exams we
       use the existing valid value "Sectional".
       It does NOT control New/PYQ hierarchy.
    */

    let data;


    if(editingExamId){

        data = {

            board: board,

            name: name,

            is_active: true,

            sort_order: sort

        };

    }else{

        data = {

            board: board,

            name: name,

            mock_type: "Sectional",

            is_active: true,

            sort_order: sort

        };

    }


    setStatus("Saving exam...");


    const response =
        editingExamId

        ?

        await supabaseClient
            .from("exams")
            .update(data)
            .eq(
                "id",
                editingExamId
            )

        :

        await supabaseClient
            .from("exams")
            .insert(data);


    if(response.error){

        alert(
            "Exam error:\n" +
            response.error.message
        );

        setStatus(
            response.error.message,
            "error"
        );

        return;

    }


    closeExamForm();

    await loadAll();

}


/* =========================================================
   DELETE EXAM
========================================================= */

async function deleteExam(id){

    const exam =
        exams.find(e =>
            String(e.id) ===
            String(id)
        );

    if(!exam)
        return;


    const hasFolders =
        folders.some(f =>
            String(f.exam_id) ===
            String(id)
        );


    const message =
        hasFolders

        ?

        "Delete " +
        exam.board +
        " - " +
        exam.name +
        "?\n\nAll its Practice folders will also be deleted."

        :

        "Delete " +
        exam.board +
        " - " +
        exam.name +
        "?";


    if(!confirm(message))
        return;


    setStatus("Deleting exam...");


    const response =
        await supabaseClient
        .from("exams")
        .delete()
        .eq("id",id);


    if(response.error){

        alert(
            "Delete error:\n" +
            response.error.message
        );

        return;

    }


    if(
        selectedExam &&
        String(selectedExam.id) ===
        String(id)
    ){

        closeWorkspace();

    }


    await loadAll();

}


/* =========================================================
   EXAM REORDER
========================================================= */

async function moveExam(id,direction){

    const list =
        sortItems(exams);


    const index =
        list.findIndex(e =>
            String(e.id) ===
            String(id)
        );


    if(index < 0)
        return;


    const target =
        direction === "up"
        ? index - 1
        : index + 1;


    if(
        target < 0 ||
        target >= list.length
    )
        return;


    const a = list[index];
    const b = list[target];


    const aOrder =
        Number(a.sort_order)||0;

    const bOrder =
        Number(b.sort_order)||0;


    let orderA = bOrder;
    let orderB = aOrder;


    if(aOrder === bOrder){

        orderA = target + 1;
        orderB = index + 1;

    }


    const r1 =
        await supabaseClient
        .from("exams")
        .update({
            sort_order:orderA
        })
        .eq("id",a.id);


    const r2 =
        await supabaseClient
        .from("exams")
        .update({
            sort_order:orderB
        })
        .eq("id",b.id);


    if(r1.error || r2.error){

        alert(
            (r1.error || r2.error).message
        );

        return;

    }


    await loadAll();

}

/* =========================================================
   NORMALIZE TYPES
========================================================= */

function normalizeType(type){

    return String(type || "")
        .trim()
        .toLowerCase()
        .replace(/[\s_-]+/g," ");

}


/* =========================================================
   ADD ROOT
========================================================= */

async function addRoot(type){

    if(!selectedExam)
        return;


    const wanted =
        type === "new"
        ? "new"
        : "pyq";


    const exists =
        folders.some(f =>

            String(f.exam_id) ===
            String(selectedExam.id)

            &&

            (
                f.parent_id === null ||
                f.parent_id === undefined
            )

            &&

            normalizeType(
                f.folder_type
            ) === wanted

        );


    if(exists){

        alert(
            wanted === "new"
            ?
            "NEW MOCKS already exists."
            :
            "PYQ MOCKS already exists."
        );

        return;

    }


    const rootName =
        wanted === "new"
        ?
        "NEW MOCKS"
        :
        "PYQ MOCKS";


    const data = {

        exam_id:
            selectedExam.id,

        parent_id:
            null,

        subject_id:
            null,

        name:
            rootName,

        display_name:
            rootName,

        folder_type:
            wanted,

        sort_order:
            nextSort(null),

        is_active:
            true

    };


    setStatus(
        "Creating " +
        rootName +
        "..."
    );


    const response =
        await supabaseClient
        .from("mock_folders")
        .insert(data);


    if(response.error){

        alert(
            "Folder error:\n" +
            response.error.message
        );

        return;

    }


    await loadAll();

}

/* =========================================================
   RENDER CURRENT FOLDER
========================================================= */

function renderFolderLevel(){

    if(!currentFolder)
        return;


    byId("levelCard")
        .classList
        .remove("hidden");


    const type =
        normalizeType(
            currentFolder.folder_type
        );


    const title =
        currentFolder.display_name ||
        currentFolder.name ||
        "";


    byId("levelTitle")
        .textContent =
        title;


    byId("levelSubtitle")
        .textContent =
        getLevelDescription(
            currentFolder
        );


    const addButton =
        byId("levelAddButton");


    /*
       ROOT NEW / PYQ
       ----------------
       Children = FULL / SECTIONAL
    */

    if(type === "new" || type === "pyq"){

        addButton.style.display =
            "block";

        addButton.textContent =
            "+ Add Category";

        addButton.onclick =
            function(){
                openCategoryForm(
                    currentFolder.id
                );
            };


        renderCategoryChildren();

        return;

    }


    /*
       FULL
       ----------------
       New Full -> direct Tests
       PYQ Full -> Years
    */

    if(type === "full"){

        const root =
            getRoot(currentFolder);

        const rootType =
            root
            ?
            normalizeType(
                root.folder_type
            )
            :
            "";


        if(rootType === "pyq"){

            addButton.style.display =
                "block";

            addButton.textContent =
                "+ Add Year";

            addButton.onclick =
                function(){
                    openYearForm(
                        currentFolder.id
                    );
                };


            renderYearChildren();

        }else{

            addButton.style.display =
                "block";

            addButton.textContent =
                "+ Add Test";

            addButton.onclick =
                function(){
                    openTestForm(
                        currentFolder.id
                    );
                };


            renderDirectTests(
                currentFolder.id
            );

        }

        return;

    }


    /*
       SECTIONAL
       ----------------
       Children = Subjects
    */

    if(type === "sectional"){

        addButton.style.display =
            "block";

        addButton.textContent =
            "+ Add Subject";

        addButton.onclick =
            function(){
                openSubjectFolderForm(
                    currentFolder.id
                );
            };


        renderSubjectChildren();

        return;

    }


    /*
       YEAR
       ----------------
       Direct Tests
    */

    if(type === "year"){

        addButton.style.display =
            "block";

        addButton.textContent =
            "+ Add Test";

        addButton.onclick =
            function(){
                openTestForm(
                    currentFolder.id
                );
            };


        renderDirectTests(
            currentFolder.id
        );

        return;

    }


    /*
       SUBJECT
       ----------------
       Direct Tests
    */

    if(type === "subject"){

        addButton.style.display =
            "block";

        addButton.textContent =
            "+ Add Test";

        addButton.onclick =
            function(){
                openTestForm(
                    currentFolder.id
                );
            };


        renderDirectTests(
            currentFolder.id
        );

        return;

    }


    /*
       FALLBACK
    */

    addButton.style.display =
        "block";

    addButton.textContent =
        "+ Add Test";

    addButton.onclick =
        function(){
            openTestForm(
                currentFolder.id
            );
        };


    renderDirectTests(
        currentFolder.id
    );

}


/* =========================================================
   DESCRIPTION
========================================================= */

function getLevelDescription(folder){

    const type =
        normalizeType(
            folder.folder_type
        );


    if(type === "new")
        return "New Mock Tests";


    if(type === "pyq")
        return "Previous Year Mock Tests";


    if(type === "full"){

        const root =
            getRoot(folder);

        if(
            root &&
            normalizeType(
                root.folder_type
            ) === "pyq"
        )
            return "Select PYQ year";

        return "Full mock tests";

    }


    if(type === "sectional")
        return "Select subject";


    if(type === "year")
        return "Tests for this year";


    if(type === "subject")
        return "Tests for this subject";


    return "Practice management";

}

        .textContent =
        "CATEGORY NAME";

        .value = "";

       We use a custom modal-like choice
       through the name prompt because the
       category type must not be confusing.
    */

        prompt(
            "Enter category:\n\n" +
            "FULL MOCKS\n" +
            "SECTIONAL MOCKS",

        normalized === "sectional mocks"

        .classList

/* =========================================================
   SAVE FOLDER
========================================================= */

async function saveFolder(){

    if(!selectedExam)
        return;


    const name =
        byId("folderName")
        .value
        .trim();


    const type =
        byId("folderFormCard")
        .dataset.type;


    const sort =
        Number(
            byId("folderSort")
            .value
        ) || 0;


    const subjectValue =
        byId("folderSubject")
        .value;


    if(!name){

        alert(
            "Enter a name."
        );

        return;

    }


    if(!type){

        alert(
            "Folder type missing."
        );

        return;

    }


    const data = {

        exam_id:
            selectedExam.id,

        parent_id:
            currentParentId === null ||
            currentParentId === undefined
            ?
            null
            :
            currentParentId,

        subject_id:
            type === "subject" &&
            subjectValue
            ?
            Number(subjectValue)
            :
            null,

        name:
            name,

        display_name:
            name,

        folder_type:
            type,

        sort_order:
            sort,

        is_active:
            true

    };


    setStatus(
        editingFolderId
        ?
        "Updating..."
        :
        "Creating..."
    );


    let response;


    if(editingFolderId){

        response =
            await supabaseClient
            .from("mock_folders")
            .update(data)
            .eq(
                "id",
                editingFolderId
            );

    }else{

        response =
            await supabaseClient
            .from("mock_folders")
            .insert(data);

    }


    if(response.error){

        alert(
            "Folder error:\n" +
            response.error.message
        );

        return;

    }


    closeFolderForm();

    await loadAll();


    if(selectedExam){

        const sameFolder =
            currentFolder
            ?
            folders.find(f =>
                String(f.id) ===
                String(currentFolder.id)
            )
            :
            null;


        if(sameFolder)
            currentFolder =
                sameFolder;


        renderWorkspace();

    }

}

/* =========================================================
   DELETE FOLDER
========================================================= */

async function deleteFolder(id){

    const folder =
        getFolder(id);


    if(!folder)
        return;


    const descendants =
        getDescendants(id);


    const hasTests =
        tests.some(t =>
            descendants.includes(
                String(t.folder_id)
            )
            ||
            String(t.folder_id) ===
            String(id)
        );


    let message =
        "Delete \"" +
        (
            folder.display_name ||
            folder.name
        ) +
        "\"?";


    if(descendants.length){

        message +=
            "\n\nChild folders will also be deleted.";

    }


    if(hasTests){

        message +=
            "\n\nTests inside these folders may also be affected.";

    }


    if(!confirm(message))
        return;


    setStatus(
        "Deleting..."
    );


    const response =
        await supabaseClient
        .from("mock_folders")
        .delete()
        .eq("id",id);


    if(response.error){

        alert(
            "Delete error:\n" +
            response.error.message
        );

        return;

    }


    if(
        currentFolder &&
        (
            String(currentFolder.id) ===
            String(id)
            ||
            descendants.includes(
                String(currentFolder.id)
            )
        )
    ){

        currentFolder =
            getFolder(
                folder.parent_id
            );

    }


    await loadAll();

}


/* =========================================================
   DESCENDANTS
========================================================= */

function getDescendants(id){

    const result = [];

    function walk(parent){

        folders
        .filter(f =>
            String(f.parent_id) ===
            String(parent)
        )
        .forEach(child => {

            result.push(
                String(child.id)
            );

            walk(child.id);

        });

    }

    walk(id);

    return result;

}


/* =========================================================
   MOVE FOLDER
========================================================= */

async function moveFolder(id,direction){

    const folder =
        getFolder(id);


    if(!folder)
        return;


    const siblings =
        sortItems(
            folders.filter(f =>

                String(f.exam_id) ===
                String(folder.exam_id)

                &&

                String(
                    f.parent_id ?? ""
                ) ===
                String(
                    folder.parent_id ?? ""
                )

            )
        );


    const index =
        siblings.findIndex(f =>
            String(f.id) ===
            String(id)
        );


    if(index < 0)
        return;


    const target =
        direction === "up"
        ? index - 1
        : index + 1;


    if(
        target < 0 ||
        target >= siblings.length
    )
        return;


    const other =
        siblings[target];


    const orderA =
        Number(
            folder.sort_order
        ) || 0;

    const orderB =
        Number(
            other.sort_order
        ) || 0;


    const r1 =
        await supabaseClient
        .from("mock_folders")
        .update({
            sort_order:
                orderB
        })
        .eq(
            "id",
            folder.id
        );


    const r2 =
        await supabaseClient
        .from("mock_folders")
        .update({
            sort_order:
                orderA
        })
        .eq(
            "id",
            other.id
        );


    if(r1.error || r2.error){

        alert(
            (r1.error || r2.error)
            .message
        );

        return;

    }


    await loadAll();

}

/* =========================================================

========================================================= */

function inferTestType(folder){

    if(!folder)
        return "full";


    const type =
        normalizeType(
            folder.folder_type
        );


    if(type === "subject")
        return "sectional";


    if(type === "sectional")
        return "sectional";


    return "full";

}
