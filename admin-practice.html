<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg,#f7f4fb);
  color:var(--text,#17131c);
}

:root{
  --purple:#9b5cff;
  --purple2:#7d3fe8;
  --card:#ffffff;
  --border:#e2d9ed;
  --muted:#746c7e;
  --danger:#e5484d;
}

:root[data-theme="dark"]{
  --bg:#120c18;
  --text:#f7f2fb;
  --card:#21172b;
  --border:#3a2a49;
  --muted:#aaa0b4;
}

.header{
  padding:18px 18px 15px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20;
}

.header h1{
  margin:0;
  font-size:23px;
}

.header h1 span{
  color:var(--purple);
}

.header p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

.container{
  padding:18px;
  padding-bottom:40px;
  max-width:900px;
  margin:auto;
}

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
  margin-bottom:16px;
}

.panel-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:14px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

input,
select{
  width:100%;
  height:45px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  padding:0 12px;
  outline:none;
  margin-bottom:12px;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.primary{
  width:100%;
  min-height:45px;
  border-radius:11px;
  background:var(--purple);
  color:white;
  font-weight:800;
}

.secondary{
  min-height:40px;
  padding:0 14px;
  border-radius:10px;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  font-weight:700;
}

.cancel{
  margin-top:8px;
}

.message{
  display:none;
  padding:11px 12px;
  border-radius:10px;
  margin-bottom:12px;
  font-size:13px;
  font-weight:700;
}

.message.show{
  display:block;
}

.message.error{
  background:#ffe5e5;
  color:#a51d22;
}

.message.success{
  background:#e4f8e9;
  color:#237333;
}

.exam-card{
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px;
  margin-bottom:12px;
}

.exam-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.exam-name{
  font-size:17px;
  font-weight:800;
}

.exam-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.action{
  padding:8px 11px;
  border-radius:8px;
  font-size:12px;
  font-weight:800;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
}

.action.delete{
  color:var(--danger);
}

.action.up,
.action.down{
  min-width:38px;
}

.tree{
  margin-top:14px;
}

.node{
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px;
  margin-bottom:9px;
  background:var(--bg);
}

.node-title{
  font-size:15px;
  font-weight:800;
}

.node-type{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.node-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:9px;
}

.small-btn{
  padding:7px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
}

.child{
  margin-left:14px;
  margin-top:8px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:20px 5px;
  font-size:13px;
}

.hidden{
  display:none!important;
}

hr{
  border:0;
  border-top:1px solid var(--border);
  margin:17px 0;
}

</style>
</head>

========================================== */

  setTimeout(()=>{

/* ==========================================
   LOAD EXAMS
========================================== */

async function loadExams(){

  const {
    data,
    error
  } =
  await db
    .from("exams")
    .select("*")
    .order("created_at",{ascending:true});

  const box =
    document.getElementById("examList");

  if(error){

    box.innerHTML =
      `<div class="empty">
        ${error.message}
      </div>`;

    return;
  }

  if(!data || !data.length){

    box.innerHTML =
      `<div class="empty">
        No exams added yet.
      </div>`;

    return;
  }

  box.innerHTML="";

  data.forEach((exam,index)=>{

    const card =
      document.createElement("div");

    card.className="exam-card";

    card.innerHTML=`

      <div class="exam-head">

        <div>

          <div class="exam-name">
            ${escapeHtml(exam.name)}
          </div>

          <div class="exam-meta">
            ${escapeHtml(exam.board || "")}
            •
            ${exam.is_active ? "Active" : "Inactive"}
          </div>

        </div>

      </div>

      <div class="actions">

        <button
          class="action up"
          onclick="moveExam('${exam.id}','up')"

          ↑

        <button
          class="action down"
          onclick="moveExam('${exam.id}','down')"
        >
          ↓
        </button>

        <button
          class="action"
          onclick="editExam('${exam.id}')"
        >
          Edit
        </button>

        <button
          class="action delete"
          onclick="deleteExam('${exam.id}')"
        >
          Delete
        </button>

      </div>

    `;

    box.appendChild(card);

  });

}


/* ==========================================
   SAVE EXAM
========================================== */

async function saveExam(){

  const id =
    document.getElementById("examId").value;

  const board =
    document.getElementById("examBoard").value.trim();

  const name =
    document.getElementById("examName").value.trim();

  const active =
    document.getElementById("examActive").value==="true";

  if(!board || !name){

    showMessage(
      "Board and Exam Name are required.",
      "error"
    );

    return;
  }

  let result;

  if(id){

    result =
      await db
        .from("exams")
        .update({
          board:board,
          name:name,
          is_active:active
        })
        .eq("id",id);

  }else{

    result =
      await db
        .from("exams")
        .insert({
          board:board,
          name:name,
          mock_type:"Sectional",
          is_active:active
        });

  }

  if(result.error){

    showMessage(
      result.error.message,
      "error"
    );

    return;
  }

  showMessage(
    id ? "Exam updated." : "Exam added.",
    "success"
  );

  cancelExamEdit();

  await loadAll();

}

   EDIT EXAM
========================================== */

    .from("exams")

  if(error){

    showMessage(error.message,"error");

========================================== */

/* ==========================================
   SAVE FOLDER
========================================== */

async function saveFolder(){

  const id =
    document.getElementById("folderId").value;

  const examId =
    document.getElementById("folderExam").value;

  const parentId =
    document.getElementById("folderParent").value || null;

  const name =
    document.getElementById("folderName").value.trim();

  const type =
    document.getElementById("folderType").value;

  const active =
    document.getElementById("folderActive").value==="true";

  if(!examId || !name){

    showMessage(
      "Select an exam and enter a name.",
      "error"
    );

    return;
  }

  const payload={

    exam_id:Number(examId),

    parent_id:
      parentId ? Number(parentId) : null,

    name:name,

    display_name:name,

    folder_type:type,

    is_active:active

  };


  let result;

  if(id){

    result =
      await db
        .from("mock_folders")
        .update(payload)
        .eq("id",id);

  }else{

    const {data:lastFolder} =
      await db
        .from("mock_folders")
        .select("sort_order")
        .eq("exam_id",Number(examId))
        .eq(
          "parent_id",
          parentId ? Number(parentId) : null
        )
        .order("sort_order",{ascending:false})
        .limit(1)
        .maybeSingle();

    payload.sort_order =
      lastFolder
        ? Number(lastFolder.sort_order)+1
        : 0;

    result =
      await db
        .from("mock_folders")
        .insert(payload);

  }

  if(result.error){

    showMessage(
      result.error.message,
      "error"
    );

    return;

  }

  showMessage(
    id ? "Section updated." : "Section added.",
    "success"
  );

  cancelFolderEdit();

  await loadAll();

}

/* ==========================================
   STRUCTURE
========================================== */

async function loadStructure(){

  const box =
    document.getElementById("structure");

  const {
    data:exams
  } =
  await db
    .from("exams")
    .select("id,name,board,is_active")
    .order("created_at",{ascending:true});

  const {
    data:folders,
    error
  } =
  await db
    .from("mock_folders")
    .select("*")
    .order("sort_order",{ascending:true});

  if(error){

    box.innerHTML=
      `<div class="empty">
        ${error.message}
      </div>`;

    return;

  }

  if(!exams || !exams.length){

    box.innerHTML=
      `<div class="empty">
        Add an exam first.
      </div>`;

    return;

  }

  box.innerHTML="";

  exams.forEach(exam=>{

    const examBox=
      document.createElement("div");

    examBox.className="exam-card";

    examBox.innerHTML=`

      <div class="exam-name">
        ${escapeHtml(exam.board || "")}
        •
        ${escapeHtml(exam.name)}
      </div>

      <div class="exam-meta">
        Practice hierarchy
      </div>

      <div class="tree"></div>

    `;

    const tree =
      examBox.querySelector(".tree");

    const roots =
      (folders||[])
        .filter(f =>
          Number(f.exam_id)===Number(exam.id)
          &&
          !f.parent_id
        )
        .sort(
          (a,b)=>
            Number(a.sort_order)-
            Number(b.sort_order)
        );

    roots.forEach(root=>{
      tree.appendChild(
        createNode(root,folders)
      );
    });

    if(!roots.length){

      tree.innerHTML=
        `<div class="empty">
          No sections created for this exam.
        </div>`;

    }

    box.appendChild(examBox);

  });

}


/* ==========================================
   CREATE TREE NODE
========================================== */

function createNode(folder,allFolders){

  const wrap =
    document.createElement("div");

  wrap.className="node";

  const children =
    (allFolders||[])
      .filter(x =>
        Number(x.parent_id)===Number(folder.id)
      )
      .sort(
        (a,b)=>
          Number(a.sort_order)-
          Number(b.sort_order)
      );

  wrap.innerHTML=`

    <div class="node-title">
      ${escapeHtml(
        folder.display_name || folder.name
      )}
    </div>

    <div class="node-type">
      ${escapeHtml(folder.folder_type || "")}
      •
      ${folder.is_active ? "Active":"Inactive"}
    </div>

    <div class="node-actions">

      <button
        class="small-btn"
        onclick="editFolder('${folder.id}')"
      >
        Edit
      </button>

      <button
        class="small-btn"
        onclick="deleteFolder('${folder.id}')"
      >
        Delete
      </button>

      <button
        class="small-btn"
        onclick="moveFolder('${folder.id}','up')"
      >
        ↑
      </button>

      <button
        class="small-btn"
        onclick="moveFolder('${folder.id}','down')"
      >
        ↓
      </button>

      <button
        class="small-btn"
        onclick="quickAddChild('${folder.id}','${folder.exam_id}')"
      >
        + Child
      </button>

    </div>

    <div class="children"></div>

  `;

  const childrenBox =
    wrap.querySelector(".children");

  children.forEach(child=>{

    const childWrap =
      document.createElement("div");

    childWrap.className="child";

    childWrap.appendChild(
      createNode(child,allFolders)
    );

    childrenBox.appendChild(childWrap);

  });

  return wrap;

}


/* ==========================================
   QUICK CHILD
========================================== */

function quickAddChild(parentId,examId){

  document.getElementById("folderId").value="";

  document.getElementById("folderExam").value=
    examId;

  document.getElementById("folderParent").value=
    parentId;

  document.getElementById("folderName").value="";

  document.getElementById("folderFormTitle").textContent=
    "Add Child Section";

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}


/* ==========================================
   MOVE FOLDER
========================================== */

async function moveFolder(id,direction){

  const {
    data:current,
    error
  } =
  await db
    .from("mock_folders")
    .select("*")
    .eq("id",id)
    .single();

  if(error || !current) return;

  const {
    data:siblings
  } =
  await db
    .from("mock_folders")
    .select("*")
    .eq("exam_id",current.exam_id)
    .eq(
      "parent_id",
      current.parent_id
    )
    .order("sort_order",{ascending:true});

  if(!siblings || siblings.length<2)
    return;

  const index =
    siblings.findIndex(
      x=>Number(x.id)===Number(id)
    );

  const otherIndex =
    direction==="up"
      ? index-1
      : index+1;

  if(
    otherIndex<0 ||
    otherIndex>=siblings.length
  ) return;

  const other =
    siblings[otherIndex];

  await db
    .from("mock_folders")
    .update({
      sort_order:other.sort_order
    })
    .eq("id",current.id);

  await db
    .from("mock_folders")
    .update({
      sort_order:current.sort_order
    })
    .eq("id",other.id);

  await loadAll();

}


/* ==========================================
   ESCAPE
========================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
