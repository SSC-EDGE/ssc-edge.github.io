<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSC EDGE - Admin Practice</title>

<script>
document.documentElement.dataset.theme =
    localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">

<style>

:root{
    --a-bg:#0f0f14;
    --a-card:#17171f;
    --a-card2:#20202a;
    --a-border:#30303c;
    --a-text:#f5f3f8;
    --a-muted:#aaa4b3;
    --a-purple:#9b5cff;
    --a-danger:#ef5350;
}

:root[data-theme="light"]{
    --a-bg:#f7f5fa;
    --a-card:#fff;
    --a-card2:#f0ebf7;
    --a-border:#ddd6e8;
    --a-text:#211d27;
    --a-muted:#716a7b;
    --a-purple:#8b45ee;
    --a-danger:#d93636;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;

    background:var(--a-bg)!important;
    color:var(--a-text)!important;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    padding-bottom:30px;
}

.admin-wrap{
    width:100%;
    max-width:900px;

    margin:auto;

    padding:22px 15px 40px;
}

.admin-title{
    margin:0 0 5px;

    font-size:25px;
    font-weight:900;
}

.admin-subtitle{
    margin:0 0 25px;

    font-size:13px;
    color:var(--a-muted);
}

/* CARD */

.admin-card{
    margin-bottom:15px;

    padding:16px;

    background:var(--a-card);

    border:1px solid var(--a-border);

    border-radius:16px;
}

/* HEAD */

.admin-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:14px;
}

.admin-head h2{
    margin:0;

    font-size:16px;
    font-weight:900;
}

/* BUTTON */

button{
    border:0;
    cursor:pointer;

    font-family:inherit;
}

.btn{
    min-height:38px;

    padding:8px 13px;

    border-radius:10px;

    background:var(--a-purple);

    color:#fff;

    font-size:11px;
    font-weight:850;
}

.btn.secondary{
    background:var(--a-card2);
    color:var(--a-text);

    border:1px solid var(--a-border);
}

.btn.danger{
    background:var(--a-danger);
    color:#fff;
}

.btn.small{
    min-height:32px;
    padding:6px 10px;
    font-size:10px;
}

/* FORM */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}

.field{
    display:flex;
    flex-direction:column;

    gap:5px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-size:10px;
    font-weight:800;
    color:var(--a-muted);
}

.field input,
.field select{
    width:100%;

    min-height:40px;

    padding:8px 10px;

    border-radius:9px;

    border:1px solid var(--a-border);

    background:var(--a-card2);

    color:var(--a-text);

    outline:none;
}

.field input:focus,
.field select:focus{
    border-color:var(--a-purple);
}

.form-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;

    margin-top:12px;
}

/* EXAM LIST */

.exam-row{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;

    padding:12px;

    margin-bottom:8px;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    border-radius:12px;
}

.exam-row.active{
    border-color:var(--a-purple);
}

.exam-name{
    font-size:13px;
    font-weight:850;
}

.exam-meta{
    margin-top:3px;

    font-size:10px;
    color:var(--a-muted);
}

.row-actions{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

/* TREE */

.tree{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.tree-item{
    padding:12px;

    background:var(--a-card2);

    border:1px solid var(--a-border);

    border-radius:12px;
}

.tree-item.root{
    border-color:#594077;
}

.tree-item.child{
    margin-left:16px;
}

.tree-item.leaf{
    margin-left:32px;
}

.tree-top{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:8px;
}

.tree-name{
    font-size:13px;
    font-weight:850;
}

.tree-type{
    margin-top:3px;

    font-size:9px;

    color:var(--a-muted);
}

.tree-actions{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
}

.icon-btn{
    width:30px;
    height:30px;

    border-radius:8px;

    background:var(--a-card);

    border:1px solid var(--a-border);

    color:var(--a-text);

    font-size:12px;
}

.icon-btn.delete{
    color:#ff7777;
}

/* TEST */

.test-admin-row{
    padding:12px;

    margin-top:8px;

    border-radius:12px;

    background:var(--a-card2);

    border:1px solid var(--a-border);
}

.test-admin-title{
    font-size:13px;
    font-weight:850;
}

.test-admin-meta{
    margin-top:4px;

    font-size:10px;

    color:var(--a-muted);
}

.status{
    margin-top:12px;

    padding:10px;

    border-radius:9px;

    font-size:11px;

    background:var(--a-card2);

    color:var(--a-muted);
}

.hidden{
    display:none!important;
}

.empty{
    padding:20px;

    text-align:center;

    font-size:12px;

    color:var(--a-muted);
}

@media(max-width:520px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .exam-row,
    .tree-top{
        align-items:flex-start;
        flex-direction:column;
    }

}

</style>

</head>


<body>


<div class="admin-wrap">


<h1 class="admin-title">
    Admin Practice
</h1>

<p class="admin-subtitle">
    Manage exams, mock hierarchy and tests
</p>


<!-- =====================================================
     EXAMS
===================================================== -->

<div class="admin-card">

    <div class="admin-head">

        <h2>
            EXAMS
        </h2>

        <button
            class="btn"
            onclick="newExam()"
        >
            + Add Exam
        </button>

    </div>


    <div id="examList"></div>

</div>


<!-- =====================================================
     EXAM FORM
===================================================== -->

<div
    id="examFormCard"
    class="admin-card hidden"
>

    <div class="admin-head">

        <h2 id="examFormTitle">
            Add Exam
        </h2>

    </div>


    <div class="form-grid">

        <div class="field">

            <label>
                Board
            </label>

            <select id="examBoard">

                <option value="SSC">
                    SSC
                </option>

                <option value="RRB">
                    RRB
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Exam Name
            </label>

            <input
                id="examName"
                placeholder="CGL"
            >

        </div>


        <div class="field">

            <label>
                Mock Type
            </label>

            <select id="examMockType">

                <option value="Sectional">
                    Sectional
                </option>

                <option value="Subject Wise">
                    Subject Wise
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Sort Order
            </label>

            <input
                id="examSort"
                type="number"
                value="0"
            >

        </div>

    </div>


    <div class="form-actions">

        <button
            class="btn"
            onclick="saveExam()"
        >
            Save Exam
        </button>

        <button
            class="btn secondary"
            onclick="closeExamForm()"
        >
            Cancel
        </button>

    </div>

</div>


<!-- =====================================================
     SELECTED EXAM
===================================================== -->

<div
    id="selectedExamCard"
    class="admin-card hidden"
>

    <div class="admin-head">

        <h2 id="selectedExamTitle">
            Practice Structure
        </h2>

    </div>


    <div class="form-actions">

        <button
            class="btn"
            onclick="addRoot('new')"
        >
            + NEW MOCKS
        </button>

        <button
            class="btn"
            onclick="addRoot('pyq')"
        >
            + PYQ MOCKS
        </button>

    </div>


    <div
        id="structureTree"
        class="tree"
        style="margin-top:15px;"
    ></div>

</div>


<!-- =====================================================
     FOLDER FORM
===================================================== -->

<div
    id="folderFormCard"
    class="admin-card hidden"
>

    <div class="admin-head">

        <h2 id="folderFormTitle">
            Add Folder
        </h2>

    </div>


    <div class="form-grid">

        <div class="field">

            <label>
                Display Name
            </label>

            <input
                id="folderName"
                placeholder="NEW MOCKS"
            >

        </div>


        <div class="field">

            <label>
                Folder Type
            </label>

            <select id="folderType">

                <option value="new">
                    NEW MOCKS
                </option>

                <option value="pyq">
                    PYQ MOCKS
                </option>

                <option value="full">
                    FULL MOCKS
                </option>

                <option value="sectional">
                    SECTIONAL MOCKS
                </option>

                <option value="year">
                    YEAR
                </option>

                <option value="subject">
                    SUBJECT
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Subject
            </label>

            <select id="folderSubject">

                <option value="">
                    No linked subject
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Sort Order
            </label>

            <input
                id="folderSort"
                type="number"
                value="0"
            >

        </div>

    </div>


    <div class="form-actions">

        <button
            class="btn"
            onclick="saveFolder()"
        >
            Save Folder
        </button>

        <button
            class="btn secondary"
            onclick="closeFolderForm()"
        >
            Cancel
        </button>

    </div>

</div>


<!-- =====================================================
     TESTS
===================================================== -->

<div
    id="testCard"
    class="admin-card hidden"
>

    <div class="admin-head">

        <h2 id="testFormTitle">
            Add Test
        </h2>

    </div>


    <div class="form-grid">

        <div class="field full">

            <label>
                Test Title
            </label>

            <input
                id="testTitle"
                placeholder="SSC CGL Mock Test 01"
            >

        </div>


        <div class="field">

            <label>
                Test Type
            </label>

            <select id="testType">

                <option value="full">
                    Full
                </option>

                <option value="sectional">
                    Sectional
                </option>

                <option value="subject_wise">
                    Subject Wise
                </option>

                <option value="chapter_wise">
                    Chapter Wise
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Subject
            </label>

            <select id="testSubject">

                <option value="">
                    No subject
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Duration (minutes)
            </label>

            <input
                id="testDuration"
                type="number"
                value="60"
            >

        </div>


        <div class="field">

            <label>
                Total Questions
            </label>

            <input
                id="testQuestions"
                type="number"
                value="25"
            >

        </div>

    </div>


    <div class="form-actions">

        <button
            class="btn"
            onclick="saveTest()"
        >
            Save Test
        </button>

        <button
            class="btn secondary"
            onclick="closeTestForm()"
        >
            Cancel
        </button>

    </div>


    <div
        id="testListAdmin"
        style="margin-top:18px;"
    ></div>

</div>


<div
    id="status"
    class="status"
>
    Loading...
</div>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient=
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   STATE
========================================================= */

let exams=[];
let subjects=[];
let folders=[];
let tests=[];

let selectedExam=null;

let editingExamId=null;
let editingFolderId=null;
let editingTestId=null;

let currentParentId=null;
let currentTestFolderId=null;


/* =========================================================
   STATUS
========================================================= */

function msg(text){

    document
    .getElementById("status")
    .textContent=text;

}


/* =========================================================
   LOAD
========================================================= */

async function loadAll(){

    msg("Loading...");


    const e=
    await supabaseClient
    .from("exams")
    .select("*")
    .order("sort_order",{ascending:true})
    .order("name",{ascending:true});


    exams=e.data||[];


    const s=
    await supabaseClient
    .from("subjects")
    .select("*")
    .order("name");


    subjects=s.data||[];


    const f=
    await supabaseClient
    .from("mock_folders")
    .select("*")
    .order("sort_order",{ascending:true});


    folders=f.data||[];


    const t=
    await supabaseClient
    .from("mock_tests")
    .select("*")
    .order("created_at",{ascending:false});


    tests=t.data||[];


    renderExams();
    renderSubjects();


    msg(
        "Ready"
    );

}


/* =========================================================
   EXAMS
========================================================= */

function renderExams(){

    const box=
    document.getElementById(
        "examList"
    );


    if(!exams.length){

        box.innerHTML=`
            <div class="empty">
                No exams added yet.
            </div>
        `;

        return;

    }


    box.innerHTML=
    exams.map((e,i)=>`

        <div
            class="exam-row
            ${
                selectedExam &&
                String(selectedExam.id)===
                String(e.id)
                ?
                "active"
                :
                ""
            }"
        >

            <div
                onclick="selectExam('${e.id}')"
                style="flex:1;cursor:pointer;"
            >

                <div class="exam-name">
                    ${escapeHtml(e.board)}
                    -
                    ${escapeHtml(e.name)}
                </div>

                <div class="exam-meta">
                    Mock Type:
                    ${escapeHtml(e.mock_type||"-")}
                    • Order:
                    ${e.sort_order||0}
                </div>

            </div>


            <div class="row-actions">

                <button
                    class="btn small"
                    onclick="selectExam('${e.id}')"
                >
                    Open
                </button>

                <button
                    class="btn small secondary"
                    onclick="editExam('${e.id}')"
                >
                    Edit
                </button>

                <button
                    class="btn small danger"
                    onclick="deleteExam('${e.id}')"
                >
                    Delete
                </button>

            </div>

        </div>

    `).join("");

}


/* =========================================================
   EXAM FORM
========================================================= */

function newExam(){

    editingExamId=null;

    document
    .getElementById("examFormTitle")
    .textContent="Add Exam";


    document
    .getElementById("examBoard")
    .value="SSC";


    document
    .getElementById("examName")
    .value="";


    document
    .getElementById("examMockType")
    .value="Sectional";


    document
    .getElementById("examSort")
    .value=exams.length+1;


    document
    .getElementById("examFormCard")
    .classList
    .remove("hidden");

}


function editExam(id){

    const e=
    exams.find(x=>
        String(x.id)===String(id)
    );


    if(!e)return;


    editingExamId=e.id;


    document
    .getElementById("examFormTitle")
    .textContent="Edit Exam";


    document
    .getElementById("examBoard")
    .value=e.board||"SSC";


    document
    .getElementById("examName")
    .value=e.name||"";


    document
    .getElementById("examMockType")
    .value=e.mock_type||"Sectional";


    document
    .getElementById("examSort")
    .value=e.sort_order||0;


    document
    .getElementById("examFormCard")
    .classList
    .remove("hidden");

}


function closeExamForm(){

    document
    .getElementById("examFormCard")
    .classList
    .add("hidden");

}


async function saveExam(){

    const data={

        board:
        document.getElementById(
            "examBoard"
        ).value,

        name:
        document.getElementById(
            "examName"
        ).value.trim(),

        mock_type:
        document.getElementById(
            "examMockType"
        ).value,

        is_active:true,

        sort_order:
        Number(
            document.getElementById(
                "examSort"
            ).value
        )||0

    };


    if(!data.name){

        alert("Enter exam name");

        return;

    }


    let r;


    if(editingExamId){

        r=
        await supabaseClient
        .from("exams")
        .update(data)
        .eq("id",editingExamId);

    }else{

        r=
        await supabaseClient
        .from("exams")
        .insert(data);

    }


    if(r.error){

        alert(
            "Exam error: "+
            r.error.message
        );

        return;

    }


    closeExamForm();

    await loadAll();

}


/* =========================================================
   DELETE EXAM
========================================================= */

async function deleteExam(id){

    if(!confirm(
        "Delete this exam and its practice folders?"
    ))
        return;


    const r=
    await supabaseClient
    .from("exams")
    .delete()
    .eq("id",id);


    if(r.error){

        alert(r.error.message);

        return;

    }


    if(
        selectedExam &&
        String(selectedExam.id)===
        String(id)
    ){

        selectedExam=null;

        document
        .getElementById("selectedExamCard")
        .classList
        .add("hidden");

    }


    await loadAll();

}


/* =========================================================
   SELECT EXAM
========================================================= */

function selectExam(id){

    selectedExam=
    exams.find(e=>
        String(e.id)===String(id)
    );


    if(!selectedExam)return;


    document
    .getElementById("selectedExamCard")
    .classList
    .remove("hidden");


    document
    .getElementById("selectedExamTitle")
    .textContent=
        selectedExam.board+
        " • "+
        selectedExam.name;


    renderTree();

    renderExams();

}


/* =========================================================
   SUBJECTS
========================================================= */

function renderSubjects(){

    const a=
    document.getElementById(
        "folderSubject"
    );

    const b=
    document.getElementById(
        "testSubject"
    );


    const options=
    subjects.map(s=>`

        <option value="${s.id}">
            ${escapeHtml(s.name)}
        </option>

    `).join("");


    a.innerHTML=
        `<option value="">
            No linked subject
        </option>`+
        options;


    b.innerHTML=
        `<option value="">
            No subject
        </option>`+
        options;

}


/* =========================================================
   ROOT
========================================================= */

async function addRoot(type){

    if(!selectedExam){

        alert("Select an exam first");

        return;

    }


    const exists=
    folders.find(f=>
        String(f.exam_id)===
        String(selectedExam.id)&&
        (
            normalize(f.folder_type)===type
            ||
            normalize(f.display_name)===
            (type==="new"
                ?"new mocks"
                :"pyq mocks")
        )&&
        (
            f.parent_id===null||
            f.parent_id===undefined
        )
    );


    if(exists){

        alert(
            type==="new"
            ?
            "NEW MOCKS already exists."
            :
            "PYQ MOCKS already exists."
        );

        return;

    }


    const max=
    Math.max(
        0,
        ...folders
        .filter(f=>
            String(f.exam_id)===
            String(selectedExam.id)
        )
        .map(f=>Number(f.sort_order)||0)
    );


    const r=
    await supabaseClient
    .from("mock_folders")
    .insert({

        exam_id:selectedExam.id,

        parent_id:null,

        subject_id:null,

        name:
            type==="new"
            ?
            "NEW MOCKS"
            :
            "PYQ MOCKS",

        display_name:
            type==="new"
            ?
            "NEW MOCKS"
            :
            "PYQ MOCKS",

        folder_type:type,

        sort_order:max+1,

        is_active:true

    });


    if(r.error){

        alert(r.error.message);

        return;

    }


    await loadAll();

    selectExam(selectedExam.id);

}


/* =========================================================
   ADD CHILD
========================================================= */

function addChild(parentId,type){

    editingFolderId=null;

    currentParentId=parentId;


    document
    .getElementById("folderFormTitle")
    .textContent=
        "Add "+
        type;


    document
    .getElementById("folderName")
    .value=
        type==="full"
        ?
        "FULL MOCKS"
        :
        type==="sectional"
        ?
        "SECTIONAL MOCKS"
        :
        type==="year"
        ?
        "2025"
        :
        "";


    document
    .getElementById("folderType")
    .value=type;


    document
    .getElementById("folderSubject")
    .value="";


    document
    .getElementById("folderSort")
    .value=nextSort(parentId);


    document
    .getElementById("folderFormCard")
    .classList
    .remove("hidden");

}


function nextSort(parentId){

    const list=
    folders.filter(f=>
        String(f.parent_id)===
        String(parentId)
    );


    return(
        Math.max(
            0,
            ...list.map(
                f=>Number(f.sort_order)||0
            )
        )+1
    );

}


/* =========================================================
   EDIT FOLDER
========================================================= */

function editFolder(id){

    const f=
    folders.find(x=>
        String(x.id)===String(id)
    );


    if(!f)return;


    editingFolderId=f.id;

    currentParentId=f.parent_id;


    document
    .getElementById("folderFormTitle")
    .textContent="Edit Folder";


    document
    .getElementById("folderName")
    .value=
        f.display_name||
        f.name||
        "";


    document
    .getElementById("folderType")
    .value=

/* =========================================================
   SAVE FOLDER
========================================================= */

    .getElementById("folderType")

    if(!name){

    }

/* =========================================================
   DELETE FOLDER
========================================================= */

async function deleteFolder(id){

    const children=
    folders.filter(f=>
        String(f.parent_id)===
        String(id)
    );


    let message=
        "Delete this folder?";


    if(children.length){

        message+=
            "\n\nThis will also delete its child folders.";

    }


    if(!confirm(message))
        return;


    const r=
    await supabaseClient
    .from("mock_folders")
    .delete()
    .eq("id",id);


    if(r.error){

        alert(r.error.message);

        return;

    }


    await loadAll();

    selectExam(selectedExam.id);

}


/* =========================================================
   REORDER
========================================================= */

async function moveFolder(
    id,
    direction
){

    const f=
    folders.find(x=>
        String(x.id)===String(id)
    );


    if(!f)return;


    const siblings=
    folders
    .filter(x=>
        String(x.exam_id)===
        String(f.exam_id)&&
        String(x.parent_id||"")===
        String(f.parent_id||"")
    )
    .sort((a,b)=>
        Number(a.sort_order||0)-
        Number(b.sort_order||0)
    );


    const index=
    siblings.findIndex(x=>
        String(x.id)===String(id)
    );


    const targetIndex=
        direction==="up"
        ?
        index-1
        :
        index+1;


    if(
        targetIndex<0||
        targetIndex>=siblings.length
    )
        return;


    const other=
    siblings[targetIndex];


    const old=f.sort_order;

    f.sort_order=
        other.sort_order;

    other.sort_order=old;


    await supabaseClient
    .from("mock_folders")
    .update({
        sort_order:f.sort_order
    })
    .eq("id",f.id);


    await supabaseClient
    .from("mock_folders")
    .update({
        sort_order:other.sort_order
    })
    .eq("id",other.id);


    await loadAll();

    selectExam(selectedExam.id);

}


/* =========================================================
   TREE
========================================================= */

function renderTree(){

    const box=
    document.getElementById(
        "structureTree"
    );


    const list=
    folders
    .filter(f=>
        String(f.exam_id)===
        String(selectedExam.id)
    )
    .sort((a,b)=>
        Number(a.sort_order||0)-
        Number(b.sort_order||0)
    );


    if(!list.length){

        box.innerHTML=`
            <div class="empty">
                No practice structure yet.
                <br><br>
                Add NEW MOCKS or PYQ MOCKS above.
            </div>
        `;

        return;

    }


    const roots=
    list.filter(f=>
        f.parent_id===null||
        f.parent_id===undefined
    );


    box.innerHTML=
    roots.map(r=>
        renderTreeItem(
            r,
            list,
            "root"
        )
    ).join("");

}


function renderTreeItem(
    folder,
    all,
    level
){

    const children=
    all
    .filter(f=>
        String(f.parent_id)===
        String(folder.id)
    )
    .sort((a,b)=>
        Number(a.sort_order||0)-
        Number(b.sort_order||0)
    );


    const type=
    folder.folder_type||"";


    let addButton="";


    if(
        type==="new"||
        type==="new_mocks"
    ){

        addButton=`
            <button
                class="btn small"
                onclick="
                    addChild(
                        '${folder.id}',
                        'full'
                    )
                "
            >
                + Full
            </button>

            <button
                class="btn small"
                onclick="
                    addChild(
                        '${folder.id}',
                        'sectional'
                    )
                "
            >
                + Sectional
            </button>
        `;

    }


    else if(
        type==="pyq"||
        type==="pyq_mocks"
    ){

        addButton=`
            <button
                class="btn small"
                onclick="
                    addChild(
                        '${folder.id}',
                        'full'
                    )
                "
            >
                + Full
            </button>

            <button
                class="btn small"
                onclick="
                    addChild(
                        '${folder.id}',
                        'sectional'
                    )
                "
            >
                + Sectional
            </button>
        `;

    }


    else if(type==="full"){

        const root=
        getParent(folder);


        const isPyq=
        root&&(
            root.folder_type==="pyq"||
            root.folder_type==="pyq_mocks"
        );


        if(isPyq){

            addButton=`
                <button
                    class="btn small"
                    onclick="
                        addChild(
                            '${folder.id}',
                            'year'
                        )
                    "
                >
                    + Year
                </button>
            `;

        }else{

            addButton=`
                <button
                    class="btn small"
                    onclick="
                        addTestForFolder(
                            '${folder.id}'
                        )
                    "
                >
                    + Test
                </button>
            `;

        }

    }


    else if(type==="sectional"){

        addButton=`
            <button
                class="btn small"
                onclick="
                    addChild(
                        '${folder.id}',
                        'subject'
                    )
                "
            >
                + Subject
            </button>
        `;

    }


    else if(type==="year"){

        addButton=`
            <button
                class="btn small"
                onclick="
                    addTestForFolder(
                        '${folder.id}'
                    )
                "
            >
                + Test
            </button>
        `;

    }


    else if(type==="subject"){

        addButton=`
            <button
                class="btn small"
                onclick="
                    addTestForFolder(
                        '${folder.id}'
                    )
                "
            >
                + Test
            </button>
        `;

    }


    return`

        <div class="
            tree-item
            ${level}
        ">

            <div class="tree-top">

                <div>

                    <div class="tree-name">
                        ${escapeHtml(
                            folder.display_name||
                            folder.name
                        )}
                    </div>

                    <div class="tree-type">
                        ${escapeHtml(type)}
                    </div>

                </div>


                <div class="tree-actions">

                    ${addButton}


                    <button
                        class="icon-btn"
                        onclick="
                            moveFolder(
                                '${folder.id}',
                                'up'
                            )
                        "
                    >
                        ↑
                    </button>


                    <button
                        class="icon-btn"
                        onclick="
                            moveFolder(
                                '${folder.id}',
                                'down'
                            )
                        "
                    >
                        ↓
                    </button>


                    <button
                        class="icon-btn"
                        onclick="
                            editFolder(
                                '${folder.id}'
                            )
                        "
                    >
                        ✏️
                    </button>


                    <button
                        class="icon-btn delete"
                        onclick="
                            deleteFolder(
                                '${folder.id}'
                            )
                        "
                    >
                        🗑
                    </button>

                </div>

            </div>


            ${
                children.length
                ?
                children.map(c=>
                    renderTreeItem(
                        c,
                        all,
                        level==="root"
                        ?"child"
                        :"leaf"
                    )
                ).join("")
                :
                ""
            }

        </div>

    `;

}


/* =========================================================
   PARENT
========================================================= */

function getParent(folder){

    return folders.find(f=>
        String(f.id)===
        String(folder.parent_id)
    )||null;

}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(v){

    return String(v??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function normalize(v){

    return String(v??"")
        .trim()
        .toLowerCase()
        .replace(/\s+/g," ");

}
