<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Videos - SSC EDGE</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">

<style>

.container{
    padding:20px;
    padding-bottom:90px;
}

.page-title{
    font-size:26px;
    font-weight:700;
    margin-bottom:5px;
}

.page-subtitle{
    color:var(--muted);
    margin-bottom:20px;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:18px;
}


/* =========================
   FOLDER LIST
========================= */

.folder-list{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
    margin-bottom:22px;
}

.folder-card{
    min-height:125px;
    padding:18px 12px;

    box-sizing:border-box;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;

    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;

    text-decoration:none;
    color:inherit;

    box-shadow:0 5px 18px rgba(0,0,0,.07);

    cursor:pointer;
}

.folder-icon{
    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:8px;

    font-size:34px;
}

.folder-name{
    font-size:15px;
    font-weight:700;
    line-height:1.3;
}

.folder-count{
    margin-top:5px;

    font-size:12px;
    color:var(--muted);
}


/* =========================
   BACK BUTTON
========================= */

.folder-back{
    width:100%;

    min-height:44px;

    margin-bottom:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    padding:10px 12px;

    box-sizing:border-box;

    font-weight:700;
    font-size:14px;

    text-decoration:none;

    background:var(--card);
    color:var(--text);

    border:1px solid var(--border);

    cursor:pointer;
}


/* =========================
   VIDEO CARD
========================= */

.video-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
}


/* =========================
   THUMBNAIL
========================= */

.video-thumbnail{
    width:100%;
    aspect-ratio:16/9;
    background:#111;
    position:relative;
    overflow:hidden;
}

.video-thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.thumbnail-fallback{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:linear-gradient(
        135deg,
        #171225,
        #30204f
    );
    color:white;
    text-align:center;
}

.thumbnail-logo{
    font-size:30px;
    font-weight:800;
    letter-spacing:1px;
}

.thumbnail-text{
    margin-top:6px;
    font-size:13px;
    opacity:.8;
}


/* =========================
   PLAY ICON
========================= */

.thumbnail-play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    width:58px;
    height:58px;

    border-radius:50%;

    background:rgba(0,0,0,.72);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:25px;
}


/* =========================
   CARD CONTENT
========================= */

.video-content{
    padding:16px;
}

.video-title{
    font-size:18px;
    font-weight:700;
    line-height:1.4;
    margin-bottom:8px;
}

.video-meta{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;

    color:var(--muted);

    font-size:13px;

    margin-bottom:10px;
}

.subject-badge{
    background:var(--card2);
    border:1px solid var(--border);

    padding:5px 9px;

    border-radius:999px;
}

.video-description{
    color:var(--muted);

    font-size:14px;
    line-height:1.5;

    margin-bottom:14px;
}


/* =========================
   OPEN BUTTON
========================= */

.video-actions{
    width:100%;
}

.open-video{
    width:100%;

    min-height:46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    padding:11px 12px;

    box-sizing:border-box;

    font-weight:700;
    font-size:14px;

    text-decoration:none;

    background:var(--purple);
    color:white;

    border:1px solid var(--purple);
}


/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;

    color:var(--muted);

    padding:35px 10px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .folder-list{
        gap:11px;
    }

    .folder-card{
        min-height:115px;
    }

}

</style>

</head>


<body>

<div class="container">

    <div class="page-title">
        Videos
    </div>

    <div class="page-subtitle" id="pageSubtitle">
        SSC EDGE Video Classes
    </div>


    <!-- =========================
         FOLDER AREA
    ========================= -->

    <div id="folderArea"></div>


    <!-- =========================
         VIDEO AREA
    ========================= -->

    <div id="videoList" class="video-list">

        <div class="empty">
            Loading videos...
        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
   Lazy loaded for faster initial page rendering
===================================================== */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

let supabaseClient = null;
let supabaseLoadPromise = null;


function loadSupabase(){

    if(window.supabase){

        return Promise.resolve(
            window.supabase
        );

    }


    if(supabaseLoadPromise){

        return supabaseLoadPromise;

    }


    supabaseLoadPromise =
        new Promise(
            function(resolve,reject){

                const script =
                    document.createElement("script");

                script.src =
                    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

                script.onload =
                    function(){

                        resolve(
                            window.supabase
                        );

                    };

                script.onerror =
                    function(){

                        reject(
                            new Error(
                                "Unable to load Supabase"
                            )
                        );

                    };

                document.head.appendChild(script);

            }
        );


    return supabaseLoadPromise;

}


async function getSupabaseClient(){

    if(supabaseClient){

        return supabaseClient;

    }


    const sdk =
        await loadSupabase();


    supabaseClient =
        sdk.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    return supabaseClient;

}


/* =====================================================
   STATE
===================================================== */

let allVideos = [];

let currentFolderId = null;

let folderSystemAvailable = true;

let videosLoaded = false;

let videosLoadingPromise = null;


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   THUMBNAIL
===================================================== */

function getThumbnail(video){

    return video.thumbnail_url || "";

}


/* =====================================================
   FALLBACK THUMBNAIL
===================================================== */

function fallbackThumbnail(){

    return `

        <div class="thumbnail-fallback">

            <div class="thumbnail-logo">
                SSC EDGE
            </div>

            <div class="thumbnail-text">
                Learn • Practice • Improve
            </div>

        </div>

    `;

}


/* =====================================================
   STUDY MATERIAL PROGRESS
===================================================== */

async function markStudyMaterialComplete(materialId){

    try{

        const client =
            await getSupabaseClient();


        const {
            data:{
                user
            }
        } =
            await client.auth.getUser();


        if(!user){

            return;

        }


        const {
            error
        } =
            await client

                .from("study_material_progress")

                .upsert(

                    {
                        user_id:
                            user.id,

                        material_id:
                            Number(materialId),

                        completed:
                            true,

                        completed_at:
                            new Date().toISOString()
                    },

                    {
                        onConflict:
                            "user_id,material_id"
                    }

                );


        if(error){

            console.warn(
                "Study progress could not be saved:",
                error
            );

        }

    }catch(error){

        console.warn(
            "Study progress error:",
            error
        );

    }

}


/* =====================================================
   LOAD FOLDERS
===================================================== */

async function loadVideoFolders(){

    try{

        const client =
            await getSupabaseClient();


        const {
            data,
            error
        } =
            await client

                .from("video_folders")

                .select(`
                    id,
                    name,
                    subject_id,
                    sort_order,
                    is_active,
                    subjects (
                        name
                    )
                `)

                .eq(
                    "is_active",
                    true
                )

                .order(
                    "sort_order",
                    {
                        ascending:true
                    }
                )

                .order(
                    "name",
                    {
                        ascending:true
                    }
                );


        /*
           If table does not exist yet,
           keep old direct-video behaviour.
        */

        if(error){

            console.warn(
                "Video folder system unavailable. Using direct videos.",
                error
            );

            folderSystemAvailable = false;

            return [];

        }


        return data || [];

    }catch(error){

        console.warn(
            "Video folder loading error:",
            error
        );

        folderSystemAvailable = false;

        return [];

    }

}


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(){

    if(videosLoaded){

        return allVideos;

    }


    if(videosLoadingPromise){

        return videosLoadingPromise;

    }


    videosLoadingPromise =
        (async function(){

            const videoList =
                document.getElementById(
                    "videoList"
                );


            try{

                const client =
                    await getSupabaseClient();


                const {
                    data:videos,
                    error
                } =
                    await client

                        .from("study_material")

                        /*
                           Only fields actually needed
                           by this page.
                        */

                        .select(`
                            id,
                            title,
                            description,
                            file_url,
                            thumbnail_url,
                            material_type,
                            is_active,
                            created_at,
                            folder_id,
                            subject_id,
                            subjects (
                                name
                            )
                        `)

                        .eq(
                            "material_type",
                            "VIDEO"
                        )

                        .eq(
                            "is_active",
                            true
                        )

                        .order(
                            "created_at",
                            {
                                ascending:false
                            }
                        );


                if(error){

                    throw error;

                }


                allVideos =
                    videos || [];

                videosLoaded = true;


                return allVideos;

            }catch(error){

                console.error(error);

                videoList.innerHTML = `

                    <div class="empty">
                        Unable to load videos.
                    </div>

                `;

                return [];

            }

        })();


    try{

        return await videosLoadingPromise;

    }finally{

        videosLoadingPromise = null;

    }

}


/* =====================================================
   RENDER FOLDER LIST
===================================================== */

function renderFolders(folders){

    const folderArea =
        document.getElementById(
            "folderArea"
        );


    if(
        !folders ||
        folders.length === 0
    ){

        folderArea.innerHTML = "";

        return;

    }


    /*
       Count videos inside every folder.
    */

    const folderCards =
        folders.map(
            function(folder){

                const count =
                    allVideos.filter(
                        function(video){

                            return String(
                                video.folder_id
                            ) === String(
                                folder.id
                            );

                        }
                    ).length;


                const subjectName =
                    folder.subjects?.name ||
                    folder.name ||
                    "Subject";


                return `

                    <div
                        class="folder-card"
                        data-folder-id="${escapeHtml(folder.id)}"
                    >

                        <div class="folder-icon">
                            📁
                        </div>

                        <div class="folder-name">
                            ${escapeHtml(subjectName)}
                        </div>

                        <div class="folder-count">
                            ${count}
                            ${count === 1 ? "Video" : "Videos"}
                        </div>

                    </div>

                `;

            }
        ).join("");


    folderArea.innerHTML = `

        <div class="folder-list">

            ${folderCards}

        </div>

    `;


    folderArea
        .querySelectorAll(
            ".folder-card"
        )
        .forEach(
            function(card){

                card.addEventListener(
                    "click",
                    function(){

                        openFolder(
                            this.dataset.folderId,
                            folders
                        );

                    }
                );

            }
        );

}


/* =====================================================
   RENDER VIDEOS
===================================================== */

function renderVideos(videos){

    const videoList =
        document.getElementById(
            "videoList"
        );


    if(
        !videos ||
        videos.length === 0
    ){

        videoList.innerHTML = `

            <div class="empty">
                No videos available yet.
            </div>

        `;

        return;

    }


    videoList.innerHTML =
        videos.map(

            function(video){

                const rawId =
                    video.id ||
                    video.file_url ||
                    "";


                const title =
                    escapeHtml(
                        video.title ||
                        "Untitled Video"
                    );


                const description =
                    escapeHtml(
                        video.description ||
                        ""
                    );


                const subject =
                    escapeHtml(
                        video.subjects?.name ||
                        "General"
                    );


                const rawUrl =
                    video.file_url ||
                    "";


                const url =
                    escapeHtml(
                        rawUrl
                    );


                const materialId =
                    escapeHtml(
                        rawId
                    );


                const thumbnail =
                    getThumbnail(video);


                const thumbnailHtml =

                    thumbnail

                    ?

                    `

                    <div class="video-thumbnail">

                        <img
                            src="${escapeHtml(thumbnail)}"
                            alt="${title}"
                            loading="lazy"
                            decoding="async"
                        >

                        <div class="thumbnail-play">
                            ▶
                        </div>

                    </div>

                    `

                    :

                    `

                    <div class="video-thumbnail">

                        ${fallbackThumbnail()}

                        <div class="thumbnail-play">
                            ▶
                        </div>

                    </div>

                    `;


                return `

                    <div class="video-card">

                        ${thumbnailHtml}


                        <div class="video-content">

                            <div class="video-title">
                                ${title}
                            </div>


                            <div class="video-meta">

                                <span class="subject-badge">
                                    📚 ${subject}
                                </span>

                                <span>
                                    🎥 Video Class
                                </span>

                            </div>


                            ${
                                description

                                ?

                                `

                                <div class="video-description">
                                    ${description}
                                </div>

                                `

                                :

                                ""
                            }


                            <div class="video-actions">

                                <a
                                    class="open-video"
                                    href="${url}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    data-material-id="${materialId}"
                                >

                                    ▶️ Open Video

                                </a>

                            </div>

                        </div>

                    </div>

                `;

            }

        ).join("");


    /*
       Progress events are attached only
       to currently rendered cards.
    */

    videoList
        .querySelectorAll(
            ".open-video[data-material-id]"
        )
        .forEach(
            function(button){

                button.addEventListener(
                    "click",
                    function(){

                        markStudyMaterialComplete(
                            this.dataset.materialId
                        );

                    }
                );

            }
        );

}


/* =====================================================
   OPEN FOLDER
===================================================== */

function openFolder(
    folderId,
    folders
){

    currentFolderId =
        String(folderId);


    const folder =
        folders.find(
            function(item){

                return String(
                    item.id
                ) === String(
                    folderId
                );

            }
        );


    const folderName =
        folder?.subjects?.name ||
        folder?.name ||
        "Subject";


    const folderArea =
        document.getElementById(
            "folderArea"
        );


    const pageSubtitle =
        document.getElementById(
            "pageSubtitle"
        );


    const videos =
        allVideos.filter(
            function(video){

                return String(
                    video.folder_id
                ) === String(
                    folderId
                );

            }
        );


    folderArea.innerHTML = `

        <button
            type="button"
            class="folder-back"
            id="backToFolders"
        >
            ← All Subjects
        </button>

    `;


    pageSubtitle.textContent =
        folderName;


    renderVideos(videos);


    document
        .getElementById(
            "backToFolders"
        )
        .addEventListener(
            "click",
            showAllFolders
        );

}


/* =====================================================
   SHOW ALL FOLDERS
===================================================== */

async function showAllFolders(){

    currentFolderId = null;


    const pageSubtitle =
        document.getElementById(
            "pageSubtitle"
        );


    pageSubtitle.textContent =
        "SSC EDGE Video Classes";


    const folders =
        await loadVideoFolders();


    renderFolders(folders);


    /*
       Videos without a folder remain
       directly visible.

       This keeps the system backward
       compatible.
    */

    const directVideos =
        allVideos.filter(
            function(video){

                return !video.folder_id;

            }
        );


    renderVideos(directVideos);

}


/* =====================================================
   INITIAL LOAD
===================================================== */

async function initializeVideos(){

    const videoList =
        document.getElementById(
            "videoList"
        );


    try{

        /*
           Load videos first because folder
           counts depend on them.
        */

        await loadVideos();


        /*
           Folder loading and rendering.
        */

        const folders =
            await loadVideoFolders();


        if(
            folders.length > 0
        ){

            renderFolders(
                folders
            );


            /*
               Videos without folder remain
               available directly.
            */

            const directVideos =
                allVideos.filter(
                    function(video){

                        return !video.folder_id;

                    }
                );


            renderVideos(
                directVideos
            );

        }else{

            /*
               No folders:
               original behaviour.
            */

            renderFolders([]);

            renderVideos(
                allVideos
            );

        }

    }catch(error){

        console.error(
            error
        );


        videoList.innerHTML = `

            <div class="empty">
                Unable to load videos.
            </div>

        `;

    }

}


initializeVideos();

</script>

</body>

</html>
