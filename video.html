<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSC EDGE - Videos</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  margin:0;
  padding-bottom:90px;
}

.video-page{
  padding:25px 18px;
  max-width:800px;
  margin:auto;
}

.page-title{
  font-size:28px;
  font-weight:800;
  margin-bottom:5px;
}

.page-subtitle{
  color:var(--muted);
  margin-bottom:25px;
}

.video-list{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.video-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
  overflow:hidden;
}

.player{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:15px;
}

.player video{
  width:100%;
  height:100%;
  display:block;
  background:#000;
}

.player iframe{
  width:100%;
  height:100%;
  border:0;
}

.video-card h3{
  margin:5px 0 8px;
  font-size:19px;
}

.subject{
  display:inline-block;
  background:var(--card2);
  color:var(--purple2);
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.description{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin-top:8px;
}

.empty,
.loading{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
}

</style>

</head>


<body>


<div class="video-page">

  <div class="page-title">
    Video Classes
  </div>

  <div class="page-subtitle">
    Learn with SSC EDGE video classes
  </div>


  <div id="videoList" class="video-list">

    <div class="loading">
      Loading videos...
    </div>

  </div>

</div>



<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-nav">

  <a href="home.html">
    <span>⌂</span>
    <small>Home</small>
  </a>

  <a href="study.html" class="active">
    <span>📚</span>
    <small>Study</small>
  </a>

  <a href="practice.html">
    <span>📝</span>
    <small>Practice</small>
  </a>

  <a href="profile.html">
    <span>👤</span>
    <small>Profile</small>
  </a>

</nav>



<script>


// =========================
// SUPABASE
// =========================

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);



// =========================
// LOAD VIDEOS
// =========================

async function loadVideos(){

  const container =
    document.getElementById("videoList");


  const { data, error } =
    await supabaseClient

      .from("study_material")

      .select(`
        id,
        title,
        description,
        file_url,
        created_at,
        subjects (
          name
        )
      `)

      .eq("material_type","VIDEO")

      .eq("is_active",true)

      .order("created_at", {
        ascending:false
      });


  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        Unable to load videos.<br>
        Please try again later.
      </div>
    `;

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML = `
      <div class="empty">

        <div style="font-size:40px;">
          🎬
        </div>

        <h3>No videos available</h3>

        <p>
          New video classes will appear here soon.
        </p>

      </div>
    `;

    return;
  }


  container.innerHTML = "";


  data.forEach(video => {

    const card =
      document.createElement("div");

    card.className =
      "video-card";


    const subject =
      video.subjects?.name || "General";


    const player =
      createPlayer(video.file_url);


    card.innerHTML = `

      <div class="player"></div>

      <span class="subject">
        ${escapeHTML(subject)}
      </span>

      <h3>
        ${escapeHTML(video.title)}
      </h3>

      ${
        video.description
        ?
        `<div class="description">
          ${escapeHTML(video.description)}
        </div>`
        :
        ""
      }

    `;


    card
      .querySelector(".player")
      .appendChild(player);


    container.appendChild(card);

  });

}



// =========================
// CREATE VIDEO PLAYER
// =========================

function createPlayer(url){

  const youtubeId =
    getYouTubeId(url);


  // =========================
  // YOUTUBE
  // =========================

  if(youtubeId){

    const iframe =
      document.createElement("iframe");


    iframe.src =
      "https://www.youtube.com/embed/" +
      youtubeId;


    iframe.title =
      "SSC EDGE Video";


    iframe.allow =
      "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";


    iframe.allowFullscreen =
      true;


    return iframe;

  }


  // =========================
  // DIRECT VIDEO
  // =========================

  const video =
    document.createElement("video");


  video.controls =
    true;


  video.playsInline =
    true;


  video.preload =
    "metadata";


  video.src =
    safeURL(url);


  return video;

}



// =========================
// YOUTUBE URL DETECTION
// =========================

function getYouTubeId(url){

  try{

    const parsed =
      new URL(url);


    // youtube.com/watch?v=

    if(
      parsed.hostname.includes("youtube.com")
      &&
      parsed.searchParams.get("v")
    ){

      return parsed.searchParams.get("v");

    }


    // youtube.com/shorts/ID

    if(
      parsed.hostname.includes("youtube.com")
      &&
      parsed.pathname.startsWith("/shorts/")
    ){

      return parsed.pathname
        .split("/shorts/")[1]
        .split("/")[0];

    }


    // youtube.com/embed/ID

    if(
      parsed.hostname.includes("youtube.com")
      &&
      parsed.pathname.startsWith("/embed/")
    ){

      return parsed.pathname
        .split("/embed/")[1]
        .split("/")[0];

    }


    // youtu.be/ID

    if(
      parsed.hostname === "youtu.be"
    ){

      return parsed.pathname
        .replace("/","")
        .split("/")[0];

    }

  }
  catch(e){

    return null;

  }


  return null;

}



// =========================
// SAFE URL
// =========================

function safeURL(url){

  try{

    const parsed =
      new URL(url);


    if(
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    ){

      return parsed.href;

    }

  }
  catch(e){}


  return "";

}



// =========================
// ESCAPE HTML
// =========================

function escapeHTML(text){

  return String(text ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



// =========================
// START
// =========================

loadVideos();

</script>


</body>

</html>
