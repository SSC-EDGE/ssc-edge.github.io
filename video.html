<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Videos - SSC EDGE</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">

<style>

.container{
    padding:20px;
    padding-bottom:90px;
}

.page-title{
    font-size:26px;
    font-weight:700;
    margin-bottom:5px;
}

.page-subtitle{
    color:var(--muted);
    margin-bottom:20px;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.video-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
}


/* =========================
   THUMBNAIL
========================= */

.video-thumbnail{
    width:100%;
    aspect-ratio:16/9;
    background:#111;
    position:relative;
    overflow:hidden;
}

.video-thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.thumbnail-fallback{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:linear-gradient(
        135deg,
        #171225,
        #30204f
    );
    color:white;
    text-align:center;
}

.thumbnail-logo{
    font-size:30px;
    font-weight:800;
    letter-spacing:1px;
}

.thumbnail-text{
    margin-top:6px;
    font-size:13px;
    opacity:.8;
}


/* =========================
   PLAY ICON
========================= */

.thumbnail-play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    width:58px;
    height:58px;

    border-radius:50%;

    background:rgba(0,0,0,.72);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:25px;
}


/* =========================
   CARD CONTENT
========================= */

.video-content{
    padding:16px;
}

.video-title{
    font-size:18px;
    font-weight:700;
    line-height:1.4;
    margin-bottom:8px;
}

.video-meta{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;

    color:var(--muted);

    font-size:13px;

    margin-bottom:10px;
}

.subject-badge{
    background:var(--card2);
    border:1px solid var(--border);

    padding:5px 9px;

    border-radius:999px;
}

.video-description{
    color:var(--muted);

    font-size:14px;
    line-height:1.5;

    margin-bottom:14px;
}


/* =========================
   OPEN BUTTON
========================= */

.video-actions{
    width:100%;
}

.open-video{
    width:100%;

    min-height:46px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    padding:11px 12px;

    box-sizing:border-box;

    font-weight:700;
    font-size:14px;

    text-decoration:none;

    background:var(--purple);
    color:white;

    border:1px solid var(--purple);
}

.empty{
    text-align:center;

    color:var(--muted);

    padding:35px 10px;
}

</style>

</head>


<body>

<div class="container">

    <div class="page-title">
        Videos
    </div>

    <div class="page-subtitle">
        SSC EDGE Video Classes
    </div>

    <div id="videoList" class="video-list">

        <div class="empty">
            Loading videos...
        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   THUMBNAIL
========================= */

function getThumbnail(video){

    /*
       Admin can provide:

       video.thumbnail_url

       If thumbnail_url exists,
       it will be shown.

       Otherwise SSC EDGE fallback
       thumbnail is shown.
    */

    return video.thumbnail_url || "";

}


/* =========================
   FALLBACK THUMBNAIL
========================= */

function fallbackThumbnail(){

    return `

    <div class="thumbnail-fallback">

        <div class="thumbnail-logo">
            SSC EDGE
        </div>

        <div class="thumbnail-text">
            Learn • Practice • Improve
        </div>

    </div>

    `;

}


/* =========================
   STUDY MATERIAL PROGRESS
========================= */

async function markStudyMaterialComplete(materialId){

    try{

        const {
            data: {
                user
            }
        } =
        await supabaseClient.auth.getUser();


        if(!user){

            return;

        }


        const {
            error
        } =
        await supabaseClient

            .from("study_material_progress")

            .upsert(

                {
                    user_id:
                        user.id,

                    material_id:
                        Number(materialId),

                    completed:
                        true,

                    completed_at:
                        new Date().toISOString()
                },

                {
                    onConflict:
                        "user_id,material_id"
                }

            );


        if(error){

            console.warn(
                "Study progress could not be saved:",
                error
            );

        }

    }catch(error){

        console.warn(
            "Study progress error:",
            error
        );

    }

}


/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

    const videoList =
        document.getElementById("videoList");


    const {
        data:videos,
        error
    } = await supabaseClient

        .from("study_material")

        .select(`
            *,
            subjects (
                name
            )
        `)

        .eq(
            "material_type",
            "VIDEO"
        )

        .eq(
            "is_active",
            true
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    /* =========================
       ERROR
    ========================= */

    if(error){

        console.error(error);

        videoList.innerHTML = `

            <div class="empty">
                Unable to load videos.
            </div>

        `;

        return;

    }


    /* =========================
       NO VIDEOS
    ========================= */

    if(
        !videos ||
        videos.length === 0
    ){

        videoList.innerHTML = `

            <div class="empty">
                No videos available yet.
            </div>

        `;

        return;

    }


    /* =========================
       CREATE CARDS
    ========================= */

    videoList.innerHTML = videos.map(

        video => {

            const rawId =
                video.id ||
                video.file_url ||
                "";


            const title =
                escapeHtml(
                    video.title ||
                    "Untitled Video"
                );


            const description =
                escapeHtml(
                    video.description ||
                    ""
                );


            const subject =
                escapeHtml(
                    video.subjects?.name ||
                    "General"
                );


            const rawUrl =
                video.file_url ||
                "";


            const url =
                escapeHtml(rawUrl);


            const materialId =
                escapeHtml(rawId);


            const thumbnail =
                getThumbnail(video);


            /* =========================
               THUMBNAIL
            ========================= */

            const thumbnailHtml =

                thumbnail

                ?

                `

                <div class="video-thumbnail">

                    <img
                        src="${escapeHtml(thumbnail)}"
                        alt="${title}"
                        loading="lazy"
                    >

                    <div class="thumbnail-play">
                        ▶
                    </div>

                </div>

                `

                :

                `

                <div class="video-thumbnail">

                    ${fallbackThumbnail()}

                    <div class="thumbnail-play">
                        ▶
                    </div>

                </div>

                `;


            /*
               IMPORTANT:

               There is NO <video> element here.

               Every video uses exactly the
               same thumbnail-based interface.

               This means:

               ✓ No automatic video loading
               ✓ No video player on page
               ✓ No first-video special behaviour
               ✓ No browser preloading
               ✓ Only thumbnail is shown
               ✓ Open Video opens the actual URL
            */


            return `

            <div class="video-card">

                ${thumbnailHtml}


                <div class="video-content">

                    <div class="video-title">
                        ${title}
                    </div>


                    <div class="video-meta">

                        <span class="subject-badge">
                            📚 ${subject}
                        </span>

                        <span>
                            🎥 Video Class
                        </span>

                    </div>


                    ${
                        description

                        ?

                        `

                        <div class="video-description">
                            ${description}
                        </div>

                        `

                        :

                        ""
                    }


                    <div class="video-actions">

                        <a
                            class="open-video"
                            href="${url}"
                            target="_blank"
                            rel="noopener noreferrer"
                            data-material-id="${materialId}"
                        >

                            ▶️ Open Video

                        </a>

                    </div>

                </div>

            </div>

            `;

        }

    ).join("");


    /* =========================
       OPEN VIDEO PROGRESS
========================= */

    document
        .querySelectorAll(
            ".open-video[data-material-id]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function(){

                        markStudyMaterialComplete(
                            this.dataset.materialId
                        );

                    }
                );

            }
        );

}


/* =========================
   INITIAL LOAD
========================= */

loadVideos();

</script>

</body>

</html>
