<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SSC EDGE - Manage Updates</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  padding:20px;
}

.updates-admin{
  max-width:800px;
  margin:auto;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.page-header h1{
  margin:0;
  font-size:24px;
}

.page-header h1 span{
  color:#a970ff;
}

.back-btn{
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 14px;
  border-radius:10px;
  text-decoration:none;
  font-size:13px;
}

.admin-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

.admin-box h2{
  margin:0 0 18px;
  font-size:18px;
}

label{
  display:block;
  margin:13px 0 7px;
  color:var(--muted);
  font-size:13px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#a970ff;
}

.form-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

button{
  cursor:pointer;
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-weight:bold;
}

.save-btn{
  background:#a970ff;
  color:white;
}

.cancel-btn{
  background:var(--bg);
  color:var(--text);
  border:1px solid var(--border);
}

.status{
  display:none;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
  font-size:13px;
}

.status.show{
  display:block;
}

.status.success{
  background:rgba(84,214,140,.15);
  color:#54d68c;
}

.status.error{
  background:rgba(255,95,109,.15);
  color:#ff5f6d;
}

.update-card{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px;
  margin-bottom:13px;
}

.update-title{
  font-size:16px;
  font-weight:bold;
  margin-bottom:7px;
}

.update-message{
  color:var(--muted);
  white-space:pre-wrap;
  line-height:1.5;
  font-size:14px;
}

.update-info{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:12px;
}

.badge{
  font-size:11px;
  padding:5px 8px;
  border-radius:6px;
  background:rgba(169,112,255,.15);
  color:#a970ff;
}

.active{
  background:rgba(84,214,140,.15);
  color:#54d68c;
}

.inactive{
  background:rgba(255,95,109,.15);
  color:#ff5f6d;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:13px;
}

.actions button{
  font-size:12px;
  padding:8px 11px;
  color:white;
}

.edit-btn{
  background:#2563eb;
}

.toggle-btn{
  background:#64748b;
}

.delete-btn{
  background:#dc2626;
}

.empty,
.loading{
  text-align:center;
  color:var(--muted);
  padding:20px;
}

@media(max-width:600px){

  body{
    padding:13px;
  }

  .page-header h1{
    font-size:20px;
  }

  .admin-box{
    padding:15px;
  }

}

</style>
</head>

<body>

<div class="updates-admin">

  <div class="page-header">
    <h1>Manage <span>Updates</span></h1>
    <a href="javascript:history.back()" class="back-btn">← Back</a>
  </div>

  <div id="statusBox" class="status"></div>

  <div class="admin-box">

    <h2 id="formTitle">Add New Update</h2>

    <label for="title">Update Title</label>
    <input
      type="text"
      id="title"
      placeholder="Example: New Mock Test Added"
    >

    <label for="message">Update Message</label>
    <textarea
      id="message"
      placeholder="Write update details..."
    ></textarea>

    <label for="type">Update Type</label>
    <select id="type">
      <option value="GENERAL">General</option>
      <option value="NEW">New</option>
      <option value="IMPORTANT">Important</option>
      <option value="NOTICE">Notice</option>
    </select>

    <label for="active">Status</label>
    <select id="active">
      <option value="true">Active</option>
      <option value="false">Inactive</option>
    </select>

    <div class="form-buttons">

      <button
        class="save-btn"
        id="saveBtn"
        onclick="saveUpdate()">
        Add Update
      </button>

      <button
        class="cancel-btn"
        id="cancelBtn"
        onclick="cancelEdit()"
        style="display:none;">
        Cancel
      </button>

    </div>

  </div>

  <div class="admin-box">

    <h2>All Updates</h2>

    <div id="updatesList" class="loading">
      Loading updates...
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let editingId = null;


/* =========================
   STATUS MESSAGE
========================= */

function showStatus(message,type){

  const box =
  document.getElementById("statusBox");

  box.textContent = message;
  box.className = "status show " + type;

  setTimeout(function(){
    box.className = "status";
  },4000);

}


/* =========================
   ADMIN CHECK
========================= */

(async()=>{

  const {
    data:{user}
  } = await db.auth.getUser();

  if(!user){

    location.href="admin.html";
    return;

  }

  const {
    data,
    error
  } = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if(error || !data){

    await db.auth.signOut();

    location.href="admin.html";
    return;

  }

  loadUpdates();

})();


/* =========================
   LOAD UPDATES
========================= */

async function loadUpdates(){

  const list =
  document.getElementById("updatesList");

  list.className = "loading";
  list.textContent = "Loading updates...";

  const {
    data,
    error
  } = await db
    .from("updates")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){

    list.className = "empty";
    list.textContent =
      "Error: " + error.message;

    return;

  }

  if(!data || data.length === 0){

    list.className = "empty";
    list.textContent = "No updates added yet.";

    return;

  }

  list.className = "";
  list.innerHTML = "";

  data.forEach(function(update){

    const card =
    document.createElement("div");

    card.className = "update-card";

    const date = update.created_at
      ? new Date(update.created_at).toLocaleString("en-IN",{
          day:"2-digit",
          month:"short",
          year:"numeric",
          hour:"2-digit",
          minute:"2-digit"
        })
      : "";

    card.innerHTML = `

      <div class="update-title">
        ${escapeHTML(update.title || "")}
      </div>

      <div class="update-message">
        ${escapeHTML(update.message || "")}
      </div>

      <div class="update-info">

        <span class="badge">
          ${escapeHTML(update.update_type || "GENERAL")}
        </span>

        <span class="badge ${
          update.is_active ? "active" : "inactive"
        }">
          ${update.is_active ? "Active" : "Inactive"}
        </span>

        <span class="badge">
          ${date}
        </span>

      </div>

      <div class="actions">

        <button
          class="edit-btn"
          onclick='editUpdate(${JSON.stringify(update)})'>
          Edit
        </button>

        <button
          class="toggle-btn"
          onclick="toggleUpdate(${update.id},${update.is_active})">
          ${update.is_active ? "Deactivate" : "Activate"}
        </button>

        <button
          class="delete-btn"
          onclick="deleteUpdate(${update.id})">
          Delete
        </button>

      </div>

    `;

    list.appendChild(card);

  });

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   SAVE / UPDATE
========================= */

async function saveUpdate(){

  const title =
  document.getElementById("title").value.trim();

  const message =
  document.getElementById("message").value.trim();

  const type =
  document.getElementById("type").value;

  const isActive =
  document.getElementById("active").value === "true";

  if(!title){

    showStatus("Please enter update title.","error");
    return;

  }

  if(!message){

    showStatus("Please enter update message.","error");
    return;

  }

  const btn =
  document.getElementById("saveBtn");

  btn.disabled = true;
  btn.textContent = "Saving...";

  let result;

  if(editingId){

    result = await db
      .from("updates")
      .update({
        title:title,
        message:message,
        update_type:type,
        is_active:isActive
      })
      .eq("id",editingId);

  }else{

    result = await db
      .from("updates")
      .insert({
        title:title,
        message:message,
        update_type:type,
        is_active:isActive
      });

  }

  btn.disabled = false;
  btn.textContent =
    editingId ? "Save Changes" : "Add Update";

  if(result.error){

    showStatus(
      "Error: " + result.error.message,
      "error"
    );

    return;

  }

  showStatus(
    editingId
      ? "Update saved successfully."
      : "Update added successfully.",
    "success"
  );

  cancelEdit();
  loadUpdates();

}


/* =========================
   EDIT
========================= */

function editUpdate(update){

  editingId = update.id;

  document.getElementById("title").value =
    update.title || "";

  document.getElementById("message").value =
    update.message || "";

  document.getElementById("type").value =
    update.update_type || "GENERAL";

  document.getElementById("active").value =
    update.is_active ? "true" : "false";

  document.getElementById("formTitle").textContent =
    "Edit Update";

  document.getElementById("saveBtn").textContent =
    "Save Changes";

  document.getElementById("cancelBtn").style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit(){

  editingId = null;

  document.getElementById("title").value = "";
  document.getElementById("message").value = "";
  document.getElementById("type").value = "GENERAL";
  document.getElementById("active").value = "true";

  document.getElementById("formTitle").textContent =
    "Add New Update";

  document.getElementById("saveBtn").textContent =
    "Add Update";

  document.getElementById("cancelBtn").style.display =
    "none";

}


/* =========================
   TOGGLE
========================= */

async function toggleUpdate(id,currentStatus){

  const {error} =
    await db
      .from("updates")
      .update({
        is_active:!currentStatus
      })
      .eq("id",id);

  if(error){

    showStatus(
      "Error: " + error.message,
      "error"
    );

    return;

  }

  loadUpdates();

}


/* =========================
   DELETE
========================= */

async function deleteUpdate(id){

  if(!confirm("Delete this update?")){
    return;
  }

  const {error} =
    await db
      .from("updates")
      .delete()
      .eq("id",id);

  if(error){

    showStatus(
      "Error: " + error.message,
      "error"
    );

    return;

  }

  showStatus(
    "Update deleted successfully.",
    "success"
  );

  loadUpdates();

}

</script>

</body>
</html>
