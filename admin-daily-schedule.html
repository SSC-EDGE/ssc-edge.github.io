<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Daily Schedule - SSC EDGE Admin</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

.page{
  min-height:100vh;
  padding:20px 16px 100px;
}

.header{
  margin-bottom:18px;
}

.back-btn{
  border:0;
  background:transparent;
  color:var(--text);
  font-size:15px;
  font-weight:800;
  padding:0;
  margin-bottom:18px;
  cursor:pointer;
}

.header h1{
  margin:0;
  font-size:26px;
}

.header p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
}

.card h2{
  margin:0 0 16px;
  font-size:19px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:800;
}

.field input,
.field select,
.field textarea{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
  font-size:14px;
  outline:none;
}

.field textarea{
  min-height:120px;
  resize:vertical;
  line-height:1.5;
}

.save-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:var(--purple);
  color:white;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.cancel-btn{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text);
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  margin-top:10px;
  display:none;
}

.message{
  margin-top:13px;
  font-size:13px;
  font-weight:700;
}

.success{
  color:#35c77a;
}

.error{
  color:#ff6b6b;
}

.schedule-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.schedule-item{
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
  background:var(--card2);
}

.schedule-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.day-title{
  font-size:17px;
  font-weight:900;
}

.date{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.schedule-message{
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
  margin-bottom:12px;
}

.status{
  color:var(--muted);
  font-size:13px;
  text-align:center;
  padding:20px 5px;
}

.actions{
  display:flex;
  gap:9px;
}

.edit-btn,
.delete-btn{
  flex:1;
  padding:10px;
  border-radius:10px;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}

.edit-btn{
  border:0;
  background:var(--purple);
  color:white;
}

.delete-btn{
  border:1px solid #ff6b6b;
  background:transparent;
  color:#ff6b6b;
}

.active-badge{
  display:inline-block;
  margin-left:7px;
  padding:4px 8px;
  border-radius:20px;
  background:rgba(53,199,122,.12);
  color:#35c77a;
  font-size:10px;
  font-weight:900;
}

.inactive-badge{
  display:inline-block;
  margin-left:7px;
  padding:4px 8px;
  border-radius:20px;
  background:rgba(255,107,107,.12);
  color:#ff6b6b;
  font-size:10px;
  font-weight:900;
}

</style>

</head>

<body>

<main class="page">

  <button
    class="back-btn"
    onclick="window.location.href='admin.html'"
  >
    ← Back to Admin
  </button>


  <div class="header">

    <h1>📅 Daily Schedule</h1>

    <p>
      Manage Day 1 to Day 60 preparation schedules.
    </p>

  </div>


  <!-- ================= ADD / EDIT ================= -->

  <div class="card">

    <h2 id="formTitle">
      Add Schedule
    </h2>


    <div class="field">

      <label>
        Day Number
      </label>

      <select id="dayNumber">

        <option value="">
          Select Day
        </option>

      </select>

    </div>


    <div class="field">

      <label>
        Schedule Date
      </label>

      <input
        type="date"
        id="scheduleDate"
      >

    </div>


    <div class="field">

      <label>
        Schedule Message
      </label>

      <textarea
        id="scheduleMessage"
        placeholder="Example: Complete Maths revision, Reasoning PYQs and one mock test."
      ></textarea>

    </div>


    <div class="field">

      <label>
        Status
      </label>

      <select id="isActive">

        <option value="true">
          Active
        </option>

        <option value="false">
          Inactive
        </option>

      </select>

    </div>


    <button
      class="save-btn"
      id="saveBtn"
      onclick="saveSchedule()"
    >
      Save Schedule
    </button>


    <button
      class="cancel-btn"
      id="cancelBtn"
      onclick="cancelEdit()"
    >
      Cancel Edit
    </button>


    <div
      id="formMessage"
      class="message"
    ></div>

  </div>


  <!-- ================= SCHEDULE LIST ================= -->

  <div class="card">

    <h2>
      Saved Schedules
    </h2>

    <div
      class="schedule-list"
      id="scheduleList"
    >

      <div class="status">
        Loading schedules...
      </div>

    </div>

  </div>

</main>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================= VARIABLES ================= */

let currentUser = null;
let editingId = null;
let schedules = [];


/* ================= ELEMENTS ================= */

const dayNumber =
document.getElementById("dayNumber");

const scheduleDate =
document.getElementById("scheduleDate");

const scheduleMessage =
document.getElementById("scheduleMessage");

const isActive =
document.getElementById("isActive");

const scheduleList =
document.getElementById("scheduleList");

const formMessage =
document.getElementById("formMessage");

const formTitle =
document.getElementById("formTitle");

const saveBtn =
document.getElementById("saveBtn");

const cancelBtn =
document.getElementById("cancelBtn");


/* ================= DAY 1 - 60 ================= */

for(let i=1;i<=60;i++){

  const option =
    document.createElement("option");

  option.value = i;

  option.textContent =
    "Day " + i;

  dayNumber.appendChild(option);

}


/* ================= ADMIN CHECK ================= */

async function checkAdmin(){

  const {
    data:{user}
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    window.location.href =
      "admin.html";

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("admin_users")
      .select("user_id")
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if(error || !data){

    await supabaseClient.auth.signOut();

    window.location.href =
      "admin.html";

    return;
  }


  currentUser = user;

  loadSchedules();

}


/* ================= LOAD ================= */

async function loadSchedules(){

  scheduleList.innerHTML =
    `<div class="status">Loading schedules...</div>`;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("daily_schedules")
      .select("*")
      .order(
        "day_number",
        {ascending:true}
      );


  if(error){

    console.error(error);

    scheduleList.innerHTML =
      `<div class="status error">
        Unable to load schedules.
        <br><br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  schedules =
    data || [];


  renderSchedules();

}


/* ================= RENDER ================= */

function renderSchedules(){

  scheduleList.innerHTML = "";


  if(schedules.length === 0){

    scheduleList.innerHTML =
      `<div class="status">
        No schedules added yet.
      </div>`;

    return;
  }


  schedules.forEach(schedule => {

    const item =
      document.createElement("div");

    item.className =
      "schedule-item";


    const statusBadge =
      schedule.is_active
      ?
      `<span class="active-badge">
        ACTIVE
      </span>`
      :
      `<span class="inactive-badge">
        INACTIVE
      </span>`;


    item.innerHTML = `

      <div class="schedule-top">

        <div class="day-title">

          DAY ${escapeHtml(schedule.day_number)}

          ${statusBadge}

        </div>

        <div class="date">

          ${formatDate(schedule.schedule_date)}

        </div>

      </div>


      <div class="schedule-message">

        ${escapeHtml(
          schedule.message ||
          "No message"
        )}

      </div>


      <div class="actions">

        <button
          class="edit-btn"
          onclick="editSchedule(${schedule.id})"
        >
          ✏️ Edit
        </button>

        <button
          class="delete-btn"
          onclick="deleteSchedule(${schedule.id})"
        >
          🗑️ Delete
        </button>

      </div>

    `;


    scheduleList.appendChild(item);

  });

}


/* ================= SAVE ================= */

async function saveSchedule(){

  clearMessage();


  const day =
    Number(dayNumber.value);

  const date =
    scheduleDate.value;

  const message =
    scheduleMessage.value.trim();

  const active =
    isActive.value === "true";


  if(!day){

    showError(
      "Please select a day."
    );

    return;
  }


  if(!date){

    showError(
      "Please select a date."
    );

    return;
  }


  if(!message){

    showError(
      "Please enter the schedule message."
    );

    return;
  }


  saveBtn.disabled = true;

  saveBtn.textContent =
    editingId
    ? "Updating..."
    : "Saving...";


  try{

    /* ================= UPDATE ================= */

    if(editingId){

      const {
        error
      } =
      await supabaseClient
        .from("daily_schedules")
        .update({

          day_number:day,

          schedule_date:date,

          message:message,

          is_active:active

        })
        .eq(
          "id",
          editingId
        );


      if(error)
        throw error;


      showSuccess(
        "Schedule updated successfully."
      );

    }


    /* ================= INSERT ================= */

    else{

      /*
       Prevent duplicate Day Number.
      */

      const existing =
        schedules.find(
          item =>
            Number(item.day_number) === day
        );


      if(existing){

        showError(
          "This Day already exists. Please edit the existing schedule."
        );

        resetButton();

        return;
      }


      const {
        error
      } =
      await supabaseClient
        .from("daily_schedules")
        .insert({

          day_number:day,

          schedule_date:date,

          message:message,

          is_active:active

        });


      if(error)
        throw error;


      showSuccess(
        "Schedule added successfully."
      );

    }


    resetForm();

    await loadSchedules();

  }

  catch(error){

    console.error(error);

    showError(
      error.message ||
      "Unable to save schedule."
    );

  }


  resetButton();

}


/* ================= EDIT ================= */

function editSchedule(id){

  const schedule =
    schedules.find(
      item =>
        Number(item.id) === Number(id)
    );


  if(!schedule)
    return;


  editingId =
    schedule.id;


  dayNumber.value =
    schedule.day_number;


  scheduleDate.value =
    schedule.schedule_date || "";


  scheduleMessage.value =
    schedule.message || "";


  isActive.value =
    schedule.is_active
    ? "true"
    : "false";


  formTitle.textContent =
    "Edit Schedule";


  saveBtn.textContent =
    "Update Schedule";


  cancelBtn.style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================= DELETE ================= */

async function deleteSchedule(id){

  const schedule =
    schedules.find(
      item =>
        Number(item.id) === Number(id)
    );


  if(!schedule)
    return;


  const confirmed =
    confirm(
      "Delete Day " +
      schedule.day_number +
      " schedule?"
    );


  if(!confirmed)
    return;


  const {
    error
  } =
  await supabaseClient
    .from("daily_schedules")
    .delete()
    .eq(
      "id",
      id
    );


  if(error){

    console.error(error);

    showError(
      error.message ||
      "Unable to delete schedule."
    );

    return;
  }


  showSuccess(
    "Schedule deleted successfully."
  );


  await loadSchedules();

}


/* ================= CANCEL ================= */

function cancelEdit(){

  resetForm();

}


/* ================= RESET ================= */

function resetForm(){

  editingId = null;

  dayNumber.value = "";

  scheduleDate.value = "";

  scheduleMessage.value = "";

  isActive.value = "true";

  formTitle.textContent =
    "Add Schedule";

  saveBtn.textContent =
    "Save Schedule";

  cancelBtn.style.display =
    "none";

}


/* ================= BUTTON ================= */

function resetButton(){

  saveBtn.disabled = false;

  saveBtn.textContent =
    editingId
    ? "Update Schedule"
    : "Save Schedule";

}


/* ================= MESSAGE ================= */

function clearMessage(){

  formMessage.textContent = "";

  formMessage.className =
    "message";

}


function showSuccess(text){

  formMessage.textContent =
    text;

  formMessage.className =
    "message success";

}


function showError(text){

  formMessage.textContent =
    text;

  formMessage.className =
    "message error";

}


/* ================= DATE ================= */

function formatDate(dateString){

  if(!dateString)
    return "";

  const date =
    new Date(
      dateString + "T00:00:00"
    );


  return date.toLocaleDateString(
    "en-IN",
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


/* ================= ESCAPE ================= */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ================= START ================= */

checkAdmin();

</script>

</body>
</html>
