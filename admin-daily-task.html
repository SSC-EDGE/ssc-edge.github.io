<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SSC EDGE - Daily Tasks</title>

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
}

.admin-page{
  min-height:100vh;
  padding:22px 16px 80px;
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:22px;
}

.back{
  width:42px;
  height:42px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:20px;
  cursor:pointer;
}

.top h1{
  margin:0;
  font-size:23px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
}

.card h2{
  margin:0 0 15px;
  font-size:18px;
}

label{
  display:block;
  margin-top:13px;
  margin-bottom:6px;
  font-size:13px;
  font-weight:800;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
  font-size:14px;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--purple);
}

.type-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:8px;
}

.type-option{
  border:1px solid var(--border);
  border-radius:13px;
  padding:14px 10px;
  text-align:center;
  cursor:pointer;
  background:var(--card2);
}

.type-option.active{
  border-color:var(--purple);
  box-shadow:0 0 0 1px var(--purple);
}

.type-option input{
  display:none;
}

.type-icon{
  font-size:27px;
  display:block;
  margin-bottom:5px;
}

.type-title{
  font-weight:800;
  font-size:13px;
}

.type-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.primary{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px;
  background:var(--purple);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  margin-top:18px;
}

.secondary{
  width:100%;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  background:transparent;
  color:var(--text);
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}

.hidden{
  display:none !important;
}

.status{
  margin-top:12px;
  font-size:13px;
  color:var(--muted);
}

.task-item{
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  margin-top:11px;
  background:var(--card2);
}

.task-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.task-title{
  font-size:15px;
  font-weight:800;
}

.badge{
  flex-shrink:0;
  padding:5px 8px;
  border-radius:8px;
  background:var(--purple);
  color:#fff;
  font-size:10px;
  font-weight:800;
}

.task-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
  line-height:1.5;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.edit-btn,
.delete-btn{
  border-radius:10px;
  padding:10px;
  font-weight:800;
  cursor:pointer;
}

.edit-btn{
  border:1px solid var(--purple);
  background:transparent;
  color:var(--purple);
}

.delete-btn{
  border:1px solid #ff6b6b;
  background:transparent;
  color:#ff6b6b;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px 10px;
}

.error{
  color:#ff6b6b;
}

.success{
  color:#55d98a;
}


/* ================= MULTIPLE MOCKS ================= */

.mock-add-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
}

.add-mock-btn{
  border:0;
  border-radius:11px;
  padding:13px 16px;
  background:var(--purple);
  color:#fff;
  font-weight:800;
  cursor:pointer;
  white-space:nowrap;
}

.selected-mocks{
  margin-top:12px;
}

.selected-mock{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border:1px solid var(--border);
  border-radius:11px;
  padding:11px 12px;
  margin-top:8px;
  background:var(--card);
}

.selected-mock-info{
  min-width:0;
}

.selected-mock-title{
  font-size:13px;
  font-weight:800;
  line-height:1.4;
}

.selected-mock-id{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

.remove-mock{
  flex-shrink:0;
  border:1px solid #ff6b6b;
  background:transparent;
  color:#ff6b6b;
  border-radius:8px;
  padding:7px 10px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.mock-count{
  color:var(--muted);
  font-size:12px;
  margin-top:9px;
}

.task-mocks{
  margin-top:10px;
}

.task-mock{
  border:1px solid var(--border);
  border-radius:9px;
  padding:8px 10px;
  margin-top:6px;
  font-size:12px;
  font-weight:700;
}

.no-mocks{
  color:var(--muted);
  font-size:12px;
  margin-top:8px;
}


@media(max-width:480px){

  .type-grid{
    grid-template-columns:1fr;
  }

  .mock-add-row{
    grid-template-columns:1fr;
  }

  .add-mock-btn{
    width:100%;
  }

}

</style>

</head>

<body>

<main class="admin-page">

  <div class="top">

    <button
      class="back"
      onclick="history.back()"
    >
      ←
    </button>

    <div>
      <h1>Daily Tasks</h1>
    </div>

  </div>


  <!-- ================= TASK FORM ================= -->

  <section class="card">

    <h2 id="formTitle">
      ➕ Add Daily Task
    </h2>

    <input
      type="hidden"
      id="editId"
    >


    <label>Task Date</label>

    <input
      type="date"
      id="taskDate"
    >


    <label>Subject</label>

    <input
      type="text"
      id="subject"
      placeholder="e.g. Quantitative Aptitude"
    >


    <label>Task Title</label>

    <input
      type="text"
      id="title"
      placeholder="e.g. Profit & Loss Practice"
    >


    <label>Description</label>

    <textarea
      id="description"
      placeholder="Short description of today's task..."
    ></textarea>


    <label>What do you want to post?</label>

    <div class="type-grid">

      <div
        class="type-option active"
        id="contentType"
        onclick="selectType('content')"
      >

        <input
          type="radio"
          name="taskType"
          checked
        >

        <span class="type-icon">📄</span>

        <div class="type-title">
          Content / PDF / Link
        </div>

        <div class="type-sub">
          Message, PDF or link
        </div>

      </div>


      <div
        class="type-option"
        id="mockType"
        onclick="selectType('mock')"
      >

        <input
          type="radio"
          name="taskType"
        >

        <span class="type-icon">📝</span>

        <div class="type-title">
          Mock / Test
        </div>

        <div class="type-sub">
          Add multiple tests
        </div>

      </div>

    </div>


    <!-- ================= CONTENT ================= -->

    <div id="contentBox">

      <label>Message / Content</label>

      <textarea
        id="content"
        placeholder="Write the complete task message/content..."
      ></textarea>


      <label>PDF Link</label>

      <input
        type="url"
        id="pdfUrl"
        placeholder="https://..."
      >


      <label>Optional External Link</label>

      <input
        type="url"
        id="taskLink"
        placeholder="https://..."
      >

    </div>


    <!-- ================= MULTIPLE MOCKS ================= -->

    <div
      id="mockBox"
      class="hidden"
    >

      <label>Select Mock / Test</label>

      <div class="mock-add-row">

        <select id="mockSelect">

          <option value="">
            Loading tests...
          </option>

        </select>

        <button
          type="button"
          class="add-mock-btn"
          onclick="addSelectedMock()"
        >
          + Add Mock
        </button>

      </div>


      <div
        id="selectedMocks"
        class="selected-mocks"
      ></div>


      <div
        id="mockCount"
        class="mock-count"
      >
        0 mocks selected
      </div>

    </div>


    <label>Task Order</label>

    <input
      type="number"
      id="taskOrder"
      value="1"
      min="1"
    >


    <button
      class="primary"
      onclick="saveTask()"
      id="saveButton"
    >
      Save Task
    </button>


    <button
      class="secondary hidden"
      onclick="cancelEdit()"
      id="cancelButton"
    >
      Cancel Edit
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </section>


  <!-- ================= TASK LIST ================= -->

  <section class="card">

    <h2>📋 Existing Daily Tasks</h2>

    <div id="taskList">

      <div class="empty">
        Loading tasks...
      </div>

    </div>

  </section>

</main>


<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let selectedType = "content";

let allTasks = [];

let allMocks = [];

let selectedMockIds = [];


/* ================= DATE ================= */

function getToday(){

  const d = new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth()+1)
      .padStart(2,"0");

  const day =
    String(d.getDate())
      .padStart(2,"0");

  return `${y}-${m}-${day}`;

}


/* ================= TYPE ================= */

function selectType(type){

  selectedType = type;

  document
    .getElementById("contentType")
    .classList
    .toggle(
      "active",
      type === "content"
    );

  document
    .getElementById("mockType")
    .classList
    .toggle(
      "active",
      type === "mock"
    );

  document
    .getElementById("contentBox")
    .classList
    .toggle(
      "hidden",
      type !== "content"
    );

  document
    .getElementById("mockBox")
    .classList
    .toggle(
      "hidden",
      type !== "mock"
    );

}


/* ================= LOAD MOCKS ================= */

async function loadMocks(){

  const select =
    document.getElementById("mockSelect");

  select.innerHTML =
    `<option value="">
      Loading tests...
    </option>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("mock_tests")
    .select("*")
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    console.log(error);

    select.innerHTML =
      `<option value="">
        Unable to load tests
      </option>`;

    return;
  }


  allMocks =
    data || [];


  if(!allMocks.length){

    select.innerHTML =
      `<option value="">
        No mock/test found
      </option>`;

    return;
  }


  select.innerHTML =
    `<option value="">
      Select Mock / Test
    </option>`;


  allMocks.forEach(test => {

    const option =
      document.createElement("option");

    option.value =
      String(test.id);

    option.textContent =
      test.title ||
      test.name ||
      `Test #${test.id}`;

    select.appendChild(option);

  });

}


/* ================= ADD MOCK ================= */

function addSelectedMock(){

  const select =
    document.getElementById("mockSelect");

  const id =
    String(select.value || "");

  if(!id){

    alert("Please select a Mock / Test.");

    return;
  }


  if(
    selectedMockIds.includes(id)
  ){

    alert("This Mock / Test is already added.");

    return;
  }


  selectedMockIds.push(id);

  renderSelectedMocks();

  select.value = "";

}


/* ================= REMOVE MOCK ================= */

function removeSelectedMock(id){

  selectedMockIds =
    selectedMockIds.filter(
      mockId =>
        String(mockId) !== String(id)
    );

  renderSelectedMocks();

}


/* ================= RENDER SELECTED MOCKS ================= */

function renderSelectedMocks(){

  const box =
    document.getElementById("selectedMocks");

  const count =
    document.getElementById("mockCount");


  box.innerHTML = "";


  if(!selectedMockIds.length){

    count.textContent =
      "0 mocks selected";

    return;
  }


  selectedMockIds.forEach(
    (id,index) => {

      const mock =
        allMocks.find(
          item =>
            String(item.id) === String(id)
        );


      const title =
        mock
          ? (
              mock.title ||
              mock.name ||
              `Test #${id}`
            )
          : `Test #${id}`;


      const div =
        document.createElement("div");

      div.className =
        "selected-mock";


      div.innerHTML = `

        <div class="selected-mock-info">

          <div class="selected-mock-title">
            ${index + 1}. ${escapeHtml(title)}
          </div>

          <div class="selected-mock-id">
            Test ID: ${escapeHtml(id)}
          </div>

        </div>

        <button
          type="button"
          class="remove-mock"
          onclick="removeSelectedMock('${escapeHtml(id)}')"
        >
          Remove
        </button>

      `;


      box.appendChild(div);

    }
  );


  count.textContent =
    `${selectedMockIds.length} mock${
      selectedMockIds.length === 1
        ? ""
        : "s"
    } selected`;

}


/* ================= SAVE ================= */

async function saveTask(){

  const status =
    document.getElementById("status");

  status.className =
    "status";

  status.textContent =
    "Saving...";


  const taskDate =
    document.getElementById("taskDate")
      .value;

  const subject =
    document.getElementById("subject")
      .value
      .trim();

  const title =
    document.getElementById("title")
      .value
      .trim();

  const description =
    document.getElementById("description")
      .value
      .trim();

  const content =
    document.getElementById("content")
      .value
      .trim();

  const pdfUrl =
    document.getElementById("pdfUrl")
      .value
      .trim();

  const taskLink =
    document.getElementById("taskLink")
      .value
      .trim();

  const taskOrder =
    Number(
      document.getElementById("taskOrder")
        .value
    ) || 1;


  const editId =
    document.getElementById("editId")
      .value;


  /* ================= VALIDATION ================= */

  if(!taskDate || !title){

    status.className =
      "status error";

    status.textContent =
      "Please enter Task Date and Task Title.";

    return;
  }


  if(selectedType === "content"){

    if(
      !content &&
      !pdfUrl &&
      !taskLink
    ){

      status.className =
        "status error";

      status.textContent =
        "Add message, PDF link or external link.";

      return;
    }

  }


  if(
    selectedType === "mock" &&
    !selectedMockIds.length
  ){

    status.className =
      "status error";

    status.textContent =
      "Please add at least one Mock / Test.";

    return;
  }


  /* ================= DAILY TASK PAYLOAD ================= */

  const payload = {

    task_date:
      taskDate,

    subject:
      subject || null,

    title:
      title,

    description:
      description || null,

    task_type:
      selectedType === "mock"
        ? "Practice"
        : "Daily Task",

    /*
      Keep old column populated for
      backward compatibility.
      For multiple mocks, first mock
      is stored here.
    */

    task_url:
      selectedType === "mock" &&
      selectedMockIds.length
        ? `test.html?id=${selectedMockIds[0]}`
        : null,

    content:
      selectedType === "content"
        ? content || null
        : null,

    pdf_url:
      selectedType === "content"
        ? pdfUrl || null
        : null,

    task_link:
      selectedType === "content"
        ? taskLink || null
        : null,

    target_type:
      selectedType === "mock"
        ? "mock"
        : "content",

    /*
      Keep first mock in old target_id
      so old frontend/data remains safe.
    */

    target_id:
      selectedType === "mock" &&
      selectedMockIds.length
        ? Number(selectedMockIds[0])
        : null,

    task_order:
      taskOrder,

    is_active:
      true

  };


  let result;


  /* ================= UPDATE ================= */

  if(editId){

    result =
      await supabaseClient
        .from("daily_tasks")
        .update(payload)
        .eq(
          "id",
          editId
        );

  }

  /* ================= INSERT ================= */

  else{

    result =
      await supabaseClient
        .from("daily_tasks")
        .insert(payload)
        .select("id")
        .single();

  }


  if(result.error){

    console.log(result.error);

    status.className =
      "status error";

    status.textContent =
      result.error.message;

    return;
  }


  /*
    Get Daily Task ID.
  */

  const dailyTaskId =
    editId
      ? Number(editId)
      : Number(result.data.id);


  /* ================= SAVE MULTIPLE MOCKS ================= */

  if(selectedType === "mock"){

    /*
      First delete old child records.
      Then insert the currently selected mocks.
    */

    const deleteResult =
      await supabaseClient
        .from("daily_task_mocks")
        .delete()
        .eq(
          "daily_task_id",
          dailyTaskId
        );


    if(deleteResult.error){

      console.log(deleteResult.error);

      status.className =
        "status error";

      status.textContent =
        "Task saved, but old mock links could not be updated: " +
        deleteResult.error.message;

      return;
    }


    const rows =
      selectedMockIds.map(
        (mockId,index) => ({

          daily_task_id:
            dailyTaskId,

          mock_id:
            Number(mockId),

          task_order:
            index + 1

        })
      );


    const insertResult =
      await supabaseClient
        .from("daily_task_mocks")
        .insert(rows);


    if(insertResult.error){

      console.log(insertResult.error);

      status.className =
        "status error";

      status.textContent =
        "Task saved, but mocks could not be linked: " +
        insertResult.error.message;

      return;
    }

  }

  else{

    /*
      If editing and switching from
      Mock to Content, remove old
      child mock links.
    */

    const deleteResult =
      await supabaseClient
        .from("daily_task_mocks")
        .delete()
        .eq(
          "daily_task_id",
          dailyTaskId
        );


    if(deleteResult.error){

      console.log(deleteResult.error);

    }

  }


  status.className =
    "status success";

  status.textContent =
    editId
      ? "Task updated successfully."
      : "Task added successfully.";


  resetForm();

  await loadTasks();

}


/* ================= LOAD TASK MOCKS ================= */

async function getTaskMocks(taskIds){

  if(!taskIds.length){

    return {};

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("daily_task_mocks")
    .select("*")
    .in(
      "daily_task_id",
      taskIds
    )
    .order(
      "task_order",
      {ascending:true}
    );


  if(error){

    console.log(error);

    return {};

  }


  const map = {};


  (data || []).forEach(row => {

    if(!map[row.daily_task_id]){

      map[row.daily_task_id] = [];

    }

    map[row.daily_task_id].push(row);

  });


  return map;

}


/* ================= LOAD TASKS ================= */

async function loadTasks(){

  const list =
    document.getElementById("taskList");

  list.innerHTML =
    `<div class="empty">Loading...</div>`;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("daily_tasks")
    .select("*")
    .order(
      "task_date",
      {ascending:false}
    )
    .order(
      "task_order",
      {ascending:true}
    );


  if(error){

    console.log(error);

    list.innerHTML =
      `<div class="empty error">
        Unable to load tasks.<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  allTasks =
    data || [];


  if(!allTasks.length){

    list.innerHTML =
      `<div class="empty">
        No Daily Tasks added yet.
      </div>`;

    return;
  }


  const taskIds =
    allTasks.map(
      task => Number(task.id)
    );


  const taskMocks =
    await getTaskMocks(taskIds);


  list.innerHTML = "";


  allTasks.forEach(task => {

    const div =
      document.createElement("div");

    div.className =
      "task-item";


    const isMock =
      task.target_type === "mock";


    const typeLabel =
      isMock
        ? "📝 Mock / Test"
        : "📄 Content";


    const mocks =
      taskMocks[task.id] || [];


    let mockHtml = "";


    if(isMock){

      if(mocks.length){

        mockHtml =
          `<div class="task-mocks">` +

          mocks.map(
            (item,index) => {

              const mock =
                allMocks.find(
                  m =>
                    String(m.id) ===
                    String(item.mock_id)
                );


              const mockTitle =
                mock
                  ? (
                      mock.title ||
                      mock.name ||
                      `Test #${item.mock_id}`
                    )
                  : `Test #${item.mock_id}`;


              return `
                <div class="task-mock">
                  ${index + 1}. ${escapeHtml(mockTitle)}
                  <span style="color:var(--muted);font-size:10px;">
                    (ID: ${escapeHtml(item.mock_id)})
                  </span>
                </div>
              `;

            }
          ).join("") +

          `</div>`;

      }

      else{

        /*
          Backward compatibility:
          old tasks may only have target_id.
        */

        if(task.target_id){

          const oldMock =
            allMocks.find(
              m =>
                String(m.id) ===
                String(task.target_id)
            );


          const oldTitle =
            oldMock
              ? (
                  oldMock.title ||
                  oldMock.name ||
                  `Test #${task.target_id}`
                )
              : `Test #${task.target_id}`;


          mockHtml = `
            <div class="task-mocks">

              <div class="task-mock">
                1. ${escapeHtml(oldTitle)}
                <span style="color:var(--muted);font-size:10px;">
                  (ID: ${escapeHtml(task.target_id)})
                </span>
              </div>

            </div>
          `;

        }

      }

    }


    div.innerHTML = `

      <div class="task-head">

        <div class="task-title">
          ${escapeHtml(task.title)}
        </div>

        <div class="badge">
          ${typeLabel}
        </div>

      </div>


      <div class="task-meta">

        📅 ${escapeHtml(task.task_date || "")}

        ${
          task.subject
            ? ` • ${escapeHtml(task.subject)}`
            : ""
        }

        <br>

        Order:
        ${task.task_order || 1}

        ${
          isMock
            ? ` • ${
                mocks.length ||
                (task.target_id ? 1 : 0)
              } Mock${
                (
                  mocks.length ||
                  (task.target_id ? 1 : 0)
                ) === 1
                  ? ""
                  : "s"
              }`
            : ""
        }

      </div>


      ${mockHtml}


      <div class="actions">

        <button
          class="edit-btn"
          onclick="editTask(${task.id})"
        >
          Edit
        </button>

        <button
          class="delete-btn"
          onclick="deleteTask(${task.id})"
        >
          Delete
        </button>

      </div>

    `;


    list.appendChild(div);

  });

}


/* ================= EDIT ================= */

async function editTask(id){

  const task =
    allTasks.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if(!task) return;


  document.getElementById("editId")
    .value =
      task.id;


  document.getElementById("taskDate")
    .value =
      task.task_date || "";


  document.getElementById("subject")
    .value =
      task.subject || "";


  document.getElementById("title")
    .value =
      task.title || "";


  document.getElementById("description")
    .value =
      task.description || "";


  document.getElementById("content")
    .value =
      task.content || "";


  document.getElementById("pdfUrl")
    .value =
      task.pdf_url || "";


  document.getElementById("taskLink")
    .value =
      task.task_link || "";


  document.getElementById("taskOrder")
    .value =
      task.task_order || 1;


  selectedMockIds = [];


  /*
    Load child mocks for this task.
  */

  const {
    data,
    error
  } =
  await supabaseClient
    .from("daily_task_mocks")
    .select("*")
    .eq(
      "daily_task_id",
      id
    )
    .order(
      "task_order",
      {ascending:true}
    );


  if(error){

    console.log(error);

  }


  if(data && data.length){

    selectedMockIds =
      data.map(
        row =>
          String(row.mock_id)
      );

  }

  /*
    Backward compatibility for old
    single-mock Daily Tasks.
  */

  else if(
    task.target_type === "mock" &&
    task.target_id
  ){

    selectedMockIds = [
      String(task.target_id)
    ];

  }


  selectType(
    task.target_type === "mock"
      ? "mock"
      : "content"
  );


  renderSelectedMocks();


  document.getElementById("formTitle")
    .textContent =
      "✏️ Edit Daily Task";


  document.getElementById("saveButton")
    .textContent =
      "Update Task";


  document.getElementById("cancelButton")
    .classList
    .remove("hidden");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================= DELETE ================= */

async function deleteTask(id){

  if(
    !confirm(
      "Delete this Daily Task?"
    )
  ){

    return;

  }


  /*
    Child records automatically delete
    because of ON DELETE CASCADE.
  */

  const {
    error
  } =
  await supabaseClient
    .from("daily_tasks")
    .delete()
    .eq(
      "id",
      id
    );


  if(error){

    alert(
      "Unable to delete task: " +
      error.message
    );

    return;

  }


  await loadTasks();

}


/* ================= RESET ================= */

function resetForm(){

  document.getElementById("editId")
    .value = "";


  document.getElementById("taskDate")
    .value =
      getToday();


  document.getElementById("subject")
    .value = "";


  document.getElementById("title")
    .value = "";


  document.getElementById("description")
    .value = "";


  document.getElementById("content")
    .value = "";


  document.getElementById("pdfUrl")
    .value = "";


  document.getElementById("taskLink")
    .value = "";


  document.getElementById("taskOrder")
    .value = "1";


  document.getElementById("mockSelect")
    .value = "";


  selectedMockIds = [];


  renderSelectedMocks();


  selectType("content");


  document.getElementById("formTitle")
    .textContent =
      "➕ Add Daily Task";


  document.getElementById("saveButton")
    .textContent =
      "Save Task";


  document.getElementById("cancelButton")
    .classList
    .add("hidden");

}


/* ================= CANCEL ================= */

function cancelEdit(){

  resetForm();

  document.getElementById("status")
    .textContent = "";

}


/* ================= ESCAPE ================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ================= START ================= */

document.getElementById("taskDate")
  .value =
    getToday();

loadMocks();

loadTasks();

</script>
