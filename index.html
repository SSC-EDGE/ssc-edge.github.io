<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SSC EDGE</title>

<link rel="stylesheet" href="css/style.css">

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<style>
.auth-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  box-sizing:border-box;
}

.auth-card{
  width:100%;
  max-width:390px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px 22px;
  box-sizing:border-box;
  text-align:center;
}

.auth-logo{
  font-size:28px;
  font-weight:800;
  margin-bottom:8px;
}

.auth-logo span{
  color:var(--purple2);
}

.auth-title{
  font-size:22px;
  margin:8px 0;
}

.auth-subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:22px;
}

.auth-input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  outline:none;
}

.auth-button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:var(--purple);
  color:white;
  font-size:15px;
  font-weight:700;
}

.secondary{
  background:var(--card2);
}

.guest{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
}

.switch{
  margin-top:16px;
  color:var(--muted);
  font-size:13px;
}

.switch span{
  color:var(--purple2);
  font-weight:700;
}

.message{
  min-height:18px;
  margin-top:10px;
  font-size:13px;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="auth-screen">

<div class="auth-card">

<div class="auth-logo">
  SSC <span>EDGE</span>
</div>


<!-- LOGIN -->

<div id="loginBox">

<h1 class="auth-title">Welcome Back</h1>

<p class="auth-subtitle">
Login to continue your SSC preparation.
</p>

<input
 id="loginEmail"
 class="auth-input"
 type="email"
 placeholder="Email">

<input
 id="loginPassword"
 class="auth-input"
 type="password"
 placeholder="Password">

<button class="auth-button" onclick="login()">
Login
</button>

<button class="auth-button guest" onclick="guest()">
Continue as Guest
</button>

<div id="loginMsg" class="message"></div>

<div class="switch">
Don't have an account?
<span onclick="showSignup()">Create Account</span>
</div>

<div class="switch">
<span onclick="showPhone()">Login with Phone OTP</span>
</div>

</div>


<!-- SIGNUP -->

<div id="signupBox" class="hidden">

<h1 class="auth-title">Create Account</h1>

<p class="auth-subtitle">
Create your SSC EDGE account.
</p>

<input
 id="signupName"
 class="auth-input"
 type="text"
 maxlength="40"
 placeholder="Your Name">

<input
 id="signupEmail"
 class="auth-input"
 type="email"
 placeholder="Email">

<input
 id="signupPassword"
 class="auth-input"
 type="password"
 placeholder="Password">

<button class="auth-button" onclick="signup()">
Create Account
</button>

<div id="signupMsg" class="message"></div>

<div class="switch">
Already have an account?
<span onclick="showLogin()">Login</span>
</div>

</div>


<!-- PHONE -->

<div id="phoneBox" class="hidden">

<h1 class="auth-title">Phone Login</h1>

<p class="auth-subtitle">
Login using your phone number.
</p>

<input
 id="phone"
 class="auth-input"
 type="tel"
 placeholder="+91XXXXXXXXXX">

<button
 id="sendOtp"
 class="auth-button"
 onclick="sendOTP()">
Send OTP
</button>

<input
 id="otp"
 class="auth-input hidden"
 type="text"
 inputmode="numeric"
 maxlength="6"
 placeholder="Enter OTP">

<button
 id="verifyOtp"
 class="auth-button secondary hidden"
 onclick="verifyOTP()">
Verify OTP
</button>

<div id="phoneMsg" class="message"></div>

<div class="switch">
<span onclick="showLogin()">Back to Login</span>
</div>

</div>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   IMPORTANT:
   INDEX NEVER AUTO-SKIPS
   LOGIN PAGE
========================= */

localStorage.removeItem("ssc-edge-guest");


/* =========================
   SWITCH BOXES
========================= */

function hideAll(){

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("signupBox")
    .classList.add("hidden");

  document.getElementById("phoneBox")
    .classList.add("hidden");
}


function showLogin(){

  hideAll();

  document.getElementById("loginBox")
    .classList.remove("hidden");
}


function showSignup(){

  hideAll();

  document.getElementById("signupBox")
    .classList.remove("hidden");
}


function showPhone(){

  hideAll();

  document.getElementById("phoneBox")
    .classList.remove("hidden");
}


/* =========================
   EMAIL LOGIN
========================= */

async function login(){

  const email =
    document.getElementById("loginEmail")
    .value.trim();

  const password =
    document.getElementById("loginPassword")
    .value;

  const msg =
    document.getElementById("loginMsg");

  msg.textContent="";
  msg.style.color="#ff7777";

  if(!email || !password){

    msg.textContent=
      "Please enter email and password.";

    return;
  }

  const {data,error} =
    await supabaseClient.auth
    .signInWithPassword({
      email,
      password
    });

  if(error){

    msg.textContent=error.message;

    return;
  }

  localStorage.removeItem("ssc-edge-guest");

  localStorage.setItem(
    "ssc-edge-user-id",
    data.user.id
  );

  localStorage.setItem(
    "ssc-edge-name",
    data.user.user_metadata?.name ||
    data.user.email?.split("@")[0] ||
    "SSC EDGE User"
  );

  window.location.href="home.html";
}


/* =========================
   SIGN UP
========================= */

async function signup(){

  const name =
    document.getElementById("signupName")
    .value.trim();

  const email =
    document.getElementById("signupEmail")
    .value.trim();

  const password =
    document.getElementById("signupPassword")
    .value;

  const msg =
    document.getElementById("signupMsg");

  msg.textContent="";
  msg.style.color="#ff7777";

  if(!name){

    msg.textContent="Enter your name.";
    return;
  }

  if(!email){

    msg.textContent="Enter your email.";
    return;
  }

  if(password.length<6){

    msg.textContent=
      "Password must be at least 6 characters.";

    return;
  }

  const {data,error} =
    await supabaseClient.auth.signUp({

      email,
      password,

      options:{
        data:{
          name:name
        }
      }

    });

  if(error){

    msg.textContent=error.message;
    return;
  }

  localStorage.setItem(
    "ssc-edge-name",
    name
  );

  if(data.session){

    localStorage.setItem(
      "ssc-edge-user-id",
      data.user.id
    );

    window.location.href="home.html";

  }else{

    msg.style.color="var(--purple2)";

    msg.textContent=
      "Account created. Check your email to verify your account.";

  }
}


/* =========================
   GUEST
========================= */

function guest(){

  localStorage.removeItem("ssc-edge-user-id");

  localStorage.setItem(
    "ssc-edge-guest",
    "true"
  );

  if(!localStorage.getItem("ssc-edge-theme")){

    localStorage.setItem(
      "ssc-edge-theme",
      "dark"
    );
  }

  window.location.href="home.html";
}


/* =========================
   SEND OTP
========================= */

async function sendOTP(){

  const phone =
    document.getElementById("phone")
    .value.trim();

  const msg =
    document.getElementById("phoneMsg");

  msg.textContent="";
  msg.style.color="#ff7777";

  if(!phone){

    msg.textContent=
      "Enter your phone number.";

    return;
  }

  const {error} =
    await supabaseClient.auth
    .signInWithOtp({
      phone:phone
    });

  if(error){

    msg.textContent=error.message;
    return;
  }

  document.getElementById("otp")
    .classList.remove("hidden");

  document.getElementById("verifyOtp")
    .classList.remove("hidden");

  document.getElementById("sendOtp")
    .textContent="OTP Sent";

  msg.style.color="var(--purple2)";
  msg.textContent="OTP sent.";
}


/* =========================
   VERIFY OTP
========================= */

async function verifyOTP(){

  const phone =
    document.getElementById("phone")
    .value.trim();

  const token =
    document.getElementById("otp")
    .value.trim();

  const msg =
    document.getElementById("phoneMsg");

  if(!token){

    msg.textContent="Enter OTP.";
    return;
  }

  const {data,error} =
    await supabaseClient.auth
    .verifyOtp({
      phone,
      token,
      type:"sms"
    });

  if(error){

    msg.textContent=error.message;
    return;
  }

  localStorage.removeItem("ssc-edge-guest");

  localStorage.setItem(
    "ssc-edge-user-id",
    data.user.id
  );

  localStorage.setItem(
    "ssc-edge-name",
    data.user.user_metadata?.name ||
    "SSC EDGE User"
  );

  window.location.href="home.html";
}

</script>

</body>
</html>
