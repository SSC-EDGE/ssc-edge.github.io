<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SSC EDGE - Login</title>


<!-- THEME -->

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>


<style>

:root{
  --bg:#08050e;
  --card:#171025;
  --card2:#251344;
  --purple:#7c3aed;
  --purple2:#a66bff;
  --text:#fff;
  --muted:#aaa2b9;
  --border:#302044;
}

:root[data-theme="light"]{
  --bg:#f6f3fb;
  --card:#fff;
  --card2:#eee6fa;
  --purple:#6d35d4;
  --purple2:#8149e8;
  --text:#17121e;
  --muted:#706879;
  --border:#ddd4e9;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;

  display:flex;
  justify-content:center;
  align-items:center;

  padding:20px;
}

.container{
  width:100%;
  max-width:420px;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:800;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:28px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;

  padding:22px;

  box-shadow:
  0 10px 30px rgba(0,0,0,.25);
}

h2{
  margin:0 0 18px;
  font-size:21px;
}

label{
  display:block;

  margin:
  13px 0 7px;

  color:var(--muted);

  font-size:14px;
}

input{
  width:100%;

  padding:13px 14px;

  border-radius:11px;

  border:1px solid var(--border);

  background:var(--bg);

  color:var(--text);

  outline:none;

  font-size:15px;
}

input:focus{
  border-color:var(--purple);
}

button{
  width:100%;

  border:0;

  border-radius:11px;

  padding:13px;

  margin-top:14px;

  font-size:15px;

  font-weight:700;

  cursor:pointer;
}

.primary{
  background:var(--purple);
  color:#fff;
}

.google{
  background:#fff;
  color:#222;
}

.guest{
  background:var(--card2);
  color:var(--text);
}

.divider{
  display:flex;

  align-items:center;

  gap:10px;

  margin:20px 0;

  color:var(--muted);

  font-size:13px;
}

.divider:before,
.divider:after{
  content:"";

  flex:1;

  height:1px;

  background:var(--border);
}

.link{
  text-align:center;

  margin-top:18px;

  color:var(--purple2);

  cursor:pointer;

  font-size:14px;
}

.message{
  margin-top:15px;

  text-align:center;

  font-size:14px;

  color:var(--muted);

  min-height:20px;
}

.hidden{
  display:none;
}

.small{
  font-size:12px;

  color:var(--muted);

  margin-top:10px;

  line-height:1.5;
}

</style>

</head>


<body>


<div class="container">


  <!-- =========================
       LOGIN
  ========================== -->

  <div class="logo">
    SSC EDGE
  </div>

  <div class="subtitle">
    Smart Preparation for SSC Exams
  </div>


  <div class="card" id="loginBox">

    <h2>
      Login
    </h2>


    <label>
      Email
    </label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter your email"
      autocomplete="email"
    >


    <label>
      Password
    </label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Enter your password"
      autocomplete="current-password"
    >


    <button
      class="primary"
      onclick="loginEmailPassword()">

      Login

    </button>


    <div class="divider">
      OR
    </div>


    <button
      class="google"
      onclick="loginWithGoogle()">

      Continue with Google

    </button>


    <button
      class="guest"
      onclick="continueAsGuest()">

      Continue as Guest

    </button>


    <div
      class="link"
      onclick="showSignup()">

      Create a new account

    </div>


    <div
      class="message"
      id="loginMessage">
    </div>

  </div>



  <!-- =========================
       CREATE ACCOUNT
  ========================== -->

  <div
    class="card hidden"
    id="signupBox">


    <h2>
      Create Account
    </h2>


    <label>
      Name
    </label>

    <input
      type="text"
      id="signupName"
      placeholder="Enter your name"
      autocomplete="name"
    >


    <label>
      Email
    </label>

    <input
      type="email"
      id="signupEmail"
      placeholder="Enter your email"
      autocomplete="email"
    >


    <label>
      Password
    </label>

    <input
      type="password"
      id="signupPassword"
      placeholder="Create a password"
      autocomplete="new-password"
    >


    <button
      class="primary"
      onclick="createAccount()">

      Create Account

    </button>


    <div class="divider">
      OR
    </div>


    <button
      class="google"
      onclick="loginWithGoogle()">

      Continue with Google

    </button>


    <button
      class="guest"
      onclick="continueAsGuest()">

      Continue as Guest

    </button>


    <div
      class="link"
      onclick="showLogin()">

      Already have an account? Login

    </div>


    <div
      class="message"
      id="signupMessage">
    </div>


    <div class="small">

      You can add your phone number later
      from your Profile.

    </div>

  </div>


</div>



<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";


const supabaseClient =
window.supabase.createClient(

  SUPABASE_URL,

  SUPABASE_KEY,

  {
    auth:{
      autoRefreshToken:true,
      persistSession:true,
      detectSessionInUrl:true
    }
  }

);



/* =========================================
   SAVE USER
========================================= */

async function saveUser(user){

  if(!user){
    return;
  }


  localStorage.setItem(
    "ssc-edge-user-id",
    user.id
  );


  localStorage.setItem(
    "ssc-edge-user-email",
    user.email || ""
  );


  const name =
    user.user_metadata?.name ||
    user.user_metadata?.full_name ||
    user.email?.split("@")[0] ||
    "Candidate";


  localStorage.setItem(
    "ssc-edge-user-name",
    name
  );


  localStorage.removeItem(
    "ssc-edge-guest"
  );

}



/* =========================================
   GO HOME
========================================= */

function goHome(){

  window.location.replace(
    "home.html"
  );

}



/* =========================================
   EMAIL LOGIN
========================================= */

async function loginEmailPassword(){

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();


  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  const msg =
    document.getElementById(
      "loginMessage"
    );


  if(!email || !password){

    msg.textContent =
      "Please enter email and password.";

    return;
  }


  msg.textContent =
    "Logging in...";


  const {
    data,
    error
  } =
  await supabaseClient.auth.signInWithPassword({

    email:email,

    password:password

  });


  if(error){

    msg.textContent =
      error.message;

    return;
  }


  if(data.session){

    await saveUser(
      data.session.user
    );

    goHome();

  }

}



/* =========================================
   GOOGLE LOGIN
========================================= */

async function loginWithGoogle(){

  const msg =
    document.getElementById(
      "loginMessage"
    );


  if(msg){

    msg.textContent =
      "Opening Google...";

  }


  const {
    error
  } =
  await supabaseClient.auth.signInWithOAuth({

    provider:"google",

    options:{

      redirectTo:
        "https://ssc-edge.github.io/",

      queryParams:{

        prompt:
          "select_account"

      }

    }

  });


  if(error && msg){

    msg.textContent =
      error.message;

  }

}



/* =========================================
   CREATE ACCOUNT
========================================= */

async function createAccount(){

  const name =
    document.getElementById(
      "signupName"
    ).value.trim();


  const email =
    document.getElementById(
      "signupEmail"
    ).value.trim();


  const password =
    document.getElementById(
      "signupPassword"
    ).value;


  const msg =
    document.getElementById(
      "signupMessage"
    );


  if(!name || !email || !password){

    msg.textContent =
      "Please fill all fields.";

    return;
  }


  if(password.length < 6){

    msg.textContent =
      "Password must be at least 6 characters.";

    return;
  }


  msg.textContent =
    "Creating account...";


  const {
    data,
    error
  } =
  await supabaseClient.auth.signUp({

    email:email,

    password:password,

    options:{

      data:{
        name:name
      },

      emailRedirectTo:
        "https://ssc-edge.github.io/"

    }

  });


  if(error){

    msg.textContent =
      error.message;

    return;
  }


  if(data.session){

    await saveUser(
      data.session.user
    );

    goHome();

    return;
  }


  msg.textContent =
    "Account created. Please check your email if confirmation is required.";

}



/* =========================================
   GUEST MODE
========================================= */

function continueAsGuest(){

  localStorage.setItem(
    "ssc-edge-guest",
    "true"
  );


  localStorage.removeItem(
    "ssc-edge-user-id"
  );


  localStorage.setItem(
    "ssc-edge-user-name",
    "Guest"
  );


  localStorage.removeItem(
    "ssc-edge-user-email"
  );


  goHome();

}



/* =========================================
   SHOW LOGIN
========================================= */

function showLogin(){

  document.getElementById(
    "loginBox"
  ).classList.remove("hidden");


  document.getElementById(
    "signupBox"
  ).classList.add("hidden");

}



/* =========================================
   SHOW SIGNUP
========================================= */

function showSignup(){

  document.getElementById(
    "loginBox"
  ).classList.add("hidden");


  document.getElementById(
    "signupBox"
  ).classList.remove("hidden");

}



/* =========================================
   GOOGLE RETURN HANDLING
========================================= */

async function handleGoogleReturn(){

  /*
    Check whether this page is returning
    from Google OAuth.
  */

  const hash =
    window.location.hash;


  const search =
    window.location.search;


  const oauthReturn =
    hash.includes("access_token") ||
    hash.includes("refresh_token") ||
    search.includes("code=");


  if(!oauthReturn){

    /*
      Normal page load.
      Check if an existing session already exists.
    */

    const {
      data:{
        session
      }
    } =
    await supabaseClient.auth.getSession();


    if(session){

      await saveUser(
        session.user
      );

      goHome();

    }

    return;
  }


  /*
    OAuth returned.
    Wait for Supabase to finish processing
    the URL and storing the session.
  */

  for(let i=0; i<40; i++){

    const {
      data:{
        session
      }
    } =
    await supabaseClient.auth.getSession();


    if(session){

      await saveUser(
        session.user
      );


      /*
        Remove OAuth data from URL.
      */

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );


      goHome();

      return;

    }


    await new Promise(
      resolve =>
      setTimeout(resolve,250)
    );

  }


  const msg =
    document.getElementById(
      "loginMessage"
    );


  if(msg){

    msg.textContent =
      "Google login could not be completed. Please try again.";

  }

}



/* =========================================
   AUTH STATE LISTENER
========================================= */

supabaseClient.auth.onAuthStateChange(

  async (event, session) => {

    /*
      IMPORTANT:
      We do NOT redirect on INITIAL_SESSION.

      This prevents the first Google callback
      from being interrupted before Supabase
      finishes restoring the session.
    */

    if(
      event === "SIGNED_IN" &&
      session
    ){

      await saveUser(
        session.user
      );


      /*
        If this is a normal email login,
        redirect immediately.

        If Google is returning, the callback
        handler also sees the same session,
        but replace() prevents duplicate pages.
      */

      goHome();

    }

  }

);



/* =========================================
   START SESSION / GOOGLE CALLBACK CHECK
========================================= */

handleGoogleReturn();


</script>

</body>
</html>
