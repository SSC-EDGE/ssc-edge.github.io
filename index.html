<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SSC EDGE</title>

<script>
document.documentElement.dataset.theme =
  localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<link rel="stylesheet" href="css/style.css">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:700;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:28px;
}

.auth-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
}

.auth-card h2{
  margin:0 0 18px;
  font-size:20px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
}

.field input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  outline:none;
}

.field input:focus{
  border-color:var(--purple);
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  background:var(--purple);
  color:white;
  font-size:15px;
  cursor:pointer;
  margin-top:5px;
}

.google-btn{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  background:var(--card2);
  color:var(--text);
  font-size:15px;
  cursor:pointer;
  margin-top:10px;
}

.guest-btn{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  background:transparent;
  color:var(--text);
  font-size:14px;
  cursor:pointer;
  margin-top:10px;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:18px 0;
  color:var(--muted);
  font-size:12px;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--border);
}

.switch{
  text-align:center;
  margin-top:18px;
  color:var(--muted);
  font-size:13px;
}

.switch button{
  border:0;
  background:none;
  color:var(--purple2);
  cursor:pointer;
  font-size:13px;
}

.message{
  display:none;
  padding:11px;
  border-radius:9px;
  margin-bottom:14px;
  background:var(--card2);
  color:var(--text);
  font-size:13px;
  line-height:1.4;
}

.back-btn{
  border:0;
  background:none;
  color:var(--muted);
  cursor:pointer;
  padding:0;
  margin-bottom:16px;
  font-size:13px;
}

</style>

</head>

<body>

<div class="login-page">

<div class="login-box">

<div class="logo">
SSC EDGE
</div>

<div class="subtitle">
Your Complete SSC Preparation Platform
</div>


<div class="auth-card">

<div id="message"
     class="message">
</div>


<!-- =========================
     LOGIN
========================= -->

<div id="loginSection">

<h2>Welcome Back</h2>


<div class="field">

<label>Email</label>

<input
  id="loginEmail"
  type="email"
  placeholder="Enter your email"
  autocomplete="email">

</div>


<div class="field">

<label>Password</label>

<input
  id="loginPassword"
  type="password"
  placeholder="Enter your password"
  autocomplete="current-password">

</div>


<button
  class="primary-btn"
  onclick="loginEmailPassword()">

Login

</button>


<button
  class="google-btn"
  onclick="loginWithGoogle()">

🌐 Continue with Google

</button>


<div class="divider">
OR
</div>


<button
  class="guest-btn"
  onclick="continueAsGuest()">

Continue as Guest

</button>


<div class="switch">

Don't have an account?

<button onclick="showSignup()">
Create Account
</button>

</div>

</div>


<!-- =========================
     SIGNUP
========================= -->

<div id="signupSection"
     style="display:none;">

<button
  class="back-btn"
  onclick="showLogin()">

← Back to Login

</button>


<h2>Create Account</h2>


<div class="field">

<label>Name</label>

<input
  id="signupName"
  type="text"
  placeholder="Enter your name"
  autocomplete="name">

</div>


<div class="field">

<label>Email</label>

<input
  id="signupEmail"
  type="email"
  placeholder="Enter your email"
  autocomplete="email">

</div>


<div class="field">

<label>Password</label>

<input
  id="signupPassword"
  type="password"
  placeholder="Create a password"
  autocomplete="new-password">

</div>


<button
  class="primary-btn"
  onclick="createAccount()">

Create Account

</button>


<button
  class="google-btn"
  onclick="loginWithGoogle()">

🌐 Continue with Google

</button>


<div class="switch">

Already have an account?

<button onclick="showLogin()">
Login
</button>

</div>

</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   MESSAGE
========================= */

function showMessage(text){

  const box =
    document.getElementById("message");

  box.textContent=text;
  box.style.display="block";

}


function hideMessage(){

  const box =
    document.getElementById("message");

  box.textContent="";
  box.style.display="none";

}


/* =========================
   LOGIN / SIGNUP SWITCH
========================= */

function showSignup(){

  hideMessage();

  document.getElementById(
    "loginSection"
  ).style.display="none";

  document.getElementById(
    "signupSection"
  ).style.display="block";

}


function showLogin(){

  hideMessage();

  document.getElementById(
    "signupSection"
  ).style.display="none";

  document.getElementById(
    "loginSection"
  ).style.display="block";

}


/* =========================
   SAVE USER
========================= */

function saveUser(user){

  if(!user)return;

  localStorage.setItem(
    "ssc-edge-user-id",
    user.id
  );

  localStorage.removeItem(
    "ssc-edge-guest"
  );

  const name =
    user.user_metadata?.name ||
    user.user_metadata?.full_name ||
    user.user_metadata?.name ||
    "";

  if(name){

    localStorage.setItem(
      "ssc-edge-name",
      name
    );

  }

}


/* =========================
   EMAIL LOGIN
========================= */

async function loginEmailPassword(){

  hideMessage();

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;


  if(!email || !password){

    showMessage(
      "Please enter your email and password."
    );

    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient.auth.signInWithPassword({

    email:email,
    password:password

  });


  if(error){

    showMessage(error.message);

    return;
  }


  saveUser(data.user);

  window.location.replace(
    "home.html"
  );

}


/* =========================
   GOOGLE LOGIN
========================= */

async function loginWithGoogle(){

  hideMessage();


  const {
    error
  } =
  await supabaseClient.auth.signInWithOAuth({

    provider:"google",

    options:{

      redirectTo:
        "https://ssc-edge.github.io/"

    }

  });


  if(error){

    showMessage(error.message);

  }

}


/* =========================
   CREATE ACCOUNT
========================= */

async function createAccount(){

  hideMessage();


  const name =
    document.getElementById(
      "signupName"
    ).value.trim();

  const email =
    document.getElementById(
      "signupEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "signupPassword"
    ).value;


  if(!name){

    showMessage(
      "Please enter your name."
    );

    return;
  }


  if(!email){

    showMessage(
      "Please enter your email."
    );

    return;
  }


  if(password.length < 6){

    showMessage(
      "Password must be at least 6 characters."
    );

    return;
  }


  const {
    data,
    error
  } =
  await supabaseClient.auth.signUp({

    email:email,

    password:password,

    options:{

      data:{
        name:name
      },

      emailRedirectTo:
        "https://ssc-edge.github.io/"

    }

  });


  if(error){

    showMessage(error.message);

    return;
  }


  /*
     If Supabase immediately creates a session,
     login directly.
  */

  if(data.session && data.user){

    saveUser(data.user);

    window.location.replace(
      "home.html"
    );

    return;
  }


  /*
     If email confirmation is enabled,
     show the user a clear message.
  */

  showMessage(
    "Account created. Please check your email if Supabase asks you to confirm your account."
  );

}


/* =========================
   GUEST
========================= */

function continueAsGuest(){

  localStorage.setItem(
    "ssc-edge-guest",
    "true"
  );

  localStorage.removeItem(
    "ssc-edge-user-id"
  );

  localStorage.setItem(
    "ssc-edge-name",
    "Guest"
  );

  window.location.replace(
    "home.html"
  );

}


/* =========================
   GOOGLE REDIRECT SESSION
========================= */

async function checkGoogleLogin(){

  const {
    data:{session}
  } =
  await supabaseClient.auth.getSession();


  if(!session || !session.user){

    return;
  }


  /*
     If a Google login has just returned,
     save the user and go home.
  */

  const provider =
    session.user.app_metadata?.provider;


  if(provider === "google"){

    saveUser(session.user);

    window.location.replace(
      "home.html"
    );

  }

}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
  (event, session)=>{

    if(
      event === "SIGNED_IN" &&
      session?.user
    ){

      saveUser(session.user);

    }

  }
);


/* =========================
   START
========================= */

checkGoogleLogin();

</script>

</body>
</html>
