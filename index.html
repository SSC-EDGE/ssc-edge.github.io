<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSC EDGE</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0b1d;
    color: white;
}

header {
    padding: 25px 20px;
    background: #17102b;
}

h1 {
    margin: 0;
    font-size: 28px;
}

.subtitle {
    margin-top: 6px;
    color: #aaa;
}

.container {
    padding: 20px;
}

.card {
    width: 100%;
    border: 0;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 15px;
    background: #21163a;
    color: white;
    text-align: left;
    font-size: 17px;
    cursor: pointer;
    display: block;
}

.card:active {
    transform: scale(0.97);
}

.icon {
    font-size: 28px;
    margin-bottom: 8px;
}

.card-title {
    font-weight: bold;
    font-size: 18px;
}

.card-text {
    color: #aaa;
    margin-top: 5px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.back {
    border: 0;
    background: #21163a;
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-size: 15px;
}

h2 {
    margin-top: 0;
}
</style>
</head>

<body>

<header>
    <h1>SSC EDGE</h1>
    <div class="subtitle">Your SSC Preparation Hub</div>
</header>

<div class="container">

    <!-- HOME -->
    <div id="home" class="page active">

        <button class="card" data-page="study">
            <div class="icon">📚</div>
            <div class="card-title">Study Material</div>
            <div class="card-text">Notes, concepts and study resources</div>
        </button>

        <button class="card" data-page="practice">
            <div class="icon">📝</div>
            <div class="card-title">Practice</div>
            <div class="card-text">Practice questions and tests</div>
        </button>

        <button class="card" data-page="updates">
            <div class="icon">🔔</div>
            <div class="card-title">SSC Updates</div>
            <div class="card-text">Latest SSC notifications</div>
        </button>

        <button class="card" data-page="papers">
            <div class="icon">📄</div>
            <div class="card-title">Previous Papers</div>
            <div class="card-text">Previous year question papers</div>
        </button>

    </div>


    <!-- STUDY -->
    <div id="study" class="page">
        <button class="back" data-page="home">← Back</button>
        <h2>📚 Study Material</h2>
        <p>SSC EDGE study material will appear here.</p>
    </div>


    <!-- PRACTICE -->
    <div id="practice" class="page">
        <button class="back" data-page="home">← Back</button>
        <h2>📝 Practice</h2>
        <p>Practice questions will appear here.</p>
    </div>


    <!-- UPDATES -->
    <div id="updates" class="page">
        <button class="back" data-page="home">← Back</button>
        <h2>🔔 SSC Updates</h2>
        <p>Latest SSC updates will appear here.</p>
    </div>


    <!-- PAPERS -->
    <div id="papers" class="page">
        <button class="back" data-page="home">← Back</button>
        <h2>📄 Previous Papers</h2>
        <p>Previous year papers will appear here.</p>
    </div>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const buttons = document.querySelectorAll("[data-page]");

    buttons.forEach(function (button) {

        button.addEventListener("click", function () {

            const target = this.getAttribute("data-page");

            document.querySelectorAll(".page").forEach(function (page) {
                page.classList.remove("active");
            });

            const targetPage = document.getElementById(target);

            if (targetPage) {
                targetPage.classList.add("active");
                window.scrollTo(0, 0);
            }

        });

    });

});
</script>

</body>
</html>
