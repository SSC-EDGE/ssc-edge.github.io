<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSC EDGE - Manage Videos</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#08050e;
  color:#fff;
  padding:20px;
}

.container{
  max-width:700px;
  margin:auto;
}

.back{
  display:inline-block;
  margin-bottom:20px;
  color:#a66bff;
  text-decoration:none;
}

h1{
  margin-bottom:5px;
}

.subtitle{
  color:#aaa2b9;
  margin-bottom:25px;
}

.card{
  background:#171025;
  border:1px solid #302044;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
}

label{
  display:block;
  margin:16px 0 7px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #302044;
  background:#08050e;
  color:#fff;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.source-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.source-option{
  border:1px solid #302044;
  border-radius:12px;
  padding:13px;
  text-align:center;
  cursor:pointer;
  color:#aaa2b9;
}

.source-option.active{
  border-color:#7c3aed;
  background:#251344;
  color:#fff;
}

.source-option input{
  display:none;
}

.hidden{
  display:none;
}

button{
  width:100%;
  margin-top:20px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#7c3aed;
  color:#fff;
  font-size:15px;
  font-weight:bold;
}

button:disabled{
  opacity:.6;
}

.cancel-btn{
  background:#302044;
}

.video-item{
  background:#171025;
  border:1px solid #302044;
  border-radius:16px;
  padding:16px;
  margin-top:12px;
}

.video-title{
  font-size:17px;
  font-weight:bold;
  margin-bottom:7px;
}

.video-subject{
  display:inline-block;
  color:#a66bff;
  background:#251344;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  margin-bottom:10px;
}

.video-description{
  color:#aaa2b9;
  font-size:14px;
  line-height:1.5;
}

.video-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.edit-btn{
  background:#302044;
}

.delete-btn{
  background:#8b2435;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#aaa2b9;
}

#status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
  line-height:1.5;
}

.section-title{
  margin-top:30px;
  margin-bottom:12px;
}

</style>

</head>


<body>


<div class="container">


<a href="admin-study.html" class="back">
← Back
</a>


<h1>Manage Videos</h1>

<div class="subtitle">
Add, edit and delete SSC EDGE video classes
</div>


<!-- =========================
     ADD / EDIT FORM
========================= -->

<div class="card">

<h2 id="formTitle">
Add Video
</h2>


<label>Video Title</label>

<input
  type="text"
  id="title"
  placeholder="Enter video title"
>


<label>Subject</label>

<select id="subject">

<option value="">
Loading subjects...
</option>

</select>


<label>Description</label>

<textarea
  id="description"
  placeholder="Enter video description"
></textarea>


<label>Video Source</label>


<div class="source-box">


<label
  class="source-option active"
  id="uploadOption"
>

<input
  type="radio"
  name="source"
  value="upload"
  checked
  onchange="changeSource('upload')"
>

📁 Upload Video

</label>


<label
  class="source-option"
  id="urlOption"
>

<input
  type="radio"
  name="source"
  value="url"
  onchange="changeSource('url')"
>

🔗 Video URL

</label>


</div>


<!-- UPLOAD -->

<div id="uploadBox">

<label>Choose Video File</label>

<input
  type="file"
  id="videoFile"
  accept="video/*"
>

</div>


<!-- URL -->

<div
  id="urlBox"
  class="hidden"
>

<label>Video URL</label>

<input
  type="url"
  id="videoUrl"
  placeholder="https://..."
>

</div>


<button
  id="saveBtn"
  onclick="saveVideo()"
>
Save Video
</button>


<button
  id="cancelBtn"
  class="cancel-btn hidden"
  onclick="cancelEdit()"
>
Cancel Edit
</button>


<div id="status"></div>

</div>



<!-- =========================
     EXISTING VIDEOS
========================= -->

<h2 class="section-title">
Existing Videos
</h2>


<div id="videoList">

<div class="empty">
Loading videos...
</div>

</div>


</div>



<script>


// =========================
// SUPABASE
// =========================

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// =========================
// STATE
// =========================

let editingId = null;

let editingOldFilePath = null;


// =========================
// STATUS
// =========================

function showStatus(message, success){

  const status =
    document.getElementById("status");

  status.style.display = "block";

  status.textContent = message;

  status.style.background =
    success
      ? "#17351f"
      : "#3a1820";

}


// =========================
// CHECK ADMIN
// =========================

async function checkAdmin(){

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();


  if(!user){

    alert("Please login first.");

    window.location.href =
      "admin.html";

    return false;
  }


  const { data, error } =
    await supabaseClient

      .from("admin_users")

      .select("user_id")

      .eq("user_id", user.id)

      .maybeSingle();


  if(error || !data){

    alert("Access denied.");

    window.location.href =
      "admin.html";

    return false;
  }


  return true;

}


// =========================
// LOAD SUBJECTS
// =========================

async function loadSubjects(){

  const select =
    document.getElementById("subject");


  const { data, error } =
    await supabaseClient

      .from("subjects")

      .select("id,name")

      .eq("is_active",true)

      .order("name");


  if(error){

    console.error(error);

    select.innerHTML =
      '<option value="">Unable to load subjects</option>';

    return;
  }


  select.innerHTML =
    '<option value="">Select Subject</option>';


  data.forEach(subject => {

    const option =
      document.createElement("option");

    option.value =
      subject.id;

    option.textContent =
      subject.name;

    select.appendChild(option);

  });

}


// =========================
// SOURCE SWITCH
// =========================

function changeSource(source){

  const uploadBox =
    document.getElementById("uploadBox");

  const urlBox =
    document.getElementById("urlBox");

  const uploadOption =
    document.getElementById("uploadOption");

  const urlOption =
    document.getElementById("urlOption");


  if(source === "upload"){

    uploadBox.classList.remove("hidden");

    urlBox.classList.add("hidden");

    uploadOption.classList.add("active");

    urlOption.classList.remove("active");

  }
  else{

    uploadBox.classList.add("hidden");

    urlBox.classList.remove("hidden");

    uploadOption.classList.remove("active");

    urlOption.classList.add("active");

  }

}


// =========================
// GET SELECTED SOURCE
// =========================

function getSource(){

  return document.querySelector(
    'input[name="source"]:checked'
  ).value;

}


// =========================
// SAVE VIDEO
// =========================

async function saveVideo(){

  const title =
    document
      .getElementById("title")
      .value
      .trim();


  const subjectId =
    document
      .getElementById("subject")
      .value;


  const description =
    document
      .getElementById("description")
      .value
      .trim();


  const source =
    getSource();


  const button =
    document.getElementById("saveBtn");


  if(!title){

    showStatus(
      "Please enter video title.",
      false
    );

    return;
  }


  if(!subjectId){

    showStatus(
      "Please select a subject.",
      false
    );

    return;
  }


  // =========================
  // EDIT EXISTING VIDEO
  // =========================

  if(editingId){

    await updateVideo(
      title,
      subjectId,
      description,
      source,
      button
    );

    return;
  }


  // =========================
  // NEW URL VIDEO
  // =========================

  if(source === "url"){

    const videoUrl =
      document
        .getElementById("videoUrl")
        .value
        .trim();


    if(!videoUrl){

      showStatus(
        "Please enter video URL.",
        false
      );

      return;
    }


    if(!isValidURL(videoUrl)){

      showStatus(
        "Please enter a valid video URL.",
        false
      );

      return;
    }


    button.disabled = true;

    button.textContent =
      "Saving...";


    const { error } =
      await supabaseClient

        .from("study_material")

        .insert({

          subject_id:
            Number(subjectId),

          title:
            title,

          description:
            description || null,

          material_type:
            "VIDEO",

          file_url:
            videoUrl,

          is_active:
            true

        });


    if(error){

      console.error(error);

      showStatus(
        "Error: " + error.message,
        false
      );

      button.disabled = false;

      button.textContent =
        "Save Video";

      return;
    }


    showStatus(
      "✅ Video URL saved successfully!",
      true
    );


    resetForm();

    await loadVideos();

    return;
  }


  // =========================
  // NEW UPLOAD VIDEO
  // =========================

  const file =
    document
      .getElementById("videoFile")
      .files[0];


  if(!file){

    showStatus(
      "Please choose a video file.",
      false
    );

    return;
  }


  if(!file.type.startsWith("video/")){

    showStatus(
      "Please select a valid video file.",
      false
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "Uploading...";


  showStatus(
    "Uploading video...",
    true
  );


  const extension =
    file.name.includes(".")
      ? file.name
          .split(".")
          .pop()
          .toLowerCase()
      : "mp4";


  const fileName =
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,8) +
    "." +
    extension;


  const filePath =
    "videos/" + fileName;


  const { error: uploadError } =
    await supabaseClient

      .storage

      .from("ssc-edge-videos")

      .upload(
        filePath,
        file,
        {
          contentType:
            file.type,

          upsert:false
        }
      );


  if(uploadError){

    console.error(uploadError);

    showStatus(
      "Upload failed: " +
      uploadError.message,
      false
    );

    button.disabled = false;

    button.textContent =
      "Save Video";

    return;
  }


  const { data: publicData } =
    supabaseClient

      .storage

      .from("ssc-edge-videos")

      .getPublicUrl(filePath);


  const videoUrl =
    publicData.publicUrl;


  const { error: dbError } =
    await supabaseClient

      .from("study_material")

      .insert({

        subject_id:
          Number(subjectId),

        title:
          title,

        description:
          description || null,

        material_type:
          "VIDEO",

        file_url:
          videoUrl,

        is_active:
          true

      });


  if(dbError){

    console.error(dbError);


    await supabaseClient

      .storage

      .from("ssc-edge-videos")

      .remove([filePath]);


    showStatus(
      "Database error: " +
      dbError.message,
      false
    );

    button.disabled = false;

    button.textContent =
      "Save Video";

    return;
  }


  showStatus(
    "✅ Video uploaded and saved successfully!",
    true
  );


  resetForm();

  await loadVideos();

}


// =========================
// UPDATE VIDEO
// =========================

async function updateVideo(
  title,
  subjectId,
  description,
  source,
  button
){

  button.disabled = true;

  button.textContent =
    "Updating...";


  let newVideoUrl = null;

  let newFilePath = null;


  // =========================
  // NEW URL
  // =========================

  if(source === "url"){

    const url =
      document
        .getElementById("videoUrl")
        .value
        .trim();


    if(!url){

      showStatus(
        "Please enter video URL.",
        false
      );

      button.disabled = false;

      button.textContent =
        "Update Video";

      return;
    }


    if(!isValidURL(url)){

      showStatus(
        "Please enter a valid video URL.",
        false
      );

      button.disabled = false;

      button.textContent =
        "Update Video";

      return;
    }


    newVideoUrl = url;

  }


  // =========================
  // NEW UPLOAD
  // =========================

  if(source === "upload"){

    const file =
      document
        .getElementById("videoFile")
        .files[0];


    if(file){

      if(!file.type.startsWith("video/")){

        showStatus(
          "Please select a valid video file.",
          false
        );

        button.disabled = false;

        button.textContent =
          "Update Video";

        return;
      }


      showStatus(
        "Uploading new video...",
        true
      );


      const extension =
        file.name.includes(".")
          ? file.name
              .split(".")
              .pop()
              .toLowerCase()
          : "mp4";


      const fileName =
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2,8) +
        "." +
        extension;


      newFilePath =
        "videos/" + fileName;


      const { error } =
        await supabaseClient

          .storage

          .from("ssc-edge-videos")

          .upload(
            newFilePath,
            file,
            {
              contentType:
                file.type,

              upsert:false
            }
          );


      if(error){

        showStatus(
          "Upload failed: " +
          error.message,
          false
        );

        button.disabled = false;

        button.textContent =
          "Update Video";

        return;
      }


      const { data } =
        supabaseClient

          .storage

          .from("ssc-edge-videos")

          .getPublicUrl(
            newFilePath
          );


      newVideoUrl =
        data.publicUrl;

    }

  }


  // =========================
  // UPDATE DATABASE
  // =========================

  const updateData = {

    subject_id:
      Number(subjectId),

    title:
      title,

    description:
      description || null

  };


  if(newVideoUrl){

    updateData.file_url =
      newVideoUrl;

  }


  const { error } =
    await supabaseClient

      .from("study_material")

      .update(updateData)

      .eq("id",editingId);


  if(error){

    console.error(error);


    if(newFilePath){

      await supabaseClient

        .storage

        .from("ssc-edge-videos")

        .remove([newFilePath]);

    }


    showStatus(
      "Update failed: " +
      error.message,
      false
    );

    button.disabled = false;

    button.textContent =
      "Update Video";

    return;
  }


  // =========================
  // REMOVE OLD FILE
  // =========================

  if(
    newFilePath &&
    editingOldFilePath
  ){

    await supabaseClient

      .storage

      .from("ssc-edge-videos")

      .remove([
        editingOldFilePath
      ]);

  }


  showStatus(
    "✅ Video updated successfully!",
    true
  );


  resetForm();

  await loadVideos();

}


// =========================
// EDIT VIDEO
// =========================

async function editVideo(video){

  editingId =
    video.id;


  editingOldFilePath =
    getStoragePath(
      video.file_url
    );


  document.getElementById("formTitle")
    .textContent =
      "Edit Video";


  document.getElementById("title")
    .value =
      video.title || "";


  document.getElementById("description")
    .value =
      video.description || "";


  document.getElementById("subject")
    .value =
      video.subject_id || "";


  document.getElementById("videoUrl")
    .value =
      video.file_url || "";


  // Default edit source to URL
  // unless the old video is from
  // our Supabase Storage.

  if(editingOldFilePath){

    document.querySelector(
      'input[name="source"][value="upload"]'
    ).checked = true;

    changeSource("upload");

  }
  else{

    document.querySelector(
      'input[name="source"][value="url"]'
    ).checked = true;

    changeSource("url");

  }


  document.getElementById("saveBtn")
    .textContent =
      "Update Video";


  document.getElementById("cancelBtn")
    .classList
    .remove("hidden");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


// =========================
// DELETE VIDEO
// =========================

async function deleteVideo(video){

  const confirmed =
    confirm(
      "Delete this video?\n\n" +
      video.title
    );


  if(!confirmed){

    return;
  }


  const storagePath =
    getStoragePath(
      video.file_url
    );


  const { error } =
    await supabaseClient

      .from("study_material")

      .delete()

      .eq("id",video.id);


  if(error){

    console.error(error);

    alert(
      "Delete failed: " +
      error.message
    );

    return;
  }


  // Delete actual uploaded file

  if(storagePath){

    const { error: storageError } =
      await supabaseClient

        .storage

        .from("ssc-edge-videos")

        .remove([
          storagePath
        ]);


    if(storageError){

      console.error(storageError);

    }

  }


  showStatus(
    "✅ Video deleted successfully!",
    true
  );


  await loadVideos();

}


// =========================
// LOAD VIDEOS
// =========================

async function loadVideos(){

  const container =
    document.getElementById("videoList");


  container.innerHTML =
    '<div class="empty">Loading videos...</div>';


  const { data, error } =
    await supabaseClient

      .from("study_material")

      .select(`
        id,
        title,
        description,
        file_url,
        subject_id,
        created_at,
        subjects (
          name
        )
      `)

      .eq("material_type","VIDEO")

      .order("created_at",{
        ascending:false
      });


  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        Unable to load videos.
      </div>`;

    return;
  }


  if(!data || data.length === 0){

    container.innerHTML =
      `<div class="empty">
        No videos added yet.
      </div>`;

    return;
  }


  container.innerHTML = "";


  data.forEach(video => {

    const item =
      document.createElement("div");


    item.className =
      "video-item";


    const subject =
      video.subjects?.name ||
      "General";


    item.innerHTML = `

      <div class="video-title">
        ${escapeHTML(video.title)}
      </div>

      <div class="video-subject">
        ${escapeHTML(subject)}
      </div>

      ${
        video.description
        ?
        `<div class="video-description">
          ${escapeHTML(video.description)}
        </div>`
        :
        ""
      }

      <div class="video-actions">

        <button
          class="edit-btn"
          data-action="edit"
        >
          ✏️ Edit
        </button>

        <button
          class="delete-btn"
          data-action="delete"
        >
          🗑️ Delete
        </button>

      </div>

    `;


    item
      .querySelector('[data-action="edit"]')
      .onclick =
        () => editVideo(video);


    item
      .querySelector('[data-action="delete"]')
      .onclick =
        () => deleteVideo(video);


    container.appendChild(item);

  });

}


// =========================
// STORAGE PATH
// =========================

function getStoragePath(url){

  if(!url){

    return null;
  }


  const marker =
    "/storage/v1/object/public/ssc-edge-videos/";


  const index =
    url.indexOf(marker);


  if(index === -1){

    return null;
  }


  return decodeURIComponent(
    url.substring(
      index + marker.length
    )
  );

}


// =========================
// URL VALIDATION
// =========================

function isValidURL(url){

  try{

    const parsed =
      new URL(url);


    return (
      parsed.protocol === "https:" ||
      parsed.protocol === "http:"
    );

  }
  catch(e){

    return false;

  }

}


// =========================
// ESCAPE HTML
// =========================

function escapeHTML(text){

  return String(text ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


// =========================
// CANCEL EDIT
// =========================

function cancelEdit(){

  resetForm();

}


// =========================
// RESET FORM
// =========================

function resetForm(){

  editingId = null;

  editingOldFilePath = null;


  document.getElementById("formTitle")
    .textContent =
      "Add Video";


  document.getElementById("title")
    .value = "";


  document.getElementById("subject")
    .value = "";


  document.getElementById("description")
    .value = "";


  document.getElementById("videoFile")
    .value = "";


  document.getElementById("videoUrl")
    .value = "";


  document.querySelector(
    'input[name="source"][value="upload"]'
  ).checked = true;


  changeSource("upload");


  document.getElementById("saveBtn")
    .textContent =
      "Save Video";


  document.getElementById("cancelBtn")
    .classList
    .add("hidden");

}


// =========================
// START
// =========================

(async function(){

  const isAdmin =
    await checkAdmin();


  if(!isAdmin){

    return;
  }


  await loadSubjects();

  await loadVideos();

})();

</script>


</body>

</html>
