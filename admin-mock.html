<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SSC EDGE - Admin Mock Tests</title>

<link rel="stylesheet" href="css/style.css">

<script>
document.documentElement.dataset.theme =
localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<style>

body{
  margin:0;
}

.admin-container{
  max-width:700px;
  margin:auto;
  padding:20px 16px 40px;
}

.simple-header{
  display:flex;
  align-items:center;
  padding:16px;
  background:var(--header);
  border-bottom:1px solid var(--border);
}

.header-brand{
  font-size:19px;
  font-weight:900;
}

.page-title{
  margin:8px 0 4px;
}

.page-subtitle{
  color:var(--muted);
  margin-bottom:22px;
}

.form-card,
.test-card,
.section-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:16px;
}

label{
  display:block;
  font-size:12px;
  font-weight:800;
  margin:14px 0 6px;
}

input,
select,
textarea{
  width:100%;
  box-sizing:border-box;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:10px;
  padding:11px;
  font-size:14px;
  outline:none;
}

textarea{
  min-height:80px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--purple);
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.checkbox-row{
  display:flex;
  align-items:center;
  gap:9px;
  margin:15px 0;
}

.checkbox-row input{
  width:auto;
}

.checkbox-row label{
  margin:0;
}

.hidden{
  display:none !important;
}

.section-card{
  padding:13px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.section-number{
  font-weight:900;
}

.section-controls{
  display:flex;
  gap:5px;
}

.small-btn{
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  border-radius:8px;
  padding:6px 9px;
  cursor:pointer;
  font-weight:800;
}

.remove-btn{
  color:#ff6868;
}

.primary-btn,
.secondary-btn,
.danger-btn{
  width:100%;
  border:0;
  border-radius:11px;
  padding:12px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  margin-top:10px;
}

.primary-btn{
  background:var(--purple);
  color:white;
}

.secondary-btn{
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
}

.danger-btn{
  background:#8f2525;
  color:white;
}

.test-title{
  font-size:17px;
  font-weight:900;
}

.test-info{
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
  margin-top:7px;
}

.test-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.status{
  display:inline-block;
  margin-top:8px;
  padding:4px 8px;
  border-radius:7px;
  font-size:10px;
  font-weight:800;
}

.active-status{
  background:#174f2a;
  color:#8cffae;
}

.inactive-status{
  background:#512020;
  color:#ff9999;
}

.message{
  padding:12px;
  border-radius:10px;
  background:var(--card2);
  color:var(--muted);
  font-size:13px;
  margin-bottom:14px;
}

.total-time{
  text-align:center;
  padding:10px;
  background:var(--card2);
  border-radius:10px;
  margin:10px 0;
  font-size:13px;
  font-weight:800;
}

@media(max-width:420px){

  .grid2{
    grid-template-columns:1fr;
  }

  .test-actions{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<header class="simple-header">
  <div class="header-brand">SSC EDGE — Admin</div>
</header>

<main class="admin-container">

<h1 class="page-title">Mock Tests</h1>

<p class="page-subtitle">
Create and manage SSC EDGE mock tests
</p>

<div id="message"></div>

<!-- =========================================
     FORM
========================================= -->

<div class="form-card">

<input
type="hidden"
id="editId"
>

<label>Test Title</label>

<input
id="title"
placeholder="Example: CGL Full Mock Test 1"
>

<label>Description</label>

<textarea
id="description"
placeholder="Test description">
</textarea>

<div class="grid2">

<div>

<label>Exam</label>

<select id="exam">
<option value="">Select Exam</option>
</select>

</div>

<div>

<label>Test Type</label>

<select
id="testType"
onchange="handleTestType()">

<option value="FULL">FULL</option>
<option value="SECTIONAL">SECTIONAL</option>
<option value="SUBJECT_WISE">SUBJECT_WISE</option>
<option value="CHAPTER_WISE">CHAPTER_WISE</option>

</select>

</div>

</div>


<!-- =========================================
     NORMAL DURATION
========================================= -->

<div id="normalDurationBox">

<label>Total Duration (minutes)</label>

<input
id="duration"
type="number"
min="1"
value="60"
>

</div>


<!-- =========================================
     SUBJECT SELECTION
========================================= -->

<div id="singleSubjectBox" class="hidden">

<label>Subject</label>

<select id="subject">
<option value="">Select Subject</option>
</select>

</div>


<!-- =========================================
     CHAPTER
========================================= -->

<div id="chapterBox" class="hidden">

<label>Chapter</label>

<select id="chapter">
<option value="">Select Chapter</option>
</select>

</div>


<!-- =========================================
     FULL TEST SETTINGS
========================================= -->

<div id="fullSettings">

<div class="checkbox-row">

<input
type="checkbox"
id="subjectTiming"
onchange="toggleSubjectTiming()"
>

<label for="subjectTiming">
Enable Subject-wise Timing
</label>

</div>


<div id="sectionSettings" class="hidden">

<div class="message">
Set the subject order and timing for this FULL test.
Each subject can have a different duration.
</div>

<div
id="sections">
</div>

<button
type="button"
class="secondary-btn"
onclick="addSection()">

+ Add Subject

</button>

<div
id="totalSectionTime"
class="total-time">

Total Section Time: 0 minutes

</div>

</div>

</div>


<!-- =========================================
     MARKING
========================================= -->

<div class="grid2">

<div>

<label>Marks per Question</label>

<input
id="marks"
type="number"
step="0.01"
value="2"
>

</div>

<div>

<label>Negative Marks</label>

<input
id="negative"
type="number"
step="0.01"
value="0"
>

</div>

</div>


<label>Total Questions</label>

<input
id="totalQuestions"
type="number"
min="1"
value="25"
>


<button
id="saveBtn"
class="primary-btn"
onclick="saveTest()">

Create Test

</button>


<button
id="cancelBtn"
class="secondary-btn hidden"
onclick="cancelEdit()">

Cancel Edit

</button>

</div>


<!-- =========================================
     EXISTING TESTS
========================================= -->

<h2 class="page-title">
Existing Tests
</h2>

<div id="tests">
Loading...
</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
"sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================
   DATA
========================================= */

let exams = [];
let subjects = [];
let chapters = [];
let tests = [];
let sections = [];


/* =========================================
   ADMIN CHECK
========================================= */

async function checkAdmin(){

  const {
    data:{user}
  } =
  await db.auth.getUser();

  if(!user){

    document.body.innerHTML =
    "<div style='padding:30px;text-align:center'>Please login as admin.</div>";

    return false;

  }


  const {
    data,
    error
  } =
  await db
  .from("admin_users")
  .select("user_id")
  .eq("user_id",user.id)
  .maybeSingle();


  if(error || !data){

    document.body.innerHTML =
    "<div style='padding:30px;text-align:center'>Access denied.</div>";

    return false;

  }

  return true;

}


/* =========================================
   LOAD DATA
========================================= */

async function loadData(){

  if(!await checkAdmin()) return;


  const examResult =
  await db
  .from("exams")
  .select("*")
  .order("id");


  if(examResult.error){

    showMessage(
      examResult.error.message
    );

    return;

  }


  exams =
  examResult.data || [];


  const subjectResult =
  await db
  .from("subjects")
  .select("*")
  .order("id");


  if(subjectResult.error){

    showMessage(
      subjectResult.error.message
    );

    return;

  }


  subjects =
  subjectResult.data || [];


  const chapterResult =
  await db
  .from("chapters")
  .select("*")
  .order("id");


  if(!chapterResult.error){

    chapters =
    chapterResult.data || [];

  }


  fillExams();

  fillSubjects();

  await loadTests();

  handleTestType();

}


/* =========================================
   FILL EXAMS
========================================= */

function fillExams(){

  const select =
  document.getElementById("exam");

  select.innerHTML =
  '<option value="">Select Exam</option>';


  exams.forEach(e=>{

    select.innerHTML += `

      <option value="${e.id}">
        ${escapeHtml(
          e.name ||
          e.title ||
          e.exam_name ||
          "Exam "+e.id
        )}
      </option>

    `;

  });

}


/* =========================================
   FILL SUBJECTS
========================================= */

function fillSubjects(){

  const select =
  document.getElementById("subject");

  select.innerHTML =
  '<option value="">Select Subject</option>';


  subjects.forEach(s=>{

    select.innerHTML += `

      <option value="${s.id}">
        ${escapeHtml(
          s.name ||
          s.title ||
          "Subject "+s.id
        )}
      </option>

    `;

  });

}


/* =========================================
   FILL CHAPTERS
========================================= */

function fillChapters(){

  const subjectId =
  document.getElementById("subject").value;

  const select =
  document.getElementById("chapter");

  select.innerHTML =
  '<option value="">Select Chapter</option>';


  if(!subjectId) return;


  chapters
  .filter(c=>

    String(
      c.subject_id
    ) === String(subjectId)

  )
  .forEach(c=>{

    select.innerHTML += `

      <option value="${c.id}">
        ${escapeHtml(
          c.name ||
          c.title ||
          "Chapter "+c.id
        )}
      </option>

    `;

  });

}


/* =========================================
   SUBJECT CHANGE
========================================= */

document
.getElementById("subject")
.addEventListener(
  "change",
  fillChapters
);


/* =========================================
   TEST TYPE
========================================= */

function handleTestType(){

  const type =
  document.getElementById(
    "testType"
  ).value;


  document
  .getElementById("fullSettings")
  .classList.toggle(
    "hidden",
    type !== "FULL"
  );


  document
  .getElementById("singleSubjectBox")
  .classList.toggle(
    "hidden",
    type !== "SECTIONAL" &&
    type !== "SUBJECT_WISE" &&
    type !== "CHAPTER_WISE"
  );


  document
  .getElementById("chapterBox")
  .classList.toggle(
    "hidden",
    type !== "CHAPTER_WISE"
  );


  if(type === "FULL"){

    document
    .getElementById("normalDurationBox")
    .classList.remove("hidden");

  }

}


/* =========================================
   SUBJECT TIMING
========================================= */

function toggleSubjectTiming(){

  const enabled =
  document
  .getElementById(
    "subjectTiming"
  )
  .checked;


  document
  .getElementById(
    "sectionSettings"
  )
  .classList.toggle(
    "hidden",
    !enabled
  );


  if(enabled &&
     sections.length === 0){

    addSection();

  }


  updateTotalTime();

}


/* =========================================
   ADD SECTION
========================================= */

function addSection(
  subjectId="",
  duration=15
){

  sections.push({

    subject_id:
      subjectId,

    duration_minutes:
      duration

  });


  renderSections();

}


/* =========================================
   RENDER SECTIONS
========================================= */

function renderSections(){

  const box =
  document.getElementById(
    "sections"
  );

  box.innerHTML = "";


  sections.forEach(
    (section,index)=>{

      const div =
      document.createElement(
        "div"
      );

      div.className =
        "section-card";


      div.innerHTML = `

        <div class="section-head">

          <div class="section-number">
            Subject ${index + 1}
          </div>

          <div class="section-controls">

            <button
            class="small-btn"
            onclick="moveSection(${index},-1)"
            ${index===0 ? "disabled":""}>
              ↑
            </button>

            <button
            class="small-btn"
            onclick="moveSection(${index},1)"
            ${index===sections.length-1 ? "disabled":""}>
              ↓
            </button>

            <button
            class="small-btn remove-btn"
            onclick="removeSection(${index})">
              ×
            </button>

          </div>

        </div>


        <label>Subject</label>

        <select
        onchange="changeSectionSubject(${index},this.value)">

          <option value="">
            Select Subject
          </option>

          ${subjects.map(s=>`

            <option
            value="${s.id}"
            ${String(s.id)===String(section.subject_id)
              ? "selected"
              : ""}>

              ${escapeHtml(
                s.name ||
                s.title ||
                "Subject "+s.id
              )}

            </option>

          `).join("")}

        </select>


        <label>Section Time (minutes)</label>

        <input
        type="number"
        min="1"
        value="${section.duration_minutes}"
        onchange="changeSectionTime(${index},this.value)"
        >

      `;


      box.appendChild(div);

    }
  );


  updateTotalTime();

}


/* =========================================
   CHANGE SUBJECT
========================================= */

function changeSectionSubject(
  index,
  value
){

  sections[index].subject_id =
    value;

}


/* =========================================
   CHANGE TIME
========================================= */

function changeSectionTime(
  index,
  value
){

  sections[index].duration_minutes =
    Number(value) || 1;

  updateTotalTime();

}


/* =========================================
   MOVE SECTION
========================================= */

function moveSection(
  index,
  direction
){

  const newIndex =
    index + direction;


  if(
    newIndex < 0 ||
    newIndex >= sections.length
  ){

    return;

  }


  const temp =
    sections[index];

  sections[index] =
    sections[newIndex];

  sections[newIndex] =
    temp;


  renderSections();

}


/* =========================================
   REMOVE SECTION
========================================= */

function removeSection(index){

  sections.splice(
    index,
    1
  );

  renderSections();

}


/* =========================================
   TOTAL SECTION TIME
========================================= */

function updateTotalTime(){

  const total =
    sections.reduce(
      (sum,section)=>
        sum +
        (
          Number(
            section.duration_minutes
          ) || 0
        ),
      0
    );


  document
  .getElementById(
    "totalSectionTime"
  )
  .textContent =
  "Total Section Time: " +
  total +
  " minutes";


  if(
    document
    .getElementById(
      "subjectTiming"
    ).checked
  ){

    document
    .getElementById(
      "duration"
    )
    .value =
    total || "";

  }

}


/* =========================================
   SAVE TEST
========================================= */

async function saveTest(){

  const editId =
    document
    .getElementById("editId")
    .value;


  const title =
    document
    .getElementById("title")
    .value
    .trim();


  const description =
    document
    .getElementById("description")
    .value
    .trim();


  const examId =
    document
    .getElementById("exam")
    .value;


  const type =
    document
    .getElementById("testType")
    .value;


  const duration =
    Number(
      document
      .getElementById("duration")
      .value
    );


  const subjectId =
    document
    .getElementById("subject")
    .value;


  const chapterId =
    document
    .getElementById("chapter")
    .value;


  const totalQuestions =
    Number(
      document
      .getElementById("totalQuestions")
      .value
    );


  const marks =
    Number(
      document
      .getElementById("marks")
      .value
    );


  const negative =
    Number(
      document
      .getElementById("negative")
      .value
    );


  const timingEnabled =
    document
    .getElementById(
      "subjectTiming"
    )
    .checked;


  /* =======================================
     BASIC VALIDATION
  ======================================= */

  if(!title){

    showMessage(
      "Enter test title."
    );

    return;

  }


  if(!examId){

    showMessage(
      "Select an exam."
    );

    return;

  }


  if(!duration || duration <= 0){

    showMessage(
      "Enter valid duration."
    );

    return;

  }


  if(!totalQuestions ||
     totalQuestions <= 0){

    showMessage(
      "Enter total questions."
    );

    return;

  }


  /* =======================================
     FULL TIMING VALIDATION
  ======================================= */

  if(
    type === "FULL" &&
    timingEnabled
  ){

    if(sections.length === 0){

      showMessage(
        "Add at least one subject section."
      );

      return;

    }


    const invalid =
      sections.some(
        s =>
        !s.subject_id ||
        !Number(s.duration_minutes) ||
        Number(s.duration_minutes) <= 0
      );


    if(invalid){

      showMessage(
        "Select subject and timing for every section."
      );

      return;

    }


    const subjectIds =
      sections.map(
        s=>String(s.subject_id)
      );


    if(
      new Set(subjectIds).size !==
      subjectIds.length
    ){

      showMessage(
        "A subject cannot be repeated in the same FULL test."
      );

      return;

    }

  }


  /* =======================================
     DATA
  ======================================= */

  const payload = {

    exam_id:
      examId,

    title:
      title,

    test_type:
      type,

    subject_id:
      (
        type === "FULL"
        ? null
        : subjectId || null
      ),

    duration_minutes:
      duration,

    total_questions:
      totalQuestions,

    is_active:
      true,

    description:
      description || null,

    marks_per_question:
      marks,

    negative_marks:
      negative,

    subject_wise_timing:
      type === "FULL"
      ? timingEnabled
      : false

  };


  /* =======================================
     INSERT / UPDATE
  ======================================= */

  let result;


  if(editId){

    result =
      await db
      .from("mock_tests")
      .update(payload)
      .eq("id",editId)
      .select()
      .single();

  }else{

    result =
      await db
      .from("mock_tests")
      .insert(payload)
      .select()
      .single();

  }


  if(result.error){

    console.error(
      result.error
    );

    showMessage(
      result.error.message
    );

    return;

  }


  const savedTest =
    result.data;


  /* =======================================
     SAVE FULL SECTIONS
  ======================================= */

  if(type === "FULL"){

    await db
    .from("mock_test_sections")
    .delete()
    .eq(
      "mock_test_id",
      savedTest.id
    );


    if(
      timingEnabled &&
      sections.length
    ){

      const sectionRows =
        sections.map(
          (section,index)=>({

            mock_test_id:
              savedTest.id,

            subject_id:
              section.subject_id,

            section_order:
              index + 1,

            duration_minutes:
              Number(
                section.duration_minutes
              )

          })
        );


      const sectionResult =
        await db
        .from("mock_test_sections")
        .insert(
          sectionRows
        );


      if(sectionResult.error){

        showMessage(
          "Test created, but sections could not be saved: " +
          sectionResult.error.message
        );

        return;

      }

    }

  }


  /* =======================================
     RESET
  ======================================= */

  resetForm();

  showMessage(
    editId
    ? "Test updated successfully."
    : "Test created successfully."
  );


  await loadTests();

}


/* =========================================
   LOAD TESTS
========================================= */

async function loadTests(){

  const result =
  await db
  .from("mock_tests")
  .select(`
    *,
    exams(*),
    subjects(*)
  `)
  .order(
    "created_at",
    {ascending:false}
  );


  if(result.error){

    document
    .getElementById("tests")
    .textContent =
    result.error.message;

    return;

  }


  tests =
  result.data || [];


  renderTests();

}


/* =========================================
   RENDER TESTS
========================================= */

function renderTests(){

  const box =
  document.getElementById(
    "tests"
  );


  if(!tests.length){

    box.innerHTML =
    '<div class="message">No mock tests created yet.</div>';

    return;

  }


  box.innerHTML = "";


  tests.forEach(test=>{

    const examName =
      test.exams?.name ||
      test.exams?.title ||
      test.exams?.exam_name ||
      "Exam";


    const subjectName =
      test.subjects?.name ||
      test.subjects?.title ||
      "";


    const card =
      document.createElement(
        "div"
      );

    card.className =
      "test-card";


    card.innerHTML = `

      <div class="test-title">
        ${escapeHtml(test.title)}
      </div>

      <span class="status ${
        test.is_active
        ? "active-status"
        : "inactive-status"
      }">

        ${
          test.is_active
          ? "ACTIVE"
          : "INACTIVE"
        }

      </span>

      <div class="test-info">

        Exam:
        ${escapeHtml(examName)}

        <br>

        Type:
        ${escapeHtml(test.test_type)}

        ${
          subjectName
          ?
          "<br>Subject: "+
          escapeHtml(subjectName)
          :
          ""
        }

        <br>

        Duration:
        ${test.duration_minutes} min

        <br>

        Questions:
        ${test.total_questions}

        <br>

        Marks:
        ${test.marks_per_question ?? 2}

        &nbsp; | &nbsp;

        Negative:
        ${test.negative_marks ?? 0}

        ${
          test.test_type === "FULL"
          ?
          "<br>Subject-wise Timing: "+
          (
            test.subject_wise_timing
            ? "ON"
            : "OFF"
          )
          :
          ""
        }

      </div>

      <div class="test-actions">

        <button
        class="secondary-btn"
        onclick="editTest('${test.id}')">

          Edit

        </button>

        <button
        class="secondary-btn"
        onclick="toggleActive('${test.id}',${test.is_active})">

          ${
            test.is_active
            ? "Deactivate"
            : "Activate"
          }

        </button>

      </div>

      <button
      class="danger-btn"
      onclick="deleteTest('${test.id}')">

        Delete

      </button>

    `;


    box.appendChild(card);

  });

}


/* =========================================
   EDIT TEST
========================================= */

async function editTest(id){

  const test =
  tests.find(
    t =>
    String(t.id) ===
    String(id)
  );


  if(!test) return;


  document
  .getElementById("editId")
  .value =
  test.id;


  document
  .getElementById("title")
  .value =
  test.title || "";


  document
  .getElementById("description")
  .value =
  test.description || "";


  document
  .getElementById("exam")
  .value =
  test.exam_id || "";


  document
  .getElementById("testType")
  .value =
  test.test_type || "FULL";


  document
  .getElementById("duration")
  .value =
  test.duration_minutes || 60;


  document
  .getElementById("totalQuestions")
  .value =
  test.total_questions || 25;


  document
  .getElementById("marks")
  .value =
  test.marks_per_question ?? 2;


  document
  .getElementById("negative")
  .value =
  test.negative_marks ?? 0;


  document
  .getElementById("subject")
  .value =
  test.subject_id || "";


  fillChapters();


  handleTestType();


  sections = [];


  if(
    test.test_type === "FULL" &&
    test.subject_wise_timing
  ){

    const result =
      await db
      .from("mock_test_sections")
      .select("*")
      .eq(
        "mock_test_id",
        test.id
      )
      .order(
        "section_order"
      );


    if(!result.error){

      sections =
      (result.data || [])
      .map(s=>({

        subject_id:
          s.subject_id,

        duration_minutes:
          s.duration_minutes

      }));

    }


    document
    .getElementById(
      "subjectTiming"
    )
    .checked =
    true;


    renderSections();


  }else{

    document
    .getElementById(
      "subjectTiming"
    )
    .checked =
    false;

  }


  toggleSubjectTiming();


  document
  .getElementById(
    "saveBtn"
  )
  .textContent =
  "Update Test";


  document
  .getElementById(
    "cancelBtn"
  )
  .classList
  .remove("hidden");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

/* =========================================
   ACTIVATE / DEACTIVATE
========================================= */

async function toggleActive(
  id,
  current
){

  const result =
  await db
  .from("mock_tests")
  .update({
    is_active:!current
  })
  .eq(
    "id",
    id
  );


  if(result.error){

    showMessage(
      result.error.message
    );

    return;

  }


  await loadTests();

}


/* =========================================
   DELETE
========================================= */

async function deleteTest(id){

  if(
    !confirm(
      "Delete this mock test?"
    )
  ){

    return;

  }


  const result =
  await db
  .from("mock_tests")
  .delete()
  .eq(
    "id",
    id
  );


  if(result.error){

    showMessage(
      result.error.message
    );

    return;

  }


  await loadTests();

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text){

  const box =
  document.getElementById(
    "message"
  );


  box.innerHTML = `

    <div class="message">
      ${escapeHtml(text)}
    </div>

  `;


  setTimeout(
    ()=>{
      box.innerHTML="";
    },
    4000
  );

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}
