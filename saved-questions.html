<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SSC EDGE - Saved Questions</title>

<link rel="stylesheet" href="css/style.css">

<script>
document.documentElement.dataset.theme =
  localStorage.getItem("ssc-edge-theme") || "dark";
</script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding-bottom:82px;
}

.saved-page{
  max-width:900px;
  margin:0 auto;
  padding:18px 16px 28px;
}

.saved-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.back-btn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
  text-decoration:none;
}

.saved-title-wrap{
  min-width:0;
}

.saved-title{
  margin:0;
  font-size:24px;
  font-weight:900;
  line-height:1.1;
}

.saved-subtitle{
  margin:4px 0 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.3;
}

.saved-summary{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:0 0 14px;
}

.saved-count{
  color:var(--muted);
  font-size:13px;
  font-weight:800;
}

.clear-all{
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--muted);
  border-radius:9px;
  padding:7px 10px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.clear-all:hover{
  color:var(--text);
  border-color:var(--purple);
}

.saved-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.saved-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
}

.saved-card-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}

.saved-meta{
  min-width:0;
}

.saved-test{
  color:var(--text);
  font-size:13px;
  font-weight:900;
  line-height:1.3;
}

.saved-subject{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.bookmark{
  flex:0 0 auto;
  font-size:17px;
  line-height:1;
  color:var(--purple2);
}

.saved-question{
  color:var(--text);
  font-size:15px;
  font-weight:650;
  line-height:1.6;
  white-space:pre-wrap;
  word-break:break-word;
}

.saved-options{
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.saved-option{
  padding:9px 10px;
  border-radius:9px;
  background:var(--card2);
  border:1px solid var(--border);
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}

.remove-btn{
  margin-top:12px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);
  border-radius:9px;
  padding:7px 10px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.remove-btn:hover{
  color:var(--text);
  border-color:var(--purple);
}

.saved-empty,
.saved-error,
.saved-loading{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  font-size:14px;
  line-height:1.5;
}

.saved-empty-icon{
  font-size:30px;
  margin-bottom:9px;
}

.hidden{display:none!important}

@media(max-width:480px){
  .saved-page{padding:15px 12px 25px}
  .saved-title{font-size:22px}
  .saved-question{font-size:14px}
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
}
</style>
</head>

<body>

<main class="saved-page">

  <header class="saved-header">
    <a href="profile.html" class="back-btn" aria-label="Back to Profile">‹</a>

    <div class="saved-title-wrap">
      <h1 class="saved-title">Saved Questions</h1>
      <p class="saved-subtitle">Questions you saved to study later</p>
    </div>
  </header>

  <div class="saved-summary">
    <span id="savedCount" class="saved-count">0 Saved Questions</span>
    <button id="clearAllBtn" class="clear-all hidden" type="button">
      Clear All
    </button>
  </div>

  <section id="savedLoading" class="saved-loading">
    Loading saved questions...
  </section>

  <section id="savedError" class="saved-error hidden"></section>

  <section id="savedEmpty" class="saved-empty hidden">
    <div class="saved-empty-icon">🔖</div>
    <strong>No saved questions yet</strong>
    <div>Save questions during a test and they will appear here.</div>
  </section>

  <section id="savedList" class="saved-list"></section>

</main>

<nav class="bottom-nav">
  <a href="home.html">
    <span class="nav-icon">⌂</span>
    <small>Home</small>
  </a>

  <a href="study.html">
    <span class="nav-icon">▣</span>
    <small>Study Material</small>
  </a>

  <a href="practice.html">
    <span class="nav-icon">✓</span>
    <small>Practice</small>
  </a>

  <a href="profile.html" class="active">
    <span class="nav-icon">○</span>
    <small>Profile</small>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://dvvyoygahzzbnpqrfhen.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2uiQtIIUylApCJSCpnaDkg_Ihh09v8s";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let savedItems = [];

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function show(id){
  document.getElementById(id).classList.remove("hidden");
}

function hide(id){
  document.getElementById(id).classList.add("hidden");
}

/*
  Saved questions are stored by test.html as:

  ssc-edge-saved-questions-<testId>

  The value is an array of question IDs.
*/
function collectSavedQuestionIds(){
  const result = [];
  const seen = new Set();

  for(let i = 0; i < localStorage.length; i++){

    const key = localStorage.key(i);

    if(!key || !key.startsWith("ssc-edge-saved-questions-")){
      continue;
    }

    const testId =
      key.substring("ssc-edge-saved-questions-".length);

    if(!testId){
      continue;
    }

    try{
      const raw = localStorage.getItem(key);
      const ids = JSON.parse(raw);

      if(!Array.isArray(ids)){
        continue;
      }

      ids.forEach(questionId => {

        const qid = String(questionId);

        if(!qid || seen.has(qid)){
          return;
        }

        seen.add(qid);

        result.push({
          testId:String(testId),
          questionId:qid,
          storageKey:key
        });

      });

    }catch(error){
      console.warn(
        "Could not read saved questions:",
        key,
        error
      );
    }
  }

  return result;
}

async function loadSavedQuestions(){

  hide("savedError");
  hide("savedEmpty");

  const rawItems =
    collectSavedQuestionIds();

  document.getElementById("savedCount").textContent =
    rawItems.length +
    (rawItems.length === 1
      ? " Saved Question"
      : " Saved Questions");

  if(!rawItems.length){
    hide("savedLoading");
    show("savedEmpty");
    return;
  }

  const testIds =
    [...new Set(rawItems.map(item => item.testId))];

  const questionIds =
    [...new Set(rawItems.map(item => item.questionId))];

  try{

    const [
      testsResult,
      questionsResult,
      optionsResult,
      subjectsResult
    ] = await Promise.all([

      db
        .from("mock_tests")
        .select("id,title,subject_id")
        .in("id",testIds),

      db
        .from("questions")
        .select("id,question_text,subject_id")
        .in("id",questionIds),

      db
        .from("question_options")
        .select("id,question_id,option_text,is_correct")
        .in("question_id",questionIds)
        .order("id"),

      db
        .from("subjects")
        .select("id,name")
        .order("name")
    ]);

    if(testsResult.error){
      throw new Error(
        "Tests: " + testsResult.error.message
      );
    }

    if(questionsResult.error){
      throw new Error(
        "Questions: " + questionsResult.error.message
      );
    }

    if(optionsResult.error){
      throw new Error(
        "Options: " + optionsResult.error.message
      );
    }

    if(subjectsResult.error){
      throw new Error(
        "Subjects: " + subjectsResult.error.message
      );
    }

    const testMap = new Map(
      (testsResult.data || []).map(test => [
        String(test.id),
        test
      ])
    );

    const questionMap = new Map(
      (questionsResult.data || []).map(question => [
        String(question.id),
        question
      ])
    );

    const subjectMap = new Map(
      (subjectsResult.data || []).map(subject => [
        String(subject.id),
        subject.name
      ])
    );

    const optionsMap = new Map();

    (optionsResult.data || []).forEach(option => {

      const qid =
        String(option.question_id);

      if(!optionsMap.has(qid)){
        optionsMap.set(qid,[]);
      }

      optionsMap.get(qid).push(option);

    });

    savedItems = rawItems
      .map(item => {

        const question =
          questionMap.get(item.questionId);

        if(!question){
          return null;
        }

        const test =
          testMap.get(item.testId);

        const subjectId =
          question.subject_id ??
          test?.subject_id;

        return {
          ...item,
          question,
          test,
          subjectName:
            subjectMap.get(String(subjectId)) ||
            "Saved Question",
          options:
            optionsMap.get(item.questionId) || []
        };

      })
      .filter(Boolean);

    renderSavedQuestions();

  }catch(error){

    console.error(
      "Saved questions load failed:",
      error
    );

    hide("savedLoading");
    show("savedError");

    document.getElementById("savedError").textContent =
      "Unable to load saved questions: " +
      (error.message || "Unknown error");

  }
}

function renderSavedQuestions(){

  hide("savedLoading");

  const list =
    document.getElementById("savedList");

  list.innerHTML = "";

  if(!savedItems.length){

    show("savedEmpty");
    hide("clearAllBtn");

    document.getElementById("savedCount").textContent =
      "0 Saved Questions";

    return;
  }

  show("clearAllBtn");

  document.getElementById("savedCount").textContent =
    savedItems.length +
    (savedItems.length === 1
      ? " Saved Question"
      : " Saved Questions");

  list.innerHTML =
    savedItems.map((item,index) => {

      const testTitle =
        item.test?.title ||
        "SSC EDGE Practice";

      const options =
        item.options.length
          ? `
            <div class="saved-options">
              ${item.options.map((option,optionIndex) => `
                <div class="saved-option">
                  <strong>${String.fromCharCode(65 + optionIndex)}.</strong>
                  ${escapeHtml(option.option_text)}
                </div>
              `).join("")}
            </div>
          `
          : "";

      return `
        <article class="saved-card">

          <div class="saved-card-top">

            <div class="saved-meta">
              <div class="saved-test">
                ${escapeHtml(testTitle)}
              </div>

              <div class="saved-subject">
                ${escapeHtml(item.subjectName)}
              </div>
            </div>

            <span
              class="bookmark"
              title="Saved Question"
              aria-label="Saved Question"
            >🔖</span>

          </div>

          <div class="saved-question">
            ${escapeHtml(item.question.question_text)}
          </div>

          ${options}

          <button
            class="remove-btn"
            type="button"
            onclick="removeSavedQuestion(${index})"
          >
            Remove from Saved
          </button>

        </article>
      `;

    }).join("");
}

function removeSavedQuestion(index){

  const item =
    savedItems[index];

  if(!item){
    return;
  }

  try{

    const raw =
      localStorage.getItem(item.storageKey);

    const ids =
      raw ? JSON.parse(raw) : [];

    const updated =
      Array.isArray(ids)
        ? ids
            .map(id => String(id))
            .filter(id =>
              id !== String(item.questionId)
            )
        : [];

    if(updated.length){
      localStorage.setItem(
        item.storageKey,
        JSON.stringify(updated)
      );
    }else{
      localStorage.removeItem(
        item.storageKey
      );
    }

  }catch(error){

    console.error(
      "Could not remove saved question:",
      error
    );

    return;
  }

  savedItems.splice(index,1);
  renderSavedQuestions();
}

function clearAllSavedQuestions(){

  const keys = [];

  for(let i = 0; i < localStorage.length; i++){

    const key =
      localStorage.key(i);

    if(
      key &&
      key.startsWith(
        "ssc-edge-saved-questions-"
      )
    ){
      keys.push(key);
    }
  }

  keys.forEach(key => {
    localStorage.removeItem(key);
  });

  savedItems = [];
  renderSavedQuestions();
}

document
  .getElementById("clearAllBtn")
  .addEventListener(
    "click",
    function(){

      if(!savedItems.length){
        return;
      }

      if(
        confirm(
          "Remove all saved questions?"
        )
      ){
        clearAllSavedQuestions();
      }

    }
  );

loadSavedQuestions();
</script>

</body>
</html>
